@keyframes spark-act-sigh { 0%, 100% { transform: none; } 25% { transform: translateY(-1px) scale(0.97, 1.05); } 55%, 75% { transform: translateY(1px) scale(1.05, 0.92); } }
@keyframes spark-act-stir { 0%, 100% { transform: none; } 30% { transform: rotate(-14deg) translateX(-1px) scale(1.04, 0.96); } 60% { transform: rotate(6deg); } 80% { transform: rotate(-2deg) scale(1.02, 0.98); } }
@keyframes spark-act-startle { 0% { transform: none; } 35% { transform: translateY(calc(var(--s) * -0.16)) scale(0.94, 1.08); } 70% { transform: scale(1.06, 0.94); } 100% { transform: none; } }
@keyframes spark-happy { 0%, 100% { transform: translateY(0) rotate(0) scale(1); } 25% { transform: translateY(-3px) rotate(-6deg) scale(1.03, 0.97); } 60% { transform: translateY(-1px) rotate(5deg); } }
@keyframes spark-bounce { 0%, 100% { transform: translateY(0) scale(1); } 35% { transform: translateY(-4px) scale(0.95, 1.05); } 65% { transform: translateY(0) scale(1.06, 0.94); } }
@keyframes spark-look { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(calc(var(--s) * -0.06)); } 70% { transform: translateX(calc(var(--s) * 0.06)); } }
@keyframes spark-snooze { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04, 0.97) translateY(1px); } }
@keyframes spark-z { 0% { opacity: 0; transform: translate(0, 0) scale(0.6); } 20% { opacity: 0.9; } 100% { opacity: 0; transform: translate(calc(var(--s) * 0.35), calc(var(--s) * -0.55)) scale(1.2) rotate(12deg); } }
@keyframes spark-tilt { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg) translateY(-1px); } }
@keyframes spark-ask { 0%, 100% { transform: translateY(0) rotate(8deg); } 50% { transform: translateY(-3px) rotate(-6deg); } }
@keyframes spark-ping { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 15% { transform: scale(1.25); } 30% { transform: scale(0.95); } 45% { transform: scale(1.15); box-shadow: 0 0 0 5px transparent; } }
@keyframes spark-squish { 0% { transform: scale(1); } 25% { transform: scale(1.18, 0.8); } 50% { transform: scale(0.9, 1.12) translateY(-3px); } 75% { transform: scale(1.05, 0.96); } 100% { transform: scale(1); } }
@keyframes spark-pop { 0% { opacity: 0; transform: translate(-50%, 0) scale(0.4); } 20% { opacity: 1; transform: translate(calc(-50% + var(--dx, 0px) * 0.3), -60%) scale(1.1); } 100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), -260%) scale(0.8) rotate(var(--r, 0deg)); } }
@keyframes spark-born { 0% { transform: scale(0) rotate(-40deg); opacity: 0; } 55% { transform: scale(1.25) rotate(8deg); opacity: 1; } 75% { transform: scale(0.9, 1.08); } 100% { transform: scale(1) rotate(0); } }
@keyframes spark-cheer { 0% { transform: translateY(0) scale(1); } 20% { transform: translateY(2px) scale(1.12, 0.88); } 55% { transform: translateY(-10px) rotate(360deg) scale(0.95, 1.08); } 80% { transform: translateY(0) rotate(360deg) scale(1.08, 0.92); } 100% { transform: rotate(360deg) scale(1); } }
@media (prefers-reduced-motion: reduce) { .spark-av, .spark-av *, .spark-av::before, .spark-av::after { animation: none !important; transition: none !important; } .spark-av .pop { display: none; } }
#sparks-btn .count { margin-left: auto; font-size: 11.5px; font-weight: 600; min-width: 18px; padding: 0 6px; line-height: 18px; border-radius: 999px; text-align: center; background: var(--accent); color: var(--accent-text); }
#sparks-btn .count:empty { display: none; }
/* While any spark is at work, its icon turns purple. */
#sparks-btn.busy svg { color: var(--working); filter: drop-shadow(0 0 4px color-mix(in srgb, var(--working) 60%, transparent)); }
/* The team, in the sidebar: each spark's face, name and title, and what
   it is doing. Bots, not conversations, as Grok Bot has it. */
#spark-roster { flex: 0 1 auto; min-height: min(84px, 12vh); max-height: 34vh; overflow-y: auto; padding: 4px 0 2px; transition: max-height 0.32s var(--ease), opacity 0.2s var(--ease), padding 0.32s var(--ease); }
#spark-roster:empty { display: none; }
/* Squeezed by a short window, the sparks, and the sidebar itself, fade
   out where there is more below. */
#spark-roster.more { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 22px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 22px), transparent); }
#sidebar.more { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 44px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 44px), transparent); }
/* It folds away, as Recents does: a chevron in the Sparks row. */
#spark-roster.folded { min-height: 0; max-height: 0; opacity: 0; padding: 0; overflow: hidden; }
#spark-roster.folded.gone { visibility: hidden; }
#sparks-btn .fold { display: grid; place-items: center; width: 20px; height: 20px; margin: -2px -4px -2px 2px; border-radius: 6px; color: var(--text-3); opacity: 0; transition: opacity 0.14s, background 0.14s, color 0.14s; }
#sparks-btn .fold[hidden] { display: none; }
#sparks-btn .fold svg { width: 13px; height: 13px; transition: transform 0.28s var(--spring); }
#sparks-btn .fold:hover { color: var(--text); background: var(--hover); }
#sparks-btn:hover .fold, #sparks-btn .fold:focus-visible, #sparks-btn .fold[aria-expanded="false"] { opacity: 1; }
#sparks-btn .fold[aria-expanded="false"] svg { transform: rotate(-90deg); }
#sparks-btn .count:empty + .fold { margin-left: auto; }
.spark-mate { display: flex; align-items: center; gap: 10px; width: calc(100% - 16px); margin: 0 8px; padding: 6px 10px 6px 12px; border-radius: 9px; text-align: left; color: var(--text-2); transition: background 0.12s, color 0.12s; }
.spark-mate:hover, .spark-mate.current { background: var(--hover); color: var(--text); }
.spark-mate .spark-av { --s: 24px; }
.spark-mate .stack { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.spark-mate .who { font-size: 13.5px; font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spark-mate .doing { font-size: 11.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spark-mate .doing.working { color: var(--working); }
.spark-mate .doing.asking { color: var(--accent); font-weight: 500; }
.spark-mate .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.spark-card .title, .spark-head .title { font-size: 13px; font-weight: 500; color: color-mix(in srgb, var(--c) 65%, var(--text)); }
.spark-card .meta { font-size: 11.5px; color: var(--text-3); margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spark-status { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--text-2); background: var(--hover); }
.spark-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
.spark-status.working { color: var(--working); background: color-mix(in srgb, var(--working) 14%, transparent); }
.spark-status.working::before { background: var(--working); animation: pulse 1.2s ease-in-out infinite; }
.spark-status.waiting { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.spark-status.waiting::before { background: var(--accent); }
.spark-status.idle::before { background: #5fcf86; }
.spark-status.failed { color: var(--del); }
.spark-status.failed::before { background: var(--del); }
/* A chat with a spark that is waiting on you: its approval card, above
   the box, as a Grok Bot shows one in its chat. */
#spark-ask { margin: 0 0 10px; }
#spark-ask[hidden] { display: none; }
#spark-ask .spark-approval { margin: 0; display: flex; flex-direction: column; gap: 8px; }
#spark-ask .top { display: flex; align-items: center; gap: 10px; font-size: 14px; }
#spark-ask .top b { font-weight: 600; }
#spark-ask .top .sub { color: var(--text-3); font-size: 12.5px; }
#spark-ask pre { margin: 0; max-height: 120px; }
/* Teams: each an org chart, drawn in as it appears. */
.team-block { --t: var(--accent); --line: color-mix(in srgb, var(--t) 50%, var(--border-strong)); margin: 0 0 20px; padding: 16px 16px 20px; border-radius: 20px;
  border: 1px solid color-mix(in srgb, var(--t) 24%, var(--border));
  background: radial-gradient(130% 90% at 0% 0%, color-mix(in srgb, var(--t) 11%, transparent), transparent 55%), var(--surface);
  animation: rise 0.35s var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms); }
.team-head { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
.team-badge { position: relative; width: 38px; height: 38px; flex: none; border-radius: 50%; display: grid; place-items: center; margin: 4px; cursor: pointer;
  transition: transform 0.25s var(--spring); }
.team-badge:hover { transform: scale(1.08); }
.team-badge:active { transform: scale(0.92); }
.team-badge > * { grid-area: 1 / 1; }
/* A slow aurora behind it, the colour of the team. */
.team-badge .aura { position: absolute; inset: -12px; border-radius: 50%; filter: blur(9px); opacity: 0.75; pointer-events: none;
  background: conic-gradient(from 0deg, transparent, color-mix(in srgb, var(--t) 80%, transparent) 18%, transparent 38%, color-mix(in srgb, var(--t) 55%, white) 58%, transparent 78%);
  animation: team-orbit 7s linear infinite; }
.team-badge .letter { position: relative; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 16px; color: #1b1a19;
  background: radial-gradient(circle at 32% 28%, color-mix(in srgb, var(--t) 55%, white), var(--t)); box-shadow: 0 4px 16px color-mix(in srgb, var(--t) 40%, transparent); }
.team-badge .ring { position: absolute; inset: -6px; border-radius: 50%; border: 1.5px dashed color-mix(in srgb, var(--t) 50%, transparent); animation: team-orbit 16s linear infinite reverse; pointer-events: none; }
/* Its sparks, as moons on the ring. */
.team-badge .moons { position: absolute; inset: 0; pointer-events: none; }
.team-badge .moons i { position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px; border-radius: 50%; background: var(--c);
  box-shadow: 0 0 6px var(--c), 0 0 0 1.5px var(--surface); animation: team-moon 9s linear infinite; animation-delay: calc(var(--k) / var(--n) * -9s); }
.team-badge .burst { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: var(--c); pointer-events: none;
  box-shadow: 0 0 8px var(--c); animation: team-burst-bit 0.8s cubic-bezier(0.2, 0.7, 0.3, 1) both; }
.team-title { display: flex; flex-direction: column; min-width: 0; }
.team-title b { font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team-title .count { font-size: 12.5px; color: var(--text-3); }
.team-faces { display: flex; padding-left: 4px; }
.team-faces i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); border: 2px solid var(--surface); margin-left: -4px; }
.team-head:hover .team-faces i { animation: team-wave 0.6s var(--spring) both; animation-delay: calc(var(--k, 0) * 70ms); }
.team-head:hover ~ .org .face-wrap { animation: team-wave 0.65s var(--spring) both; animation-delay: calc(var(--k, 0) * 70ms + 80ms); }
.team-actions { margin-left: auto; display: flex; gap: 2px; opacity: 0.5; transition: opacity 0.15s; }
.team-block:hover .team-actions, .team-actions:focus-within { opacity: 1; }
.team-actions .sure { color: var(--del); }
.team-empty { color: var(--text-3); font-size: 13.5px; padding: 8px 4px 0 52px; }
.team-loose { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 4px 2px 10px; }

.org { position: relative; overflow-x: auto; padding: 4px 2px 2px; }
.org-tree, .org-tree ul { display: flex; justify-content: center; list-style: none; margin: 0; padding: 0; position: relative; }
.org-tree { width: max-content; min-width: 100%; }
.org-tree ul { padding-top: 22px; }
.org-tree li { position: relative; display: flex; flex-direction: column; align-items: center; padding: 22px 7px 0; }
.org-tree li::before, .org-tree li::after { content: ""; position: absolute; top: 0; right: 50%; width: 50%; height: 22px; border-top: 2px solid var(--line);
  transform-origin: right; animation: org-draw-x 0.45s var(--ease) both, org-flow 7s ease-in-out infinite;
  animation-delay: calc(var(--d, 0) * 200ms + 100ms), calc(var(--d, 0) * 260ms + 2.4s); }
.org-tree li::after { right: auto; left: 50%; border-left: 2px solid var(--line); transform-origin: left; }
.org-tree li:only-child::before, .org-tree li:only-child::after { display: none; }
.org-tree li:only-child { padding-top: 0; }
.org-tree li:first-child::before, .org-tree li:last-child::after { border: 0 none; }
.org-tree li:last-child::before { border-right: 2px solid var(--line); border-radius: 0 12px 0 0; }
.org-tree li:first-child::after { border-radius: 12px 0 0 0; }
.org-tree ul::before { content: ""; position: absolute; top: 0; left: 50%; height: 22px; border-left: 2px solid var(--line); margin-left: -1px;
  transform-origin: top; animation: org-draw-y 0.3s var(--ease) both, org-flow 7s ease-in-out infinite;
  animation-delay: calc(var(--d, 0) * 200ms), calc(var(--d, 0) * 260ms + 2.27s); }
.org-tree > li { padding-top: 6px; }
.org-tree > li::before, .org-tree > li::after { display: none; }

.org-node { --lift: 0px; position: relative; display: flex; align-items: center; gap: 10px; padding: 10px 14px 10px 10px; width: 210px; text-align: left; border-radius: 14px;
  border: 1px solid var(--border); background: var(--bg);
  transform: perspective(700px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--lift));
  transition: transform 0.25s var(--ease), border-color 0.15s, box-shadow 0.2s;
  animation: org-pop 0.5s var(--spring) backwards; animation-delay: calc(var(--d, 0) * 200ms + var(--k, 0) * 40ms + 220ms); }
.org-node:hover { --lift: -3px; transition: transform 0.08s linear, border-color 0.15s, box-shadow 0.2s; border-color: color-mix(in srgb, var(--t) 55%, var(--border)); box-shadow: 0 12px 26px color-mix(in srgb, var(--t) 22%, transparent); }
/* A sheen of the team's colour, following the pointer across. */
.org-node::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity 0.2s;
  background: radial-gradient(120px 70px at var(--gx, 50%) 0%, color-mix(in srgb, var(--t) 26%, transparent), transparent 70%); }
.org-node:hover::before { opacity: 1; }
.org-node.got-news { animation: org-got 0.9s var(--spring) backwards; }
.org-node.got-news::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none; animation: org-flash 1.1s ease-out both; }
/* News coming up the lines: a comet of the team's colour. */
.org .courier { position: absolute; left: 0; top: 0; width: calc(10px * var(--s, 1)); height: calc(10px * var(--s, 1)); margin: calc(-5px * var(--s, 1)) 0 0 calc(-5px * var(--s, 1));
  border-radius: 50%; pointer-events: none; z-index: 2; background: color-mix(in srgb, var(--c) 60%, white); box-shadow: 0 0 12px 3px color-mix(in srgb, var(--c) 75%, transparent); }
.org-tree > li > .org-node { border-color: color-mix(in srgb, var(--t) 40%, var(--border)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--t) 9%, transparent); }
.org-node .face-wrap { display: inline-flex; flex: none; }
.org-node .words { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
.org-node .name { font-weight: 600; font-size: 14px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.org-node .title { font-size: 12px; color: color-mix(in srgb, var(--c) 70%, var(--text-2)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.org-node .state { font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.org-node .state.working { color: var(--text-2); }
.org-node .state.asking { color: var(--warn); }
/* At work under a lead: a glow climbs the line to it. */
.org-node .pulse { position: absolute; left: 50%; top: -22px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; pointer-events: none;
  background: var(--t); box-shadow: 0 0 10px 3px color-mix(in srgb, var(--t) 70%, transparent); animation: org-pulse 1.7s ease-in infinite; }
.org-node.joined { animation: org-join 0.9s var(--spring) backwards !important; }
.org-node.joined::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none; animation: org-flash 1.2s ease-out both; }

/* A team just made: its badge bursts in, and its sparks gather round. */
.team-block.fresh .team-badge { animation: team-born 0.9s var(--spring) both; }
.team-block.fresh .team-badge::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 3px solid var(--t); animation: team-burst 1.1s ease-out 0.15s both; }
.team-block.fresh .org-node { animation: org-gather 0.85s var(--spring) backwards; animation-delay: calc(var(--d, 0) * 160ms + var(--k, 0) * 90ms + 350ms); }
.team-block.again:not(.fresh), .team-block.again:not(.fresh) .org-node:not(.joined):not(.got-news) { animation: none; }
/* Drawn again for news: the lines are there already, and only beat. */
.team-block.again:not(.fresh) .org-tree li::before, .team-block.again:not(.fresh) .org-tree li::after { animation: org-flow 7s ease-in-out infinite; animation-delay: calc(var(--d, 0) * 260ms + 2.4s); }
.team-block.again:not(.fresh) .org-tree ul::before { animation: org-flow 7s ease-in-out infinite; animation-delay: calc(var(--d, 0) * 260ms + 2.27s); }
/* Rallied: the team jumps, a level at a time, and its lines flare. */
.team-block.rally .face-wrap { animation: team-jump 0.75s var(--spring) both; animation-delay: calc(var(--d, 0) * 150ms + var(--k, 0) * 45ms + 120ms); }
.team-block.rally .org-tree li::before, .team-block.rally .org-tree li::after, .team-block.rally .org-tree ul::before { animation: org-flare 1.2s ease-out both; animation-delay: calc(var(--d, 0) * 150ms + 250ms); }
.team-block.rally .team-badge .letter { animation: team-born 0.7s var(--spring) both; }

@keyframes team-orbit { to { transform: rotate(360deg); } }
@keyframes team-moon { from { transform: rotate(0deg) translateX(25px); } to { transform: rotate(360deg) translateX(25px); } }
@keyframes team-burst-bit { 0% { transform: rotate(var(--a)) translateX(4px) scale(1.2); opacity: 1; } 100% { transform: rotate(var(--a)) translateX(var(--dist)) scale(0.2); opacity: 0; } }
@keyframes team-jump { 0%, 100% { transform: translateY(0); } 30% { transform: translateY(2px) scale(1.1, 0.88); } 55% { transform: translateY(-16px) scale(0.94, 1.08) rotate(-8deg); } 80% { transform: translateY(1px) scale(1.06, 0.94); } }
@keyframes org-flow { 0%, 6%, 100% { border-color: var(--line); } 3% { border-color: color-mix(in srgb, var(--t) 90%, white); } }
@keyframes org-flare { 0% { border-color: var(--line); } 25% { border-color: color-mix(in srgb, var(--t) 70%, white); filter: drop-shadow(0 0 4px var(--t)); } 100% { border-color: var(--line); } }
@keyframes org-got { 0% { scale: 1; } 30% { scale: 1.06; } 100% { scale: 1; } }
@keyframes team-wave { 0%, 100% { transform: translateY(0); } 35% { transform: translateY(-7px) scale(1.12); } 65% { transform: translateY(1px) scale(0.96, 1.04); } }
@keyframes team-born { 0% { transform: scale(0) rotate(-120deg); } 60% { transform: scale(1.22) rotate(12deg); } 100% { transform: none; } }
@keyframes team-burst { from { transform: scale(0.7); opacity: 1; } to { transform: scale(2.6); opacity: 0; } }
@keyframes org-draw-x { from { transform: scaleX(0); } }
@keyframes org-draw-y { from { transform: scaleY(0); } }
@keyframes org-pop { from { opacity: 0; transform: translateY(-14px) scale(0.86); } }
@keyframes org-gather { 0% { opacity: 0; transform: translate(calc(-40px - var(--k, 0) * 24px), -70px) scale(0.3) rotate(-25deg); } 60% { opacity: 1; transform: translate(0, 4px) scale(1.05) rotate(2deg); } 100% { transform: none; } }
@keyframes org-join { 0% { opacity: 0; transform: translateY(-46px) scale(0.6) rotate(-6deg); } 55% { opacity: 1; transform: translateY(5px) scale(1.06, 0.94); } 80% { transform: translateY(-2px) scale(0.98, 1.02); } 100% { transform: none; } }
@keyframes org-flash { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--t) 70%, transparent); } 100% { box-shadow: 0 0 0 16px transparent; } }
@keyframes org-pulse { 0% { transform: translateY(22px) scale(0.4); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateY(-3px) scale(1); opacity: 0; } }

/* What a spark with a budget has used of its month. */
.budget-row { display: flex; align-items: center; gap: 8px; }
.field .budget-row input { flex: 1 1 auto; min-width: 90px; width: auto; }
.budget-row .per { font-size: 13.5px; color: var(--text-3); flex: none; margin: 0; }
.field .budget-row select { width: auto; flex: 0 0 auto; }
.budget-meter { display: flex; align-items: center; gap: 7px; margin-top: 4px; font-size: 11.5px; color: var(--text-3); min-width: 0; }
.budget-meter .bar { width: 56px; height: 4px; border-radius: 99px; background: var(--border); overflow: hidden; flex: none; }
.budget-meter i { display: block; height: 100%; width: 0; background: var(--add); border-radius: inherit; transition: width 0.6s var(--ease); }
.budget-meter .said { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.org-node .budget-meter .unit { display: none; }
.budget-meter.warn i { background: var(--warn); }
.budget-meter.full i { background: var(--del); }
.budget-meter.full .said { color: var(--del); }

/* Hires and let-gos waiting on the user. */
.sparks-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: space-between; margin: -4px 0 16px; padding: 8px 8px 8px 14px;
  border-radius: 14px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; color: var(--text-2); animation: rise 0.3s var(--ease) both; }
.sparks-bar .buttons { display: flex; flex-wrap: wrap; gap: 6px; }
.sparks-bar.holding { border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); background: color-mix(in srgb, var(--warn) 7%, var(--surface)); }
/* Stop all: everything flinches to a halt. */
body.all-stopped .org-node, body.all-stopped .spark-card { animation: all-halt 0.6s var(--ease) both !important; }
@keyframes all-halt { 0% { transform: none; } 25% { transform: translateX(-4px) scale(0.98); filter: saturate(0.4); } 50% { transform: translateX(3px); } 100% { transform: none; filter: saturate(1); } }
.hire-stack { margin-bottom: 18px; }
.hire-card { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; padding: 14px; margin-bottom: 8px; border-radius: 16px;
  border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--border)); background: color-mix(in srgb, var(--warn) 6%, var(--surface)); animation: rise 0.35s var(--ease) both; }
.hire-card .face { flex: none; display: inline-flex; }
.hire-card .words { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 3px; }
.hire-card .hire-ask { font-size: 14px; }
.hire-card .goal { font-size: 13px; color: var(--text-2); }
.hire-card .why { font-size: 12.5px; color: var(--text-3); }
.hire-card .decide { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.hire-card .decide input { width: 180px; font: 13px var(--sans); padding: 6px 10px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
.hire-stack.again .hire-card:not(.stamped):not(.waved) { animation: none; }
.hire-card.stamped { animation: hire-stamp 0.7s var(--spring) forwards; }
.hire-card.waved { animation: hire-wave 0.5s var(--ease) forwards; }
@keyframes hire-stamp { 30% { transform: scale(1.03); border-color: var(--add); background: color-mix(in srgb, var(--add) 14%, var(--surface)); } 100% { transform: translateY(-8px) scale(0.96); opacity: 0; } }
@keyframes hire-wave { to { transform: translateX(48px); opacity: 0; } }

/* The team forms and the spark window's team line. */
.team-line { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-2); margin-top: 4px; }
.team-line .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--t); box-shadow: 0 0 0 3px color-mix(in srgb, var(--t) 22%, transparent); }
.swatches { display: flex; flex-wrap: wrap; gap: 9px; }
.swatch { width: 28px; height: 28px; border-radius: 50%; background: var(--c); border: 2px solid transparent; box-shadow: inset 0 0 0 2px var(--surface); transition: transform 0.2s var(--spring), border-color 0.15s; }
.swatch:hover { transform: scale(1.1); }
.swatch[aria-checked="true"] { border-color: var(--c); transform: scale(1.14); }
.field-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.team-code { margin: 0 0 14px; }
.team-code summary { cursor: pointer; font-size: 13px; color: var(--text-2); margin-bottom: 10px; }

/* The audit log. */
.audit-sum .intact { color: var(--add); font-weight: 600; display: inline-flex; gap: 4px; align-items: center; }
.audit-sum .broken { color: var(--del); font-weight: 600; display: inline-flex; gap: 4px; align-items: center; }
.audit-sum svg { width: 14px; height: 14px; }
.audit-list { list-style: none; margin: 0 0 8px; padding: 0; max-height: 52vh; overflow: auto; border: 1px solid var(--border); border-radius: 12px; }
.audit-row { border-bottom: 1px solid var(--border); animation: rise 0.25s var(--ease) both; animation-delay: calc(var(--k, 0) * 18ms); }
.audit-row:last-child { border-bottom: 0; }
.audit-line { display: grid; grid-template-columns: 112px 118px minmax(0, 1fr); gap: 10px; width: 100%; text-align: left; padding: 8px 12px; font-size: 13px; align-items: baseline; }
.audit-line:hover, .audit-row.open .audit-line { background: var(--hover); }
.audit-line .when { color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.audit-line .kind { font-weight: 600; font-size: 12.5px; color: var(--text-2); }
.audit-line .what { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.audit-row pre { margin: 0 12px 10px; max-height: 260px; overflow: auto; font-size: 12px; }
.audit-row.kind-tool .kind { color: var(--accent); }
.audit-row.kind-approval_asked .kind, .audit-row.kind-budget_paused .kind, .audit-row.kind-hire_proposed .kind, .audit-row.kind-removal_proposed .kind { color: var(--warn); }
.audit-row.kind-shift_end .kind, .audit-row.kind-hired .kind, .audit-row.kind-made .kind { color: var(--add); }
.audit-row.kind-removed .kind, .audit-row.kind-stopped .kind { color: var(--del); }
.audit-empty { padding: 14px; color: var(--text-3); }
@media (max-width: 560px) {
  .field-pair { grid-template-columns: 1fr; }
  .org-node { width: 168px; }
  .team-block { padding: 14px 12px 16px; }
  .audit-line { grid-template-columns: 1fr; gap: 2px; }
  .team-faces { display: none; }
  .hire-card .decide input { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .team-block, .team-block .org-node, .team-badge, .team-badge .ring, .team-badge .aura, .team-badge .moons i, .team-badge .letter, .team-block .org-tree li::before, .team-block .org-tree li::after, .team-block .org-tree ul::before, .face-wrap, .team-faces i, .hire-card { animation: none !important; }
  .org-node .pulse, .team-badge .moons, .org .courier { display: none; }
  .org-node { transform: none !important; }
}
.spark-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.spark-card { display: flex; gap: 14px; align-items: flex-start; padding: 16px; text-align: left; border: 1px solid var(--border); border-radius: 16px; background: var(--surface);
  transition: border-color 0.15s, transform 0.15s; animation: rise 0.3s var(--ease) both; animation-delay: calc(var(--i, 0) * 0.04s); min-width: 0; }
.spark-card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
.spark-card .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.spark-card .name { font-weight: 600; font-size: 15px; color: var(--text); }
.spark-card .handle, .spark-head .handle { font: 12px var(--mono); color: var(--text-3); }
.spark-card .state { font-size: 12.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spark-card .state.working { color: var(--text-2); }
.spark-card .goal { font-size: 13.5px; color: var(--text-2); line-height: 1.45; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.spark-head { display: flex; align-items: center; gap: 18px; margin: -6px -6px 16px; padding: 18px 18px 16px; border-radius: 16px;
  background: radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--c) 26%, transparent), transparent 60%), color-mix(in srgb, var(--c) 6%, var(--surface)); }
.spark-head h2 { margin: 0; font-size: 19px; }
.spark-head .meta { font-size: 12.5px; color: var(--text-3); margin-top: 3px; }
.spark-sec { margin: 16px 0 6px; font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.spark-text { font-size: 14px; color: var(--text); white-space: pre-wrap; line-height: 1.5; }
.spark-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
.spark-lessons { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.spark-lessons li { display: flex; align-items: flex-start; gap: 8px; font-size: 13.5px; color: var(--text-2); padding: 7px 8px 7px 12px; border-radius: 10px; background: var(--hover); }
.spark-lessons li span { flex: 1; }
.spark-lessons .icon-btn { width: 24px; height: 24px; }
.spark-lessons .icon-btn svg { width: 13px; height: 13px; }
.spark-report { border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-top: 10px; background: var(--bg); animation: rise 0.26s var(--ease) both; }
.spark-report.failed { border-color: color-mix(in srgb, var(--del) 40%, transparent); }
.spark-report .when { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-3); margin-bottom: 6px; }
.spark-report .body { font-size: 14px; }
.spark-report .body > :first-child { margin-top: 0; }
.spark-report .body > :last-child { margin-bottom: 0; }
.spark-report details { margin-top: 8px; font-size: 12.5px; color: var(--text-3); }
.spark-report details summary { cursor: pointer; }
.spark-report details ol { margin: 6px 0 0; padding-left: 20px; font: 12px/1.6 var(--mono); }
.spark-report .said { margin-top: 10px; font-size: 13px; color: var(--text-3); }
.spark-report .teach { display: flex; gap: 8px; margin-top: 10px; }
.spark-report .teach input { flex: 1; min-width: 0; font: 13.5px var(--sans); color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 9px; padding: 6px 10px; outline: 0; }
.spark-quiet { font-size: 12.5px; color: var(--text-3); margin-top: 10px; }
.field small [data-handle] { font: 500 12px var(--mono); color: var(--text-2); }
.mem-path .link-btn { font: inherit; padding: 0 4px; text-decoration: underline; text-underline-offset: 2px; }
.field.check { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
.field.check input { flex: none; width: auto; margin: 3px 0 0; padding: 0; accent-color: var(--accent); }
.field.check span { flex: 1; margin: 0; font-weight: 400; color: var(--text-2); }
/* A chat with a spark: its bubble and name as a badge, in the box and
   beside the chat in the sidebar. */
#spark-btn { display: inline-flex; align-items: center; gap: 7px; max-width: 220px; color: var(--text); background: color-mix(in srgb, var(--c, var(--accent)) 14%, transparent); border-color: color-mix(in srgb, var(--c, var(--accent)) 45%, transparent); }
#spark-btn[hidden] { display: none; }
/* The spark lives in its badge: it floats and blinks while it waits,
   and bounces with its glint circling while it answers. */
#spark-btn .spark-av { --s: 18px; box-shadow: 0 1px 5px color-mix(in srgb, var(--c) 40%, transparent); animation-name: spark-bob; }
#spark-btn .spark-av[data-state="working"] { animation: spark-hop 0.95s var(--spring) infinite; }
@keyframes spark-bob { 50% { transform: translateY(-1px); } }
@keyframes spark-hop { 0%, 100% { transform: translateY(0) scale(1); } 35% { transform: translateY(-2px) scale(0.95, 1.05); } 65% { transform: translateY(0) scale(1.06, 0.94); } }
#spark-btn .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#spark-btn .drop { display: inline-flex; margin-right: -4px; padding: 1px; border-radius: 50%; color: var(--text-3); }
#spark-btn .drop:hover { color: var(--text); background: var(--hover); }
#spark-btn .drop svg { width: 13px; height: 13px; }
.chat .open .spark-av { --s: 14px; animation: none; box-shadow: none; }
.chat .open .spark-av .eyes { gap: 2px; animation: none; }
.chat .open .spark-av .eye { animation: none; }
.menu .spark-av { --s: 22px; animation: none; }
.menu.emoji-menu { z-index: 60; min-width: 220px; }
.menu .emo { font-size: 18px; width: 24px; text-align: center; flex: none; }
.section-label .link-btn { float: right; margin-top: -3px; }
.project-sparks { margin-bottom: 26px; }
.project-sparks button { display: flex; align-items: center; gap: 10px; }
.project-sparks .name { flex: 1; min-width: 0; text-align: left; }
.speaker { display: flex; align-items: center; gap: 8px; margin: 18px 0 -4px; font-size: 13.5px; }
.speaker .name { font-weight: 600; color: color-mix(in srgb, var(--c) 70%, var(--text)); }
.speaker .handle { font: 12px var(--mono); color: var(--text-3); }
.speaker .from { font-size: 11.5px; color: var(--text-3); padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); }
.menu .item .handle { margin-left: auto; font: 12px var(--mono); color: var(--text-3); }
.spark-approval { border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 8%, var(--bg)); border-radius: 14px; padding: 12px 14px; margin: 4px 0 14px; animation: rise 0.26s var(--ease) both; }
.spark-approval .want { font-weight: 600; font-size: 14px; margin-bottom: 8px; }
.spark-approval pre { margin: 0 0 10px; padding: 9px 11px; max-height: 180px; overflow: auto; border-radius: 9px; background: var(--code-bg); font: 12px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.spark-approval .row { display: flex; gap: 8px; align-items: center; }
.spark-approval input { flex: 1; min-width: 0; font: 13.5px var(--sans); color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 9px; padding: 6px 10px; outline: 0; }
.spark-card .state.asking { color: var(--accent); font-weight: 500; }
.spark-templates { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 16px; }
.spark-templates .chip-btn { font-size: 12.5px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--text-2); }
.spark-templates .chip-btn:hover, .spark-templates .chip-btn.on { background: var(--hover); color: var(--text); }
.spark-code { width: 100%; font: 12px/1.5 var(--mono); color: var(--text); background: var(--bg); border: 1px solid var(--border-strong); border-radius: 10px; padding: 9px 12px; resize: vertical; overflow-wrap: anywhere; outline: 0; }
.spark-preview { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin: 12px 0 4px; font-size: 13.5px; color: var(--text-2); }
.spark-preview b { color: var(--text); }
.spark-preview p { margin: 6px 0 0; }
.read-aloud.on { color: var(--accent); }
.spark-report .when .read-aloud { margin-left: auto; width: 26px; height: 26px; }
.spark-report .when .read-aloud svg { width: 13px; height: 13px; }
/* A like or a dislike, for its later shifts to learn from. */
.spark-report .rate { display: inline-flex; gap: 2px; }
.spark-report .rate .icon-btn { width: 26px; height: 26px; }
.spark-report .rate .icon-btn svg { width: 13px; height: 13px; }
.spark-report .rate .up.on { color: #3fb56d; background: color-mix(in srgb, #3fb56d 14%, transparent); }
.spark-report .rate .down.on { color: var(--del); background: color-mix(in srgb, var(--del) 14%, transparent); }
.spark-report .rate .on svg { fill: currentColor; fill-opacity: 0.18; }
.field select { width: 100%; font: 14.5px var(--sans); color: var(--text); background: var(--bg); border: 1px solid var(--border-strong); border-radius: 10px; padding: 9px 12px; outline: 0; }

.ext-preview { margin: 14px 0 6px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--code-bg); }
.ext-preview .name { font: 600 14px var(--mono); }
.ext-preview ul { margin: 8px 0 0; padding-left: 18px; font-size: 13.5px; color: var(--text-2); }
.ext-preview .note { margin: 10px 0 0; font-size: 13px; color: var(--text-3); }
.ext-preview .note.warn { color: var(--del); }
.mem-path { font: 12px var(--mono); color: var(--text-3); margin: 10px 2px 0; }
.steps { display: flex; flex-direction: column; gap: 20px; margin: 18px 0 16px; }
.step { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; }
.step .num { width: 24px; height: 24px; border-radius: 50%; background: var(--hover); border: 1px solid var(--border); display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--text-2); }
.step-title { font-size: 14px; font-weight: 500; margin: 2px 0 9px; }
.prompt-box { border: 1px solid var(--border); border-radius: 12px; background: var(--code-bg); overflow: hidden; }
.prompt-box pre { margin: 0; padding: 12px 14px; max-height: 128px; overflow: auto; font: 12px/1.6 var(--mono); white-space: pre-wrap; color: var(--text-2); }
.prompt-box .bar { display: flex; justify-content: flex-end; padding: 7px 8px; border-top: 1px solid var(--border); }
.step textarea { width: 100%; min-height: 118px; resize: vertical; font: 13px/1.55 var(--mono); }
#form .dialog-buttons.sticky { position: sticky; bottom: -24px; margin: 0 -24px -24px; padding: 12px 24px 20px; background: var(--surface); border-top: 1px solid var(--border); }
.import-preview { font-size: 13px; color: var(--text-3); margin-top: 8px; min-height: 18px; }
.import-preview .found { display: flex; align-items: center; gap: 6px; color: var(--text-2); font-weight: 500; }
.import-preview .found svg { width: 15px; height: 15px; color: var(--add); }
.import-preview ul { margin: 8px 0 0; padding: 8px 12px 8px 26px; max-height: 132px; overflow: auto; border-radius: 10px; background: var(--hover); color: var(--text-2); line-height: 1.5; }
.import-preview li { animation: rise 0.2s var(--ease) both; }
.chat-list { border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.chat-list button { display: flex; justify-content: space-between; gap: 16px; width: 100%; padding: 12px 16px; text-align: left; font-size: 14.5px; border-bottom: 1px solid var(--border); }
.chat-list button:last-child { border-bottom: 0; }
.chat-list button:hover { background: var(--hover); }
.chat-list .when { color: var(--text-3); font-size: 12.5px; white-space: nowrap; }
.actions-row { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }
#crumb { font-size: 14px; color: var(--text-3); padding: 5px 8px; border-radius: 8px; margin-left: 6px; }
#crumb:hover { color: var(--text); background: var(--hover); }
#crumb + #title { margin-left: 0; }
#crumb::after { content: "/"; margin-left: 10px; color: var(--text-3); opacity: 0.6; }
.side-row.active { background: var(--pressed); color: var(--text); }

.field { display: block; margin: 0 0 14px; text-align: left; }
.field span { display: block; font-size: 12.5px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }
.field small { display: block; font-size: 12px; color: var(--text-3); margin-top: 6px; }
.field[hidden] { display: none; }
.field small.bad { color: var(--del); }
.field input.mono { font-family: var(--mono); font-size: 13.5px; }
.form-error { color: var(--del); font-size: 13px; min-height: 18px; margin: -4px 0 8px; }
.dialog-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
/* Folder suggestions, hanging under the field that asked for them. */
.suggest { position: fixed; z-index: 50; max-height: 248px; overflow-y: auto; padding: 5px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px; box-shadow: var(--shadow); animation: pop 0.14s cubic-bezier(0.2, 0, 0, 1); }
.suggest[hidden] { display: none; }
.suggest-row { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 8px; font: 13.5px var(--mono); color: var(--text-3); cursor: pointer; white-space: nowrap; overflow: hidden; }
.suggest-row svg { width: 15px; height: 15px; flex: none; }
.suggest-row .path { display: flex; min-width: 0; }
.suggest-row .where { flex: none; }
.suggest-row .name { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; }
.suggest-row .name b { color: var(--text); font-weight: 600; }
.suggest-row.sel { background: var(--hover); }
.suggest-row.sel svg { color: var(--accent); }
.suggest-row.sel .name { color: var(--text); }
.dialog-buttons .spacer { flex: 1; }
.btn.danger { color: var(--del); }

.menu .head-row { padding: 8px 10px 4px; font-size: 11.5px; font-weight: 500; color: var(--text-3); }
.menu .health { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); flex: none; opacity: 0.6; }
.menu .health.up { background: var(--add); opacity: 1; }
.menu .health.down { background: var(--del); opacity: 1; }
/* Answering, but not to this key: something in front of it wants one. */
.menu .health.refused { background: var(--warn); opacity: 1; }
.menu .lock { display: inline-flex; color: var(--text-3); }
.menu .lock svg { width: 12px; height: 12px; }
.menu .label .lock { margin-left: 6px; vertical-align: -1px; }
.menu .sub { font: 11.5px var(--mono); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu .stack { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.35; }
.menu .remove { opacity: 0; color: var(--text-3); padding: 2px; border-radius: 6px; display: grid; }
.menu .item:hover .remove { opacity: 1; }
.menu .remove:hover { color: var(--text); background: var(--hover); }
.menu .remove svg { width: 14px; height: 14px; }
.menu .menu-note { font-weight: 400; }
.menu .item.add { color: var(--text-3); }
.menu .item.add svg { width: 16px; height: 16px; }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 6px 4px; }
/* A section of the model menu that folds: its name, and what is picked
   in it, beside a chevron that turns as it opens. */
.menu .item.section { padding: 7px 10px 5px; font-size: 11.5px; font-weight: 500; color: var(--text-3); gap: 6px; }
.menu .item.section svg { width: 13px; height: 13px; transition: transform 0.2s var(--ease); }
.menu .item.section.open svg { transform: rotate(90deg); }
.menu .item.section .picked { margin-left: auto; font: 11.5px var(--mono); max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu .item.section.open .picked { display: none; }
/* A model's whole name, its own part stronger than where it is from
   and which build it is. */
.menu .full { font-family: var(--mono); font-size: 13px; }
.menu .full .own { color: var(--text); }
.menu .full .rest { color: var(--text-3); }
.menu .menu-note code { font: 11.5px var(--mono); }
.menu .menu-note.bad { color: var(--del); }

/* Files the agent shows: a card in the chat, a panel from the right --- */
.attachment {
  display: flex; align-items: center; gap: 12px; width: min(420px, 100%);
  padding: 10px 14px 10px 10px; text-align: left;
  border: 1px solid var(--border); border-radius: 14px; background: var(--surface);
  transition: border-color 0.14s, box-shadow 0.2s, transform 0.25s var(--spring);
}
.attachment:hover { border-color: var(--border-strong); box-shadow: var(--composer-shadow); transform: translateY(-1px); }
.attachment:active { transform: scale(0.98); }
.attachment .thumb {
  width: 48px; height: 48px; border-radius: 9px; flex: none; overflow: hidden;
  display: grid; place-items: center; background: var(--hover); color: var(--text-3);
}
.attachment .thumb img { width: 100%; height: 100%; object-fit: cover; }
.attachment .thumb .badge { font: 700 10px/1 var(--sans); letter-spacing: 0.04em; color: var(--accent); }
.attachment .info { flex: 1; min-width: 0; }
.inline-image {
  position: relative; display: block; padding: 0; overflow: hidden; cursor: zoom-in;
  max-width: min(480px, 100%); width: fit-content; border-radius: 14px;
  border: 1px solid var(--border); background: var(--hover);
  transition: border-color 0.14s, box-shadow 0.2s, transform 0.25s var(--spring);
}
.inline-image img { display: block; max-width: 100%; max-height: 380px; width: auto; height: auto; object-fit: contain; }
.inline-image:hover { border-color: var(--border-strong); box-shadow: var(--composer-shadow); transform: translateY(-1px); }
.inline-image:active { transform: scale(0.985); }
.inline-image:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.inline-image .caption {
  position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 8px;
  padding: 18px 12px 9px; color: #fff; font-size: 12.5px; text-align: left;
  background: linear-gradient(transparent, rgba(0, 0, 0, 0.55));
  opacity: 0; transform: translateY(4px); transition: opacity 0.18s, transform 0.18s;
}
.inline-image:hover .caption, .inline-image:focus-visible .caption { opacity: 1; transform: none; }
.inline-image .caption .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inline-image .caption svg { width: 14px; height: 14px; }
.inline-image.broken { min-width: 220px; min-height: 64px; cursor: pointer; }
.inline-image.broken img { display: none; }
.inline-image.broken .caption { position: static; opacity: 1; transform: none; color: var(--text-2); background: none; padding: 22px 14px; }
@media (hover: none) { .inline-image .caption { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .inline-image, .inline-image .caption { transition: none; } }
.attachment .name { font-weight: 500; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attachment .meta { font-size: 12.5px; color: var(--text-3); }
.attachment .chev svg { width: 16px; height: 16px; color: var(--text-3); }

/* The agent's browser: a window onto its newest step in the chat, and
   the whole run, step by step, in the panel. */
.browser-card { display: flex; flex-direction: column; width: min(440px, 100%); padding: 0; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); overflow: hidden; text-align: left; transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease); animation: rise 0.28s var(--ease) both; }
.browser-card:hover { border-color: var(--border-strong); }
.browser-card.open { border-color: var(--accent); }
.browser-card .shot { display: block; aspect-ratio: 16 / 9; background: var(--code-bg); border-bottom: 1px solid var(--border); overflow: hidden; }
.browser-card .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
.browser-card .bar { display: flex; align-items: center; gap: 10px; padding: 9px 12px; }
.browser-card .globe svg { width: 16px; height: 16px; color: var(--accent); display: block; }
.browser-card .info { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.browser-card .name { font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.browser-card .meta { font-size: 12.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.browser-card .chev svg { width: 16px; height: 16px; color: var(--text-3); display: block; }
.browser-view { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--code-bg); }
.browser-bar { display: flex; align-items: center; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--border); background: var(--surface); }
.browser-bar .icon-btn { width: 30px; height: 30px; }
.browser-bar [data-prev] svg { transform: scaleX(-1); }
.browser-bar .icon-btn:disabled { opacity: 0.35; cursor: default; }
.browser-bar .url { flex: 1; min-width: 0; margin-left: 4px; padding: 6px 12px; border-radius: 999px; background: var(--bg); border: 1px solid var(--border); font: 12.5px var(--mono); color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.browser-bar .live { display: inline-flex; align-items: center; gap: 6px; margin-left: 6px; font-size: 12px; font-weight: 600; color: var(--accent); }
.browser-bar .live[hidden] { display: none; }
.browser-bar .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse-dot 1.4s var(--ease) infinite; }
@keyframes pulse-dot { 50% { opacity: 0.35; } }
.browser-shot { flex: 1; min-height: 0; overflow: auto; padding: 14px; }
.browser-shot img { display: block; width: 100%; height: auto; border-radius: 8px; box-shadow: var(--shadow); background: #fff; }
.browser-step { padding: 9px 14px; border-top: 1px solid var(--border); background: var(--surface); font-size: 13px; color: var(--text-2); }
.browser-step:empty { display: none; }

#viewer {
  flex: none; width: 0; overflow: hidden; position: relative;
  border-left: 1px solid transparent;
  transition: width 0.46s var(--apple), border-color 0.46s var(--apple);
}
#viewer.open { width: var(--viewer-w, min(46vw, 780px)); border-left-color: var(--border); }
#viewer .pane {
  position: absolute; top: 0; right: 0; bottom: 0; width: var(--viewer-w, min(46vw, 780px));
  display: flex; flex-direction: column; background: var(--bg);
  transform: translateX(48px); opacity: 0;
  transition: transform 0.46s var(--apple), opacity 0.3s var(--ease);
}
#viewer.open .pane { transform: none; opacity: 1; }
/* The panel's left edge drags to make it wider or narrower. */
.viewer-resize { position: absolute; top: 0; bottom: 0; left: 0; z-index: 5; width: 10px; cursor: col-resize; touch-action: none; outline: 0; }
.viewer-resize::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 2px; background: var(--accent); opacity: 0; transition: opacity 0.15s var(--ease); }
.viewer-resize:hover::after, .viewer-resize:focus-visible::after, #viewer.resizing .viewer-resize::after { opacity: 1; transition-delay: 0.08s; }
#viewer.resizing, #viewer.resizing .pane { transition: none; }
body.resizing-viewer { cursor: col-resize; user-select: none; }
body.resizing-viewer iframe { pointer-events: none; }
.viewer-bar {
  height: 56px; flex: none; display: flex; align-items: center; gap: 10px;
  padding: 0 10px 0 16px; border-bottom: 1px solid var(--border);
}
.viewer-bar .kind { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--hover); color: var(--text-3); flex: none; }
.viewer-bar .kind svg { width: 16px; height: 16px; }
.viewer-bar .names { flex: 1; min-width: 0; line-height: 1.3; }
#viewer-title { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#viewer-size { font-size: 12px; color: var(--text-3); }
.viewer-bar a.icon-btn { text-decoration: none; }
.viewer-editing { display: flex; gap: 6px; margin-right: 6px; flex: none; }
.viewer-editing[hidden] { display: none; }
#viewer-body { flex: 1; min-height: 0; position: relative; background: var(--code-bg); }
#viewer-body iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--code-bg); }
#viewer-body iframe.page { background: #fff; }
#viewer-body .image { position: absolute; inset: 0; overflow: auto; display: grid; place-items: center; padding: 20px; cursor: zoom-in; }
#viewer-body .image img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; box-shadow: var(--shadow); animation: rise-far 0.45s var(--apple) both; }
#viewer-body .image.actual { place-items: start; cursor: zoom-out; }
/* A 3D model: the canvas fills the panel; a few controls float on it. */
.model-view { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 35%, var(--surface), var(--code-bg) 75%); }
.model-view .stage { position: absolute; inset: 0; cursor: grab; }
.model-view .stage:active { cursor: grabbing; }
.model-view .model-note { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--text-3); font-size: 13.5px; pointer-events: none; }
.model-view .model-tools { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 12px; background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--border); box-shadow: var(--shadow); backdrop-filter: blur(8px); animation: rise-far 0.45s var(--apple) both; }
.model-view .model-tools[hidden] { display: none; }
.model-view .model-tools button { padding: 5px 10px; border-radius: 8px; font-size: 12.5px; color: var(--text-2); white-space: nowrap; }
.model-view .model-tools button:hover { background: var(--hover); color: var(--text); }
.model-view .model-tools button[aria-pressed="true"] { background: var(--hover); color: var(--text); }
.model-view .model-tools .hint { padding: 0 8px; font-size: 12px; color: var(--text-3); white-space: nowrap; }
@media (max-width: 560px) { .model-view .model-tools .hint { display: none; } }

/* A MIDI file: a piano roll, its tracks, and a transport to play it by.
   The roll fits the whole piece across; the line is where it is. */
.midi-view { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; }
.midi-view .midi-note { margin: auto; padding: 24px; text-align: center; color: var(--text-3); font-size: 13.5px; }
/* Long or busy pieces scroll across rather than squeezing into the
   width: the lane is as wide as the piece at the zoom, and the canvas
   stays put over the part in view. */
.midi-view .roll { position: relative; flex: 1 0 220px; margin: 14px 14px 0; border-radius: 12px; overflow-x: auto; overflow-y: hidden; background: var(--code-bg); border: 1px solid var(--border); cursor: pointer; touch-action: pan-x pan-y; scrollbar-width: thin; }
.midi-view .roll .lane { position: relative; height: 100%; min-width: 100%; }
.midi-view .roll canvas { position: sticky; left: 0; top: 0; width: 100%; height: 100%; display: block; }
.midi-view .zoom { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.midi-view .zoom button { padding: 4px 9px; border-radius: 0; }
.midi-view .tracks { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px 0; }
.midi-view .track { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px 4px 8px; border-radius: 999px; border: 1px solid var(--border); font-size: 12.5px; color: var(--text-2); background: var(--surface); }
.midi-view .track i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.midi-view .track small { color: var(--text-3); font-size: 11.5px; }
.midi-view .track[aria-pressed="false"] { opacity: 0.45; }
.midi-view .track[aria-pressed="false"] i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
.midi-view .transport { display: flex; align-items: center; gap: 10px; padding: 12px 14px 14px; flex-wrap: wrap; }
.midi-view .play { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-text); flex: none; transition: transform 0.15s var(--spring); }
.midi-view .play:active { transform: scale(0.93); }
.midi-view .play svg { width: 17px; height: 17px; }
.midi-view .play:not(.on) svg { margin-left: 2px; }
.midi-view .time { font: 12.5px var(--mono); color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.midi-view .scrub { flex: 1; min-width: 120px; accent-color: var(--accent); }
.midi-view .knobs { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.midi-view .knobs button { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 8px; font-size: 12.5px; color: var(--text-2); }
.midi-view .knobs button:hover, .midi-view .knobs button[aria-pressed="true"] { background: var(--hover); color: var(--text); }
.midi-view .knobs svg { width: 14px; height: 14px; }
.midi-view .knobs select { font: 12.5px var(--sans); color: var(--text-2); background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 4px 6px; }
.midi-view .knobs .vol { display: inline-flex; align-items: center; gap: 5px; color: var(--text-3); }
.midi-view .knobs .vol input { width: 72px; accent-color: var(--accent); }
@media (max-width: 560px) { .midi-view .knobs { margin-left: 0; width: 100%; justify-content: space-between; } .midi-view .knobs .vol input { width: 60px; } }

/* A document, set like a page: a readable column, generous margins. */
#viewer-body .doc-scroll { position: absolute; inset: 0; overflow: auto; background: var(--bg); display: flex; flex-direction: column; }
#viewer-body:has(.doc-foot:not([hidden])) .doc-scroll { bottom: var(--foot, 220px); }
.doc { width: 100%; max-width: 720px; margin: 0 auto; padding: 36px 40px 72px; font-size: 16px; line-height: 1.75; color: var(--text); animation: rise 0.3s var(--ease) both; }
.doc.assistant h1 { font-size: 1.85em; letter-spacing: -0.02em; margin: 0 0 0.6em; line-height: 1.2; }
.doc.assistant h2 { font-size: 1.35em; margin: 1.8em 0 0.6em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border); }
.doc.assistant h3 { font-size: 1.12em; margin: 1.5em 0 0.5em; }
.doc.assistant > :first-child { margin-top: 0; }
.doc.assistant table { margin: 0 0 1em; }
.doc.assistant img { max-width: 100%; }
.doc-plain { white-space: pre-wrap; font: 14px/1.65 var(--mono); }
.doc-error { color: var(--del); }
::highlight(doc-comment) { background-color: color-mix(in srgb, var(--warn) 30%, transparent); }
/* Flash's comments: its own colour, and a line under, so they read as
   notes from it and not the user's. */
::highlight(doc-note) { background-color: color-mix(in srgb, var(--accent) 16%, transparent); text-decoration: underline 2px color-mix(in srgb, var(--accent) 75%, transparent); text-underline-offset: 4px; }
.note-pop .who { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 12px; font-weight: 600; color: var(--accent); }
.note-pop .who .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.note-pop p { margin: 0 0 4px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
.doc-thumb { display: grid; place-items: center; color: var(--accent); }
.doc-thumb svg { width: 22px; height: 22px; }

/* Commenting: a button by the selection, then a small box to write in. */
.doc-comment-btn { position: fixed; z-index: 60; display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 9px; font-size: 13px; font-weight: 500; color: var(--invert-text); background: var(--invert-bg); box-shadow: var(--shadow); animation: pop 0.14s var(--ease); }
.doc-comment-btn svg { width: 14px; height: 14px; }
.doc-comment-box { position: fixed; z-index: 60; width: 280px; padding: 12px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--surface); box-shadow: var(--shadow); animation: pop 0.16s var(--ease); }
.doc-comment-box blockquote { margin: 0 0 8px; padding-left: 10px; border-left: 3px solid var(--warn); font-size: 12.5px; color: var(--text-3); max-height: 60px; overflow: hidden; }
.doc-comment-box textarea { width: 100%; resize: vertical; min-height: 64px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); outline: 0; }
.doc-comment-box textarea:focus { border-color: var(--border-strong); }
.doc-comment-box .row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.doc-comment-box .hint { flex: 1; font-size: 11.5px; color: var(--text-3); }

/* The comments waiting to go, at the foot of the panel. */
.doc-foot { position: absolute; left: 0; right: 0; bottom: 0; height: var(--foot, 220px); display: flex; flex-direction: column; border-top: 1px solid var(--border); background: var(--surface); }
.doc-foot[hidden] { display: none; }
.doc-foot-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.doc-foot-head b { font-size: 13.5px; }
.doc-foot-head .spacer, .doc-editbar .spacer { flex: 1; }
/* The footer reads as a chat: Flash on the left, the user in bubbles
   on the right, each under the passage it is about. */
.doc-comments { list-style: none; margin: 0; padding: 12px 14px 16px; overflow: auto; flex: 1; display: flex; flex-direction: column; gap: 14px; }
.doc-comments li { display: flex; flex-direction: column; align-items: flex-start; max-width: 100%; animation: rise 0.22s var(--ease) both; }
.doc-comments li.mine { align-items: flex-end; }
.doc-comments li.lost .about { opacity: 0.55; }
.doc-comments .who { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; font-size: 12px; font-weight: 600; color: var(--accent); }
.doc-comments .who .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.doc-comments .about { display: flex; align-items: baseline; gap: 6px; max-width: 88%; margin-bottom: 5px; padding: 2px 0; font-size: 12px; color: var(--text-3); text-align: left; }
.doc-comments button.about:hover q { color: var(--text-2); }
.doc-comments .where { flex: none; font: 600 11px/1.3 var(--mono); }
.doc-comments .where:empty { display: none; }
.doc-comments q { min-width: 0; padding-left: 7px; border-left: 2px solid var(--warn); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; quotes: none; }
.doc-comments li.theirs q { border-left-color: var(--accent); }
.doc-comments .said { margin: 0; max-width: 92%; font-size: 14px; line-height: 1.55; color: var(--text); white-space: pre-wrap; word-wrap: break-word; }
.doc-comments .replying { margin-bottom: 4px; font-size: 11.5px; color: var(--accent); }
.doc-comments .bubble { margin: 0; max-width: 85%; padding: 8px 13px; border-radius: 16px 16px 5px 16px; border: 1px solid var(--border); background: var(--bg); font-size: 14px; line-height: 1.5; color: var(--text); white-space: pre-wrap; word-wrap: break-word; cursor: text; }
.doc-comments .acts { display: flex; align-items: center; gap: 2px; margin-top: 4px; opacity: 0; transition: opacity 0.15s var(--ease); }
.doc-comments li.theirs .acts { opacity: 1; gap: 4px; }
.doc-comments li:hover .acts, .doc-comments .acts:focus-within { opacity: 1; }
.doc-comments .acts .icon-btn { width: 26px; height: 26px; }
.doc-comments .acts .icon-btn svg { width: 14px; height: 14px; }
.doc-comments .acts .btn { height: 26px; padding: 0 10px; font-size: 12.5px; }
.doc-comments .bubble-edit { width: 85%; resize: none; padding: 8px 13px; border-radius: 16px 16px 5px 16px; border: 1px solid var(--accent); background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); outline: 0; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.doc-comments .edit-acts { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.doc-comments .edit-acts .hint { font-size: 11.5px; color: var(--text-3); margin-right: 4px; }
.doc-comments .edit-acts .btn { height: 26px; padding: 0 10px; font-size: 12.5px; }

/* Editing in place: the page itself, with a toolbar for the formatting. */
.doc-editbar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--surface); font-size: 13.5px; color: var(--text-2); }
.doc-tools { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; min-width: 0; }
.doc-editbar .doc-block { width: 112px; }
.doc-tools .sep { width: 1px; height: 18px; background: var(--border-strong); margin: 0 5px; }
.doc-tool { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: var(--text-2); font: 600 14px/1 var(--sans); transition: background 0.12s, color 0.12s; }
.doc-tool svg { width: 16px; height: 16px; }
.doc-tool:hover { background: var(--hover); color: var(--text); }
.doc-tool.on { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.doc-tool.t-italic { font-style: italic; font-family: Georgia, serif; }
.doc-tool.t-underline { text-decoration: underline; text-underline-offset: 3px; }
.doc-tool.t-strikeThrough { text-decoration: line-through; }
.doc-block { height: 30px; padding: 0 26px 0 9px; margin-right: 4px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: 13px var(--sans); cursor: pointer; }
.doc-editable { outline: 0; caret-color: var(--accent); cursor: text; }
.doc-editable:empty::before { content: "Start writing"; color: var(--text-3); }
.doc-editable u, .doc u { text-underline-offset: 3px; }
.doc-editable .code-head { user-select: none; }
.doc-link-box input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: 13.5px var(--mono); outline: 0; }
#viewer-body .image.actual img { max-width: none; max-height: none; }

/* Search ------------------------------------------------------------- */
#search .dialog { width: min(660px, 100%); }
#search .dialog { animation: spotlight-in 0.3s var(--apple) both; }
#search-input { flex: 1; height: 54px; border: 0; outline: 0; background: transparent; color: var(--text); font: 16px var(--sans); }
#search-input::placeholder { color: var(--text-3); font: 16px var(--sans); }
#search-list { max-height: 56vh; overflow-y: auto; padding: 6px; }
.result { align-items: flex-start; padding: 10px 12px; }
.result .stack { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.result .title { font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.result .snippet { font-size: 13px; color: var(--text-3); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.result .snippet .who { color: var(--text-2); font-weight: 500; }
.result mark { background: color-mix(in srgb, var(--accent) 28%, transparent); color: var(--text); border-radius: 3px; padding: 0 1px; }
.result .when { font-size: 12px; color: var(--text-3); white-space: nowrap; margin-top: 2px; }
.result .more { font-size: 12px; color: var(--text-3); }
.search-empty { padding: 22px 14px; text-align: center; color: var(--text-3); font-size: 14px; }
.row.sel .snippet { color: var(--text-2); }

/* The message a search led to glows, and its words are marked. */
::highlight(found) { background-color: color-mix(in srgb, var(--accent) 38%, transparent); color: var(--text); }
/* What voice mode is reading aloud right now. */
::highlight(speaking) { background-color: color-mix(in srgb, var(--accent) 26%, transparent); color: var(--text); }
.block.found { animation: found 2.2s var(--ease); border-radius: 14px; }
@keyframes found {
  0%, 30% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent) 16%, transparent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
}

/* Popovers, menus, dialogs ------------------------------------------- */
.menu {
  position: absolute; z-index: 30;
  min-width: 260px; max-width: 360px; max-height: 320px; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: 14px; box-shadow: var(--shadow); padding: 6px;
  animation: pop 0.14s cubic-bezier(0.2, 0, 0, 1);
}
.menu .item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 9px; font-size: 14px; text-align: left; color: var(--text-2); }
.menu .item.sel { background: var(--hover); color: var(--text); }
.menu .item .check { margin-left: auto; color: var(--accent); }
.menu .item .check svg { width: 16px; height: 16px; }
.menu .item .desc svg { width: 14px; height: 14px; display: block; }
.menu .empty { padding: 10px; color: var(--text-3); font-size: 13px; }
.menu .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu .slash { font-family: var(--mono); font-size: 13px; color: var(--text); flex: none; }
.menu .desc { color: var(--text-3); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.overlay {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(2px);
  display: flex; justify-content: center; align-items: flex-start;
  padding: 14vh 16px 16px;
  animation: fade 0.14s ease-out;
}
.dialog {
  width: min(600px, 100%);
  background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: 18px; box-shadow: var(--shadow); overflow: hidden;
  animation: pop 0.16s cubic-bezier(0.2, 0, 0, 1);
}
.search { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--border); color: var(--text-3); }
#palette-input { flex: 1; height: 54px; border: 0; outline: 0; background: transparent; color: var(--text); font: 16px var(--sans); }
#palette-input::placeholder { color: var(--text-3); font: 16px var(--sans); }
#palette-list { max-height: 52vh; overflow-y: auto; padding: 6px; }
.row { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; cursor: pointer; font-size: 14px; color: var(--text-2); }
.row .group { font-size: 12px; color: var(--text-3); width: 44px; flex: none; }
.row .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .keys { display: none; gap: 4px; color: var(--text-3); }
.row.sel { background: var(--hover); color: var(--text); }
.row.sel .keys { display: flex; }
.row mark { background: none; color: var(--text); font-weight: 600; }

.dialog .inner { padding: 22px 24px 24px; max-height: 76vh; overflow-y: auto; }
.dialog h2 { font: 600 19px/1.3 var(--sans); letter-spacing: -0.01em; margin: 0 0 4px; }
.dialog .sub { color: var(--text-3); font-size: 14px; margin: 0 0 8px; }
.dialog h3 { font-size: 12px; color: var(--text-3); font-weight: 500; margin: 20px 0 8px; }
.keys-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 2px 28px; }
.keys-grid div { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; padding: 5px 0; color: var(--text-2); }
.keys-grid span:last-child { display: flex; gap: 4px; color: var(--text-3); font-size: 12px; align-items: center; white-space: nowrap; }
#help .dialog { width: min(720px, 100%); }

#phone .dialog { width: min(400px, 100%); text-align: center; }
#qr { display: inline-block; margin: 18px 0 14px; padding: 12px; background: #fff; border-radius: 16px; line-height: 0; }
#qr svg { width: 220px; height: 220px; display: block; shape-rendering: crispEdges; }
.link { font: 12px var(--mono); color: var(--text-3); word-break: break-all; background: var(--hover); padding: 8px 10px; border-radius: 9px; text-align: left; }
.dialog code { background: var(--hover); border: 1px solid var(--border); padding: 2px 6px; border-radius: 6px; }

#tip {
  position: fixed; z-index: 60; pointer-events: none;
  display: flex; align-items: center; gap: 8px;
  padding: 6px 9px; border-radius: 8px;
  background: var(--invert-bg); color: var(--invert-text);
  font-size: 12.5px; font-weight: 500; white-space: nowrap;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
  opacity: 0; transform: translateY(2px);
  transition: opacity 0.1s, transform 0.1s;
}
#tip.show { opacity: 1; transform: none; }
#tip .k { display: flex; gap: 3px; }
#tip kbd { background: rgba(127, 127, 127, 0.28); }

#toast {
  position: fixed; left: 50%; bottom: 28px; z-index: 70;
  transform: translateX(-50%);
  height: 38px; padding: 0 16px; border-radius: 19px;
  display: flex; align-items: center; justify-content: center;
  background: var(--invert-bg); color: var(--invert-text);
  font-size: 13.5px; font-weight: 500; white-space: nowrap;
  box-shadow: var(--shadow);
  opacity: 0; pointer-events: none; overflow: hidden;
  max-width: calc(100vw - 32px);
}
#toast span { overflow: hidden; text-overflow: ellipsis; }
/* Its Markdown: code as code, and links that can be clicked while it shows. */
#toast code { font: 12.5px var(--mono); padding: 1px 5px; border-radius: 5px; background: color-mix(in srgb, var(--invert-text) 16%, transparent); }
#toast a { color: inherit; text-decoration: underline; text-underline-offset: 2px; pointer-events: auto; }

@keyframes pulse { 50% { opacity: 0.3; } }
@keyframes shine { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } }
@keyframes pop { from { opacity: 0; transform: scale(0.97); } }
@keyframes fade { from { opacity: 0; } }

@media (hover: none) {
  .actions { opacity: 1; }
  #tip { display: none; }
}
@media (max-width: 800px) {
  #viewer, #viewer.open { position: fixed; inset: 0; z-index: 55; width: 100%; border: 0; pointer-events: none; }
  #viewer .pane { width: 100%; transform: translateX(100%); opacity: 1; }
  .viewer-resize { display: none; }
  #viewer.open { pointer-events: auto; }
  #viewer.open .pane { transform: none; }
  #sidebar { position: fixed; z-index: 50; height: 100%; box-shadow: var(--shadow); }
  body:not(.side-closed) #scrim { display: block; position: fixed; inset: 0; z-index: 45; background: rgba(0, 0, 0, 0.4); }
  #top .when-closed { display: grid !important; }
  .col { padding: 0 14px; }
  #greeting { font-size: 30px; }
  .user { max-width: 92%; }
  body.empty #dock { padding-bottom: 6vh; }
  #model-btn { max-width: 45%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .glow, .shell::after, #greeting::after { display: none; }
  #log, #dock { view-transition-name: none; }
  .slide { opacity: 1; }
}
</style>

<body class="empty">
<div id="app">

// ---------------------------------------------------------------------------
// Motion. Everything here is skipped for anyone whose system asks for
// less of it, and none of it is ever waited on to do the actual work.

const calm = matchMedia("(prefers-reduced-motion: reduce)");

// Change what is on screen inside a view transition, where there is one:
// the old and new views cross-fade, and the composer glides between the
// middle of an empty chat and the foot of a full one.
function morph(change, nav) {
  if (!document.startViewTransition || calm.matches || document.hidden) { change(); return; }
  // Which way it moves: "forward" into something, "back" out of it, or
  // unset for a cross-fade between things side by side.
  const root = document.documentElement;
  if (nav) root.dataset.nav = nav; else delete root.dataset.nav;
  const transition = document.startViewTransition(change);
  transition.finished.then(() => { if (root.dataset.nav === nav) delete root.dataset.nav; }, () => {});
  // A second transition before this one ends skips it, which rejects
  // these; the change itself still happens, so there is nothing to do.
  transition.ready.catch(() => {});
  transition.finished.catch(() => {});
}

// Once, restartable: removing and re-adding a class does not replay an
// animation unless the element is reflowed between the two.
function flash(node, cls, ms = 450) {
  if (!node || calm.matches) return;
  node.classList.remove(cls);
  void node.offsetWidth;
  node.classList.add(cls);
  clearTimeout(node["_" + cls]);
  node["_" + cls] = setTimeout(() => node.classList.remove(cls), ms);
}

// Run AFTER, once NODE's leaving animation (class CLS) has played.
function leave(node, cls, after, ms = 180) {
  if (!node || calm.matches) { after(); return; }
  node.classList.add(cls);
  setTimeout(after, ms);
}

const buzz = (ms = 8) => { if (navigator.vibrate && matchMedia("(hover: none)").matches) navigator.vibrate(ms); };

// Scroll BOX, and nothing else, just enough to show NODE. Not
// scrollIntoView: that scrolls every scrollable ancestor as well,
// the page included, and drags the whole app out of its window.
function reveal(box, node, smooth, margin = 6) {
  if (!box || !node) return;
  let delta = 0;
  if (node.offsetParent === box) {
    // Layout positions, which a box still scaling in from its opening
    // animation does not throw off the way on-screen ones would.
    const top = node.offsetTop, bottom = top + node.offsetHeight;
    if (top < box.scrollTop + margin) delta = top - box.scrollTop - margin;
    else if (bottom > box.scrollTop + box.clientHeight - margin) delta = bottom - box.scrollTop - box.clientHeight + margin;
  } else {
    const b = box.getBoundingClientRect();
    const r = node.getBoundingClientRect();
    if (r.top < b.top + margin) delta = r.top - b.top - margin;
    else if (r.bottom > b.bottom - margin) delta = r.bottom - b.bottom + margin;
  }
  if (delta) box.scrollBy({ top: delta, behavior: smooth && !calm.matches ? "smooth" : "auto" });
}

// A body that opens and closes by animating its height.
function slideBox(parent) {
  let inner = parent.querySelector(":scope > .slide > .inner");
  if (!inner) {
    const slide = el("div", "slide");
    inner = el("div", "inner");
    slide.appendChild(inner);
    parent.appendChild(slide);
  }
  return inner;
}

// ---------------------------------------------------------------------------
// Connection. The link Flash opened carried a token, which the server
// traded for a cookie that signs this browser in: the page never holds
// the token, so signing the browser out in Settings locks it out. The
// token leaves the address bar too, so it is not left in the history or
// shown over a shoulder.

const params = new URLSearchParams(location.search);
if (params.has("token")) window.history.replaceState(null, "", location.pathname);
try { sessionStorage.removeItem("flash-token"); } catch (_) { /* where older pages kept it */ }

async function api(path, body) {
  const options = body === undefined
    ? { credentials: "same-origin" }
    : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), credentials: "same-origin" };
  const response = await fetch(path, options);
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}
const command = (name, arg, chat = current, extra = {}) => api("/api/command", { name, arg, chat, ...extra });

// State
