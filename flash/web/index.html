// Local time, as a file name: 2026-09-27-15-04-05.
const stamp = () => {
  const d = new Date();
  return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 19).replace(/[T:]/g, "-");
};

// One frame of a screen, window or tab the browser lets you pick.
async function screenshot() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
  } catch (err) {
    if (err.name !== "NotAllowedError" && err.name !== "AbortError") toast(`No screenshot: ${err.message}`);
    return;
  }
  try {
    const video = el("video");
    video.muted = true;
    video.srcObject = stream;
    await video.play();
    // Two frames, so the capture has something drawn in it.
    await new Promise((done) => requestAnimationFrame(() => requestAnimationFrame(done)));
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);
    const as = (type, quality) => new Promise((done) => canvas.toBlob(done, type, quality));
    let blob = await as("image/png");
    let type = "png";
    if (blob && blob.size > MAX_UPLOAD) { blob = await as("image/jpeg", 0.9); type = "jpeg"; }
    if (!blob) throw new Error("the capture came back empty");
    addFiles([new File([blob], `screenshot-${stamp()}.${type === "png" ? "png" : "jpg"}`, { type: `image/${type}` })]);
  } finally {
    stream.getTracks().forEach((t) => t.stop());
  }
}

// Screen recordings -------------------------------------------------------
// The user shows Flash how they do something. While the screen is
// recorded, the page catches a still each time it changes and settles,
// and, narrated, keeps what the microphone hears; the recording goes
// with the next message, the stills and what was said over each one go
// to the model, which works out the procedure and saves it as a skill.

const REC_LONGEST = 4 * 60;          // seconds a recording may run
const REC_BITS = 600_000;            // its video bitrate: four minutes fit in an upload
const REC_LOOK_MS = 600;             // how often the screen is looked at for change
const REC_SETTLE_MS = 900;           // how long it must hold still to count as a step
const REC_STILL_WIDTH = 1280;        // the stills' width, at most
const REC_MAX_STILLS = 16;
let recording = null;

const canRecordScreen = () => !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia && window.MediaRecorder);
const clock = (seconds) => `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, "0")}`;

// A small picture of the screen, in colour, to tell one moment from
// another: two colours as bright as each other are still two colours.
function screenPrint(video, canvas) {
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  return ctx.getImageData(0, 0, canvas.width, canvas.height).data;
}

// How much of the screen changed between two prints, from 0 to 1: the
// share of its points that changed plainly, so a menu opening counts
// however little of the screen it covers.
function printsDiffer(a, b) {
  if (!a || !b) return 1;
  let changed = 0;
  for (let i = 0; i < a.length; i += 4) {
    if (Math.abs(a[i] - b[i]) > 24 || Math.abs(a[i + 1] - b[i + 1]) > 24 || Math.abs(a[i + 2] - b[i + 2]) > 24) changed++;
  }
  return changed / (a.length / 4);
}

async function stillOf(video) {
  const scale = Math.min(1, REC_STILL_WIDTH / video.videoWidth);
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(video.videoWidth * scale);
  canvas.height = Math.round(video.videoHeight * scale);
  canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
  return new Promise((done) => canvas.toBlob(done, "image/jpeg", 0.72));
}

async function recordScreen(narrate) {
  if (recording) return;
  let screen;
  try {
    screen = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 15 }, audio: false });
  } catch (err) {
    if (err.name !== "NotAllowedError" && err.name !== "AbortError") toast(`No recording: ${err.message}`);
    return;
  }
  let mic = null;
  if (narrate) {
    try { mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
    catch (_) { toast("No microphone, so the recording goes without your words"); }
  }
  const video = el("video");
  video.muted = true;
  video.srcObject = screen;
  try { await video.play(); } catch (_) { /* it plays once there is a frame */ }

  const tracks = [...screen.getVideoTracks(), ...(mic ? mic.getAudioTracks() : [])];
  const type = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"].find((t) => MediaRecorder.isTypeSupported(t)) || "";
  const recorder = new MediaRecorder(new MediaStream(tracks), { mimeType: type, videoBitsPerSecond: REC_BITS });
  const rec = { screen, mic, video, recorder, chunks: [], bytes: 0, started: performance.now(), stills: [], print: null, pending: null, quietSince: 0, timer: 0, pcm: [], audio: null, discarded: false };
  recording = rec;
  recorder.ondataavailable = (e) => {
    if (!e.data.size) return;
    rec.chunks.push(e.data);
    rec.bytes += e.data.size;
    // Kept under what one upload can carry.
    if (rec.bytes > MAX_UPLOAD - 1_500_000) stopRecording();
  };
  recorder.onstop = () => finishRecording(rec);
  recorder.start(1000);
  // Ending the share from the browser's own bar ends the recording.
  screen.getVideoTracks()[0].addEventListener("ended", () => stopRecording());

  // The microphone, at the rate the listening model hears, for what was
  // said over each step.
  if (mic) {
    try {
      const ctx = new AudioContext();
      const source = ctx.createMediaStreamSource(mic);
      const node = ctx.createScriptProcessor(4096, 1, 1);
      node.onaudioprocess = (e) => {
        const samples = e.inputBuffer.getChannelData(0);
        const ratio = ctx.sampleRate / VOICE_RATE;
        const out = new Int16Array(Math.floor(samples.length / ratio));
        let level = 0;
        for (let i = 0; i < out.length; i++) {
          const from = Math.floor(i * ratio), to = Math.min(samples.length, Math.floor((i + 1) * ratio));
          let total = 0;
          for (let j = from; j < to; j++) total += samples[j];
          const value = total / Math.max(1, to - from);
          level = Math.max(level, Math.abs(value));
          out[i] = Math.max(-32768, Math.min(32767, Math.round(value * 32767)));
        }
        rec.pcm.push(out);
        rec.level = Math.min(1, level * 3);
      };
      source.connect(node);
      node.connect(ctx.destination);
      rec.audio = ctx;
    } catch (_) { rec.audio = null; }
  }

  // Each look: has the screen changed, and has it settled since? A
  // settled change is a step, and its still is kept.
  const canvas = Object.assign(document.createElement("canvas"), { width: 160, height: 90 });
  rec.timer = setInterval(async () => {
    if (!video.videoWidth) return;
    const now = performance.now();
    const print = screenPrint(video, canvas);
    if (!rec.stills.length) { rec.print = print; await keepStill(rec, now); return; }
    const moving = printsDiffer(print, rec.last) > 0.002;
    rec.last = print;
    if (moving) { rec.quietSince = now; return; }
    if (now - rec.quietSince >= REC_SETTLE_MS && printsDiffer(print, rec.print) > 0.004) {
      rec.print = print;
      await keepStill(rec, now);
    }
    showRecording(rec);
  }, REC_LOOK_MS);
  rec.ticker = setInterval(() => {
    showRecording(rec);
    if ((performance.now() - rec.started) / 1000 >= REC_LONGEST) stopRecording();
  }, 250);
  const bar = $("#recording");
  bar.hidden = false;
  bar.querySelector(".rec-mic").hidden = !mic;
  if (mic) bar.querySelector(".rec-mic").innerHTML = "<i></i><i></i><i></i><i></i>";
  showRecording(rec);
}

async function keepStill(rec, now) {
  const blob = await stillOf(rec.video);
  if (blob) rec.stills.push({ blob, at: (now - rec.started) / 1000 });
}

function showRecording(rec) {
  const seconds = (performance.now() - rec.started) / 1000;
  const bar = $("#recording");
  const steps = rec.stills.length;
  bar.querySelector(".rec-meta").textContent = `${clock(seconds)} of ${clock(REC_LONGEST)} · ${steps} step${steps === 1 ? "" : "s"} caught${rec.mic ? " · narrating" : ""}`;
  if (rec.mic) bar.querySelectorAll(".rec-mic i").forEach((bit, n) => bit.style.setProperty("--v", Math.max(0, (rec.level || 0) - n * 0.12).toFixed(2)));
}

function stopRecording(discard = false) {
  const rec = recording;
  if (!rec) return;
  rec.discarded = rec.discarded || discard;
  clearInterval(rec.timer);
  clearInterval(rec.ticker);
  if (rec.recorder.state !== "inactive") rec.recorder.stop();
  else finishRecording(rec);
}

// Stopped: the last moment is a step too, the stills are thinned to what
// the model can take, and it all goes in the tray to send.
async function finishRecording(rec) {
  if (rec.finished) return;
  rec.finished = true;
  const seconds = (performance.now() - rec.started) / 1000;
  if (!rec.discarded && rec.video.videoWidth) await keepStill(rec, performance.now());
  rec.screen.getTracks().forEach((t) => t.stop());
  if (rec.mic) rec.mic.getTracks().forEach((t) => t.stop());
  if (rec.audio) rec.audio.close().catch(() => {});
  recording = null;
  $("#recording").hidden = true;
  if (rec.discarded) { toast("Recording discarded"); return; }
  if (!rec.chunks.length) { toast("Nothing was recorded"); return; }
  if (attached.length >= MAX_ATTACHED) { toast(`Up to ${MAX_ATTACHED} files go with one message`); return; }

  let stills = rec.stills;
  if (stills.length > REC_MAX_STILLS) {
    // The first and the last, and the rest evenly between.
    const keep = new Set([0, stills.length - 1]);
    for (let n = 1; keep.size < REC_MAX_STILLS; n++) keep.add(Math.round(n * (stills.length - 1) / (REC_MAX_STILLS - 1)));
    stills = stills.filter((_, i) => keep.has(i));
  }
  const file = new File(rec.chunks, `screen-recording-${stamp()}.webm`, { type: "video/webm" });
  const item = { name: file.name, size: file.size, recording: true, seconds, uploading: true, url: stills.length ? URL.createObjectURL(stills[0].blob) : "" };
  attached.push(item);
  renderTray();
  updateSend();
  if (!input.value.trim()) input.placeholder = "Say what it shows, or just send it to teach Flash";
  input.focus();

  let narration = "";
  if (rec.pcm.length) {
    const pcm = new Int16Array(rec.pcm.reduce((n, part) => n + part.length, 0));
    let at = 0;
    for (const part of rec.pcm) { pcm.set(part, at); at += part.length; }
    narration = base64Of(new Uint8Array(pcm.buffer));
  }
  try {
    const sent = { name: item.name, data: await readBase64(file), narration, stills: [] };
    for (const still of stills) sent.stills.push({ data: await readBase64(still.blob), at: Math.round(still.at * 10) / 10 });
    const kept = await api("/api/upload", sent);
    Object.assign(item, { id: kept.id, name: kept.name, kind: kept.kind, uploading: false });
    if (kept.unheard) toast("Your words were not written down: voice mode's listening model is not set up (Settings > Voice models). The steps still go.");
  } catch (err) {
    if (attached.includes(item)) { toast(`The recording did not upload: ${err.message}`); unattach(item); }
    return;
  }
  if (attached.includes(item)) { renderTray(); updateSend(); }
}

$("#recording [data-rec-stop]").onclick = () => stopRecording();
$("#recording [data-rec-discard]").onclick = () => stopRecording(true);

// For a phone or a tablet, where there is no Ctrl V to press.
async function pasteImage() {
  let items;
  try { items = await navigator.clipboard.read(); } catch (_) { toast("The browser blocked the clipboard"); return; }
  const files = [];
  for (const item of items) {
    const type = item.types.find((t) => t.startsWith("image/"));
    if (type) files.push(new File([await item.getType(type)], `pasted-${stamp()}.${type.split("/")[1].replace("jpeg", "jpg")}`, { type }));
  }
  if (files.length) addFiles(files); else toast("There is no image on the clipboard");
}

// Picking one names it at the start of the message; Flash reads the
// skill when the message reaches it.
async function openSkillPicker() {
  const { skills: list } = await command("skills");
  const rows = [{ header: true, html: "Use a skill" }];
  for (const sk of list) {
    rows.push({ html: `<span class="stack"><span class="label">${esc(sk.name)}</span><span class="sub">${esc(sk.description || "")}</span></span>`, skill: sk.name });
  }
  rows.push({ html: `${icon("plus")}<span class="label">${list.length ? "Browse skills…" : "No skills yet. Browse…"}</span>`, browse: true, cls: "add" });
  openPlusMenu(rows, (row) => {
    if (row.browse) { showPage("skills"); return; }
    const lead = `Use the ${row.skill} skill. `;
    const rest = input.value.replace(/^Use the \S+ skill\. /, "");
    input.value = lead + rest;
    autosize();
    updateSend();
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }, "");
}

// Files dragged in from anywhere land in the box.
let dragDepth = 0;
const carriesFiles = (e) => [...((e.dataTransfer && e.dataTransfer.types) || [])].includes("Files");
function showDrop(on) {
  const drop = $("#drop");
  if (on && !drop.firstChild.firstChild) drop.firstChild.innerHTML = `${icon("image")}<span>Drop to attach</span><span>Photos and files, up to 20 MB each</span>`;
  drop.classList.toggle("on", on);
}
document.addEventListener("dragenter", (e) => {
  if (!carriesFiles(e)) return;
  e.preventDefault();
  dragDepth++;
  if (view === "chat") showDrop(true);
});
document.addEventListener("dragover", (e) => {
  if (!carriesFiles(e)) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = view === "chat" ? "copy" : "none";
});
document.addEventListener("dragleave", (e) => {
  if (!carriesFiles(e)) return;
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) showDrop(false);
});
document.addEventListener("drop", (e) => {
  if (!carriesFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  showDrop(false);
  if (view === "chat") addFiles(e.dataTransfer.files);
});

// A pasted screenshot attaches; pasted text stays text.
input.addEventListener("paste", (e) => {
  const data = e.clipboardData;
  if (!data || !data.files.length || data.getData("text/plain")) return;
  e.preventDefault();
  addFiles(data.files);
});

// The project a chat starts in, picked from the box before its first
// message. Picking one on a chat that has nothing in it yet starts over
// on a new one, since a chat's project is set when it is made.
function renderProjectBtn() {
  const p = projectOf(viewProject);
  const b = $("#project-btn");
  b.innerHTML = `${icon("folder")}<span></span>`;
  b.lastChild.textContent = p ? p.name : "Project";
  b.classList.toggle("on", !!p);
}

// The badge on a chat with a spark: its bubble and name. It opens the
// spark's window; on a new chat nothing has been said in, its x makes
// it a chat with Flash again.
function renderSparkBtn() {
  renderRoster();
  renderSparkAsk();
  const chat = chats.get(current);
  const sp = sparkOf(chat ? chat.spark : viewSpark);
  const b = $("#spark-btn");
  b.hidden = !sp;
  if (!sp) return;
  const fresh = !chat || (!chat.log.length && !chat.busy && !chat.queued);
  b.innerHTML = `<span class="name"></span>${fresh ? `<span class="drop" role="button" aria-label="Chat with Flash instead">${icon("x")}</span>` : ""}`;
  b.prepend(sparkAvatar({ ...sp, unread: 0, status: chat && (chat.busy || chat.queued) ? "working" : "idle" }, 18));
  b.querySelector(".name").textContent = sp.name;
  b.style.setProperty("--c", sp.colour);
  b.dataset.tip = fresh ? `Talking with ${sp.name}` : `Open ${sp.name}`;
}

function openProjectPicker() {
  const rows = [{ header: true, html: "Start this chat in" }];
  rows.push({ html: `<span class="label">No project</span>`, project: "", current: !viewProject });
  for (const p of [...projects].reverse()) {
    rows.push({
      html: `<span class="stack"><span class="label">${esc(p.name)}</span><span class="sub">${esc(shortPath(p.path))}</span></span>`,
      project: p.id, current: p.id === viewProject,
    });
  }
  rows.push({ html: `${icon("plus")}<span class="label">New project…</span>`, add: true, cls: "add" });
  openMenu($("#project-btn"), rows, (row) => (row.add ? projectForm() : pickProject(row.project)), "", true);
}

function pickProject(id) {
  const chat = chats.get(current);
  if (chat && (chat.log.length || chat.busy || chat.queued)) return;
  current = null;
  viewProject = id || null;
  drawChat();
  input.focus();
}

async function newChat() {
  // A new chat starts empty: nothing is made until the first message,
  // so pressing it twice does not leave an empty chat behind.
  view = "chat";
  current = null;
  viewProject = null;
  viewSpark = null;
  renderChats();
  morph(drawChat);
  input.focus();
  if (innerWidth <= 800) closeSide();
}

// A new chat with a spark, on the main screen: from its window on the
// Sparks page, or from + in the box. Like any new chat, it is made when
// the first message is sent.
function startSparkChat(id) {
  if (isOpen($("#form"))) closeForm();
  closeMenu();
  view = "chat";
  current = null;
  const sp = sparkOf(id);
  viewProject = sp && projectOf(sp.project) ? sp.project : null;
  viewSpark = id;
  renderChats();
  morph(drawChat);
  input.focus();
  if (innerWidth <= 800) closeSide();
}

async function openSparkPicker() {
  let list;
  try { list = (await command("sparks")).sparks; } catch (error) { showFailure(error); return; }
  const rows = [{ header: true, html: "Chat with a spark" }];
  for (const sp of list) {
    rows.push({ html: `${sparkAvatar({ ...sp, unread: 0 }, 22).outerHTML}<span class="stack"><span class="label">${esc(sp.name)}</span><span class="sub">${esc(sp.handle)} · ${esc(sparkState(sp))}</span></span>`, spark: sp.id });
  }
  rows.push({ html: `${icon("plus")}<span class="label">${list.length ? "All sparks…" : "No sparks yet. Make one…"}</span>`, browse: true, cls: "add" });
  openPlusMenu(rows, (row) => (row.browse ? showPage("sparks") : startSparkChat(row.spark)), "");
}

function switchTo(id, nav) {
  if (!chats.has(id)) return;
  current = id;
  view = "chat";
  viewProject = chats.get(id).project || null;
  renderChats();
  refreshContext();
  // Inside the change: a view transition applies it a moment later, and
  // until then the old chat is still what is on the page.
  morph(() => {
    drawChat();
    const pending = pendingAsk();
    if (pending) { pending.focus({ preventScroll: true }); reveal(logEl, pending, false, 16); } else input.focus();
  }, nav);
}

function visibleChats() {
  return [...chats.values()].filter((c) => c.log.length || c.busy || c.queued).sort(byRecent).map((c) => c.id);
}

function stepChat(delta) {
  const list = visibleChats();
  if (!list.length) return;
  const at = list.indexOf(current);
  const next = list[at < 0 ? 0 : (at + delta + list.length) % list.length];
  if (next) switchTo(next);
}

async function toggleAuto() {
  const { auto } = await command("auto", "toggle");
  info.auto = auto;
  renderInfo();
}

async function setModel(name) {
  await command("model", name);
  info.model = name;
  renderInfo();
}

async function undo() { const { message } = await command("undo"); toast(message); }

async function clearChat() {
  if (!current) return;
  await command("clear");
}

async function deleteChat(id = current) {
  if (!id) return;
  const row = document.querySelector(`.chat[data-chat="${id}"]`);
  if (row && !calm.matches) {
    await row.animate(
      [{ height: row.offsetHeight + "px", opacity: 1 }, { height: "0px", opacity: 0, transform: "translateX(-8px)" }],
      { duration: 200, easing: "cubic-bezier(0.2, 0, 0, 1)", fill: "forwards" },
    ).finished.catch(() => {});
  }
  await command("delete", "", id);
  chats.delete(id);
  order = order.filter((x) => x !== id);
  if (current === id) { current = null; drawChat(); }
  renderChats();
}

// Rename a chat right where it sits in the sidebar.
function renameInSide(id, row) {
  const chat = chats.get(id);
  if (!chat || renamingChat) return;
  renamingChat = id;
  const field = el("input", "rename");
  field.value = chat.title;
  field.setAttribute("aria-label", "Chat name");
  row.textContent = "";
  row.appendChild(field);
  field.focus();
  field.select();
  let finished = false;
  const done = async (save) => {
    if (finished) return;
    finished = true;
    const value = field.value.trim();
    renamingChat = null;
    const changed = save && value && value !== chat.title;
    if (changed) {
      chat.title = value;
      if (id === current && view === "chat") { $("#title").textContent = value; document.title = `${value} · Flash`; }
    }
    renderChats();
    if (changed) await command("rename", value, id).catch(showFailure);
  };
  field.onkeydown = (e) => {
    if (e.key === "Enter") { e.preventDefault(); done(true); input.focus(); }
    if (e.key === "Escape") { e.preventDefault(); done(false); input.focus(); }
    e.stopPropagation();
  };
  field.onblur = () => done(true);
  field.onclick = (e) => e.stopPropagation();
}

function rename() {
  const chat = chats.get(current);
  if (!chat || view !== "chat" || document.body.classList.contains("empty")) return;
  const title = $("#title");
  const field = el("input");
  field.value = chat.title;
  title.textContent = "";
  title.appendChild(field);
  field.focus();
  field.select();
  let finished = false;
  const done = async (save) => {
    if (finished) return;
    finished = true;
    const value = field.value.trim();
    title.textContent = chat.title;
    if (save && value && value !== chat.title) {
      chat.title = value;
      title.textContent = value;
      renderChats();
      await command("rename", value);
    }
    input.focus();
  };
  field.onkeydown = (e) => {
    if (e.key === "Enter") { e.preventDefault(); done(true); }
    if (e.key === "Escape") { e.preventDefault(); done(false); }
    e.stopPropagation();
  };
  field.onblur = () => done(true);
}

function lastOf(type) {
  const chat = chats.get(current);
  if (!chat) return null;
  for (let i = chat.log.length - 1; i >= 0; i--) if (chat.log[i].type === type && chat.log[i].text) return chat.log[i];
  return null;
}

function retry() { const last = lastOf("user"); if (last) send(last.text); else toast("Nothing to retry"); }

function editLast(text, files) {
  const last = text === undefined ? lastOf("user") || {} : {};
  const value = text ?? last.text ?? "";
  if (parseComments(value)) { toast("Comments are sent from the document. Open it to add more."); return; }
  files = files ?? last.files ?? [];
  if (!value && !files.length) { toast("Nothing to edit"); return; }
  reattach(files);
  input.value = value;
  autosize();
  updateSend();
  input.focus();
  input.setSelectionRange(value.length, value.length);
}

async function copy(text, what, from) {
  if (!text) { toast(`No ${what} to copy`); return; }
  try { await navigator.clipboard.writeText(text); }
  catch (_) { toast("The browser blocked the clipboard"); return; }
  // The button says it worked, so there is no toast to read as well.
  if (from) {
    const was = from.innerHTML;
    from.innerHTML = was.replace(/<svg[\s\S]*?<\/svg>/, icon("check")).replace(/Copy$/, "Copied");
    flash(from, "done", 1300);
    clearTimeout(from._restore);
    from._restore = setTimeout(() => { from.innerHTML = was; }, 1300);
  } else toast(`Copied ${what}`);
}
const copyLastReply = () => copy((lastOf("assistant") || {}).text, "reply");
function copyLastCode() {
  const found = [...((lastOf("assistant") || {}).text || "").matchAll(/```[^\n]*\n([\s\S]*?)```/g)];
  copy(found.length ? found[found.length - 1][1].replace(/\n$/, "") : "", "code block");
}

function toggleAllTools() {
  allOpen = !allOpen;
  messagesEl.querySelectorAll(".tool").forEach((card) => card.classList.toggle("open", allOpen));
}

// "light", "dark", or "system", which follows the computer.
const lightQuery = matchMedia("(prefers-color-scheme: light)");
let themeChoice = pref("theme", "system");
const resolveTheme = (choice) => (choice === "system" ? (lightQuery.matches ? "light" : "dark") : choice);

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#faf9f5" : "#262624";
}

function setTheme(choice) {
  themeChoice = choice;
  savePref("theme", choice);
  markThemeCards();
  const next = resolveTheme(choice);
  if (next !== document.documentElement.dataset.theme) wipeTheme(next);
}

function toggleTheme() {
  setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");
}

lightQuery.addEventListener("change", () => {
  if (themeChoice === "system") wipeTheme(resolveTheme("system"));
});

// The new theme sweeps across from the top-left corner. The circle
// itself is CSS (theme-sweep); this only marks the switch and runs it.
function wipeTheme(next) {
  const change = () => applyTheme(next);
  if (!document.startViewTransition || calm.matches || document.hidden) { change(); return; }
  const root = document.documentElement;
  root.classList.add("theme-switch");
  const transition = document.startViewTransition(change);
  transition.ready.catch(() => {});
  const done = () => root.classList.remove("theme-switch");
  transition.finished.then(done, done);
}

function closeSide() { document.body.classList.add("side-closed"); }
function toggleSide() {

let menuEl = null;
let menuRows = [];
let menuSel = 0;
let menuPick = null;
let emojiField = null;     // the box the open menu is offering emojis for
let emojis = {};           // :name -> emoji, the terminal's list

function closeMenu() {
  emojiField = null;
  $("#plus-btn").classList.remove("open");
  if (!menuEl) return;
  const leaving = menuEl;
  menuEl = null;
  leave(leaving, "closing", () => leaving.remove(), 120);
}

function openMenu(anchor, rows, pick, emptyText, alignLeft) {
  closeMenu();
  menuRows = rows;
  menuPick = pick;
  menuSel = rows.findIndex((r) => r.current && !r.header);
  if (menuSel < 0) menuSel = rows.findIndex((r) => !r.header);
  menuEl = el("div", "menu");
  menuEl.setAttribute("role", "listbox");
  // Built once. Moving the selection only moves the highlight, and a
  // move from the keyboard scrolls the list to keep it in sight; the
  // mouse is already pointing at the row it picked.
  const items = [];
  const mark = (scroll) => {
    items.forEach((item, i) => { if (item) item.classList.toggle("sel", i === menuSel); });
    const sel = items[menuSel];
    if (scroll && sel) reveal(menuEl, sel, false, 4);
  };
  const draw = () => {
    if (!rows.length) menuEl.appendChild(el("div", "empty")).textContent = emptyText;
    rows.forEach((row, i) => {
      if (row.header) {
        if (row.rule) menuEl.appendChild(el("hr"));
        if (row.html) menuEl.appendChild(el("div", "head-row", row.html));
        return;
      }
      if (row.rule) menuEl.appendChild(el("hr"));
      const item = el("button", "item" + (row.cls ? " " + row.cls : "") + (i === menuSel ? " sel" : ""));
      items[i] = item;
      item.type = "button";
      item.innerHTML = row.html + (row.current ? `<span class="check">${icon("check")}</span>` : "");
      item.onmousemove = () => { if (menuSel !== i) { menuSel = i; mark(false); } };
      item.onmousedown = (e) => e.preventDefault();
      item.onclick = (e) => {
        const remove = e.target.closest("[data-remove]");
        if (remove) { e.stopPropagation(); removeHost(remove.dataset.remove); return; }
        // A section's header folds it, with the menu left open.
        if (row.keep) { pick(row); return; }
        closeMenu();
        pick(row);
      };
      menuEl.appendChild(item);
    });
  };
  menuEl.redraw = () => mark(true);
  draw();
  document.body.appendChild(menuEl);
  // Above the anchor if it fits there, else below if it fits there, else
  // on the roomier side, cut to fit: never past the edge of the window.
  const r = anchor.getBoundingClientRect();
  const above = r.top - 16, below = innerHeight - r.bottom - 16;
  const natural = menuEl.offsetHeight;
  const up = natural <= above || (natural > below && above > below);
  menuEl.style.maxHeight = Math.max(120, Math.min(natural, up ? above : below)) + "px";
  const w = menuEl.offsetWidth, h = menuEl.offsetHeight;
  const left = alignLeft ? r.left : r.right - w;
  menuEl.style.left = Math.max(8, Math.min(innerWidth - w - 8, left)) + "px";
  menuEl.style.top = Math.max(8, up ? r.top - h - 8 : r.bottom + 8) + "px";
  mark(true);
}

let modelsLoading = false;
let modelsReachable = true;
// System One's side of the menu: the System One models on this host,
// scanned when the menu opens, and which is in use.
let systemOne = { loading: false, models: [], model: "", problem: "", too_old: false };

// Which of the menu's sections are folded, kept for this browser.
const folded = { host: pref("fold-host", "0") === "1", model: pref("fold-model", "0") === "1", s1: pref("fold-s1", "0") === "1" };

// The picker that is showing: in the box on a new chat, at the top of
// the chat once one is going.
const modelAnchor = () => (document.body.classList.contains("empty") || document.body.classList.contains("on-page") ? $("#model-btn") : $("#top-model"));

// The menu opens at once with the hosts. The models and the hosts' dots
// fill in as each answers, so a host that is down never holds it shut.
async function openModels(focusHosts = false) {
  slashOpen = false;
  modelsLoading = true;
  // Asked for the hosts, they are opened to.
  if (focusHosts) folded.host = false;
  const hadModels = models.length > 0;
  systemOne = { ...systemOne, loading: true };
  drawModelMenu(focusHosts);
  const stillOpen = () => menuEl && !slashOpen && menuEl.dataset.kind === "models";
  command("model").then(
    (r) => { models = r.models || []; modelsReachable = r.reachable !== false; },
    () => { modelsReachable = false; },
  ).finally(() => {
    modelsLoading = false;
    // Where the highlight goes if nothing had loaded to put it on yet.
    if (stillOpen()) drawModelMenu(focusHosts, hadModels || focusHosts);
  });
  command("hosts").then((r) => {
    hosts = r.hosts;
    info.host_url = r.current;
    if (stillOpen()) drawModelMenu(focusHosts, true);
  }, () => {});
  command("system-one", "models", null).then(
    (r) => { systemOne = { ...r, loading: false }; },
    (error) => { systemOne = { loading: false, models: [], model: "", problem: error.message || String(error) }; },
  ).finally(() => { if (stillOpen()) drawModelMenu(focusHosts, true); });
}

// A section's header: its name, and what is picked in it while folded.
const sectionRow = (key, name, picked, rule) => ({
  section: key, keep: true, rule, cls: "section" + (folded[key] ? "" : " open"),
  html: `${icon("chevRight")}<span>${name}</span><span class="picked">${esc(picked)}</span>`,
});

function drawModelMenu(focusHosts, keepSelection) {
  const active = info.host_url || normalHost(info.host);
  const shown = hosts.length ? hosts : [{ name: "This computer", url: "http://localhost:11434" }];
  if (!shown.some((h) => h.url === active)) shown.push({ name: info.host_name || "Current", url: active });
  const activeHost = shown.find((h) => h.url === active);
  const rows = [sectionRow("host", "Host", activeHost ? activeHost.name : active)];
  if (!folded.host) {
    for (const h of shown) {
      const health = h.up === undefined ? "" : h.up ? " up" : h.refused ? " refused" : " down";
      // Where it is, or why it will not talk to Flash.
      const where = h.refused ? (h.locked ? "turned down its key" : "wants an API key") : h.url.replace(/^https?:\/\//, "");
      const lock = h.locked ? `<span class="lock" data-tip="Sends an API key">${icon("lock")}</span>` : "";
      // Only a saved host can go, and not while it is the one in use.
      const removable = h.saved && h.url !== active;
      rows.push({
        html: `<span class="health${health}"></span><span class="stack"><span class="label">${esc(h.name)}${lock}</span><span class="sub">${esc(where)}</span></span>` +
          (removable ? `<span class="remove" data-remove="${esc(h.url)}" data-tip="Remove host">${icon("x")}</span>` : ""),
        host: h.url, current: h.url === active,
      });
    }
    rows.push({ html: `${icon("plus")}<span class="label">Add host…</span>`, add: true, cls: "add" });
  }
  rows.push(sectionRow("model", "Model", shortModel(info.model) || "None", true));
  if (!folded.model) {
    if (modelsLoading && !models.length) rows.push({ header: true, html: '<span class="menu-note">Loading models…</span>' });
    else if (!modelsReachable && !modelsLoading && activeHost && activeHost.refused) rows.push({ header: true, html: '<span class="menu-note">This host wants an API key. Add it again with its key under Add host.</span>' });
    else if (!modelsReachable && !modelsLoading) rows.push({ header: true, html: '<span class="menu-note">This host is not answering. Pick another above.</span>' });
    else {
      // A model that can only judge is System One's, below: it cannot chat.
      const chatty = models.filter((m) => m === info.model || !(systemOne.judge_only || []).includes(m));
      for (const m of chatty) rows.push({ html: modelParts(m), value: m, current: m === info.model });
      if (!chatty.length) rows.push({ header: true, html: '<span class="menu-note">No models on this host</span>' });
    }
  }
  const s1 = info.system_one ? info.system_one_model : "";
  rows.push(sectionRow("s1", "System One", s1 ? shortModel(s1) : "None", true));
  if (!folded.s1) {
    // None first: System One is optional, and off unless a model is picked.
    rows.push({ html: '<span class="label">None</span>', s1: "none", current: !s1 });
    for (const m of systemOne.models || []) rows.push({ html: modelParts(m), s1: m, current: sameModel(m, s1) });
    // Picked before, but not found on this host now.
    if (s1 && !(systemOne.models || []).some((m) => sameModel(m, s1)) && !systemOne.loading) rows.push({ html: modelParts(s1), s1, current: true });
    if (systemOne.loading && !(systemOne.models || []).length) rows.push({ header: true, html: '<span class="menu-note">Looking for System One models…</span>' });
    else if (systemOne.problem) rows.push({ header: true, html: `<span class="menu-note${systemOne.too_old ? " bad" : ""}">${inline(systemOne.problem)}</span>` });
  }
  const previous = keepSelection && menuEl ? menuSel : null;
  // Drawn again in place, as a section folds or a list fills in: the
  // old one goes at once rather than shrinking away under the new.
  const redrawn = keepSelection && menuEl;
  if (redrawn) { menuEl.remove(); menuEl = null; }
  const anchor = modelAnchor();
  openMenu(anchor, rows, pickModelRow, "", anchor.id === "top-model");
  if (redrawn) menuEl.style.animation = "none";
  menuEl.dataset.kind = "models";
  menuEl.classList.add("model-menu");
  if (previous !== null) { menuSel = Math.min(previous, rows.length - 1); menuEl.redraw(); }
  else if (focusHosts) { menuSel = rows.findIndex((r) => r.host && r.current); menuEl.redraw(); }
  else { const at = rows.findIndex((r) => r.value && r.current); if (at >= 0) { menuSel = at; menuEl.redraw(); } }
}

async function pickSystemOne(name) {
  let r;
  try { r = await command("system-one", "model", null, { model: name }); }
  catch (error) { showFailure(error); return; }
  info.system_one = r.on;
  info.system_one_model = r.model;
  renderInfo();
  toast(r.on ? `System One is **${shortModel(r.model)}** now` + (info.auto ? "" : ", once autonomous mode is on") : "System One is off");
}

function normalHost(url) {
  url = String(url || "").replace(/\/+$/, "");
  if (!/^https?:\/\//.test(url)) url = "http://" + url;
  return /:\d+$/.test(url.replace(/^https?:\/\//, "")) ? url : url + ":11434";
}

async function pickModelRow(row) {
  if (row.section) {
    folded[row.section] = !folded[row.section];
    savePref("fold-" + row.section, folded[row.section] ? "1" : "0");
    drawModelMenu(false, true);
    return;
  }
  if (row.s1) { pickSystemOne(row.s1); input.focus(); return; }
  if (row.add) { hostForm(); return; }
  if (row.host) { if (!row.current) await switchHost(row.host, true); else openModels(true); return; }
  if (row.value) { setModel(row.value); input.focus(); }
}

async function switchHost(url, reopen) {
  try {
    const result = await command("host", url);
    info.host = result.host;
    info.host_url = result.host_url || result.host;
    const known = hosts.find((h) => h.url === info.host_url);
    info.host_name = known ? known.name : result.host;
    models = result.models || [];
    modelsReachable = !!result.up;
    renderInfo();
    // Adding a host again at the same address replaces it, key and all.
    if (result.refused) toast(known && known.locked ? `${info.host_name} turned down its API key. Add it again under **Add host…** with the right one.` : `${info.host_name} wants an API key. Add it again under **Add host…** with its key.`);
    else toast(result.up ? `Switched to ${info.host_name}` : `${info.host_name} is not answering`);
    if (reopen) openModels(true);
  } catch (error) { showFailure(error); }
}

async function removeHost(url) {
  let result;
  try { result = await command("host-remove", url); } catch (error) { showFailure(error); return; }
  if (!result.removed) toast("That host was not saved, so there was nothing to remove.");
  // What the server has now, rather than what the page assumes.
  const listed = await command("hosts").catch(() => null);
  hosts = listed ? listed.hosts : hosts.filter((h) => h.url !== url);
  if (listed) info.host_url = listed.current;
  drawModelMenu(true, true);
}

function runSlash(text) {
  const [word, ...rest] = text.split(/\s+/);
  const arg = rest.join(" ").trim();
  if (word === "/model" && arg) { setModel(arg); clearInput(); return true; }
  if (word === "/rename" && arg) { const c = chats.get(current); if (c) { c.title = arg; renderChats(); $("#title").textContent = arg; } command("rename", arg); clearInput(); return true; }
  const action = ACTIONS.find((a) => a.slash === word);
  if (!action) return false;
  clearInput();
  action.run();
  return true;
}
function clearInput() { input.value = ""; autosize(); closeMenu(); slashOpen = false; updateSend(); }

let slashOpen = false;
function showSlash() {
  const value = input.value;
  if (!value.startsWith("/") || /\s/.test(value)) { if (slashOpen) closeMenu(); slashOpen = false; return; }
  const rows = ACTIONS.filter((a) => a.slash.startsWith(value)).map((a) => ({
    html: `<span class="slash">${esc(a.slash)}</span><span class="desc">${esc(a.label)}</span>`, action: a,
  }));
  if (!rows.length) { closeMenu(); slashOpen = false; return; }
  openMenu($("#composer"), rows, (row) => { clearInput(); row.action.run(); }, "", true);
  slashOpen = true;
}

// Emoji and mentions -------------------------------------------------------
// A colon and a few letters, as in the terminal, offers the emojis named
// that way, and an @ offers your sparks, to bring one into the chat:
// Tab or Enter puts one in. A colon or an @ that follows a letter or a
// digit, as in 12:30 or me@home, is not the start of one.

// What is being typed at the caret that a menu can finish: ":name" for
// an emoji or "@name" for a spark, with where it starts. Null if neither.
function suggestable(field) {
  if (field.selectionStart !== field.selectionEnd) return null;
  const before = field.value.slice(0, field.selectionStart);
  let m = before.match(/(?:^|\s):([a-z0-9_+-]{1,32})$/i);
  if (m) return { kind: "emoji", query: m[1].toLowerCase(), cut: m[1].length + 1 };
  m = before.match(/(?:^|\s)@([a-z0-9-]{0,32})$/i);
  if (m && sparkList.length) return { kind: "spark", query: m[1].toLowerCase(), cut: m[1].length + 1 };
  return null;
}

// The names QUERY starts, shortest first, then the ones it is inside;
// one name for each emoji.
function emojiMatches(query) {
  const names = Object.keys(emojis);
  const starts = names.filter((n) => n.startsWith(query)).sort((a, b) => a.length - b.length);
  const within = names.filter((n) => !n.startsWith(query) && n.includes(query));
  const seen = new Set();
  return [...starts, ...within].filter((n) => !seen.has(emojis[n]) && seen.add(emojis[n])).slice(0, 8);
}

// A spark is mentioned by its handle without "-spark": @scout.
const mentionOf = (sp) => sp.handle.slice(1).replace(/-spark$/, "");

function suggestionRows(want) {
  if (want.kind === "emoji") {
    return emojiMatches(want.query).map((name) => ({ html: `<span class="emo">${emojis[name]}</span><span class="slash">:${esc(name)}:</span>`, insert: emojis[name] }));
  }
  const q = want.query.replace(/-spark$/, "");
  const starts = sparkList.filter((sp) => mentionOf(sp).startsWith(q) || sp.name.toLowerCase().startsWith(q));
  const within = sparkList.filter((sp) => !starts.includes(sp) && mentionOf(sp).includes(q));
  return [...starts, ...within].slice(0, 8).map((sp) => ({
    html: `${sparkAvatar({ ...sp, unread: 0 }, 22).outerHTML}<span class="label">${esc(sp.name)}</span><span class="handle">@${esc(mentionOf(sp))}</span>`,
    insert: `@${mentionOf(sp)}`,
  }));
}

function showEmoji(field, anchor = field) {
  const want = suggestable(field);
  const rows = want ? suggestionRows(want) : [];
  if (!rows.length) { if (emojiField === field) closeMenu(); return; }
  rows.forEach((row) => { row.cut = want.cut; });
  openMenu(anchor, rows, (row) => putSuggestion(field, row), "", true);
  menuEl.classList.add("emoji-menu");
  emojiField = field;
  slashOpen = false;
}

function putSuggestion(field, row) {
  const at = field.selectionStart;
  const from = at - row.cut;
  field.value = field.value.slice(0, from) + row.insert + " " + field.value.slice(at);
  const caret = from + row.insert.length + 1;
  field.setSelectionRange(caret, caret);
  closeMenu();
  field.focus();
  field.dispatchEvent(new Event("input"));
}

// A key pressed in FIELD while its emoji menu is open: true if it was
// the menu's to handle.
function emojiKeys(e, field) {
  if (!menuEl || emojiField !== field) return false;
  if (e.key === "ArrowDown") { menuSel = (menuSel + 1) % menuRows.length; menuEl.redraw(); }
  else if (e.key === "ArrowUp") { menuSel = (menuSel - 1 + menuRows.length) % menuRows.length; menuEl.redraw(); }
  else if ((e.key === "Tab" || e.key === "Enter") && !e.shiftKey && !e.isComposing) putSuggestion(field, menuRows[menuSel]);
  else if (e.key === "Escape") closeMenu();
  else return false;
  e.preventDefault();
  e.stopPropagation();
  return true;
}

const searchBox = $("#search");
const searchInput = $("#search-input");
let searchRows = [];
let searchSel = 0;
let searchAsked = 0;
let searchTimer = null;
let jumpTo = null;   // { chat, index, terms }: where a picked result leads

const termsOf = (query) => query.toLowerCase().split(/\s+/).filter(Boolean);

// TEXT escaped, with every term in it marked.
function markTerms(text, terms) {
  if (!terms.length) return esc(text);
  const pattern = new RegExp(terms.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "gi");
  let out = "", last = 0;
  for (const m of String(text).matchAll(pattern)) {
    out += esc(text.slice(last, m.index)) + `<mark>${esc(m[0])}</mark>`;
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

function openSearch(prefill = "") {
  closeMenu();
  if (isOpen(palette)) hideOverlay(palette);
  showOverlay(searchBox);
  searchInput.value = prefill;
  searchSel = 0;
  runSearch(true);
  searchInput.focus();
  searchInput.select();
}
function closeSearch() { hideOverlay(searchBox); input.focus(); }

// Asked as you type, a beat after the last key; an answer that comes back
// after a newer question was asked is dropped.
function runSearch(now) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const asked = ++searchAsked;
    const query = searchInput.value.trim();
    const { results } = await api("/api/search?q=" + encodeURIComponent(query)).catch(() => ({ results: [] }));
    if (asked !== searchAsked) return;
    searchRows = results;
    searchSel = Math.min(searchSel, Math.max(0, results.length - 1));
    drawSearch(termsOf(query));
  }, now ? 0 : 110);
}

function drawSearch(terms) {
  const list = $("#search-list");
  list.textContent = "";
  if (!searchRows.length) {
    list.appendChild(el("div", "search-empty", terms.length ? "No chats mention that." : "No chats yet."));
    return;
  }
  searchRows.forEach((r, i) => {
    const hit = r.hits[0];
    const p = projectOf(r.project);
    const who = hit ? (hit.type === "user" ? "You" : "Flash") : "";
    const row = el("div", "row result" + (i === searchSel ? " sel" : ""));
    row.setAttribute("role", "option");
    row.innerHTML = `<div class="stack"><span class="title">${markTerms(r.title, terms)}</span>` +
      (hit ? `<span class="snippet"><span class="who">${who}:</span> ${markTerms(hit.snippet, terms)}</span>` : "") +
      (r.matches > 1 ? `<span class="more">${r.matches} messages match</span>` : "") +
      `</div><span class="when">${p ? esc(p.name) + " · " : ""}${ago(r.updated)}</span>`;
    row.onmousemove = () => { if (searchSel !== i) { searchSel = i; markSearch(false); } };
    row.onclick = () => openResult(i);
    list.appendChild(row);
  });
  markSearch(true);
}

function markSearch(scroll) {

function openResult(i) {

  jumpTo = r.hits[0] ? { chat: r.chat, index: r.hits[0].index, terms } : null;

// Scroll to the message a search found, glow it, and mark its words.
function showFound({ index, terms }) {
  const block = messagesEl.querySelector(`[data-log="${index}"]`);
  if (!block) { follow = true; toBottom(true); return; }
  follow = false;
  const top = block.getBoundingClientRect().top - logEl.getBoundingClientRect().top + logEl.scrollTop;
  logEl.scrollTo({ top: Math.max(0, top - logEl.clientHeight / 3), behavior: calm.matches ? "auto" : "smooth" });
  flash(block, "found", 2300);
  markFound(block, terms);
}

function markFound(block, terms) {
  if (!window.CSS || !CSS.highlights || typeof Highlight === "undefined" || !terms.length) return;
  const ranges = [];
  const walk = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
  while (walk.nextNode()) {
    const node = walk.currentNode;
    const low = node.nodeValue.toLowerCase();
    for (const term of terms) {
      for (let at = low.indexOf(term); at !== -1; at = low.indexOf(term, at + term.length)) {
        const range = new Range();
        range.setStart(node, at);
        range.setEnd(node, at + term.length);
        ranges.push(range);
      }
    }
  }
  CSS.highlights.set("found", new Highlight(...ranges));
  clearTimeout(markFound.timer);
  markFound.timer = setTimeout(() => CSS.highlights.delete("found"), 6000);
}

// Every typed character in order, earlier and closer scoring better.
// Spaces only separate words: "onyx 31" finds flash-onyx-2.6:31b.
function fuzzy(query, text) {
  const q = query.toLowerCase().replace(/\s+/g, ""), t = text.toLowerCase();
  if (!q) return { score: 0, marks: [] };
  let at = 0, score = 0, last = -1;
  const marks = [];
  for (const ch of q) {
    const found = t.indexOf(ch, at);
    if (found < 0) return null;
    score += found - last - 1 + (found === 0 || /[\s\-:./]/.test(t[found - 1]) ? -2 : 0);
    marks.push(found);
    last = found;
    at = found + 1;
  }
  return { score, marks };
}
const highlight = (text, marks) => [...text].map((ch, i) => (marks.includes(i) ? `<mark>${esc(ch)}</mark>` : esc(ch))).join("");

function paletteItems(query) {
  const rows = [];
  for (const a of ACTIONS) rows.push({ group: "Action", label: a.label, keys: a.keys, run: a.run });
  for (const id of visibleChats()) {
    const c = chats.get(id);
    if (id !== current) rows.push({ group: "Chat", label: c.title, run: () => switchTo(id) });
  }
  for (const p of projects) rows.push({ group: "Project", label: p.name, keys: "", run: () => openProject(p.id) });
  for (const m of models) rows.push({ group: "Model", label: m, keys: "", run: () => setModel(m) });
  for (const h of hosts) rows.push({ group: "Host", label: h.name, keys: "", run: () => switchHost(h.url, false) });
  const ranked = rows.map((r) => ({ ...r, match: fuzzy(query, r.label) })).filter((r) => r.match).sort((a, b) => a.match.score - b.match.score);
  // Typed something: the first row offers to look for it inside chats.
  if (query.trim().length > 1) {
    ranked.unshift({ group: "Search", label: `Search chats for “${query.trim()}”`, keys: "", match: { marks: [] }, run: () => openSearch(query.trim()) });
  }
  return ranked;
}

function drawPalette() {
  paletteRows = paletteItems(paletteInput.value);
  paletteSel = Math.min(paletteSel, Math.max(0, paletteRows.length - 1));
  const listEl = $("#palette-list");
  listEl.textContent = "";
  paletteRows.slice(0, 60).forEach((row, i) => {
    const node = el("div", "row" + (i === paletteSel ? " sel" : ""));
    node.setAttribute("role", "option");
    node.innerHTML = `<span class="group">${row.group}</span><span class="label">${highlight(row.label, row.match.marks)}</span>` +
      (row.keys ? `<span class="keys">${row.keys.split(" ").map((k) => `<kbd>${esc(k)}</kbd>`).join("")}</span>` : "");
    node.onmousemove = () => { if (paletteSel !== i) { paletteSel = i; markPalette(); } };
    node.onclick = () => runPalette(i);
    listEl.appendChild(node);
  });
  if (!paletteRows.length) listEl.appendChild(el("div", "row", '<span class="label" style="color:var(--text-3)">Nothing matches</span>'));
}
function markPalette() {
  [...$("#palette-list").children].forEach((n, i) => n.classList.toggle("sel", i === paletteSel));
  const sel = $("#palette-list").children[paletteSel];

}
async function openPalette() {

}
function hideOverlay(node) {
  if (node.hidden || node.classList.contains("closing")) return;
  // Reopened while it was still leaving: the opener took the class off,
  // and the dialog stays up.
  leave(node, "closing", () => { if (node.classList.contains("closing")) { node.hidden = true; node.classList.remove("closing"); } }, 160);
}
function showOverlay(node) { node.classList.remove("closing"); node.hidden = false; }
// Open and staying open: one on its way out already counts as closed.
const isOpen = (node) => !node.hidden && !node.classList.contains("closing");
function closePalette() { hideOverlay(palette); input.focus(); }
function runPalette(i) { const row = paletteRows[i]; closePalette(); if (row) row.run(); }

paletteInput.addEventListener("input", () => { paletteSel = 0; drawPalette(); });

  else if (e.key === "ArrowUp" || (e.key === "Tab" && e.shiftKey)) { e.preventDefault(); paletteSel = Math.max(paletteSel - 1, 0); markPalette(); }

});

function autosize() {
  input.style.height = "auto";

input.addEventListener("keydown", (e) => {
  if (emojiKeys(e, input)) return;
  if (menuEl && slashOpen) {
    if (e.key === "ArrowDown") { e.preventDefault(); menuSel = (menuSel + 1) % menuRows.length; menuEl.redraw(); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); menuSel = (menuSel - 1 + menuRows.length) % menuRows.length; menuEl.redraw(); return; }
    if (e.key === "Tab" && !e.shiftKey) { e.preventDefault(); input.value = menuRows[menuSel].action.slash + " "; closeMenu(); slashOpen = false; autosize(); return; }
    if (e.key === "Escape") { e.preventDefault(); closeMenu(); slashOpen = false; return; }
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); const row = menuRows[menuSel]; clearInput(); row.action.run(); return; }
  }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value, e.ctrlKey || e.metaKey ? "queue" : "steer"); return; }
  if (e.key === "Tab" && e.shiftKey) { e.preventDefault(); toggleAuto(); return; }
  if (e.key === "Escape") {
    if (menuEl) return;
    e.preventDefault();
    if (!stopReply() && !closeViewer()) { input.blur(); focusBlock(blocks().length - 1); }
    return;
  }
  const atStart = input.selectionStart === 0 && input.selectionEnd === 0;
  if (e.key === "ArrowUp" && !e.altKey && (atStart || !input.value) && sent.length) {
    e.preventDefault();
    if (sentAt === -1) { draft = input.value; sentAt = sent.length; }
    sentAt = Math.max(0, sentAt - 1);
    input.value = sent[sentAt];
    autosize(); updateSend();
    return;
  }
  if (e.key === "ArrowDown" && !e.altKey && sentAt !== -1 && input.selectionStart === input.value.length) {
    e.preventDefault();
    sentAt += 1;
    if (sentAt >= sent.length) { sentAt = -1; input.value = draft; } else input.value = sent[sentAt];
    autosize(); updateSend();
  }
});

const typing = () => { const a = document.activeElement; return a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT"); };

window.addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey;
  hideTip();
  // The real Ctrl, on a Mac too: Cmd Shift R is the browser's own reload.
  if (e.ctrlKey && e.altKey && e.shiftKey && !e.metaKey && e.code === "KeyR") { e.preventDefault(); restartServer(); return; }
  // Shift too: Ctrl Enter alone queues a message in the box.
  if (mod && e.shiftKey && e.key === "Enter" && openDoc && !openDoc.editing && openDoc.comments.length) { e.preventDefault(); sendComments(openDoc); return; }

  // An overlay on its way out counts as closed, so a key pressed during
  // its exit (Ctrl K straight after Esc) is not swallowed.
  const up = (node) => !node.hidden && !node.classList.contains("closing");
  if (voice.on && e.key === "Escape") { e.preventDefault(); endVoice(); return; }
  if (up($("#help"))) { if (e.key === "Escape" || e.key === "?" || (mod && e.key === "/")) { e.preventDefault(); closeHelp(); } return; }
  if (up($("#phone"))) { if (e.key === "Escape") { e.preventDefault(); closePhone(); } return; }
  if (up($("#form"))) return;
  if (up(palette) || up(searchBox)) return;

  if (menuEl && !slashOpen) {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const step = e.key === "ArrowDown" ? 1 : -1;
      let at = menuSel;
      do { at += step; } while (at >= 0 && at < menuRows.length && menuRows[at].header);
      if (at >= 0 && at < menuRows.length) { menuSel = at; menuEl.redraw(); }
      return;
    }
    if (e.key === "Enter") { e.preventDefault(); const row = menuRows[menuSel]; if (row && row.keep) { menuPick(row); return; } closeMenu(); if (row) menuPick(row); return; }
    if (e.key === "Escape") { e.preventDefault(); closeMenu(); input.focus(); return; }
  }

  if (mod && e.code === "KeyK") { e.preventDefault(); openPalette(); return; }
  if (mod && (e.key === "/" || e.code === "Slash")) { e.preventDefault(); openHelp(); return; }
  if (mod && e.code === "KeyB") { e.preventDefault(); toggleSide(); return; }
  if (mod && e.code === "KeyO") { e.preventDefault(); toggleAllTools(); return; }
  if (e.key === "F2") { e.preventDefault(); rename(); return; }

  if (e.altKey && !mod) {
    // e.code, not e.key: on a Mac, Alt turns letters into symbols.
    const k = e.code;
    if (k === "KeyC") { e.preventDefault(); e.shiftKey ? copyLastCode() : copyLastReply(); return; }
    if (k === "KeyD" && e.shiftKey) { e.preventDefault(); deleteChat(); return; }
    if (k === "KeyN" && pendingAsk()) { e.preventDefault(); answerPending("n"); return; }
    if (k === "KeyY") { e.preventDefault(); if (!answerPending("y")) toast("Nothing is waiting for an answer"); return; }
    if (/^Digit[1-9]$/.test(k)) { e.preventDefault(); const id = visibleChats()[+k.slice(5) - 1]; if (id) switchTo(id); return; }
    const act = { KeyV: toggleViewer, KeyN: newChat, KeyM: () => openModels(), KeyH: () => openModels(true), KeyP: showProjects, Comma: () => showSettings(), KeyF: () => openSearch(), KeyR: retry, KeyE: () => editLast(), KeyZ: undo, KeyL: clearChat, KeyT: toggleTheme, ArrowUp: () => stepChat(-1), ArrowDown: () => stepChat(1) }[k];
    if (act) { e.preventDefault(); act(); return; }
  }

  const ask = document.activeElement && document.activeElement.closest && document.activeElement.closest(".ask:not(.done)");
  if (ask && !mod && !e.altKey) {
    if (e.key === "y" || e.key === "Y" || e.key === "Enter") { e.preventDefault(); answer(ask.dataset.ask, "y"); return; }
    if (e.key === "n" || e.key === "N" || e.key === "Escape") { e.preventDefault(); answer(ask.dataset.ask, "n"); return; }
  }

  if (typing() || mod || e.altKey) return;

  const all = blocks();
  switch (e.key) {
    case "j": case "ArrowDown": e.preventDefault(); focusBlock(focusedIndex + 1); break;
    case "k": case "ArrowUp": e.preventDefault(); readingUp(); focusBlock(focusedIndex < 0 ? all.length - 1 : focusedIndex - 1); break;
    case "g": e.preventDefault(); readingUp(); logEl.scrollTop = 0; focusBlock(0); break;
    case "G": case "End": e.preventDefault(); toBottom(true); focusBlock(all.length - 1); break;
    case "Enter": case "o": e.preventDefault(); openFocused(); break;
    case "c": { const n = focusedBlock(); if (n) { e.preventDefault(); copy(n.dataset.raw || n.textContent, "block"); } break; }
    case "e": { const n = focusedBlock(); e.preventDefault(); editLast(n && n.classList.contains("user-wrap") ? n.dataset.raw : undefined); break; }
    case "y": if (answerPending("y")) e.preventDefault(); break;
    case "n": if (answerPending("n")) e.preventDefault(); break;
    case "?": e.preventDefault(); openHelp(); break;
    case "Escape": if (stopReply() || closeViewer()) e.preventDefault(); break;
    case "/": e.preventDefault(); input.focus(); input.value = "/"; showSlash(); updateSend(); break;
    case "i": case "a": e.preventDefault(); input.focus(); break;
    default: if (e.key.length === 1) input.focus();
  }
});

});

  e.preventDefault();

$("#viewer-edit").innerHTML = icon("edit");

// The panel is as wide as it was last dragged, within what leaves the
// chat room to read. Double-click puts it back.
const VIEWER_MIN = 340, CHAT_MIN = 320;
const viewerEl = $("#viewer"), viewerHandle = $(".viewer-resize");
function setViewerWidth(px) {
  const chatLeft = viewerEl.previousElementSibling.getBoundingClientRect().left;
  const room = Math.max(VIEWER_MIN, viewerEl.getBoundingClientRect().right - chatLeft - CHAT_MIN);
  const width = Math.round(Math.min(room, Math.max(VIEWER_MIN, px)));
  viewerEl.style.setProperty("--viewer-w", `${width}px`);
  return width;
}
const keptWidth = +pref("viewer-width", 0);
if (keptWidth) viewerEl.style.setProperty("--viewer-w", `${keptWidth}px`);
viewerHandle.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  e.preventDefault();
  viewerHandle.setPointerCapture(e.pointerId);
  viewerEl.classList.add("resizing");
  document.body.classList.add("resizing-viewer");
  dropCommentUi();
  const right = viewerEl.getBoundingClientRect().right;
  let width = viewerEl.getBoundingClientRect().width;
  // The drag ends when the button comes up. That release can go missing
  // (let go over a PDF's frame, outside the window, or with the capture
  // taken away), and a drag that missed it would follow the pointer with
  // no button held. So it also ends on losing the capture, on the window
  // losing focus, and on the first move made with no button down.
  let over = false;
  const move = (ev) => {
    if (!(ev.buttons & 1)) { done(); return; }
    width = setViewerWidth(right - ev.clientX);
  };
  const done = () => {
    if (over) return;
    over = true;
    viewerHandle.removeEventListener("pointermove", move);
    for (const kind of ["pointerup", "pointercancel", "lostpointercapture"]) viewerHandle.removeEventListener(kind, done);
    removeEventListener("pointerup", done, true);
    removeEventListener("blur", done);
    if (viewerHandle.hasPointerCapture(e.pointerId)) viewerHandle.releasePointerCapture(e.pointerId);
    viewerEl.classList.remove("resizing");
    document.body.classList.remove("resizing-viewer");
    savePref("viewer-width", width);
  };
  viewerHandle.addEventListener("pointermove", move);
  for (const kind of ["pointerup", "pointercancel", "lostpointercapture"]) viewerHandle.addEventListener(kind, done);
  addEventListener("pointerup", done, true);
  addEventListener("blur", done);
});
viewerHandle.ondblclick = () => {
  viewerEl.style.removeProperty("--viewer-w");
  savePref("viewer-width", "");
};
viewerHandle.addEventListener("keydown", (e) => {
  const step = { ArrowLeft: 32, ArrowRight: -32 }[e.key];
  if (!step) return;
  e.preventDefault();
  savePref("viewer-width", setViewerWidth(viewerEl.getBoundingClientRect().width + step));
});
// A smaller window still leaves the chat its room.
addEventListener("resize", () => { if (viewerEl.style.getPropertyValue("--viewer-w") && viewerEl.classList.contains("open")) setViewerWidth(viewerEl.getBoundingClientRect().width); });
$("#viewer-edit").onclick = () => { if (openDoc) editDocument(openDoc); };

applyTheme(resolveTheme(themeChoice));
if (innerWidth <= 800 || pref("side", "open") === "closed") document.body.classList.add("side-closed");
renderInfo();
updateSend();

// The server only sends this page to a browser it let in, by link or by
// cookie, so there is nothing to check before starting.
connect();
loadState().catch(showFailure);
input.focus();
