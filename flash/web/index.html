  if (!openDoc || !openDoc.comments.length) { toast("No comments waiting to send"); return; }
  sendComments(openDoc);
}

// The comments go to Flash as one message, each quoting its passage. An
// edit still open is saved first, so they are about what Flash will read.
async function sendComments(doc) {
  if (!doc.comments.length) return;
  if (doc.editing && !(await saveDocument(doc))) return;
  const where = doc.entry.path ? `${doc.entry.name} (${doc.entry.path})` : doc.entry.name;
  const lines = [`Comments on ${where}, with the line and column each one is about in the file as it is now:`];
  doc.comments.forEach((c, i) => {
    const quote = c.quote.replace(/\s+/g, " ");
    const spot = commentSpot(doc, c);
    const on = `on "${quote.length > 300 ? `${quote.slice(0, 300)}…` : quote}"`;
    const said = c.replyTo ? `Replying to your comment "${c.replyTo.replace(/\s+/g, " ").slice(0, 200)}": ${c.text}` : c.text;
    lines.push("", `${i + 1}. ${spot ? `${spotLabel(spot)}, ${on}` : on[0].toUpperCase() + on.slice(1)}:`, `   ${said.replace(/\n/g, "\n   ")}`);
  });
  doc.comments = [];
  markComments(doc);
  drawComments(doc);
  await send(lines.join("\n"));
  toast("Comments sent to Flash");
}

// Editing: the page itself turns editable, like a word processor, with
// a toolbar for the formatting. Nobody types Markdown: it is only what
// the file on disk holds, for Flash to read, and saving writes it back.

const DOC_TOOLS = [
  ["bold", "B", "Bold", "\u2318B"], ["italic", "I", "Italic", "\u2318I"], ["underline", "U", "Underline", "\u2318U"], ["strikeThrough", "S", "Strikethrough", ""],
  null,
  ["insertUnorderedList", "bullets", "Bulleted list", "- then space"], ["insertOrderedList", "numbers", "Numbered list", "1. then space"],
  ["blockquote", "quote", "Quote", "> then space"], ["code", "code", "Code", ""], ["link", "link", "Link", ""],
];

function editDocument(doc) {
  if (doc.editing) return;
  dropCommentUi();
  doc.editing = true;
  $("#viewer-edit").hidden = true;
  $("#viewer-editing").hidden = false;
  const scroll = doc.body.querySelector(".doc-scroll");
  scroll.innerHTML = `<div class="doc-editbar"><div class="doc-tools" role="toolbar" aria-label="Formatting"></div></div><article class="doc doc-editable"></article>`;
  const article = scroll.querySelector(".doc");
  const tools = scroll.querySelector(".doc-tools");
  if (doc.markdown) {
    article.className = "doc assistant doc-editable";
    article.innerHTML = markdown(doc.text);
    // A code block's label and Copy button, and rendered math, are not
    // text to type into: they stay whole.
    article.querySelectorAll(".code-head, math").forEach((n) => { n.contentEditable = "false"; });
    const block = el("select", "doc-block");
    block.setAttribute("aria-label", "Text style");
    block.innerHTML = `<option value="p">Text</option><option value="h1">Title</option><option value="h2">Heading</option><option value="h3">Subheading</option>`;
    block.onmousedown = block.onfocus = () => saveEditorSelection(doc);
    block.onchange = () => { restoreEditorSelection(doc); document.execCommand("formatBlock", false, `<${block.value}>`); article.focus(); markTools(doc); };
    tools.appendChild(block);
    for (const tool of DOC_TOOLS) {
      if (!tool) { tools.appendChild(el("span", "sep")); continue; }
      const [cmd, face, tip, keys] = tool;
      const b = el("button", `doc-tool t-${cmd}`, ICON[face] ? icon(face) : face);
      b.type = "button";
      b.dataset.cmd = cmd;
      b.dataset.tip = tip;
      if (keys) b.dataset.keys = keys;
      b.setAttribute("aria-label", tip);
      b.onmousedown = (e) => e.preventDefault();   // keeps the selection
      b.onclick = () => formatDocument(doc, cmd, b);
      tools.appendChild(b);
    }
  } else {
    article.className = "doc doc-plain doc-editable";
    article.textContent = doc.text;
    scroll.querySelector(".doc-editbar").remove();
  }
  article.contentEditable = doc.markdown ? "true" : "plaintext-only";
  article.spellcheck = true;
  document.execCommand("styleWithCSS", false, false);
  document.execCommand("defaultParagraphSeparator", false, "p");
  article.focus();
  doc.startedAs = editorText(doc);
  const cancel = async () => {
    if (editorText(doc) !== doc.startedAs && !(await confirmPop($("#viewer-cancel"), { title: "Discard your changes?", text: "What you changed since you started editing is lost. The file stays as it was.", yes: "Discard" }))) return;
    if (doc.editing) stopEditing(doc);
  };
  $("#viewer-cancel").onclick = cancel;
  $("#viewer-save").onclick = () => saveDocument(doc);
  article.addEventListener("keydown", (e) => {
    e.stopPropagation();
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); saveDocument(doc); }
    else if (mod && e.key.toLowerCase() === "k" && doc.markdown) { e.preventDefault(); formatDocument(doc, "link"); }
    else if (e.key === "Escape") { e.preventDefault(); cancel(); }
  });
  if (doc.markdown) article.addEventListener("input", (e) => autoFormat(doc, e));
  doc.onSelect = () => markTools(doc);
  document.addEventListener("selectionchange", doc.onSelect);
}

const editorOf = (doc) => doc.body.querySelector(".doc-editable");
const editorText = (doc) => { const a = editorOf(doc); return !a ? doc.text : doc.markdown ? toMarkdown(a) : a.innerText; };

function saveEditorSelection(doc) {
  const sel = getSelection();
  doc.savedRange = sel.rangeCount && editorOf(doc).contains(sel.anchorNode) ? sel.getRangeAt(0).cloneRange() : null;
}
function restoreEditorSelection(doc) {
  if (!doc.savedRange) return;
  const sel = getSelection();
  sel.removeAllRanges();
  sel.addRange(doc.savedRange);
}

// The toolbar shows what the text at the cursor already is.
function markTools(doc) {
  const article = editorOf(doc);
  const sel = getSelection();
  if (!article || !sel.rangeCount || !article.contains(sel.anchorNode)) return;
  const node = sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement;
  for (const b of doc.body.querySelectorAll(".doc-tool")) {
    const cmd = b.dataset.cmd;
    let on = false;
    if (cmd === "blockquote") on = !!node.closest("blockquote");
    else if (cmd === "code") on = !!node.closest("code");
    else if (cmd === "link") on = !!node.closest("a");
    else { try { on = document.queryCommandState(cmd); } catch (_) { on = false; } }
    b.classList.toggle("on", on);
  }
  const block = node.closest("h1, h2, h3, h4, p, li, blockquote, pre");
  const select = doc.body.querySelector(".doc-block");
  if (select) select.value = block && /^H[1-3]$/.test(block.tagName) ? block.tagName.toLowerCase() : "p";
}

function formatDocument(doc, cmd, from) {
  const article = editorOf(doc);
  article.focus();
  const sel = getSelection();
  const node = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);
  if (cmd === "blockquote") {
    document.execCommand("formatBlock", false, node && node.closest("blockquote") ? "<p>" : "<blockquote>");
  } else if (cmd === "code") {
    const inCode = node && node.closest("code");
    if (inCode && !inCode.closest("pre")) {
      inCode.replaceWith(document.createTextNode(inCode.textContent));
    } else if (sel.rangeCount && !sel.isCollapsed) {
      const code = document.createElement("code");
      code.textContent = sel.toString();
      const range = sel.getRangeAt(0);
      range.deleteContents();
      range.insertNode(code);
    }
  } else if (cmd === "link") {
    askLink(doc, from);
    return;
  } else {
    document.execCommand(cmd, false, null);
  }
  markTools(doc);
}

// A link: the address, asked for in a small box by the toolbar.
function askLink(doc, from) {
  saveEditorSelection(doc);
  dropCommentUi();
  const sel = getSelection();
  const node = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);
  const existing = node && node.closest("a");
  const box = el("div", "doc-comment-box doc-link-box", `<input type="url" placeholder="https://" spellcheck="false"><div class="row"><span class="hint">Enter to link</span>${existing ? '<button type="button" class="btn small" data-unlink>Remove</button>' : ""}<button type="button" class="btn small primary" data-apply>Link</button></div>`);
  const anchor = (from || editorOf(doc)).getBoundingClientRect();
  placeFloat(box, anchor);
  document.body.appendChild(box);
  const field = box.querySelector("input");
  field.value = existing ? existing.getAttribute("href") : "";
  field.focus();
  const apply = () => {
    let url = field.value.trim();
    if (url && !/^https?:\/\//i.test(url)) url = `https://${url}`;
    dropCommentUi();
    restoreEditorSelection(doc);
    editorOf(doc).focus();
    if (!url) return;
    if (getSelection().isCollapsed && !existing) {
      const a = document.createElement("a");
      a.href = url;
      a.textContent = url;
      getSelection().getRangeAt(0).insertNode(a);
    } else document.execCommand("createLink", false, url);
    markTools(doc);
  };
  box.querySelector("[data-apply]").onclick = apply;
  const unlink = box.querySelector("[data-unlink]");
  if (unlink) unlink.onclick = () => { dropCommentUi(); restoreEditorSelection(doc); document.execCommand("unlink"); };
  field.addEventListener("keydown", (e) => {
    e.stopPropagation();
    if (e.key === "Enter") { e.preventDefault(); apply(); }
    if (e.key === "Escape") { e.preventDefault(); dropCommentUi(); restoreEditorSelection(doc); }
  });
}

// Typing "- ", "1. ", "# " or "> " at the start of a line formats it,
// the way a word processor does, and the marks themselves go away.
function autoFormat(doc, e) {
  if (e.inputType !== "insertText" || e.data !== " ") return;
  const sel = getSelection();
  if (!sel.rangeCount || !sel.isCollapsed) return;
  const node = sel.anchorNode;
  const block = (node.nodeType === 1 ? node : node.parentElement).closest("p, div, li, h1, h2, h3, h4");
  if (!block || block.closest("pre")) return;
  const before = document.createRange();
  before.setStart(block, 0);
  before.setEnd(sel.anchorNode, sel.anchorOffset);
  const typed = before.toString().replace(/\u00a0/g, " ");
  const rules = { "- ": ["insertUnorderedList"], "* ": ["insertUnorderedList"], "1. ": ["insertOrderedList"], "# ": ["formatBlock", "<h1>"], "## ": ["formatBlock", "<h2>"], "### ": ["formatBlock", "<h3>"], "> ": ["formatBlock", "<blockquote>"] };
  const rule = rules[typed];
  if (!rule || block.tagName === "LI") return;
  before.deleteContents();
  // An emptied line has nowhere for the cursor to sit, and the format
  // would land on the line above: keep a <br> in it, the cursor there.
  if (!block.textContent) block.innerHTML = "<br>";
  const caret = document.createRange();
  caret.setStart(block, 0);
  sel.removeAllRanges();
  sel.addRange(caret);
  document.execCommand(rule[0], false, rule[1] || null);
  markTools(doc);
}

function stopEditing(doc) {
  doc.editing = false;
  if (doc.onSelect) document.removeEventListener("selectionchange", doc.onSelect);
  dropCommentUi();
  $("#viewer-edit").hidden = false;
  $("#viewer-editing").hidden = true;
  doc.body.querySelector(".doc-scroll").innerHTML = `<article class="doc"></article>`;
  drawDocument(doc);
}

async function saveDocument(doc) {
  if (!editorOf(doc)) return true;
  const text = editorText(doc);
  try {
    const saved = await command("document-save", doc.entry.id, current, { text });
    doc.text = text;
    doc.entry.size = saved.size;
    $("#viewer-size").textContent = `${fileKind(doc.entry)} \u00b7 ${fileSize(saved.size)}`;
    const card = messagesEl.querySelector(`.attachment[data-file="${doc.entry.id}"] .meta`);
    if (card) card.textContent = attachmentMeta(doc.entry);
    stopEditing(doc);
    toast(saved.path ? `Saved to ${shortPath(saved.path)}` : "Saved");
    return true;
  } catch (error) { showFailure(error); return false; }
}

// The edited page, back into Markdown: what the file holds, and what
// Flash reads. It writes only what the renderer reads back the same way.
function toMarkdown(root) {
  const escapeText = (t) => t.replace(/\u00a0/g, " ").replace(/([\\`*~[\]|])/g, "\\$1").replace(/(?<![A-Za-z0-9])_|_(?![A-Za-z0-9])/g, "\\_");
  const wrap = (mark, inner, close = mark) => {
    const lead = inner.match(/^\s*/)[0], tail = inner.match(/\s*$/)[0];
    const body = inner.trim();
    return body ? `${lead}${mark}${body}${close}${tail}` : inner;
  };
  const inlineOf = (node) => {
    let out = "";
    for (const child of node.childNodes) {
      if (child.nodeType === 3) { out += escapeText(child.nodeValue.replace(/\s+/g, " ")); continue; }
      if (child.nodeType !== 1) continue;
      const tag = child.tagName;
      if (tag === "MATH") {
        const tex = (child.querySelector('annotation[encoding="application/x-tex"]') || {}).textContent || child.textContent;
        out += child.getAttribute("display") === "block" ? `$$${tex}$$` : `$${tex}$`;
      } else if (tag === "BR") out += " ";
      else if (tag === "STRONG" || tag === "B") out += wrap("**", inlineOf(child));
      else if (tag === "EM" || tag === "I") out += wrap("*", inlineOf(child));
      else if (tag === "U") out += wrap("<u>", inlineOf(child), "</u>");
      else if (child.classList.contains("serif")) out += wrap("<serif>", inlineOf(child), "</serif>");
      else if (tag === "S" || tag === "DEL" || tag === "STRIKE") out += wrap("~~", inlineOf(child));
      else if (tag === "CODE") out += `\`${child.textContent.replace(/`/g, "'")}\``;
      else if (tag === "A") { const href = child.getAttribute("href") || ""; const text = inlineOf(child).trim(); out += /^https?:/i.test(href) ? (text === href ? href : `[${text || href}](${href})`) : text; }
      else if (child.classList.contains("code-head")) continue;
      else out += inlineOf(child);
    }
    return out;
  };
  // A paragraph that starts like a heading, list, or quote is kept as
  // text by escaping its first mark.
  const plainStart = (line) => line.replace(/^(\s*)(#{1,6}\s|>|[-+]\s|(\d+)([.)])\s)/, (m, sp, mark, num, dot) => (num ? `${sp}${num}\\${dot} ` : `${sp}\\${mark}`));
  const listOf = (listEl, depth) => {
    const lines = [];
    let n = 1;
    for (const li of listEl.children) {
      if (li.tagName !== "LI") continue;
      const marker = listEl.tagName === "OL" ? `${n++}. ` : "- ";
      const nested = [];
      const own = document.createElement("div");
      for (const c of li.childNodes) {
        if (c.nodeType === 1 && (c.tagName === "UL" || c.tagName === "OL")) nested.push(c);
        else own.appendChild(c.cloneNode(true));
      }
      lines.push(`${"  ".repeat(depth)}${marker}${inlineOf(own).trim()}`);
      for (const sub of nested) lines.push(...listOf(sub, depth + 1));
    }
    return lines;
  };
  const blocksOf = (node) => {
    const blocks = [];
    let loose = "";
    const flush = () => { if (loose.trim()) blocks.push(plainStart(loose.trim())); loose = ""; };
    for (const child of node.childNodes) {
      if (child.nodeType === 3) { loose += escapeText(child.nodeValue.replace(/\s+/g, " ")); continue; }
      if (child.nodeType !== 1) continue;
      const tag = child.tagName;
      if (/^H[1-6]$/.test(tag)) { flush(); const text = inlineOf(child).trim(); if (text) blocks.push(`${"#".repeat(+tag[1])} ${text}`); }
      else if (tag === "DIV" && child.classList.contains("serif-block")) {
        flush();
        const inner = blocksOf(child).join("\n\n");
        if (inner.trim()) blocks.push("```serif\n" + inner + "\n```");
      }
      else if (tag === "P" || tag === "DIV") {
        flush();
        if (child.querySelector("p, ul, ol, h1, h2, h3, blockquote, pre, table")) blocks.push(...blocksOf(child));
        else { const text = inlineOf(child).trim(); if (text) blocks.push(plainStart(text)); }
      } else if (tag === "UL" || tag === "OL") { flush(); const items = listOf(child, 0); if (items.length) blocks.push(items.join("\n")); }
      else if (tag === "BLOCKQUOTE") { flush(); const inner = blocksOf(child).join("\n\n"); if (inner) blocks.push(inner.split("\n").map((l) => `> ${l}`.trimEnd()).join("\n")); }
      else if (tag === "PRE") {
        flush();
        const lang = ((child.querySelector(".code-head span") || {}).textContent || "").trim();
        const code = (child.querySelector("code") || child).textContent.replace(/\n$/, "");
        blocks.push(`\`\`\`${lang}\n${code}\n\`\`\``);
      } else if (tag === "TABLE") {
        flush();
        const rows = [...child.querySelectorAll("tr")].map((tr) => `| ${[...tr.children].map((cell) => inlineOf(cell).trim()).join(" | ")} |`);
        if (rows.length) {
          const cols = child.querySelector("tr").children.length;
          rows.splice(1, 0, `|${" --- |".repeat(cols)}`);
          blocks.push(rows.join("\n"));
        }
      } else if (tag === "HR") { flush(); blocks.push("---"); }
      else if (tag === "BR") { flush(); }
      else loose += inlineOf({ childNodes: [child] });
    }
    flush();
    return blocks;
  };
  return blocksOf(root).join("\n\n") + "\n";
}

function closeViewer() {
  const viewer = $("#viewer");
  if (!viewer.classList.contains("open")) return false;
  viewer.classList.remove("open");
  viewer.setAttribute("aria-hidden", "true");
  viewing = null;
  if (openDoc && openDoc.onSelect) document.removeEventListener("selectionchange", openDoc.onSelect);
  openDoc = null;
  dropCommentUi();
  if (window.CSS && CSS.highlights) CSS.highlights.delete("doc-comment");
  markOpenCard();
  // Emptied once it has slid away, so a PDF or a model is not left loaded.
  // A piece stops at once; the panel empties once it has slid away.
  dropMidi();
  setTimeout(() => { if (!viewing) { dropModel(); $("#viewer-body").textContent = ""; } }, 480);
  return true;
}

function toggleViewer() {
  if (!closeViewer()) {
    if (lastViewed) openViewer(lastViewed); else toast("Nothing has been shown in this chat yet");
  }
}

function markOpenCard() {
  messagesEl.querySelectorAll(".attachment").forEach((card) => {
    card.style.borderColor = viewing && card.dataset.file === viewing.id ? "var(--accent)" : "";
  });
  messagesEl.querySelectorAll(".browser-card").forEach((card) => {
    card.classList.toggle("open", !!viewing && viewing.kind === "browser" && card.dataset.run === viewing.run);
  });
}

function statsText(entry) {
  const parts = [];
  if (entry.tokens) parts.push(`${entry.tokens} tokens`);
  if (entry.rate) parts.push(`${entry.rate} tok/s`);
  if (entry.seconds) parts.push(`${entry.seconds}s`);
  return parts.join(" · ");
}

function replyActions(text) {
  const row = el("div", "actions");
  row.append(
    button("icon-btn", "copy", "Copy", "Alt C", (b) => copy(text, "reply", b)),
    readButton(`reply:${text}`, () => row.closest(".block") && row.closest(".block").querySelector(".assistant")),
    button("icon-btn", "retry", "Retry", "Alt R", retry),
  );
  return row;
}

// Comments sent from a document are a message Flash reads as text. In
// the chat they show as what they are: the file, and each passage with
// its note and where it is. Not a message to copy or edit.
const COMMENTS_HEAD = /^Comments on (.+), with the line and column each one is about in the file as it is now:\n\n/;

function parseComments(text) {
  const head = COMMENTS_HEAD.exec(text || "");
  if (!head) return null;
  const named = /^(.*?) \((.+)\)$/.exec(head[1]);
  const items = text.slice(head[0].length).split(/\n\n(?=\d+\. )/).map((part) => {
    const m = /^\d+\. (?:(.*?), on|On) "(.*)":\n([\s\S]*)$/.exec(part);
    return m && { where: m[1] || "", quote: m[2], note: m[3].replace(/^ {3}/gm, "") };
  });
  if (!items.length || items.some((i) => !i)) return null;
  return { name: named ? named[1] : head[1], path: named ? named[2] : "", items };
}

function commentsBlock(sent, text, steered) {
  const wrap = el("div", "block user-wrap turn comments-wrap");
  if (steered) wrap.appendChild(el("div", "steer-tag", `${icon("steer")}<span>Steered mid-turn</span>`));
  const card = wrap.appendChild(el("div", "sent-comments"));
  // The file, if this chat still has it, opens from the card.
  const chat = chats.get(current);
  const file = chat && [...chat.log].reverse().find((e) => e.type === "file" && (sent.path ? e.path === sent.path : e.name === sent.name));
  const head = card.appendChild(el(file ? "button" : "div", "head", `<span class="badge">${icon("file")}</span><span class="words"><span class="name"></span><span class="meta"></span></span>${file ? `<span class="chev">${icon("chevRight")}</span>` : ""}`));
  head.querySelector(".name").textContent = sent.name;
  head.querySelector(".meta").textContent = `${sent.items.length} comment${sent.items.length === 1 ? "" : "s"}`;
  head.title = sent.path || sent.name;
  if (file) { head.type = "button"; head.onclick = () => openViewer(file); }
  const list = card.appendChild(el("ol", "items"));
  for (const item of sent.items) {
    const li = list.appendChild(el("li", "", `<span class="where"></span><q></q><p></p>`));
    li.querySelector(".where").textContent = item.where.split(",")[0];
    li.querySelector(".where").title = item.where;
    li.querySelector("q").textContent = item.quote;
    li.querySelector("p").textContent = item.note;
  }
  wrap.dataset.raw = text;
  wrap.tabIndex = -1;
  return wrap;
}

function userBlock(text, steered, files) {
  const sent = !(files && files.length) && parseComments(text);
  if (sent) return commentsBlock(sent, text, steered);
  const wrap = el("div", "block user-wrap turn");
  if (steered) wrap.appendChild(el("div", "steer-tag", `${icon("steer")}<span>Steered mid-turn</span>`));
  if (files && files.length) wrap.appendChild(sentFiles(files));
  if (text) wrap.appendChild(el("div", "user")).textContent = text;
  wrap.dataset.raw = text;
  wrap.tabIndex = -1;
  const row = el("div", "actions");
  if (text) row.append(button("icon-btn", "copy", "Copy", "", (b) => copy(text, "message", b)));
  row.append(button("icon-btn", "edit", "Edit", "Alt E", () => editLast(text, files || [])));
  wrap.appendChild(row);
  return wrap;
}

const extOf = (name) => (name.includes(".") ? name.split(".").pop().toUpperCase().slice(0, 5) : "File");

// What a file card says under the name: its kind, its size, and how
// many of Flash's comments on it are still open.
function attachmentMeta(entry) {
  const gone = (dismissedNotes()[entry.id] || []).length;
  const open = Math.max(0, (entry.comments || []).length - gone);
  return `${fileKind(entry)} \u00b7 ${fileSize(entry.size)}` + (open ? ` \u00b7 ${open} from Flash` : "");
}

// Photos show as themselves and open in the panel; a PDF opens there
// too; any other file is a chip with its name.
function sentFiles(files) {
  const images = files.filter((f) => f.kind === "image").length;
  const box = el("div", "user-files" + (images > 1 ? " many" : ""));
  for (const f of files) {
    if (f.kind === "video") {
      const clip = box.appendChild(el("div", "clip", `<video controls preload="metadata" playsinline></video><span class="tag"></span>`));
      clip.querySelector("video").src = fileUrl(f);
      clip.querySelector(".tag").textContent = f.stills ? `Screen recording · ${f.stills} steps` : "Screen recording";
      continue;
    }
    if (f.kind === "image") {
      const shot = box.appendChild(el("button", "shot"));
      shot.type = "button";
      shot.title = f.name;
      const img = shot.appendChild(el("img"));
      img.alt = f.name;
      img.loading = "lazy";
      img.src = fileUrl(f);
      shot.onclick = () => openViewer(f);
      continue;
    }
    const viewable = f.kind === "pdf" || f.kind === "model" || f.kind === "midi";
    const chip = box.appendChild(el(viewable ? "button" : "div", "doc", `<span class="badge">${icon(f.kind === "model" ? "cube" : f.kind === "midi" ? "music" : "file")}</span><span class="words"><span class="name"></span><span class="meta"></span></span>`));
    chip.querySelector(".name").textContent = f.name;
    chip.querySelector(".meta").textContent = `${extOf(f.name)} · ${fileSize(f.size)}`;
    if (viewable) { chip.type = "button"; chip.onclick = () => openViewer(f); }
  }
  return box;
}

// Who is speaking, above a reply from a spark that was @mentioned into
// this chat: the chat's own voice needs no name.
function speakerTag(sparkId, fromShift = false) {
  const chat = chats.get(current);
  const sp = sparkOf(sparkId);
  // In its own chat it needs no name, but a report from its shift does.
  if (!sp || (chat && chat.spark === sparkId && !fromShift)) return null;
  const tag = el("div", "speaker", `<span class="name"></span><span class="handle"></span>`);
  if (fromShift) tag.appendChild(el("span", "from", "report from its shift"));
  tag.prepend(sparkAvatar({ ...sp, unread: 0 }, 20));
  tag.querySelector(".name").textContent = sp.name;
  tag.querySelector(".handle").textContent = sp.title || sp.handle;
  tag.style.setProperty("--c", sp.colour);
  return tag;
}

function assistantBlock(entry) {
  const frag = document.createDocumentFragment();
  const tag = entry.spark && entry.text && entry.text.trim() ? speakerTag(entry.spark, !!entry.shift) : null;
  if (tag) frag.appendChild(tag);
  if (entry.thinking && entry.thinking.trim()) frag.appendChild(thinkingBlock(entry.thinking, false));
  if (entry.text && entry.text.trim()) {
    const wrap = el("div", "block turn");
    wrap.tabIndex = -1;
    wrap.dataset.raw = entry.text;
    wrap.dataset.reply = "1";
    wrap.appendChild(el("div", "assistant", markdown(entry.text)));
    wrap.appendChild(replyActions(entry.text));
    frag.appendChild(wrap);
  }
  return frag;
}

function drawEntry(entry, ctx) {
  switch (entry.type) {
    case "user": {
      const block = messagesEl.appendChild(userBlock(entry.text, entry.steer, entry.files));
      block.dataset.log = ctx.index;
      ctx.lastReply = null;
      break;
    }
    case "assistant": {
      messagesEl.appendChild(assistantBlock(entry));
      const replies = messagesEl.querySelectorAll("[data-reply]");
      ctx.lastReply = replies[replies.length - 1] || null;
      if (ctx.lastReply && entry.text && entry.text.trim()) ctx.lastReply.dataset.log = ctx.index;
      break;
    }
    case "thought": {
      const block = messagesEl.appendChild(el("div", "block thought assistant"));
      block.innerHTML = markdown(entry.text || "");
      block.dataset.log = ctx.index;
      break;
    }
    case "tool": ctx.tool = toolCard(entry.label); messagesEl.appendChild(ctx.tool); break;
    case "file": messagesEl.appendChild(entry.kind === "image" ? inlineImage(entry) : attachment(entry)); break;
    case "browser": drawBrowserFrame(entry); break;
    case "result": if (ctx.tool) addResult(ctx.tool, entry.text, entry.error, entry.warn); break;
    case "diff": if (ctx.tool) addDiff(ctx.tool, entry.text); break;
    case "plan": if (ctx.tool) addPlan(ctx.tool, entry.steps || []); break;
    case "ask": messagesEl.appendChild(askCard(entry)); break;
    case "answered": { const card = messagesEl.querySelector(`[data-ask="${entry.id}"]`); if (card) settleAsk(card, entry.answer); break; }
    case "error": { const node = el("div", "block error", icon("alert") + "<span></span>"); node.lastChild.textContent = entry.text; messagesEl.appendChild(node); break; }
    case "note": messagesEl.appendChild(el("div", "block note")).textContent = entry.text; break;
    case "stats": {
      const reply = ctx.lastReply;
      const text = statsText(entry);
      if (reply && text) {
        const meta = el("span", "meta");
        meta.textContent = text;
        reply.querySelector(".actions").appendChild(meta);
      }
      markLatest();
      break;
    }
  }
}

// The newest reply keeps its actions showing, as chat apps do.
function markLatest() {
  messagesEl.querySelectorAll(".actions.keep").forEach((n) => n.classList.remove("keep"));
  const replies = messagesEl.querySelectorAll("[data-reply] .actions");
  if (replies.length) replies[replies.length - 1].classList.add("keep");
}

let drawCtx = {};

function drawChat() {
  if (view !== "chat") { closeViewer(); drawPage(); return; }
  // A file belongs to its chat: the panel does not follow to another.
  const chatNow = chats.get(current);
  const files = chatNow ? chatNow.log.filter((e) => e.type === "file") : [];
  const stays = viewing && (viewing.kind === "browser"
    ? chatNow && chatNow.log.some((e) => e.type === "browser" && e.run === viewing.run)
    : files.some((f) => f.id === viewing.id));
  if (viewing && !stays) closeViewer();
  lastViewed = files.length ? files[files.length - 1] : null;
  document.body.classList.remove("on-page", "page-projects", "page-project", "page-settings", "page-tool");
  const chat = chats.get(current);
  messagesEl.textContent = "";
  drawCtx = {};
  focusedIndex = -1;
  streamNode = null;
  const empty = !chat || (!chat.log.length && !chat.busy && !chat.queued);
  document.body.classList.toggle("empty", empty);
  if (!empty) {
    chat.log.forEach((entry, index) => { drawCtx.index = index; drawEntry(entry, drawCtx); });
    markLatest();
    drawStreaming();
  }
  $("#title").textContent = chat ? chat.title : "New chat";
  document.title = chat && chat.title !== "New chat" ? `${chat.title} · Flash` : "Flash";
  const inProject = projectOf(chat ? chat.project : viewProject);
  $("#crumb").hidden = !inProject;
  if (inProject) $("#crumb").textContent = inProject.name;
  const withSpark = sparkOf(chat ? chat.spark : viewSpark);
  const who = withSpark ? withSpark.name : "Flash";
  input.placeholder = empty ? (inProject ? `Message ${who} in ${inProject.name}` : `Message ${who}`) : `Reply to ${who}`;
  renderProjectBtn();
  renderSparkBtn();
  renderPending();
  syncUrl();
  greet();
  markSide();
  updateSend();
  // Arriving from a search: show the message it matched, not the end.
  if (jumpTo && jumpTo.chat === current) {
    const target = jumpTo;
    jumpTo = null;
    requestAnimationFrame(() => showFound(target));
    return;
  }
  follow = true;
  requestAnimationFrame(() => toBottom(true));
}

// Projects pages -----------------------------------------------------------

function drawPage() {
  // A file belongs to its chat: a page that is not a chat has no panel.
  closeViewer();
  document.body.classList.remove("empty");
  document.body.classList.add("on-page");
  document.body.classList.toggle("page-projects", view === "projects");
  document.body.classList.toggle("page-project", view === "project");
  document.body.classList.toggle("page-settings", view === "settings");
  document.body.classList.toggle("page-tool", view === "skills" || view === "sparks" || view === "extensions");
  messagesEl.textContent = "";
  streamNode = null;
  $("#crumb").hidden = true;
  const pages = { projects: drawProjects, settings: drawSettings, skills: drawSkillsPage, sparks: drawSparksPage, extensions: drawExtensionsPage };
  (pages[view] || drawProject)();
  renderPending();
  syncUrl();
  markSide();
  updateSend();
  logEl.scrollTop = 0;
}

function drawProjects() {
  $("#title").textContent = "Projects";
  document.title = "Projects · Flash";
  const page = el("div", "page");
  page.innerHTML = `<div class="page-head"><h1>Projects</h1></div>`;
  if (!projects.length) {
    page.appendChild(el("p", "page-empty", "A project is a folder Flash works in, with instructions for every chat about it. Its chats stay together, and each one runs in the project's folder."));
  }
  const cards = el("div", "cards");
  for (const [i, p] of [...projects].reverse().entries()) {
    const count = [...chats.values()].filter((c) => c.project === p.id && c.log.length).length;
    const latest = Math.max(p.created, ...[...chats.values()].filter((c) => c.project === p.id).map((c) => c.updated || 0));
    const card = el("button", "card");
    card.type = "button";
    card.innerHTML = `<span class="name"></span><span class="where"></span><span class="meta">${count} chat${count === 1 ? "" : "s"} · ${ago(latest)}</span>`;
    card.style.setProperty("--i", i);
    card.querySelector(".name").textContent = p.name;
    card.querySelector(".where").textContent = shortPath(p.path);
    card.onclick = () => openProject(p.id, "forward");
    cards.appendChild(card);
  }
  const add = el("button", "card new", icon("plus") + "<span>New project</span>");
  add.type = "button";
  add.style.setProperty("--i", projects.length);
  add.onclick = () => projectForm();
  cards.appendChild(add);
  page.appendChild(cards);
  messagesEl.appendChild(page);
}

function drawProject() {
  const p = projectOf(viewProject);
  if (!p) { view = "projects"; drawPage(); return; }
  $("#title").textContent = p.name;
  document.title = `${p.name} · Flash`;
  input.placeholder = `Start a chat in ${p.name}`;
  const page = el("div", "page");
  const back = el("button", "back", icon("chevRight") + "All projects");
  back.type = "button";
  back.onclick = () => showProjects("back");
  page.appendChild(back);

  const head = el("div", "page-head");
  head.innerHTML = `<div><h1></h1><div class="path"></div></div>`;
  head.querySelector("h1").textContent = p.name;
  head.querySelector(".path").textContent = shortPath(p.path);
  head.appendChild(button("icon-btn", "more", "Edit project", "", () => projectForm(p)));
  page.appendChild(head);

  const panel = el("div", "panel");
  const drawNotes = () => {
    panel.innerHTML = `<div class="label"><span>Instructions</span></div><div class="text"></div>`;
    const text = panel.querySelector(".text");
    if (p.instructions) text.textContent = p.instructions;
    else { text.textContent = "Tell Flash how to work in this project: conventions, commands to run, what to avoid."; text.classList.add("placeholder"); }
    const edit = el("button", "link-btn", p.instructions ? "Edit" : "Add");
    edit.type = "button";
    edit.onclick = editNotes;
    panel.querySelector(".label").appendChild(edit);
  };
  const editNotes = () => {
    panel.innerHTML = `<div class="label"><span>Instructions</span></div><textarea></textarea><div class="actions-row"><button type="button" class="btn">Cancel</button><button type="button" class="btn primary">Save</button></div>`;
    const area = panel.querySelector("textarea");
    area.value = p.instructions;
    area.focus();
    const [cancel, save] = panel.querySelectorAll(".actions-row button");
    cancel.onclick = drawNotes;
    const commit = async () => {
      try {
        const updated = await command("project-update", p.id, null, { instructions: area.value });
        Object.assign(p, updated);
        drawNotes();
        toast("Instructions saved");
      } catch (error) { showFailure(error); }
    };
    save.onclick = commit;
    area.onkeydown = (e) => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); commit(); }
      if (e.key === "Escape") { e.preventDefault(); drawNotes(); }
      e.stopPropagation();
    };
  };
  drawNotes();
  page.appendChild(panel);

  // The sparks working on it: each opens its window, and a new one can
  // be made here, already given the project.
  const itsSparks = sparkList.filter((sp) => sp.project === p.id);
  const sparkHead = el("div", "section-label", "Sparks");
  const addSpark = el("button", "link-btn", "New spark");
  addSpark.type = "button";
  addSpark.onclick = () => sparkForm(null, p.id);
  sparkHead.appendChild(addSpark);
  page.appendChild(sparkHead);
  if (itsSparks.length) {
    const listEl = el("div", "chat-list project-sparks");
    itsSparks.forEach((sp, i) => {
      const row = el("button", "", `<span class="name"></span><span class="when">${esc(sp.handle)}</span>`);
      row.type = "button";
      row.prepend(sparkAvatar({ ...sp, unread: 0 }, 20, i));
      row.querySelector(".name").textContent = sp.name;
      row.onclick = () => openSpark(sp.id);
      listEl.appendChild(row);
    });
    page.appendChild(listEl);
  } else {
    page.appendChild(el("p", "page-empty", "No sparks work on this project yet. A spark keeps at one goal here on a schedule, like checking the build every morning."));
  }

  const inProject = [...chats.values()].filter((c) => c.project === p.id && c.log.length).sort(byRecent);
  if (inProject.length) {
    page.appendChild(el("div", "section-label", "Chats"));
    const listEl = el("div", "chat-list");
    for (const c of inProject) {
      const row = el("button", "", `<span></span><span class="when">${ago(c.updated || c.created || 0)}</span>`);
      row.type = "button";
      row.firstChild.textContent = c.title;
      row.onclick = () => switchTo(c.id, "forward");
      listEl.appendChild(row);
    }
    page.appendChild(listEl);
  } else {
    page.appendChild(el("p", "page-empty", "No chats yet. Anything you send below starts one, working in this folder."));
  }
  messagesEl.appendChild(page);
}

function showProjects(nav) {
  view = "projects";
  viewProject = null;
  morph(drawPage, nav);
  if (innerWidth <= 800) closeSide();
}

function openProject(id, nav) {
  view = "project";
  viewProject = id;
  current = null;
  morph(drawPage, nav);
  renderChats();
  input.focus();

// Agents that keep working on one goal, on a schedule, for as long as Flash
// runs, and report back. Each is drawn as a bubble with eyes: floating while

const EVERY_CHOICES = [[15, "Every 15 minutes"], [30, "Every 30 minutes"], [60, "Every hour"], [120, "Every 2 hours"], [360, "Every 6 hours"], [720, "Every 12 hours"], [1440, "Every day"], [10080, "Every week"]];

}

// Sparks' little moments: pets, births, and news. -------------------------

const seenUnread = new Map();  // each spark's unread count, as last drawn
const petting = new WeakMap(); // each face's recent pets, for heart eyes

function popOut(av, glyph, cls = "", count = 1) {
  for (let n = 0; n < count; n++) {
    const pop = el("i", `pop ${cls}`.trim());
    pop.textContent = glyph;
    pop.style.setProperty("--dx", `${Math.round((Math.random() - 0.5) * 36)}px`);
    pop.style.setProperty("--r", `${Math.round((Math.random() - 0.5) * 50)}deg`);
    pop.style.animationDelay = `${n * 90}ms`;
    pop.addEventListener("animationend", () => pop.remove());
    av.appendChild(pop);
  }
}

// A one-off: KIND is "born" or "cheer". The face goes back to what it
// was doing once it is over.
function celebrate(av, kind) {
  av.classList.add(kind);
  av.addEventListener("animationend", function done(e) {
    if (e.target !== av) return;
    av.classList.remove(kind);
    av.removeEventListener("animationend", done);
  });
  requestAnimationFrame(() => popOut(av, "✦", "star", kind === "born" ? 4 : 3));
}

function pet(av) {
  if (calm.matches || av.classList.contains("tiny")) return;
  av.classList.remove("petted");
  void av.offsetWidth; // start the squish over
  av.classList.add("petted");
  av.addEventListener("animationend", function done(e) {
    if (e.target !== av) return;
    av.classList.remove("petted");
    av.removeEventListener("animationend", done);
  });
  popOut(av, "♥", "", 1 + Math.floor(Math.random() * 2));
  const now = Date.now();
  const pets = (petting.get(av) || []).filter((t) => now - t < 3000).concat(now);
  petting.set(av, pets);
  if (pets.length >= 5) {
    petting.set(av, []);
    av.classList.add("love");
    popOut(av, "♥", "", 5);
    setTimeout(() => av.classList.remove("love"), 2600);
  }
}
document.addEventListener("pointerdown", (e) => {
  const av = e.target.closest && e.target.closest(".spark-av");
  if (av) pet(av);
});

// Sparks' ambient life ------------------------------------------------------
// One clock for every face on screen: each blinks when it likes, glances
// about, watches the pointer when it comes near and looks right at you
// when it is on them, and now and then has a little moment of its own;
// one that hops can set a neighbour off. With nobody about for a while,
// the idle ones doze, and wake with a start when someone moves. Nothing
// runs with reduced motion asked for, or while the page is hidden.

const LIFE_TICK = 200;
const DOZE_AFTER = 45000;
const ACTS = { hop: 900, wiggle: 800, spin: 1100, yawn: 1700, peek: 1700, hum: 1900, boing: 750, sparkle: 1300, startle: 450, sigh: 1800, stir: 1500 };
// The moments a spark has by itself, by what it is doing, each with how
// often it comes up: an idle one plays, one waiting on you tries to catch
// your eye, one whose shift failed sighs, and a sleeping one stirs.
const ACT_WEIGHTS = {
  idle: [["hop", 5], ["wiggle", 4], ["peek", 4], ["hum", 3], ["boing", 3], ["sparkle", 3], ["yawn", 2], ["spin", 1]],
  waiting: [["boing", 3], ["peek", 2], ["wiggle", 2]],
  failed: [["sigh", 3], ["peek", 1]],
  paused: [["stir", 1]],
};
// How long between one spark's moments, at least and at most.
const ACT_GAP = { idle: [5000, 13000], waiting: [6000, 12000], failed: [9000, 18000], paused: [12000, 26000] };
const lives = new WeakMap();
let lastActive = Date.now();
let dozing = false;
let pointerAt = null;

const randomIn = (low, high) => low + Math.random() * (high - low);

function pickAct(state) {
  const weights = ACT_WEIGHTS[state] || ACT_WEIGHTS.idle;
  let roll = Math.random() * weights.reduce((sum, [, w]) => sum + w, 0);
  for (const [name, weight] of weights) { roll -= weight; if (roll <= 0) return name; }
  return weights[0][0];
}

// The faces on screen that have a life: not the still ones beside a
// chat's name or in a menu.
function livingFaces() {
  return [...document.querySelectorAll(".spark-av")].filter((av) => {
    if (av.closest(".chat .open, .menu")) return false;
    const r = av.getBoundingClientRect();
    return r.width > 0 && r.bottom > 0 && r.top < innerHeight && r.right > 0 && r.left < innerWidth;
  });
}

function hovered(av) {
  const holder = av.closest(".spark-card, .spark-mate, #spark-btn, .project-sparks button");
  return av.matches(":hover") || !!(holder && holder.matches(":hover"));
}

function lookAt(av, x, y) {
  const eyes = av.querySelector(".eyes");
  if (!eyes) return;
  eyes.style.setProperty("--lx", Math.max(-1, Math.min(1, x)).toFixed(2));
  eyes.style.setProperty("--ly", Math.max(-1, Math.min(1, y)).toFixed(2));
}

function blinkFace(av) {
  const twice = Math.random() < 0.22;
  av.classList.remove("blink", "blink2");
  void av.offsetWidth; // start it over
  av.classList.add(twice ? "blink2" : "blink");
  setTimeout(() => av.classList.remove("blink", "blink2"), twice ? 420 : 220);
}

// A moment: NAME for as long as it lasts, unless something bigger (a
// pet, a birth, news) is going on.
function act(av, name) {
  if (av.dataset.acting || ["petted", "born", "cheer", "love"].some((c) => av.classList.contains(c))) return false;
  av.dataset.acting = name;
  av.classList.add(`act-${name}`);
  if (name === "peek") {
    const side = Math.random() < 0.5 ? -1 : 1;
    av.style.setProperty("--lean", `${side * 12}deg`);
    av.style.setProperty("--lean-x", `${side * 2}px`);
    lookAt(av, side, -0.2);
  } else if (name === "sparkle") {
    lookAt(av, randomIn(-0.4, 0.4), -1);
    if (!av.classList.contains("tiny")) popOut(av, "✦", "star", 1);
  } else if (name === "hum") {
    if (!av.classList.contains("tiny")) popOut(av, Math.random() < 0.5 ? "♪" : "♫", "note", 1);
  }
  setTimeout(() => {
    av.classList.remove(`act-${name}`);
    delete av.dataset.acting;
    if (name === "peek" || name === "sparkle") lookAt(av, 0, 0);
  }, ACTS[name]);
  return true;
}

function lifeTick() {
  if (calm.matches || document.hidden) return;
  const now = Date.now();
  const faces = livingFaces();
  const doze = now - lastActive > DOZE_AFTER;
  if (doze !== dozing) {
    dozing = doze;
    // Woken: each with a little start, not all at once.
    if (!doze) faces.forEach((av) => { if (av.dataset.state === "idle") setTimeout(() => act(av, "startle"), randomIn(0, 450)); });
  }
  faces.forEach((av, n) => {
    let life = lives.get(av);
    if (!life) {
      life = { blink: now + randomIn(800, 4000), act: now + randomIn(3000, 14000), glance: now + randomIn(1500, 5000), followed: 0 };
      lives.set(av, life);
    }
    av.classList.toggle("dozy", dozing);
    const state = av.dataset.state;
    // Its eyes are shut asleep, and busy at work.
    if (state !== "paused" && now >= life.blink) {
      if (!(dozing && state === "idle")) blinkFace(av);
      life.blink = now + randomIn(2200, 6500);
    }
    if (state === "working" || (dozing && state === "idle") || hovered(av)) return;
    // Glances, while the pointer is not what it watches.
    if (state !== "paused" && now >= life.glance && now > life.followed) {
      if (Math.random() < 0.4) lookAt(av, 0, 0);
      else lookAt(av, randomIn(-1, 1), randomIn(-0.7, 0.4));
      life.glance = now + randomIn(1600, 4800);
    }
    if (now >= life.act) {
      // The tiny ones keep to the gentle moments.
      const name = av.classList.contains("tiny") && state === "idle" ? (Math.random() < 0.5 ? "boing" : "wiggle") : pickAct(state);
      if (act(av, name) && name === "hop") {
        // A hop catches: the one beside it may join in.
        const next = faces[n + 1];
        if (next && next.dataset.state === "idle" && Math.random() < 0.4) setTimeout(() => act(next, "hop"), 260);
      }
      const [least, most] = ACT_GAP[state] || ACT_GAP.idle;
      life.act = now + randomIn(least, most);
    }
  });
}
setInterval(lifeTick, LIFE_TICK);

// Eyes on the pointer, when it comes near; right at you when it is on them.
let followFrame = 0;
function followPointer() {
  followFrame = 0;
  if (!pointerAt || calm.matches) return;
  const now = Date.now();
  for (const av of livingFaces()) {
    if (!["idle", "waiting", "failed"].includes(av.dataset.state) || av.dataset.acting) continue;
    const r = av.getBoundingClientRect();
    const dx = pointerAt.x - (r.left + r.width / 2);
    const dy = pointerAt.y - (r.top + r.height / 2);
    const far = Math.hypot(dx, dy);
    if (far > 420) continue;
    if (far < r.width / 2) lookAt(av, 0, 0);
    else lookAt(av, dx / 160, dy / 200);
    const life = lives.get(av);
    if (life) life.followed = now + 1500;
  }
}

function stirred() {
  lastActive = Date.now();
  if (dozing) lifeTick();
}
addEventListener("pointermove", (e) => {
  pointerAt = { x: e.clientX, y: e.clientY };
  stirred();
  if (!followFrame) followFrame = requestAnimationFrame(followPointer);
}, { passive: true });
addEventListener("keydown", stirred, { passive: true });
addEventListener("pointerdown", stirred, { passive: true });

function everyWords(minutes) {
  for (const [size, unit] of [[10080, "week"], [1440, "day"], [60, "hour"]]) {
    if (minutes % size === 0) { const n = minutes / size; return n === 1 ? unit : `${n} ${unit}s`; }
  }
  return `${minutes} minutes`;
}

function sparkState(spark) {
  if (spark.waiting) return "Waiting for your approval";
  if (spark.answering) return "Answering you";
  if (spark.status === "working") return spark.activity ? `Working: ${spark.activity}` : "Working";
  if (spark.paused) return "Paused";
  const wait = Math.round((spark.next_run - Date.now() / 1000) / 60);
  const next = wait <= 0 ? "Starting soon" : wait < 120 ? `Next shift in ${wait} min` : wait < 2880 ? `Next shift in ${Math.round(wait / 60)} h` : `Next shift in ${Math.round(wait / 1440)} d`;
  return spark.status === "failed" ? `Last shift failed · ${next}` : next;
}

// What it is doing, in a word or two, and the class that colours it.
function sparkPresence(spark) {
  if (spark.waiting) return ["waiting", "Needs your approval"];
  if (spark.status === "working") return ["working", spark.activity ? spark.activity : "Working"];
  if (spark.answering) return ["working", "Answering you"];
  if (spark.paused) return ["paused", "Paused"];
  if (spark.status === "failed") return ["failed", "Last shift failed"];
  return ["idle", spark.unread ? `${spark.unread} new report${spark.unread === 1 ? "" : "s"}` : "Ready"];
}

// The team, in the sidebar, as Grok Bot lists its bots: each face, name,
// and title or what it is doing now. A spark opens its latest chat, or a
// new one.
function renderRoster() {
  const box = $("#spark-roster");
  if (!box) return;
  const open = chats.get(current);
  const here = open ? open.spark : viewSpark;
  $("#sparks-btn").classList.toggle("busy", sparkList.some((sp) => sp.status === "working" || sp.answering));
  const fold = $("#sparks-btn .fold");
  if (fold) fold.hidden = !sparkList.length;
  box.replaceChildren(...sparkList.map((sp, i) => {
    const [kind, doing] = sparkPresence(sp);
    const row = el("button", "spark-mate" + (sp.id === here && view === "chat" ? " current" : ""), `<span class="stack"><span class="who"></span><span class="doing"></span></span>`);
    row.type = "button";
    row.prepend(sparkAvatar({ ...sp, unread: 0 }, 24, i));
    row.querySelector(".who").textContent = sp.name;
    const line = row.querySelector(".doing");
    line.textContent = kind === "idle" && !sp.unread ? sp.title || sp.handle : doing;
    line.classList.toggle("working", kind === "working");
    line.classList.toggle("asking", kind === "waiting");
    if (sp.unread && kind !== "waiting") row.appendChild(el("span", "dot"));
    row.dataset.tip = `${sp.name}${sp.title ? ` · ${sp.title}` : ""}`;
    row.onclick = () => {
      const latest = [...chats.values()].filter((c) => c.spark === sp.id && (c.log.length || c.busy || c.queued || c.title !== "New chat")).sort(byRecent)[0];
      if (latest) switchTo(latest.id); else startSparkChat(sp.id);
      if (innerWidth <= 800) closeSide();
    };
    return row;
  }));
  rosterMore();
}

// Whether the roster, and the sidebar, have more below than they show,
// for their fades.
function rosterMore() {
  for (const box of [$("#spark-roster"), $("#sidebar")]) {
    box.classList.toggle("more", box.scrollTop + box.clientHeight < box.scrollHeight - 2);
  }
}

// The roster folds away, and stays that way in this browser until opened.
function foldRoster(fold, instant) {
  const box = $("#spark-roster");
  const b = $("#sparks-btn .fold");
  b.setAttribute("aria-expanded", !fold);
  b.setAttribute("aria-label", fold ? "Show your sparks" : "Hide your sparks");
  b.dataset.tip = fold ? "Show your sparks" : "Hide your sparks";
  savePref("roster", fold ? "folded" : "open");
  clearTimeout(box.hiding);
  if (instant) box.style.transition = "none";
  box.classList.toggle("folded", fold);
  // Hidden once folded, so its buttons are out of the Tab order.
  if (!fold) box.classList.remove("gone");
  else if (instant) box.classList.add("gone");
  else box.hiding = setTimeout(() => box.classList.add("gone"), 320);
  if (instant) { void box.offsetWidth; box.style.transition = ""; }
  setTimeout(rosterMore, instant ? 0 : 340);
}

// In a chat with a spark that is waiting on you, its approval card sits
// above the box, so the answer is given where the talk is.
function renderSparkAsk() {
  const box = $("#spark-ask");
  const chat = chats.get(current);
  const sp = view === "chat" ? sparkOf(chat ? chat.spark : viewSpark) : null;
  if (!sp || !sp.waiting) { box.hidden = true; box.replaceChildren(); delete box.dataset.for; return; }
  const key = `${sp.id}:${sp.pending && sp.pending.label}:${sp.pending && sp.pending.detail}`;
  if (!box.hidden && box.dataset.for === key) return;
  box.dataset.for = key;
  box.hidden = false;
  const card = el("div", "spark-approval", `<div class="top"><span class="stack"><b></b><div class="sub">Its shift is paused until you answer</div></span></div><pre></pre><div class="row"><input type="text" maxlength="400" autocomplete="off" placeholder="Why not? (optional, it hears this)"><button type="button" class="btn small" data-no>Deny</button><button type="button" class="btn small primary" data-yes>Approve</button></div>`);
  card.style.setProperty("--c", sp.colour);
  card.querySelector(".top").prepend(sparkAvatar({ ...sp, unread: 0 }, 30));
  card.querySelector("b").textContent = `${sp.name} wants to: ${(sp.pending && sp.pending.label) || "take a step"}`;
  const detail = card.querySelector("pre");
  if (sp.pending && sp.pending.detail) detail.textContent = sp.pending.detail; else detail.remove();
  const decide = async (yes) => {
    card.querySelectorAll("button").forEach((b) => { b.disabled = true; });
    try {
      await command(yes ? "spark-approve" : "spark-deny", sp.id, null, { why: card.querySelector("input").value });
      toast(yes ? `${sp.name} carries on` : `${sp.name} carries on without it`);
    } catch (error) {
      card.querySelectorAll("button").forEach((b) => { b.disabled = false; });
      showFailure(error);
    }
  };
  card.querySelector("[data-yes]").onclick = () => decide(true);
  card.querySelector("[data-no]").onclick = () => decide(false);
  box.replaceChildren(card);
}

// Whether sparks keep working with Flash closed: what the page last heard.
let sparksAlways = { installed: false, running: false, here: false };

// Another Flash's keeper runs the sparks: its code, its tools. One
// press puts this one in its place.
function otherKeeperBanner(a) {
  const banner = el("div", "other-keeper", `<span class="ico">${icon("alert")}</span><span class="words"></span>`);
  banner.querySelector(".words").textContent = `Your sparks are being run by ${a.other}, so their shifts use its code and tools, not this one's.`;
  const fix = el("button", "btn", "Run them on this Flash");
  fix.type = "button";
  fix.onclick = async () => {
    fix.disabled = true;
    fix.textContent = "Taking over…";
    try {
      sparksAlways = (await command("sparks-takeover", "", null)).always;
      toast("Your sparks run on this Flash now");
      banner.remove();
    } catch (error) {
      banner.querySelector(".words").textContent = error.message;
      fix.textContent = "Try again";
      fix.disabled = false;
    }
  };
  banner.appendChild(fix);
  return banner;
}

function alwaysWords(a) {
  if (a.other) return `Your sparks are being run by ${a.other}, so their shifts use its code and its tools, not this one's. Run them on this Flash from the Sparks page.`;
  if (!a.installed) return "Off: sparks work while Flash is open, in the terminal or here. On, Flash starts a keeper of its own at login, so they keep working with everything closed and send a notification when they have news.";
  if (a.running) return "On: a keeper started at login is doing the work, and keeps doing it with Flash closed.";
  if (a.here) return "On: this Flash is doing the work right now, and the keeper started at login takes over when it closes.";
  return "On, but the keeper is not running yet. It starts at your next login.";
}

const sparkHandle = (name) => `@${name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "spark"}-spark`;

// AGAIN: a redraw for news, which should not replay the cards' entrance.
async function drawSparks(body, again = false) {
  let r;
  try { r = await command("sparks"); } catch (error) { showFailure(error); return; }
  if (!body.isConnected) return;
  body.innerHTML = `<div class="mem-head"><p class="sub">Agents that keep working on one goal, on a schedule, for as long as Flash is running, and report back. Tell one what to do differently and it remembers.</p></div><div class="host"></div><div class="mem-path"></div>`;
  if (again) body.style.animation = "none";
  const buttons = el("div", "buttons");
  const shared = el("button", "btn with-icon", `${icon("download")}<span>Add shared</span>`);
  shared.type = "button";
  shared.onclick = () => addSharedSpark();
  const team = el("button", "btn with-icon", `${icon("users")}<span>New team</span>`);
  team.type = "button";
  team.onclick = () => teamForm();
  const add = el("button", "btn primary with-icon", `${icon("plus")}<span>New spark</span>`);
  add.type = "button";
  add.onclick = () => sparkForm();
  buttons.append(shared, team, add);
  body.querySelector(".mem-head").appendChild(buttons);
  sparksAlways = r.always;
  const host = body.querySelector(".host");
  if (r.always.other) host.before(otherKeeperBanner(r.always));
  if (r.sparks.length) host.appendChild(sparksBar(r, again));
  if (r.hires.length) host.appendChild(hireCards(r.hires, r.sparks, again));
  if (!r.sparks.length && !r.teams.length) {
    host.insertAdjacentHTML("beforeend", `<div class="mem-empty"><b>No sparks yet</b>Give one a goal like “every morning, check my repo for new issues and tell me which look like bugs”. Or ask Flash in a chat to make one, or start a whole team from New team.</div>`);
    return;
  }
  const byId = new Map(r.sparks.map((s) => [s.id, s]));
  r.teams.forEach((t, ti) => host.appendChild(teamBlock(t, byId, again, ti)));
  const teamIds = new Set(r.teams.map((t) => t.id));
  const alone = r.sparks.filter((s) => !teamIds.has(s.team));
  if (alone.length && r.teams.length) host.appendChild(el("h3", "team-loose", "No team"));
  for (const s of r.sparks) seenTeam.set(s.id, s.team || "");
  if (!alone.length) { sparksFooter(body, r); return; }
  const grid = el("div", "spark-grid");
  alone.forEach((spark, i) => {
    const card = el("button", "spark-card", `<span class="main"><span class="name"></span><span class="title"></span><span class="state"></span><span class="goal"></span><span class="meta"></span></span>`);
    card.style.setProperty("--c", spark.colour);
    card.type = "button";
    card.style.setProperty("--i", i);
    if (again) card.style.animation = "none";
    const face = sparkAvatar(spark, 44, i);
    // Just made: it pops into being. News since the page last looked:
    // it jumps for joy.
    if (!again && Date.now() / 1000 - (spark.created || 0) < 8) celebrate(face, "born");
    const before = seenUnread.get(spark.id);
    if (before !== undefined && spark.unread > before) celebrate(face, "cheer");
    seenUnread.set(spark.id, spark.unread);
    card.prepend(face);
    card.querySelector(".name").textContent = spark.name;
    const title = card.querySelector(".title");
    if (spark.title) title.textContent = spark.title; else title.remove();
    card.querySelector(".meta").textContent = `${spark.handle} · ${spark.schedule}${spark.project_name ? ` · in ${spark.project_name}` : ""}${spark.model_used ? ` · ${spark.model_used}` : ""}`;
    const state = card.querySelector(".state");
    state.textContent = spark.unread ? `${spark.unread} new report${spark.unread === 1 ? "" : "s"} · ${sparkState(spark)}` : sparkState(spark);
    state.classList.toggle("working", spark.status === "working");
    state.classList.toggle("asking", !!spark.waiting);
    card.querySelector(".goal").textContent = spark.goal;
    if (spark.budget_on) card.querySelector(".main").appendChild(budgetMeter(spark));
    card.onclick = () => openSpark(spark.id);
    grid.appendChild(card);
  });
  host.appendChild(grid);
  sparksFooter(body, r);
}

// Teams ---------------------------------------------------------------------
// A team is drawn as its org chart: the sparks that report to no one on
// it along the top, each with the ones that report to it below, joined
// by lines. The lines draw themselves in, the sparks pop in a level at a
// time, a spark at work sends a glow up its line to its lead, and a team
// waves hello when the pointer comes onto its name.

// The team each spark was on when the page last drew it, to see a spark
// that has just joined one; and teams made just now, to assemble: for a
// moment, since a team from a template is drawn as each spark lands.
const seenTeam = new Map();
const freshTeams = new Map();
const FRESH_MS = 2500;
const TEAM_COLOURS = ["#f2a65a", "#5ab0f2", "#7bd88f", "#c792ea", "#ff7a90", "#ffd166", "#4fd1c5", "#a3b1ff"];

function teamBlock(team, byId, again, ti) {
  const block = el("section", "team-block", `<header class="team-head"><button type="button" class="team-badge" data-tip="Rally the team" aria-label="Rally the team"><span class="aura"></span><span class="ring"></span><span class="letter"></span><span class="moons"></span></button><span class="team-title"><b></b><span class="count"></span></span><span class="team-faces"></span><span class="team-actions"></span></header><div class="org"></div>`);
  block.style.setProperty("--t", team.colour);
  block.style.setProperty("--i", ti);
  if (again) block.classList.add("again");
  const fresh = Date.now() - (freshTeams.get(team.id) || 0) < FRESH_MS;
  if (fresh) block.classList.add("fresh");
  block.querySelector(".letter").textContent = (team.name.match(/\p{L}|\p{N}/u) || ["?"])[0].toUpperCase();
  block.querySelector(".team-title b").textContent = team.name;
  const ids = [];
  const walk = (node) => { ids.push(node.id); node.reports.forEach(walk); };
  team.chart.forEach(walk);
  const working = ids.filter((id) => byId.get(id)?.status === "working").length;
  block.querySelector(".count").textContent = `${ids.length} spark${ids.length === 1 ? "" : "s"}${working ? ` · ${working} working` : ""}`;
  const faces = block.querySelector(".team-faces");
  const moons = block.querySelector(".moons");
  const orbiting = ids.slice(0, 6);
  orbiting.forEach((id, k) => {
    const dot = el("i");
    dot.style.setProperty("--c", byId.get(id)?.colour || team.colour);
    dot.style.setProperty("--k", k);
    faces.appendChild(dot);
    // Its sparks circle the badge, each at its own place on the ring.
    const moon = el("i");
    moon.style.setProperty("--c", byId.get(id)?.colour || team.colour);
    moon.style.setProperty("--k", k);
    moon.style.setProperty("--n", orbiting.length);
    moons.appendChild(moon);
  });
  const badge = block.querySelector(".team-badge");
  badge.onclick = () => rally(block, team.colour);
  if (fresh && !again) setTimeout(() => teamBurst(badge, team.colour, 16), 120);
  const actions = block.querySelector(".team-actions");
  const action = (name, tip, run) => {
    const b = button("icon-btn", name, tip, "", run);
    actions.appendChild(b);
    return b;
  };
  action("share", "Share this team", () => shareTeam(team));
  action("edit", "Rename or recolour", () => teamForm(team));
  action("trash", "Delete the team (its sparks stay)", async (b) => {
    if (!b.classList.contains("sure")) { b.classList.add("sure"); b.dataset.tip = "Click again to delete it"; return; }
    try { await command("team-remove", team.id, null); toast(`${team.name} is gone. Its sparks are on no team now.`); }
    catch (error) { showFailure(error); }
  });
  const org = block.querySelector(".org");
  if (!team.chart.length) {
    org.innerHTML = `<div class="team-empty">No sparks on ${esc(team.name)} yet. Edit a spark to put it here, or make one with this team picked.</div>`;
    return block;
  }
  const tree = el("ul", "org-tree");
  let k = 0;
  const grow = (node, depth, into) => {
    const spark = byId.get(node.id);
    if (!spark) return;
    const li = el("li");
    li.style.setProperty("--d", depth);
    li.style.setProperty("--k", k++);
    li.appendChild(orgNode(spark, depth, fresh));
    if (node.reports.length) {
      const ul = el("ul");
      node.reports.forEach((child) => grow(child, depth + 1, ul));
      li.appendChild(ul);
    }
    into.appendChild(li);
  };
  team.chart.forEach((node) => grow(node, 0, tree));
  org.appendChild(tree);
  // Wider than the page, as on a phone: it opens on its lead, centred.
  requestAnimationFrame(() => { org.scrollLeft = (org.scrollWidth - org.clientWidth) / 2; });
  tree.querySelectorAll(".org-node").forEach(tilt);
  // News just in, from a spark with a lead: a comet carries it up.
  const news = [...tree.querySelectorAll(".org-node.has-news")];
  if (news.length) {
    setTimeout(() => news.forEach((node, k) => courier(org, node, leadNodeOf(node), team.colour, k * 160)), again ? 150 : 900);
  }
  return block;
}

function orgNode(spark, depth, fresh) {
  const node = el("button", "org-node", `<span class="face-wrap"></span><span class="words"><span class="name"></span><span class="title"></span><span class="state"></span></span>`);
  node.type = "button";
  node.style.setProperty("--c", spark.colour);
  const face = sparkAvatar(spark, 40, depth);
  node.querySelector(".face-wrap").appendChild(face);
  node.querySelector(".name").textContent = spark.name;
  const title = node.querySelector(".title");
  if (spark.title) title.textContent = spark.title; else title.remove();
  const state = node.querySelector(".state");
  state.textContent = spark.unread ? `${spark.unread} new · ${sparkState(spark)}` : sparkState(spark);
  state.classList.toggle("working", spark.status === "working");
  state.classList.toggle("asking", !!spark.waiting);
  if (spark.budget_on) node.querySelector(".words").appendChild(budgetMeter(spark));
  // At work under a lead: a glow runs up the line to it.
  if (spark.status === "working" && depth > 0) node.appendChild(el("span", "pulse"));
  const before = seenTeam.get(spark.id);
  if (before !== undefined && before !== spark.team) node.classList.add("joined");
  // Just made, a hire say: it pops into being on its team.
  else if (Date.now() / 1000 - (spark.created || 0) < 8 && !fresh) celebrate(face, "born");
  const unread = seenUnread.get(spark.id);
  if (unread !== undefined && spark.unread > unread) {
    celebrate(face, "cheer");
    if (depth > 0) node.classList.add("has-news");
  }
  seenUnread.set(spark.id, spark.unread);
  node.onclick = () => openSpark(spark.id);
  node.dataset.tip = `${spark.name}: ${spark.goal.split("\n")[0].slice(0, 120)}`;
  return node;
}

// Every spark at once: Pause all holds their schedules, Stop all also
// stops whatever is running and calls off what waits on you, and Resume
// all wakes what either held.
function sparksBar(r, again = false) {
  const bar = el("div", "sparks-bar", `<span class="said"></span><span class="buttons"></span>`);
  if (again) bar.style.animation = "none";
  const working = r.sparks.filter((s) => s.status === "working" || s.waiting).length;
  const awake = r.sparks.filter((s) => !s.paused).length;
  const paused = r.sparks.length - awake;
  bar.querySelector(".said").textContent = r.held
    ? `${r.held} spark${r.held === 1 ? "" : "s"} paused till Resume all`
    : [working && `${working} working`, `${awake} on schedule`, paused && `${paused} paused`].filter(Boolean).join(" · ");
  bar.classList.toggle("holding", !!r.held);
  const buttons = bar.querySelector(".buttons");
  const add = (label, iconName, cls, run) => {
    const b = el("button", `btn small with-icon ${cls}`, `${icon(iconName)}<span>${label}</span>`);
    b.type = "button";
    b.onclick = () => run(b);
    buttons.appendChild(b);
    return b;
  };
  if (r.held) {
    add("Resume all", "play", "primary", async () => {
      try { const { resumed } = await command("sparks-resume-all"); toast(`${resumed} spark${resumed === 1 ? "" : "s"} back on schedule`); }
      catch (error) { showFailure(error); }
    });
  }
  if (awake) {
    add("Pause all", "pause", "", async () => {
      try { const { paused: n } = await command("sparks-pause-all"); toast(`Paused ${n}: what is running finishes, and nothing starts till Resume all`); }
      catch (error) { showFailure(error); }
    });
  }
  if (awake || working) {
    add("Stop all", "halt", "danger", async (b) => {
      if (!b.classList.contains("sure")) { b.classList.add("sure"); b.querySelector("span").textContent = "Stop everything?"; return; }
      try {
        const done = await command("sparks-stop-all");
        toast(`Stopped ${done.stopped} shift${done.stopped === 1 ? "" : "s"} and paused ${done.paused}`);
        document.body.classList.add("all-stopped");
        setTimeout(() => document.body.classList.remove("all-stopped"), 1200);
      } catch (error) { showFailure(error); }
    });
  }
  return bar;
}

// The spark a node reports to, as drawn: the node of the list item one
// level up.
function leadNodeOf(node) {
  const up = node.closest("li")?.parentElement?.closest("li");
  return up ? up.querySelector(":scope > .org-node") : null;
}

// Sparks of the team's colour flung out from NODE, all ways round.
function teamBurst(node, colour, count = 14) {
  if (calm.matches || !node) return;
  for (let n = 0; n < count; n++) {
    const bit = el("i", "burst");
    bit.style.setProperty("--a", `${(360 / count) * n + Math.random() * 18}deg`);
    bit.style.setProperty("--dist", `${38 + Math.random() * 36}px`);
    bit.style.setProperty("--c", colour);
    bit.style.animationDelay = `${Math.round(Math.random() * 90)}ms`;
    bit.addEventListener("animationend", () => bit.remove());
    node.appendChild(bit);
  }
}

// A comet that runs along the org chart's lines from FROM up to TO: up
// its stub, across the bar, up into its lead, which lights as it lands.
function courier(org, from, to, colour, delay = 0) {
  if (calm.matches || !from || !to || !org.isConnected) return;
  const box = org.getBoundingClientRect();
  const a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
  const x0 = a.left + a.width / 2 - box.left + org.scrollLeft;
  const y0 = a.top - box.top + org.scrollTop;
  const x1 = b.left + b.width / 2 - box.left + org.scrollLeft;
  const y1 = b.bottom - box.top + org.scrollTop;
  const bar = y0 - 22;
  const frames = [[x0, y0, 0], [x0, bar, 0.28], [x1, bar, 0.72], [x1, y1, 1]].map(([x, y, offset]) => ({ transform: `translate(${x}px, ${y}px)`, offset }));
  for (let t = 0; t < 5; t++) {
    const orb = el("i", "courier");
    orb.style.setProperty("--c", colour);
    orb.style.setProperty("--s", 1 - t * 0.17);
    orb.style.opacity = String(1 - t * 0.2);
    org.appendChild(orb);
    const run = orb.animate(frames, { duration: 1150, delay: delay + t * 42, easing: "cubic-bezier(0.55, 0, 0.3, 1)", fill: "both" });
    run.onfinish = () => {
      orb.remove();
      if (t) return;
      to.classList.remove("got-news");
      void to.offsetWidth;
      to.classList.add("got-news");
      teamBurst(to.querySelector(".face-wrap"), colour, 7);
    };
  }
}

// Clicking a team's badge: the team jumps in a wave down the tree, the
// badge throws sparks, and a comet runs up every line to its lead.
function rally(block, colour) {
  if (calm.matches) return;
  block.classList.remove("rally");
  void block.offsetWidth;
  block.classList.add("rally");
  teamBurst(block.querySelector(".team-badge"), colour, 20);
  const org = block.querySelector(".org");
  block.querySelectorAll(".org-node").forEach((node) => {
    const d = Number(getComputedStyle(node).getPropertyValue("--d")) || 0;
    courier(org, node, leadNodeOf(node), colour, 350 + d * 160);
  });
  clearTimeout(block.rallyEnd);
  block.rallyEnd = setTimeout(() => block.classList.remove("rally"), 2400);
}

// A spark's card leans toward the pointer, as a card in the hand does.
function tilt(node) {
  if (calm.matches) return;
  node.addEventListener("pointermove", (e) => {
    const r = node.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
    node.style.setProperty("--ry", `${(x * 14).toFixed(2)}deg`);
    node.style.setProperty("--rx", `${(-y * 14).toFixed(2)}deg`);
    node.style.setProperty("--gx", `${Math.round((x + 0.5) * 100)}%`);
  });
  node.addEventListener("pointerleave", () => {
    node.style.setProperty("--rx", "0deg");
    node.style.setProperty("--ry", "0deg");
  });
}

// How much of its month a spark with a budget has used.
function budgetMeter(spark) {
  const share = spark.budget ? Math.min(100, Math.round(100 * (spark.used || 0) / spark.budget)) : 0;
  const meter = el("span", "budget-meter", `<span class="bar"><i></i></span><span class="said"></span>`);
  meter.querySelector("i").style.width = `${share}%`;
  meter.classList.toggle("warn", share >= 75 && share < 100);
  meter.classList.toggle("full", share >= 100);
  const n = (x) => x >= 1e6 ? `${+(x / 1e6).toFixed(1)}M` : x >= 1e3 ? `${Math.round(x / 1e3)}k` : String(x);
  const unit = { hour: "hour", day: "day", week: "week", month: "month" }[spark.budget_period || "month"];
  meter.querySelector(".said").innerHTML = share >= 100 ? "Budget used" : `${n(spark.used || 0)} / ${n(spark.budget)}<span class="unit"> a ${unit}</span>`;
  const per = { hour: "an hour", day: "a day", week: "a week", month: "a month" }[spark.budget_period || "month"];
  const when = spark.period_words || "this month";
  meter.dataset.tip = share >= 100
    ? `Used all ${Number(spark.budget).toLocaleString()} tokens of its budget for ${when}: paused till it turns`
    : `${Number(spark.used || 0).toLocaleString()} of ${Number(spark.budget).toLocaleString()} tokens ${per}, used ${when}`;
  return meter;
}

// Hires and let-gos waiting on the user, at the top of the page.
function hireCards(hires, all, again = false) {
  const box = el("section", "hire-stack", `<h3 class="team-loose">Waiting on you</h3>`);
  // Drawn again for news: the cards stay put rather than rise again.
  if (again) box.classList.add("again");
  const byId = new Map(all.map((s) => [s.id, s]));
  for (const hire of hires) {
    const by = byId.get(hire.by);
    const card = el("div", "hire-card", `<span class="face"></span><span class="words"><span class="hire-ask"></span><span class="goal"></span><span class="why"></span></span><span class="decide"><input type="text" maxlength="300" placeholder="Why not? (optional)" aria-label="Why not"><button type="button" class="btn small" data-no>Decline</button><button type="button" class="btn small primary" data-yes></button></span>`);
    if (by) card.querySelector(".face").appendChild(sparkAvatar(by, 36));
    const ask = card.querySelector(".hire-ask");
    if (hire.kind === "hire") {
      ask.innerHTML = `<b></b> wants to hire <b class="who"></b>`;
      ask.querySelector("b").textContent = hire.by_name;
      ask.querySelector(".who").textContent = hire.spark.name + (hire.spark.title ? `, ${hire.spark.title}` : "");
      card.querySelector(".goal").textContent = hire.spark.goal;
      card.querySelector("[data-yes]").textContent = "Hire";
    } else {
      ask.innerHTML = `<b></b> wants to let <b class="who"></b> go`;
      ask.querySelector("b").textContent = hire.by_name;
      ask.querySelector(".who").textContent = hire.target_name;
      card.querySelector(".goal").remove();
      card.querySelector("[data-yes]").textContent = "Let it go";
    }
    const why = card.querySelector(".why");
    if (hire.reason) why.textContent = `Why: ${hire.reason}`; else why.remove();
    const decide = async (yes) => {
      card.querySelectorAll("button").forEach((b) => { b.disabled = true; });
      try {
        await command("hire-decide", hire.id, null, { yes, why: card.querySelector("input").value });
        card.classList.add(yes ? "stamped" : "waved");
        toast(yes ? (hire.kind === "hire" ? `${hire.spark.name} is hired` : `${hire.target_name} is let go`) : "Declined");
      } catch (error) { showFailure(error); card.querySelectorAll("button").forEach((b) => { b.disabled = false; }); }
    };
    card.querySelector("[data-yes]").onclick = () => decide(true);
    card.querySelector("[data-no]").onclick = () => decide(false);
    box.appendChild(card);
  }
  return box;
}

// Making a team, empty or from a template or a code; or, given TEAM,
// renaming and recolouring it.
function teamForm(team = null) {
  const colour = team ? team.colour : TEAM_COLOURS[Math.floor(Math.random() * TEAM_COLOURS.length)];
  const form = openForm(`
    <h2>${team ? "Edit team" : "New team"}</h2>
    <p class="sub">${team ? "" : "A team keeps sparks together: a lead, and the sparks that report to it. Sparks can also stay on no team."}</p>
    ${team ? "" : `<div class="spark-templates team-templates"><span class="sub">Start from:</span></div>`}
    <label class="field"><span>Name</span><input name="teamname" maxlength="32" placeholder="Dev" autocomplete="off" required></label>
    <div class="field"><span>Colour</span><div class="swatches" role="radiogroup" aria-label="Colour">${TEAM_COLOURS.map((c) => `<button type="button" class="swatch" role="radio" data-c="${c}" style="--c:${c}" aria-label="${c}"></button>`).join("")}</div></div>
    ${team ? "" : `<details class="team-code"><summary>Add a shared team instead</summary><label class="field"><span>Team code</span><textarea name="code" rows="3" class="mono" placeholder="flash-team:..." spellcheck="false"></textarea><small class="code-said">Paste the code someone shared. You see its sparks before anything is added.</small></label></details>
    <label class="field check start-paused" hidden><input type="checkbox" name="paused" checked><span>Start its sparks paused, to look them over first. Resume each in its window, or Resume all.</span></label>`}
    <div class="dialog-buttons"><button type="button" class="btn" data-cancel>Cancel</button><button type="submit" class="btn primary">${team ? "Save" : "Make team"}</button></div>`,
    async (data) => {
      const name = (data.teamname || "").trim();
      const chosen = form.dataset.colour;
      if (team) {
        await command("team-update", team.id, null, { rename: name, colour: chosen });
        toast(`Saved ${name}`);
        return;
      }
      const code = (data.code || "").trim();
      const from = form.dataset.template || code;
      let made;
      let note = "";
      if (from) ({ team: made, note } = await command("team-add", from, null, { model: "", paused: !!data.paused }));
      if (note) toast(note);
      else made = (await command("team-create", name, null, { colour: chosen })).team;
      freshTeams.set(made.id, Date.now());
      toast(from ? `${made.name} is here, with its sparks` : `Made ${made.name}. Edit a spark to put it on the team.`);
      if (view !== "sparks") showPage("sparks");
    });
  form.querySelector("[data-cancel]").onclick = closeForm;
  const pick = (c) => {
    form.dataset.colour = c;
    form.querySelectorAll(".swatch").forEach((b) => b.setAttribute("aria-checked", b.dataset.c === c));
  };
  form.querySelectorAll(".swatch").forEach((b) => { b.onclick = () => pick(b.dataset.c); });
  pick(colour);
  if (team) { form.teamname.value = team.name; return; }
  command("team-templates", "", null).then(({ templates }) => {
    const row = form.querySelector(".team-templates");
    if (!row) return;
    for (const t of templates) {
      const chip = el("button", "chip-btn");
      chip.type = "button";
      chip.textContent = t.name;
      chip.dataset.tip = `${t.blurb}: ${t.lead}, leading ${t.reports.join(" and ")}`;
      chip.onclick = () => {
        const on = !chip.classList.contains("on");
        row.querySelectorAll(".chip-btn").forEach((c) => c.classList.remove("on"));
        chip.classList.toggle("on", on);
        form.dataset.template = on ? t.name : "";
        if (on) form.teamname.value = t.name;
        showStartPaused();
      };
      row.appendChild(chip);
    }
  }).catch(() => {});
  // Only a team that comes with sparks has sparks to start paused.
  const showStartPaused = () => {
    form.querySelector(".start-paused").hidden = !(form.dataset.template || form.code.value.trim());
  };
  let timer = 0;
  form.code.addEventListener("input", () => {
    showStartPaused();
    clearTimeout(timer);
    const said = form.querySelector(".code-said");
    timer = setTimeout(async () => {
      const code = form.code.value.trim();
      form.teamname.required = !code;
      if (!code) { said.textContent = "Paste the code someone shared. You see its sparks before anything is added."; return; }
      try {
        const seen = (await command("team-code", code, null)).team;
        form.teamname.value = seen.name;
        said.textContent = `${seen.name}: ${seen.sparks.map((s) => s.name).join(", ")}.`;
      } catch (error) { said.textContent = error.message; }
    }, 200);
  });
}

async function shareTeam(team) {
