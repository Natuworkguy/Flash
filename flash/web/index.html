let streamNode = null;
let streamScheduled = false;

function drawStreaming() {
  const chat = chats.get(current);
  if (streamNode) { streamNode.remove(); streamNode = null; }
  if (!chat || !(chat.busy || chat.queued)) return;
  streamNode = el("div", "streaming");
  if (chat.thinking) streamNode.appendChild(thinkingBlock(chat.thinking, true));
  if (chat.partial) {
    const wrap = el("div", "block");
    const body = el("div", "assistant", markdown(chat.partial));
    ink(body);
    const last = body.lastElementChild;
    const tail = last && !["PRE", "DIV", "UL", "OL"].includes(last.tagName) ? last : body;
    // The reply is drawn again for every few tokens, which would restart
    // the cursor's pulse each time and freeze it. Starting each new one
    // part way through, in step with the clock, keeps it breathing.
    const cursor = el("span", "cursor");
    cursor.style.animationDelay = `-${Math.round(performance.now() % 1000)}ms`;
    tail.appendChild(cursor);
    wrap.appendChild(body);
    streamNode.appendChild(wrap);
  } else if (!chat.thinking && !pendingAsk()) {
    streamNode.appendChild(el("div", "block", '<div class="typing"><span></span><span></span><span></span></div>'));
  }
  messagesEl.appendChild(streamNode);
}

// Ink: the text a reply gained in the last moment fades in from a blur.
// The reply is drawn again for every few tokens, so each stretch keeps a
// note of when it arrived and its animation is restarted part way
// through, at its own age, rather than from the beginning each time.
const INK_MS = 420;
let inkFor = null;
let inkRuns = [];   // { t, from, to }: when the text from..to arrived
let inkSeen = 0;    // how much of the reply has arrived so far

function ink(body) {
  if (calm.matches) return;
  const now = performance.now();
  const nodes = [];
  let total = 0;
  const walk = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
  while (walk.nextNode()) { nodes.push([walk.currentNode, total]); total += walk.currentNode.nodeValue.length; }

  // Another chat, or a new reply after a tool call: start the count over.
  if (inkFor !== current || total < inkSeen) { inkRuns = []; inkSeen = 0; }
  inkFor = current;
  if (total > inkSeen) { inkRuns.push({ t: now, from: inkSeen, to: total }); inkSeen = total; }
  inkRuns = inkRuns.filter((run) => now - run.t < INK_MS);
  if (!inkRuns.length) return;

  // Last node first, and within one the latest stretch first, so every
  // split leaves the offsets still to come where they were.
  const runs = [...inkRuns].reverse();
  for (let k = nodes.length - 1; k >= 0; k--) {
    const [node, start] = nodes[k];
    const end = start + node.nodeValue.length;
    for (const run of runs) {
      const a = Math.max(run.from, start), b = Math.min(run.to, end);
      if (a >= b) continue;
      if (b - start < node.nodeValue.length) node.splitText(b - start);
      const part = node.splitText(a - start);
      const span = document.createElement("span");
      span.className = "ink";
      span.style.animationDelay = `-${Math.round(now - run.t)}ms`;
      part.parentNode.insertBefore(span, part);
      span.appendChild(part);
    }
  }
}

function scheduleStream() {
  if (streamScheduled) return;
  streamScheduled = true;
  requestAnimationFrame(() => {
    streamScheduled = false;
    drawStreaming();
    keepUp();
  });
}

// Scrolling -----------------------------------------------------------------

// Following: while on, the view keeps up with everything that arrives,
// however much arrives at once. Sending turns it on, as does coming back
// to the bottom; only scrolling up, which is someone wanting to read,
// turns it off.
let follow = true;
const nearBottom = () => logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 100;

function toBottom(force, smooth) {
  if (!force && !follow) return;
  follow = true;
  logEl.scrollTo({ top: logEl.scrollHeight, behavior: smooth && !calm.matches ? "smooth" : "auto" });
  $("#jump").hidden = true;
}

// After anything new lands: keep up, or offer the way down.
function keepUp() {
  if (follow) { toBottom(); return; }
  if (!document.body.classList.contains("empty") && view === "chat") { placeJump(); $("#jump").hidden = false; }
}

function readingUp() { follow = false; }
logEl.addEventListener("wheel", (e) => { if (e.deltaY < 0) readingUp(); }, { passive: true });
// A press on the log itself, not on anything in it, is its scrollbar.
logEl.addEventListener("mousedown", (e) => { if (e.target === logEl) readingUp(); });
window.addEventListener("keydown", (e) => { if (e.key === "PageUp" || (e.key === "Home" && !typing())) readingUp(); }, true);
let touchY = null;
logEl.addEventListener("touchstart", (e) => { touchY = e.touches[0].clientY; }, { passive: true });
logEl.addEventListener("touchmove", (e) => { if (touchY !== null && e.touches[0].clientY > touchY + 4) readingUp(); }, { passive: true });
function placeJump() { $("#jump").style.bottom = ($("#dock").offsetHeight + 12) + "px"; }
logEl.addEventListener("scroll", () => {
  if (nearBottom()) { follow = true; $("#jump").hidden = true; }
});

// ---------------------------------------------------------------------------
// Events from Flash

function apply(event) {
  if (event.seq && event.seq <= lastSeq) return;
  if (event.seq) lastSeq = event.seq;
  if (event.type === "chats" || event.type === "status" || event.type === "projects") { refreshLite(); return; }

  const chat = chats.get(event.chat);
  if (!chat) { if (event.chat) refreshLite(); return; }
  const here = event.chat === current && view === "chat";

  switch (event.type) {
    case "token": chat.partial += event.text; if (here) scheduleStream(); return;
    case "thinking": chat.thinking += event.text; if (here) scheduleStream(); return;
    case "busy":
      chat.busy = event.busy;
      if (event.busy) chat.queued = false;
      else { chat.partial = ""; chat.thinking = ""; refreshContext(); }
      renderChats();
      if (here) { drawStreaming(); updateSend(); }
      break;
    case "cleared":
      chat.log = []; chat.partial = ""; chat.thinking = "";
      if (here) drawChat();
      return;
    default: {
      const entry = { ...event };
      delete entry.chat;
      chat.log.push(entry);
      if (event.type === "user") { chat.queued = true; chat.updated = Date.now() / 1000; }
      if (event.type === "assistant") { chat.partial = ""; chat.thinking = ""; }
      if (here) {
        // The first thing in a chat turns the empty screen into a
        // conversation, and the follow-ups still have to happen after.
        if (document.body.classList.contains("empty")) { morph(() => { drawChat(); arrived(entry); }); break; }
        if (streamNode) { streamNode.remove(); streamNode = null; }
        drawCtx.index = chat.log.length - 1;
        drawEntry(entry, drawCtx);
        drawStreaming();
        updateSend();
        arrived(entry);
      } else if (event.type === "ask") {
        toast(`“${chat.title}” needs your permission`);
      }
    }
  }
  if (here) keepUp();
}

// What a live entry does beyond being drawn: a question takes the keys,
// and a file the agent sends pops out on the right.
function arrived(entry) {
  if (entry.type === "ask") focusAsk();
  if (entry.type === "file") openViewer(entry);
}

async function loadState() {
  loading = true;
  buffered = [];
  const state = await api("/api/state");
  chats.clear();
  for (const c of state.chats) chats.set(c.id, c);
  order = state.chats.map((c) => c.id);
  info = state.status;
  projects = state.projects || [];
  lastSeq = state.seq;
  if (current && !chats.has(current)) current = null;
  loading = false;
  renderChats();
  renderInfo();
  drawChat();
  for (const event of buffered) apply(event);
  buffered = [];
  refreshContext();
}

let liteTimer = null;
function refreshLite() {
  clearTimeout(liteTimer);
  liteTimer = setTimeout(async () => {
    const state = await api("/api/state?lite=1").catch(() => null);
    if (!state) return;
    info = state.status;
    projects = state.projects || [];
    const ids = state.chats.map((c) => c.id);
    for (const c of state.chats) {
      const known = chats.get(c.id);
      if (known) Object.assign(known, { title: c.title, busy: c.busy, queued: c.queued, project: c.project, updated: c.updated });
      else chats.set(c.id, { ...c, log: [], partial: "", thinking: "" });
    }
    for (const id of [...chats.keys()]) if (!ids.includes(id)) chats.delete(id);
    order = ids;
    if (current && !chats.has(current)) { current = null; drawChat(); }
    // Not while something on the page is being edited: redrawing it
    // would throw away what is half typed.
    const editing = messagesEl.contains(document.activeElement) && /TEXTAREA|INPUT/.test(document.activeElement.tagName);
    if (view !== "chat" && view !== "settings" && !editing && $("#form").hidden) drawPage();
    renderChats();
    renderInfo();
    const chat = chats.get(current);
    if (chat && !$("#title input")) { $("#title").textContent = chat.title; document.title = chat.title === "New chat" ? "Flash" : `${chat.title} · Flash`; }
  }, 60);
}

function connect() {
  const source = new EventSource(token ? "/api/events?token=" + encodeURIComponent(token) : "/api/events");
  let first = true;
  source.onopen = () => { if (!first) loadState().catch(showFailure); first = false; };
  source.onmessage = (message) => {
    const event = JSON.parse(message.data);
    if (loading) buffered.push(event); else apply(event);
  };
  source.onerror = async () => {
    // Refused rather than unreachable: Flash restarted with a new token.
    // Loading the page again shows why, instead of retrying forever.
    try { await api("/api/state?lite=1"); toast("Reconnecting to Flash…"); }
    catch (error) {
      if (error.message === "forbidden") { source.close(); location.reload(); }
      else toast("Reconnecting to Flash…");
    }
  };
}

// ---------------------------------------------------------------------------
// Chrome

let shownChats = null;
let renamingChat = null;   // a sidebar row being renamed in place

function renderChats() {
  // Redrawing would throw away the half-typed name; it catches up after.
  if (renamingChat) return;
  const nav = $("#chats");
  // Where each row was, so a chat that moves up the list can glide there.
  const was = new Map([...nav.children].map((row) => [row.dataset.chat, row.getBoundingClientRect().top]));
  nav.textContent = "";
  const before = shownChats;
  shownChats = new Set();
  for (const id of visibleChats()) {
    const chat = chats.get(id);
    shownChats.add(id);
    const fresh = before && !before.has(id);
    const row = el("div", "chat" + (id === current ? " current" : "") + (fresh ? " fresh" : ""));
    row.dataset.chat = id;
    const open = el("button", "open", `<span class="name"></span>`);
    open.type = "button";
    open.firstChild.textContent = chat.title;
    const project = chat.project && projectOf(chat.project);
    if (project) {
      const pill = el("span", "proj");
      pill.textContent = project.name;
      open.prepend(pill);
    }
    open.onclick = () => { switchTo(id); if (innerWidth <= 800) closeSide(); };
    open.ondblclick = () => renameInSide(id, row);
    row.appendChild(open);
    if (chat.busy || chat.queued) row.appendChild(el("span", "live"));
    const acts = el("span", "acts");
    acts.append(
      button("", "edit", "Rename", "", () => renameInSide(id, row)),
      button("", "x", "Delete chat", "Alt Shift D", () => deleteChat(id)),
    );
    row.appendChild(acts);
    nav.appendChild(row);
  }
  if (calm.matches) return;
  for (const row of nav.children) {
    const before = was.get(row.dataset.chat);
    const shift = before === undefined ? 0 : before - row.getBoundingClientRect().top;
    if (Math.abs(shift) > 1) {
      row.animate([{ transform: `translateY(${shift}px)` }, { transform: "none" }],
        { duration: 460, easing: "cubic-bezier(0.32, 0.72, 0, 1)" });
    }
  }
}

  if (auto && !was && autoBtn.dataset.ready) flash(autoBtn, "zap", 520);
  autoBtn.dataset.ready = "1";

function greet() {
  const hour = new Date().getHours();
  const when = hour < 5 ? "Up late" : hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
  const inProject = projectOf(viewProject);
  $("#greeting").innerHTML = esc(when) + (inProject ? `<span class="in">in ${esc(inProject.name)}</span>` : "");
  const name = inProject ? inProject.name : info.folder || "this project";
  const ideas = [
    ["Explain the codebase", `Explain how ${name} is put together, and where I should start reading.`],
    ["Find a bug", `Find the most likely bug in ${name} and show me the fix.`],
    ["Write tests", "Write tests for the code I changed most recently."],
    ["Review my changes", "Review my uncommitted changes and point out anything risky."],
  ];
  const box = $("#suggestions");
  // Built again only when they change: rebuilding replays their entrance,
  // and the status refreshes far more often than the project does.
  const signature = ideas.map((idea) => idea[1]).join("|");
  if (box.dataset.signature === signature) return;
  box.dataset.signature = signature;
  box.textContent = "";
  ideas.forEach(([label, prompt], i) => {
    const chip = el("button", "suggestion");
    chip.type = "button";
    chip.textContent = label;
    chip.style.setProperty("--i", i);
    chip.onclick = () => typeIn(prompt);
    box.appendChild(chip);
  });
}

// Types TEXT into the box quickly, the way a suggestion should land.
function typeIn(text) {
  input.focus();
  if (calm.matches) { input.value = text; autosize(); updateSend(); return; }
  cancelAnimationFrame(typeIn.frame);
  const step = Math.max(1, Math.ceil(text.length / 22));
  let at = 0;
  const tick = () => {
    at = Math.min(text.length, at + step);
    input.value = text.slice(0, at);
    autosize();
    updateSend();
    if (at < text.length) typeIn.frame = requestAnimationFrame(tick);
  };
  tick();
}

async function refreshContext() {
  const chat = chats.get(current);
  if (!chat || !chat.log.length) { $("#context").textContent = ""; return; }
  try {
    const { share } = await command("context");
    $("#context").textContent = share >= 50 ? `${share}% of context` : "";
  } catch (_) { /* the chat went away */ }
}

function updateSend() {
  const chat = chats.get(current);
  const busy = chat && (chat.busy || chat.queued);
  const send = $("#send");
  send.classList.toggle("stop", !!busy);
  document.body.classList.toggle("working", !!busy && view === "chat");
  // Swapped only when it changes, so the icon's entrance plays once per
  // change rather than on every keystroke.
  if (send.dataset.state !== (busy ? "stop" : "up")) {
    send.dataset.state = busy ? "stop" : "up";
    send.innerHTML = icon(busy ? "stop" : "up");
  }
  send.dataset.tip = busy ? "Stop" : "Send";
  send.dataset.keys = busy ? "Esc" : "Enter";
  send.setAttribute("aria-label", busy ? "Stop" : "Send");
  send.disabled = !busy && !input.value.trim();
}

// A notice grows out of a small capsule, springs to its width, and
// shrinks back into it, the way the Dynamic Island shows an alert.
function toast(text) {
  const t = $("#toast");
  clearTimeout(toast.timer);
  t.getAnimations().forEach((a) => a.cancel());
  t.innerHTML = "<span></span>";
  t.firstChild.textContent = text;
  t.style.width = "";
  t.style.opacity = "1";
  const wide = t.offsetWidth;
  if (!calm.matches) {
    t.animate(
      [{ width: "38px", transform: "translateX(-50%) translateY(10px) scale(0.9)", opacity: 0 },
       { width: wide + "px", transform: "translateX(-50%)", opacity: 1 }],
      { duration: 560, easing: "cubic-bezier(0.34, 1.3, 0.64, 1)" },
    );
    t.firstChild.animate([{ opacity: 0, filter: "blur(3px)" }, { opacity: 1, filter: "blur(0)" }],
      { duration: 300, delay: 140, easing: "ease-out", fill: "backwards" });
  }
  toast.timer = setTimeout(() => {
    if (calm.matches) { t.style.opacity = "0"; return; }
    t.firstChild.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 140, fill: "forwards" });
    t.animate(
      [{ width: wide + "px", opacity: 1 }, { width: "38px", opacity: 0, transform: "translateX(-50%) scale(0.9)" }],
      { duration: 360, delay: 90, easing: "cubic-bezier(0.32, 0.72, 0, 1)", fill: "forwards" },
    ).finished.then(() => { t.style.opacity = "0"; t.getAnimations().forEach((a) => a.cancel()); }, () => {});
  }, 2000);
}
const showFailure = (error) => toast(error.message || String(error));

// Tooltips: a label, and its keys when it has keys, on hover only.
const tip = $("#tip");
let tipTimer = null;
let tipFor = null;
function showTip(target) {
  const label = target.dataset.tip;
  if (!label || !document.contains(target)) return;
  const keys = target.dataset.keys;
  tip.innerHTML = `<span>${esc(label)}</span>` + (keys ? `<span class="k">${keys.split(" ").map((k) => `<kbd>${esc(k)}</kbd>`).join("")}</span>` : "");
  tip.classList.add("show");
  const r = target.getBoundingClientRect();
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let top = r.top - h - 8;
  if (top < 6) top = r.bottom + 8;
  tip.style.top = top + "px";
  tip.style.left = Math.max(6, Math.min(innerWidth - w - 6, r.left + r.width / 2 - w / 2)) + "px";
}
function hideTip() { clearTimeout(tipTimer); tip.classList.remove("show"); tipFor = null; }
document.addEventListener("mouseover", (e) => {
  const target = e.target.closest("[data-tip]");
  if (target === tipFor) return;
  const warm = tip.classList.contains("show");
  hideTip();
  if (!target) return;
  tipFor = target;
  tipTimer = setTimeout(() => showTip(target), warm ? 0 : 380);
});
document.addEventListener("mousedown", hideTip, true);
document.addEventListener("scroll", hideTip, true);

// Actions: every key, button, menu row and slash command lands here.

async function send(text) {
  text = text.trim();
  if (!text) return;
  if (text.startsWith("/") && runSlash(text)) return;
  sent.push(text);
  sentAt = -1;
  flash($("#send"), "launch", 420);
  flash($("#composer"), "sent", 340);
  buzz();
  follow = true;
  toBottom(true, true);
  input.value = "";
  autosize();
  updateSend();
  // The chat has to exist here before anything is said in it, or its
  // first events would arrive for a chat this page has never seen.
  if (!current) await createChat(view === "project" ? viewProject : "");
  await api("/api/send", { chat: current, text }).catch(showFailure);
}

async function createChat(project = "") {
  const { chat: id } = await command("new", "", null, { project });
  if (!chats.has(id)) chats.set(id, { id, title: "New chat", busy: false, queued: false, log: [], partial: "", thinking: "", project, updated: Date.now() / 1000 });
  if (!order.includes(id)) order.push(id);
  current = id;
  view = "chat";
  viewProject = project || null;
  renderChats();
  drawChat();
}

function stopReply() {
  const chat = chats.get(current);
  if (chat && (chat.busy || chat.queued)) { command("stop"); return true; }
  return false;
}

async function newChat() {
  // A new chat starts empty: nothing is made until the first message,
  // so pressing it twice does not leave an empty chat behind.
  view = "chat";
  current = null;
  viewProject = null;
  renderChats();
  morph(drawChat);
  input.focus();
  if (innerWidth <= 800) closeSide();
}

function switchTo(id, nav) {
  if (!chats.has(id)) return;
  current = id;
  view = "chat";
  viewProject = chats.get(id).project || null;
  renderChats();
  refreshContext();
  // Inside the change: a view transition applies it a moment later, and
  // until then the old chat is still what is on the page.
  morph(() => {
    drawChat();
    const pending = pendingAsk();
    if (pending) { pending.focus({ preventScroll: true }); reveal(logEl, pending, false, 16); } else input.focus();
  }, nav);
}

function visibleChats() {
  return [...chats.values()].filter((c) => c.log.length || c.busy || c.queued).sort(byRecent).map((c) => c.id);
}

function stepChat(delta) {
  const list = visibleChats();
  if (!list.length) return;
  const at = list.indexOf(current);
  const next = list[at < 0 ? 0 : (at + delta + list.length) % list.length];
  if (next) switchTo(next);
}

async function toggleAuto() {
  const { auto } = await command("auto", "toggle");
  info.auto = auto;
  renderInfo();
}

async function setModel(name) {
  await command("model", name);
  info.model = name;
  renderInfo();
}

async function undo() { const { message } = await command("undo"); toast(message); }

async function clearChat() {

}

async function deleteChat(id = current) {
  if (!id) return;
  const row = document.querySelector(`.chat[data-chat="${id}"]`);
  if (row && !calm.matches) {
    await row.animate(
      [{ height: row.offsetHeight + "px", opacity: 1 }, { height: "0px", opacity: 0, transform: "translateX(-8px)" }],
      { duration: 200, easing: "cubic-bezier(0.2, 0, 0, 1)", fill: "forwards" },
    ).finished.catch(() => {});
  }
  await command("delete", "", id);
  chats.delete(id);
  order = order.filter((x) => x !== id);
  if (current === id) { current = null; drawChat(); }
  renderChats();

// Rename a chat right where it sits in the sidebar.
function renameInSide(id, row) {
  const chat = chats.get(id);
  if (!chat || renamingChat) return;
  renamingChat = id;
  const field = el("input", "rename");
  field.value = chat.title;
  field.setAttribute("aria-label", "Chat name");
  row.textContent = "";
  row.appendChild(field);
  field.focus();
  field.select();
  let finished = false;
  const done = async (save) => {
    if (finished) return;
    finished = true;
    const value = field.value.trim();
    renamingChat = null;
    const changed = save && value && value !== chat.title;
    if (changed) {
      chat.title = value;
      if (id === current && view === "chat") { $("#title").textContent = value; document.title = `${value} · Flash`; }
    }
    renderChats();
    if (changed) await command("rename", value, id).catch(showFailure);
  };
  field.onkeydown = (e) => {
    if (e.key === "Enter") { e.preventDefault(); done(true); input.focus(); }
    if (e.key === "Escape") { e.preventDefault(); done(false); input.focus(); }
    e.stopPropagation();
  };
  field.onblur = () => done(true);
  field.onclick = (e) => e.stopPropagation();
}

function rename() {
  const chat = chats.get(current);
  if (!chat || view !== "chat" || document.body.classList.contains("empty")) return;
  const title = $("#title");
  const field = el("input");
  field.value = chat.title;
  title.textContent = "";
  title.appendChild(field);
  field.focus();
  field.select();
  let finished = false;
  const done = async (save) => {
    if (finished) return;
    finished = true;
    const value = field.value.trim();
    title.textContent = chat.title;
    if (save && value && value !== chat.title) {
      chat.title = value;
      title.textContent = value;
      renderChats();
      await command("rename", value);
    }
    input.focus();
  };
  field.onkeydown = (e) => {
    if (e.key === "Enter") { e.preventDefault(); done(true); }
    if (e.key === "Escape") { e.preventDefault(); done(false); }
    e.stopPropagation();
  };
  field.onblur = () => done(true);
}

function lastOf(type) {
  const chat = chats.get(current);
  if (!chat) return null;
  for (let i = chat.log.length - 1; i >= 0; i--) if (chat.log[i].type === type && chat.log[i].text) return chat.log[i];
  return null;
}

function retry() { const last = lastOf("user"); if (last) send(last.text); else toast("Nothing to retry"); }

function editLast(text) {
  const value = text ?? (lastOf("user") || {}).text;
  if (!value) { toast("Nothing to edit"); return; }
  input.value = value;
  autosize();
  updateSend();
  input.focus();
  input.setSelectionRange(value.length, value.length);
}

async function copy(text, what, from) {
  if (!text) { toast(`No ${what} to copy`); return; }
  try { await navigator.clipboard.writeText(text); }
  catch (_) { toast("The browser blocked the clipboard"); return; }
  // The button says it worked, so there is no toast to read as well.
  if (from) {
    const was = from.innerHTML;
    from.innerHTML = was.replace(/<svg[\s\S]*?<\/svg>/, icon("check")).replace(/Copy$/, "Copied");
    flash(from, "done", 1300);
    clearTimeout(from._restore);
    from._restore = setTimeout(() => { from.innerHTML = was; }, 1300);
  } else toast(`Copied ${what}`);
}
const copyLastReply = () => copy((lastOf("assistant") || {}).text, "reply");
function copyLastCode() {
  const found = [...((lastOf("assistant") || {}).text || "").matchAll(/```[^\n]*\n([\s\S]*?)```/g)];
  copy(found.length ? found[found.length - 1][1].replace(/\n$/, "") : "", "code block");
}

function toggleAllTools() {
  allOpen = !allOpen;
  messagesEl.querySelectorAll(".tool").forEach((card) => card.classList.toggle("open", allOpen));
}

// "light", "dark", or "system", which follows the computer.
const lightQuery = matchMedia("(prefers-color-scheme: light)");
let themeChoice = pref("theme", "system");
const resolveTheme = (choice) => (choice === "system" ? (lightQuery.matches ? "light" : "dark") : choice);

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#faf9f5" : "#262624";
}

function setTheme(choice) {
  themeChoice = choice;
  savePref("theme", choice);
  markThemeCards();
  const next = resolveTheme(choice);
  if (next !== document.documentElement.dataset.theme) wipeTheme(next);
}

function toggleTheme() {
  setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");
}

lightQuery.addEventListener("change", () => {
  if (themeChoice === "system") wipeTheme(resolveTheme("system"));
});

// The new theme sweeps across from the top-left corner. The circle
// itself is CSS (theme-sweep); this only marks the switch and runs it.
function wipeTheme(next) {
  const change = () => applyTheme(next);
  if (!document.startViewTransition || calm.matches || document.hidden) { change(); return; }
  const root = document.documentElement;
  root.classList.add("theme-switch");
  const transition = document.startViewTransition(change);
  transition.ready.catch(() => {});
  const done = () => root.classList.remove("theme-switch");
  transition.finished.then(done, done);
}

function closeSide() { document.body.classList.add("side-closed"); }
function toggleSide() {
  const closed = document.body.classList.toggle("side-closed");
  if (innerWidth > 800) savePref("side", closed ? "closed" : "open");
}

function focusAsk() { const card = pendingAsk(); if (card) { card.focus({ preventScroll: true }); reveal(logEl, card, true, 16); } }
async function answer(id, value) { buzz(value === "y" ? 10 : 6); await api("/api/answer", { id, answer: value }).catch(showFailure); input.focus(); }
function answerPending(value) { const card = pendingAsk(); if (!card) return false; answer(card.dataset.ask, value); return true; }

const blocks = () => [...messagesEl.querySelectorAll(".block")].filter((n) => !n.closest(".streaming"));
function focusBlock(index) {
  const all = blocks();
  if (!all.length) return;
  focusedIndex = Math.max(0, Math.min(all.length - 1, index));
  all.forEach((n) => n.classList.remove("focused"));
  all[focusedIndex].classList.add("focused");
  reveal(logEl, all[focusedIndex], false, 16);
}
const focusedBlock = () => (focusedIndex >= 0 ? blocks()[focusedIndex] : null);

// Menus: the model picker and the slash list ------------------------------

let menuEl = null;
let menuRows = [];
let menuSel = 0;
let menuPick = null;

function closeMenu() {
  if (!menuEl) return;
  const leaving = menuEl;
  menuEl = null;
  leave(leaving, "closing", () => leaving.remove(), 120);
}

function openMenu(anchor, rows, pick, emptyText, alignLeft) {
  closeMenu();
  menuRows = rows;
  menuPick = pick;
  menuSel = rows.findIndex((r) => r.current && !r.header);
  if (menuSel < 0) menuSel = rows.findIndex((r) => !r.header);
  menuEl = el("div", "menu");
  menuEl.setAttribute("role", "listbox");
  // Built once. Moving the selection only moves the highlight, and a
  // move from the keyboard scrolls the list to keep it in sight; the
  // mouse is already pointing at the row it picked.
  const items = [];
  const mark = (scroll) => {
    items.forEach((item, i) => { if (item) item.classList.toggle("sel", i === menuSel); });
    const sel = items[menuSel];
    if (scroll && sel) reveal(menuEl, sel, false, 4);
  };
  const draw = () => {
    if (!rows.length) menuEl.appendChild(el("div", "empty")).textContent = emptyText;
    rows.forEach((row, i) => {
      if (row.header) {
        if (row.rule) menuEl.appendChild(el("hr"));
        menuEl.appendChild(el("div", "head-row", row.html));
        return;
      }
      const item = el("button", "item" + (row.cls ? " " + row.cls : "") + (i === menuSel ? " sel" : ""));
      items[i] = item;
      item.type = "button";
      item.innerHTML = row.html + (row.current ? `<span class="check">${icon("check")}</span>` : "");
      item.onmousemove = () => { if (menuSel !== i) { menuSel = i; mark(false); } };
      item.onmousedown = (e) => e.preventDefault();
      item.onclick = (e) => {
        const remove = e.target.closest("[data-remove]");
        if (remove) { e.stopPropagation(); removeHost(remove.dataset.remove); return; }
        closeMenu();
        pick(row);
      };
      menuEl.appendChild(item);
    });
  };
  menuEl.redraw = () => mark(true);
  draw();
  document.body.appendChild(menuEl);
  // Above the anchor if it fits there, else below if it fits there, else
  // on the roomier side, cut to fit: never past the edge of the window.
  const r = anchor.getBoundingClientRect();
  const above = r.top - 16, below = innerHeight - r.bottom - 16;
  const natural = menuEl.offsetHeight;
  const up = natural <= above || (natural > below && above > below);
  menuEl.style.maxHeight = Math.max(120, Math.min(natural, up ? above : below)) + "px";
  const w = menuEl.offsetWidth, h = menuEl.offsetHeight;
  const left = alignLeft ? r.left : r.right - w;
  menuEl.style.left = Math.max(8, Math.min(innerWidth - w - 8, left)) + "px";
  menuEl.style.top = Math.max(8, up ? r.top - h - 8 : r.bottom + 8) + "px";
  mark(true);
}

async function openModels(focusHosts = false) {
  slashOpen = false;
  const [modelResult] = await Promise.all([command("model").catch(() => ({ models: [] }))]);
  models = modelResult.models || [];
  drawModelMenu(focusHosts);
  // Checking every host takes as long as the slowest; the menu is up
  // before that, and the dots fill in when it answers.
  const result = await command("hosts").catch(() => null);
  if (result && menuEl && !slashOpen) { hosts = result.hosts; drawModelMenu(focusHosts, true); }
}

function drawModelMenu(focusHosts, keepSelection) {
  const active = normalHost(info.host);
  const shown = hosts.length ? hosts : [{ name: "This computer", url: "http://localhost:11434" }];
  if (!shown.some((h) => h.url === active)) shown.push({ name: info.host_name || "Current", url: active });
  const rows = [{ header: true, html: "Host" }];
  for (const h of shown) {
    const health = h.up === undefined ? "" : h.up ? " up" : " down";
    const removable = h.url !== "http://localhost:11434";
    rows.push({
      html: `<span class="health${health}"></span><span class="stack"><span class="label">${esc(h.name)}</span><span class="sub">${esc(h.url.replace(/^https?:\/\//, ""))}</span></span>` +
        (removable ? `<span class="remove" data-remove="${esc(h.url)}" data-tip="Remove host">${icon("x")}</span>` : ""),
      host: h.url, current: h.url === active,
    });
  }
  rows.push({ html: `${icon("plus")}<span class="label">Add host…</span>`, add: true, cls: "add" });
  rows.push({ header: true, html: "Model", rule: true });
  for (const m of models) rows.push({ html: `<span class="label">${esc(m)}</span>`, value: m, current: m === info.model });
  if (!models.length) rows.push({ header: true, html: '<span style="font-weight:400">No models on this host</span>' });
  const previous = keepSelection && menuEl ? menuSel : null;
  openMenu($("#model-btn"), rows, pickModelRow, "");
  if (previous !== null) { menuSel = previous; menuEl.redraw(); }
  else if (focusHosts) { menuSel = rows.findIndex((r) => r.host && r.current); menuEl.redraw(); }
  else { const at = rows.findIndex((r) => r.value && r.current); if (at >= 0) { menuSel = at; menuEl.redraw(); } }
}

function normalHost(url) {
  url = String(url || "").replace(/\/+$/, "");
  if (!/^https?:\/\//.test(url)) url = "http://" + url;
  return /:\d+$/.test(url.replace(/^https?:\/\//, "")) ? url : url + ":11434";
}

async function pickModelRow(row) {
  if (row.add) { hostForm(); return; }
  if (row.host) { if (!row.current) await switchHost(row.host, true); else openModels(true); return; }
  if (row.value) { setModel(row.value); input.focus(); }
}

async function switchHost(url, reopen) {
  try {
    const result = await command("host", url);
    info.host = result.host;
    const known = hosts.find((h) => h.url === result.host);
    info.host_name = known ? known.name : result.host;
    models = result.models || [];
    renderInfo();
    toast(result.up ? `Switched to ${info.host_name}` : `${info.host_name} is not answering`);
    if (reopen) openModels(true);
  } catch (error) { showFailure(error); }
}

async function removeHost(url) {
  await command("host-remove", url).catch(showFailure);
  hosts = hosts.filter((h) => h.url !== url);
  drawModelMenu(true);
}

  { label: "Switch host", keys: "Alt H", slash: "/host", run: () => openModels(true) },

  { label: "Search chats", keys: "Alt F", slash: "/search", run: () => openSearch() },
  { label: "Show or hide the file panel", keys: "Alt V", slash: "/file", run: toggleViewer },
  { label: "New project", keys: "", slash: "/project", run: () => projectForm() },

  { label: "Show or hide the sidebar", keys: "Ctrl B", slash: "/sidebar", run: toggleSide },
  { label: "Light or dark", keys: "Alt T", slash: "/theme", run: toggleTheme },
  { label: "Open on your phone", keys: "", slash: "/phone", run: () => openPhone() },
  { label: "Keyboard shortcuts", keys: "?", slash: "/help", run: () => openHelp() },
];

function runSlash(text) {
  const [word, ...rest] = text.split(/\s+/);
  const arg = rest.join(" ").trim();
  if (word === "/model" && arg) { setModel(arg); clearInput(); return true; }
  if (word === "/rename" && arg) { const c = chats.get(current); if (c) { c.title = arg; renderChats(); $("#title").textContent = arg; } command("rename", arg); clearInput(); return true; }
  const action = ACTIONS.find((a) => a.slash === word);
  if (!action) return false;
  clearInput();
  action.run();
  return true;
}
function clearInput() { input.value = ""; autosize(); closeMenu(); slashOpen = false; updateSend(); }

let slashOpen = false;
function showSlash() {
  const value = input.value;
  if (!value.startsWith("/") || /\s/.test(value)) { if (slashOpen) closeMenu(); slashOpen = false; return; }
  const rows = ACTIONS.filter((a) => a.slash.startsWith(value)).map((a) => ({
    html: `<span class="slash">${esc(a.slash)}</span><span class="desc">${esc(a.label)}</span>`, action: a,
  }));
  if (!rows.length) { closeMenu(); slashOpen = false; return; }
  openMenu($("#composer"), rows, (row) => { clearInput(); row.action.run(); }, "", true);
  slashOpen = true;
}

// Search --------------------------------------------------------------------

const searchBox = $("#search");
const searchInput = $("#search-input");
let searchRows = [];
let searchSel = 0;
let searchAsked = 0;
let searchTimer = null;
let jumpTo = null;   // { chat, index, terms }: where a picked result leads

const termsOf = (query) => query.toLowerCase().split(/\s+/).filter(Boolean);

// TEXT escaped, with every term in it marked.
function markTerms(text, terms) {
  if (!terms.length) return esc(text);
  const pattern = new RegExp(terms.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "gi");
  let out = "", last = 0;
  for (const m of String(text).matchAll(pattern)) {
    out += esc(text.slice(last, m.index)) + `<mark>${esc(m[0])}</mark>`;
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

function openSearch(prefill = "") {
  closeMenu();
  if (isOpen(palette)) hideOverlay(palette);
  showOverlay(searchBox);
  searchInput.value = prefill;
  searchSel = 0;
  runSearch(true);
  searchInput.focus();
  searchInput.select();
}
function closeSearch() { hideOverlay(searchBox); input.focus(); }

// Asked as you type, a beat after the last key; an answer that comes back
// after a newer question was asked is dropped.
function runSearch(now) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const asked = ++searchAsked;
    const query = searchInput.value.trim();
    const { results } = await api("/api/search?q=" + encodeURIComponent(query)).catch(() => ({ results: [] }));
    if (asked !== searchAsked) return;
    searchRows = results;
    searchSel = Math.min(searchSel, Math.max(0, results.length - 1));
    drawSearch(termsOf(query));
  }, now ? 0 : 110);
}

function drawSearch(terms) {
  const list = $("#search-list");
  list.textContent = "";
  if (!searchRows.length) {
    list.appendChild(el("div", "search-empty", terms.length ? "No chats mention that." : "No chats yet."));
    return;
  }
  searchRows.forEach((r, i) => {
    const hit = r.hits[0];
    const p = projectOf(r.project);
    const who = hit ? (hit.type === "user" ? "You" : "Flash") : "";
    const row = el("div", "row result" + (i === searchSel ? " sel" : ""));
    row.setAttribute("role", "option");
    row.innerHTML = `<div class="stack"><span class="title">${markTerms(r.title, terms)}</span>` +
      (hit ? `<span class="snippet"><span class="who">${who}:</span> ${markTerms(hit.snippet, terms)}</span>` : "") +
      (r.matches > 1 ? `<span class="more">${r.matches} messages match</span>` : "") +
      `</div><span class="when">${p ? esc(p.name) + " · " : ""}${ago(r.updated)}</span>`;
    row.onmousemove = () => { if (searchSel !== i) { searchSel = i; markSearch(false); } };
    row.onclick = () => openResult(i);
    list.appendChild(row);
  });
  markSearch(true);
}

function markSearch(scroll) {
  const rows = [...$("#search-list").querySelectorAll(".result")];
  rows.forEach((row, i) => row.classList.toggle("sel", i === searchSel));
  if (scroll && rows[searchSel]) reveal($("#search-list"), rows[searchSel], false, 4);
}

function openResult(i) {
  const r = searchRows[i];
  if (!r) return;
  const terms = termsOf(searchInput.value);
  closeSearch();
  if (!chats.has(r.chat)) { refreshLite(); toast("That chat is still loading. Try again in a moment."); return; }
  jumpTo = r.hits[0] ? { chat: r.chat, index: r.hits[0].index, terms } : null;
  if (r.chat === current && view === "chat") { drawChat(); return; }
  switchTo(r.chat);
}

// Scroll to the message a search found, glow it, and mark its words.
function showFound({ index, terms }) {
  const block = messagesEl.querySelector(`[data-log="${index}"]`);
  if (!block) { follow = true; toBottom(true); return; }
  follow = false;
  const top = block.getBoundingClientRect().top - logEl.getBoundingClientRect().top + logEl.scrollTop;
  logEl.scrollTo({ top: Math.max(0, top - logEl.clientHeight / 3), behavior: calm.matches ? "auto" : "smooth" });
  flash(block, "found", 2300);
  markFound(block, terms);
}

function markFound(block, terms) {
  if (!window.CSS || !CSS.highlights || typeof Highlight === "undefined" || !terms.length) return;
  const ranges = [];
  const walk = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
  while (walk.nextNode()) {
    const node = walk.currentNode;
    const low = node.nodeValue.toLowerCase();
    for (const term of terms) {
      for (let at = low.indexOf(term); at !== -1; at = low.indexOf(term, at + term.length)) {
        const range = new Range();
        range.setStart(node, at);
        range.setEnd(node, at + term.length);
        ranges.push(range);
      }
    }
  }
  CSS.highlights.set("found", new Highlight(...ranges));
  clearTimeout(markFound.timer);
  markFound.timer = setTimeout(() => CSS.highlights.delete("found"), 6000);
}

searchInput.addEventListener("input", () => { searchSel = 0; runSearch(false); });
searchInput.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" || (e.key === "Tab" && !e.shiftKey)) { e.preventDefault(); searchSel = Math.min(searchSel + 1, searchRows.length - 1); markSearch(true); }
  else if (e.key === "ArrowUp" || (e.key === "Tab" && e.shiftKey)) { e.preventDefault(); searchSel = Math.max(searchSel - 1, 0); markSearch(true); }
  else if (e.key === "Enter") { e.preventDefault(); openResult(searchSel); }
  else if (e.key === "Escape") { e.preventDefault(); closeSearch(); }
  e.stopPropagation();
});
searchBox.addEventListener("mousedown", (e) => { if (e.target === searchBox) closeSearch(); });

// Palette -------------------------------------------------------------------

const palette = $("#palette");
const paletteInput = $("#palette-input");
let paletteRows = [];
let paletteSel = 0;

// Every typed character in order, earlier and closer scoring better.
// Spaces only separate words: "onyx 31" finds flash-onyx-2.6:31b.
function fuzzy(query, text) {
  const q = query.toLowerCase().replace(/\s+/g, ""), t = text.toLowerCase();
  if (!q) return { score: 0, marks: [] };
  let at = 0, score = 0, last = -1;
  const marks = [];
  for (const ch of q) {
    const found = t.indexOf(ch, at);
    if (found < 0) return null;
    score += found - last - 1 + (found === 0 || /[\s\-:./]/.test(t[found - 1]) ? -2 : 0);
    marks.push(found);
    last = found;
    at = found + 1;
  }
  return { score, marks };
}
const highlight = (text, marks) => [...text].map((ch, i) => (marks.includes(i) ? `<mark>${esc(ch)}</mark>` : esc(ch))).join("");

function paletteItems(query) {
  const rows = [];
  for (const a of ACTIONS) rows.push({ group: "Action", label: a.label, keys: a.keys, run: a.run });
  for (const id of visibleChats()) {
    const c = chats.get(id);
    if (id !== current) rows.push({ group: "Chat", label: c.title, run: () => switchTo(id) });
  }
  for (const p of projects) rows.push({ group: "Project", label: p.name, keys: "", run: () => openProject(p.id) });
  for (const m of models) rows.push({ group: "Model", label: m, keys: "", run: () => setModel(m) });
  for (const h of hosts) rows.push({ group: "Host", label: h.name, keys: "", run: () => switchHost(h.url, false) });
  const ranked = rows.map((r) => ({ ...r, match: fuzzy(query, r.label) })).filter((r) => r.match).sort((a, b) => a.match.score - b.match.score);
  // Typed something: the first row offers to look for it inside chats.
  if (query.trim().length > 1) {
    ranked.unshift({ group: "Search", label: `Search chats for “${query.trim()}”`, keys: "", match: { marks: [] }, run: () => openSearch(query.trim()) });
  }
  return ranked;
}

function drawPalette() {
  paletteRows = paletteItems(paletteInput.value);
  paletteSel = Math.min(paletteSel, Math.max(0, paletteRows.length - 1));
  const listEl = $("#palette-list");
  listEl.textContent = "";
  paletteRows.slice(0, 60).forEach((row, i) => {
    const node = el("div", "row" + (i === paletteSel ? " sel" : ""));
    node.setAttribute("role", "option");
    node.innerHTML = `<span class="group">${row.group}</span><span class="label">${highlight(row.label, row.match.marks)}</span>` +
      (row.keys ? `<span class="keys">${row.keys.split(" ").map((k) => `<kbd>${esc(k)}</kbd>`).join("")}</span>` : "");
    node.onmousemove = () => { if (paletteSel !== i) { paletteSel = i; markPalette(); } };
    node.onclick = () => runPalette(i);
    listEl.appendChild(node);
  });
  if (!paletteRows.length) listEl.appendChild(el("div", "row", '<span class="label" style="color:var(--text-3)">Nothing matches</span>'));
}
function markPalette() {
  [...$("#palette-list").children].forEach((n, i) => n.classList.toggle("sel", i === paletteSel));
  const sel = $("#palette-list").children[paletteSel];
  if (sel) reveal($("#palette-list"), sel, false, 4);
}
async function openPalette() {
  closeMenu();
  showOverlay(palette);
  paletteInput.value = "";
  paletteSel = 0;
  drawPalette();
  paletteInput.focus();
  const result = await command("model").catch(() => null);
  if (result) { models = result.models || []; if (!palette.hidden) drawPalette(); }
  const listed = await command("hosts").catch(() => null);
  if (listed) { hosts = listed.hosts; if (!palette.hidden) drawPalette(); }
}
function hideOverlay(node) {
  if (node.hidden || node.classList.contains("closing")) return;
  // Reopened while it was still leaving: the opener took the class off,
  // and the dialog stays up.
  leave(node, "closing", () => { if (node.classList.contains("closing")) { node.hidden = true; node.classList.remove("closing"); } }, 160);
}
function showOverlay(node) { node.classList.remove("closing"); node.hidden = false; }
// Open and staying open: one on its way out already counts as closed.
const isOpen = (node) => !node.hidden && !node.classList.contains("closing");
function closePalette() { hideOverlay(palette); input.focus(); }
function runPalette(i) { const row = paletteRows[i]; closePalette(); if (row) row.run(); }

paletteInput.addEventListener("input", () => { paletteSel = 0; drawPalette(); });
paletteInput.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" || (e.key === "Tab" && !e.shiftKey)) { e.preventDefault(); paletteSel = Math.min(paletteSel + 1, paletteRows.length - 1); markPalette(); }
  else if (e.key === "ArrowUp" || (e.key === "Tab" && e.shiftKey)) { e.preventDefault(); paletteSel = Math.max(paletteSel - 1, 0); markPalette(); }
  else if (e.key === "Enter") { e.preventDefault(); runPalette(paletteSel); }
  else if (e.key === "Escape") { e.preventDefault(); closePalette(); }
  e.stopPropagation();
});
palette.addEventListener("mousedown", (e) => { if (e.target === palette) closePalette(); });

const HELP = [

    [["↑", "↓"], "Earlier messages"], [["/"], "Commands"], [["Shift Tab"], "Autonomous mode"],
  ]],
  ["Everywhere", [
    [["Ctrl K"], "Search actions, chats, models"], [["Ctrl /"], "Shortcuts"],
    [["Alt N"], "New chat"], [["Alt ↑", "Alt ↓"], "Previous or next chat"], [["Alt 1–9"], "Go to a chat"],
    [["Alt M"], "Switch model"], [["Alt H"], "Switch host"], [["Alt P"], "Projects"], [["Alt ,"], "Settings"],
    [["Alt F"], "Search chats"], [["Alt V"], "Show or hide the file panel"],
    [["Alt R"], "Retry"], [["Alt E"], "Edit last message"],
    [["Alt C"], "Copy last reply"], [["Alt Shift C"], "Copy last code block"], [["Alt Z"], "Undo file changes"],

    [["Ctrl B"], "Sidebar"], [["Ctrl O"], "Expand tool output"], [["F2"], "Rename chat"],
  ]],

];
const kbds = (combo) => combo.split(" ").map((k) => `<kbd>${esc(k)}</kbd>`).join("");

function openHelp() {
  closeMenu();
  $("#help-body").innerHTML = `<h2>Keyboard shortcuts</h2><p class="sub">Every action is also in <kbd>Ctrl</kbd> <kbd>K</kbd>. On a Mac, ⌘ works wherever Ctrl does.</p>` +
    HELP.map(([title, rows]) => `<h3>${title}</h3><div class="keys-grid">` +
      rows.map(([keys, d]) => `<div><span>${esc(d)}</span><span>${keys.map(kbds).join('<span style="opacity:.6">or</span>')}</span></div>`).join("") +
      "</div>").join("");
  showOverlay($("#help"));
}
function closeHelp() { hideOverlay($("#help")); input.focus(); }
$("#help").addEventListener("mousedown", (e) => { if (e.target.id === "help") closeHelp(); });

async function openPhone() {
  closeMenu();
  const body = $("#phone-body");
  body.innerHTML = `<h2>Open on your phone</h2><p class="sub">Loading…</p>`;
  showOverlay($("#phone"));

  }
}
function closePhone() { hideOverlay($("#phone")); input.focus(); }
$("#phone").addEventListener("mousedown", (e) => { if (e.target.id === "phone") closePhone(); });

// ---------------------------------------------------------------------------
// Keys

function autosize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, innerHeight * 0.4) + "px";
  placeJump();
}

input.addEventListener("input", () => { autosize(); updateSend(); showSlash(); sentAt = -1; });

input.addEventListener("keydown", (e) => {
  if (menuEl && slashOpen) {
    if (e.key === "ArrowDown") { e.preventDefault(); menuSel = (menuSel + 1) % menuRows.length; menuEl.redraw(); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); menuSel = (menuSel - 1 + menuRows.length) % menuRows.length; menuEl.redraw(); return; }
    if (e.key === "Tab" && !e.shiftKey) { e.preventDefault(); input.value = menuRows[menuSel].action.slash + " "; closeMenu(); slashOpen = false; autosize(); return; }
    if (e.key === "Escape") { e.preventDefault(); closeMenu(); slashOpen = false; return; }
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); const row = menuRows[menuSel]; clearInput(); row.action.run(); return; }
  }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); return; }
  if (e.key === "Tab" && e.shiftKey) { e.preventDefault(); toggleAuto(); return; }
  if (e.key === "Escape") {
    if (menuEl) return;
    e.preventDefault();
    if (!stopReply() && !closeViewer()) { input.blur(); focusBlock(blocks().length - 1); }
    return;
  }
  const atStart = input.selectionStart === 0 && input.selectionEnd === 0;
  if (e.key === "ArrowUp" && !e.altKey && (atStart || !input.value) && sent.length) {
    e.preventDefault();
    if (sentAt === -1) { draft = input.value; sentAt = sent.length; }
    sentAt = Math.max(0, sentAt - 1);
    input.value = sent[sentAt];
    autosize(); updateSend();
    return;
  }
  if (e.key === "ArrowDown" && !e.altKey && sentAt !== -1 && input.selectionStart === input.value.length) {
    e.preventDefault();
    sentAt += 1;
    if (sentAt >= sent.length) { sentAt = -1; input.value = draft; } else input.value = sent[sentAt];
    autosize(); updateSend();
  }
});

$("#composer").addEventListener("submit", (e) => { e.preventDefault(); if (!stopReply()) send(input.value); });
$("#composer").addEventListener("mousedown", (e) => { if (e.target === e.currentTarget) { e.preventDefault(); input.focus(); } });
$("#new-chat").onclick = newChat;
$("#top-new").onclick = newChat;
$("#close-side").onclick = toggleSide;
$("#open-side").onclick = toggleSide;
$("#scrim").onclick = closeSide;
$("#auto-btn").onclick = toggleAuto;
$("#agents-btn").onclick = () => (menuEl ? closeMenu() : openAgents());
$("#model-btn").onclick = () => (menuEl && !slashOpen ? closeMenu() : openModels());
$("#projects-btn").onclick = showProjects;
$("#crumb").onclick = () => { const c = chats.get(current); if (c && c.project) openProject(c.project, "back"); };
$("#title").onclick = rename;
$("#keys-btn").onclick = () => openHelp();
$("#phone-btn").onclick = () => openPhone();
$("#settings-btn").onclick = () => showSettings();
$("#jump").onclick = () => toBottom(true, true);

messagesEl.addEventListener("click", (e) => {
  const copyButton = e.target.closest("[data-copy]");
  if (copyButton) { copy(copyButton.closest("pre").querySelector("code").textContent, "code", copyButton); return; }
  const head = e.target.closest(".tool > .head, .thinking > .head");
  if (head) head.parentNode.classList.toggle("open");
});

const typing = () => { const a = document.activeElement; return a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT"); };

window.addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey;
  hideTip();

  // An overlay on its way out counts as closed, so a key pressed during
  // its exit (Ctrl K straight after Esc) is not swallowed.
  const up = (node) => !node.hidden && !node.classList.contains("closing");
  if (up($("#help"))) { if (e.key === "Escape" || e.key === "?" || (mod && e.key === "/")) { e.preventDefault(); closeHelp(); } return; }
  if (up($("#phone"))) { if (e.key === "Escape") { e.preventDefault(); closePhone(); } return; }
  if (up($("#form"))) return;
  if (up(palette) || up(searchBox)) return;

  if (menuEl && !slashOpen) {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const step = e.key === "ArrowDown" ? 1 : -1;
      let at = menuSel;
      do { at += step; } while (at >= 0 && at < menuRows.length && menuRows[at].header);
      if (at >= 0 && at < menuRows.length) { menuSel = at; menuEl.redraw(); }
      return;
    }
    if (e.key === "Enter") { e.preventDefault(); const row = menuRows[menuSel]; closeMenu(); if (row) menuPick(row); return; }
    if (e.key === "Escape") { e.preventDefault(); closeMenu(); input.focus(); return; }
  }

  if (mod && e.code === "KeyK") { e.preventDefault(); openPalette(); return; }
  if (mod && (e.key === "/" || e.code === "Slash")) { e.preventDefault(); openHelp(); return; }
  if (mod && e.code === "KeyB") { e.preventDefault(); toggleSide(); return; }
  if (mod && e.code === "KeyO") { e.preventDefault(); toggleAllTools(); return; }
  if (e.key === "F2") { e.preventDefault(); rename(); return; }

  if (e.altKey && !mod) {
    // e.code, not e.key: on a Mac, Alt turns letters into symbols.
    const k = e.code;
    if (k === "KeyC") { e.preventDefault(); e.shiftKey ? copyLastCode() : copyLastReply(); return; }
    if (k === "KeyD" && e.shiftKey) { e.preventDefault(); deleteChat(); return; }
    if (k === "KeyN" && pendingAsk()) { e.preventDefault(); answerPending("n"); return; }
    if (k === "KeyY") { e.preventDefault(); if (!answerPending("y")) toast("Nothing is waiting for an answer"); return; }
    if (/^Digit[1-9]$/.test(k)) { e.preventDefault(); const id = visibleChats()[+k.slice(5) - 1]; if (id) switchTo(id); return; }
    const act = { KeyV: toggleViewer, KeyN: newChat, KeyM: () => openModels(), KeyH: () => openModels(true), KeyP: showProjects, Comma: () => showSettings(), KeyF: () => openSearch(), KeyR: retry, KeyE: () => editLast(), KeyZ: undo, KeyL: clearChat, KeyT: toggleTheme, ArrowUp: () => stepChat(-1), ArrowDown: () => stepChat(1) }[k];
    if (act) { e.preventDefault(); act(); return; }
  }

  const ask = document.activeElement && document.activeElement.closest && document.activeElement.closest(".ask:not(.done)");
  if (ask && !mod && !e.altKey) {
    if (e.key === "y" || e.key === "Y" || e.key === "Enter") { e.preventDefault(); answer(ask.dataset.ask, "y"); return; }
    if (e.key === "n" || e.key === "N" || e.key === "Escape") { e.preventDefault(); answer(ask.dataset.ask, "n"); return; }
  }

  if (typing() || mod || e.altKey) return;

  const all = blocks();
  switch (e.key) {
    case "j": case "ArrowDown": e.preventDefault(); focusBlock(focusedIndex + 1); break;
    case "k": case "ArrowUp": e.preventDefault(); readingUp(); focusBlock(focusedIndex < 0 ? all.length - 1 : focusedIndex - 1); break;
    case "g": e.preventDefault(); readingUp(); logEl.scrollTop = 0; focusBlock(0); break;
    case "G": case "End": e.preventDefault(); toBottom(true); focusBlock(all.length - 1); break;
    case "Enter": case "o": e.preventDefault(); openFocused(); break;
    case "c": { const n = focusedBlock(); if (n) { e.preventDefault(); copy(n.dataset.raw || n.textContent, "block"); } break; }
    case "e": { const n = focusedBlock(); e.preventDefault(); editLast(n && n.classList.contains("user-wrap") ? n.dataset.raw : undefined); break; }
    case "y": if (answerPending("y")) e.preventDefault(); break;
    case "n": if (answerPending("n")) e.preventDefault(); break;
    case "?": e.preventDefault(); openHelp(); break;
    case "Escape": if (stopReply() || closeViewer()) e.preventDefault(); break;
    case "/": e.preventDefault(); input.focus(); input.value = "/"; showSlash(); updateSend(); break;
    case "i": case "a": e.preventDefault(); input.focus(); break;
    default: if (e.key.length === 1) input.focus();
  }
});

window.addEventListener("resize", () => { closeMenu(); slashOpen = false; placeJump(); });
