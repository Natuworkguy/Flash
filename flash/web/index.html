let streamNode = null;
let streamScheduled = false;

// A tip under the box while a reply is on its way. Each is up for
// TIP_MS by the clock, as in the terminal, so one turn running into the
// next keeps its tip instead of starting another.
const TIP_MS = 30000;
function drawTip() {
  const caution = $(".fine .caution"), line = $(".fine .tip");
  const tips = info.tips || [];
  const chat = chats.get(current);
  const busy = view === "chat" && chat && (chat.busy || chat.queued) && tips.length;
  caution.hidden = !!busy;
  line.hidden = !busy;
  if (!busy) { delete line.dataset.at; return; }
  const at = Math.floor(Date.now() / TIP_MS) % tips.length;
  if (line.dataset.at === String(at)) return;
  const first = line.dataset.at === undefined;
  line.dataset.at = at;
  const [what, prompt] = tips[at];
  const fill = () => {
    line.innerHTML = `<b>Tip</b> · <span></span>`;
    line.querySelector("span").textContent = what;
    if (prompt) {
      const go = el("button", "", "Try it");
      go.type = "button";
      go.onclick = () => typeIn(prompt);
      line.appendChild(go);
    }
    line.classList.remove("fading");
  };
  if (first || calm.matches) { fill(); return; }
  line.classList.add("fading");
  setTimeout(fill, 250);
}
setInterval(drawTip, 1000);

function drawStreaming() {
  drawTip();
  const chat = chats.get(current);
  const waiting = chat && (chat.busy || chat.queued) && !chat.partial && !chat.thinking && !pendingAsk();
  // Put back where it already is, the loader would start its
  // animations over on every event; left alone, it keeps going.
  if (waiting && streamNode && streamNode.classList.contains("loading") && streamNode === messagesEl.lastElementChild && (streamNode.dataset.speaker || "") === (chat.speaker || "")) return;
  if (streamNode) { streamNode.remove(); streamNode = null; }
  if (!chat || !(chat.busy || chat.queued)) return;
  streamNode = el("div", "streaming");
  const tag = chat.speaker ? speakerTag(chat.speaker) : null;
  if (tag) {
    // Bouncing while it answers, as on the Sparks page.
    tag.querySelector(".spark-av").dataset.state = "working";
    streamNode.appendChild(tag);
  }
  if (chat.thinking) streamNode.appendChild(thinkingBlock(chat.thinking, true));
  if (chat.partial) {
    const wrap = el("div", "block");
    const body = el("div", "assistant", markdown(chat.partial));
    ink(body);
    const last = body.lastElementChild;
    const tail = last && !["PRE", "DIV", "UL", "OL"].includes(last.tagName) ? last : body;
    // The reply is drawn again for every few tokens, which would restart
    // the cursor's pulse each time and freeze it. Starting each new one
    // part way through, in step with the clock, keeps it breathing.
    const cursor = el("span", "cursor");
    cursor.style.animationDelay = `-${Math.round(performance.now() % 1000)}ms`;
    tail.appendChild(cursor);
    wrap.appendChild(body);
    streamNode.appendChild(wrap);
  } else if (waiting) {
    streamNode.classList.add("loading");
    streamNode.dataset.speaker = chat.speaker || "";
    streamNode.appendChild(loaderBlock(chat));
  }
  messagesEl.appendChild(streamNode);
}

// The loader. Its word and its clock count from when the turn began,
// not from when the loader was drawn, so drawing it again (after a tool
// runs, say) picks up where it was instead of starting over.
const WORD_MS = 3200;
let words = ["Thinking"];
const busySince = new Map();
const wordOffset = new Map();

function startedWaiting(id) {
  if (!busySince.has(id)) {
    busySince.set(id, Date.now());
    wordOffset.set(id, Math.floor(Math.random() * words.length));
  }
}

function loaderBlock(chat) {
  startedWaiting(chat.id);
  const node = el("div", "block loader", `<span class="word"></span><span class="elapsed"></span>`);
  node.setAttribute("role", "status");
  node.dataset.chat = chat.id;
  node.wordAt = -1;
  tickLoader(node, true);
  return node;
}

function tickLoader(node, first) {
  const age = Date.now() - (busySince.get(node.dataset.chat) || Date.now());
  const at = Math.floor(age / WORD_MS);
  if (at !== node.wordAt) {
    node.wordAt = at;
    const box = node.querySelector(".word");
    for (const old of box.querySelectorAll("span:not(.out)")) {
      if (first || calm.matches) old.remove();
      else { old.classList.add("out"); setTimeout(() => old.remove(), 320); }
    }
    const word = el("span");
    word.textContent = `${words[((wordOffset.get(node.dataset.chat) || 0) + at) % words.length]}…`;
    box.appendChild(word);
  }
  const seconds = Math.floor(age / 1000);
  const clock = node.querySelector(".elapsed");
  clock.textContent = seconds < 60 ? `${seconds}s` : `${Math.floor(seconds / 60)}m ${seconds % 60}s`;
  clock.classList.toggle("shown", seconds >= 3);
}

setInterval(() => {
  const node = messagesEl.querySelector(".loader");
  if (node) tickLoader(node, false);
}, 250);

// KaTeX arrives after the page. A chat already drawn with math in it is
// drawn again once it can be typeset.
$("#katex").addEventListener("load", () => {
  const chat = chats.get(current);
  const hasMath = (e) => e.type === "assistant" && /\$|\\\(|\\\[/.test(e.text || "");
  if (view === "chat" && chat && chat.log.some(hasMath)) drawChat();
});

// Ink: the text a reply gained in the last moment fades in from a blur.
// The reply is drawn again for every few tokens, so each stretch keeps a
// note of when it arrived and its animation is restarted part way
// through, at its own age, rather than from the beginning each time.
const INK_MS = 420;
let inkFor = null;
let inkRuns = [];   // { t, from, to }: when the text from..to arrived
let inkSeen = 0;    // how much of the reply has arrived so far

function ink(body) {
  if (calm.matches) return;
  const now = performance.now();
  const nodes = [];
  let total = 0;
  const walk = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
  while (walk.nextNode()) { nodes.push([walk.currentNode, total]); total += walk.currentNode.nodeValue.length; }

  // Another chat, or a new reply after a tool call: start the count over.
  if (inkFor !== current || total < inkSeen) { inkRuns = []; inkSeen = 0; }
  inkFor = current;
  if (total > inkSeen) { inkRuns.push({ t: now, from: inkSeen, to: total }); inkSeen = total; }
  inkRuns = inkRuns.filter((run) => now - run.t < INK_MS);
  if (!inkRuns.length) return;

  // Last node first, and within one the latest stretch first, so every
  // split leaves the offsets still to come where they were.
  const runs = [...inkRuns].reverse();
  for (let k = nodes.length - 1; k >= 0; k--) {
    const [node, start] = nodes[k];
    const end = start + node.nodeValue.length;
    for (const run of runs) {
      const a = Math.max(run.from, start), b = Math.min(run.to, end);
      if (a >= b) continue;
      if (b - start < node.nodeValue.length) node.splitText(b - start);
      const part = node.splitText(a - start);
      const span = document.createElement("span");
      span.className = "ink";
      span.style.animationDelay = `-${Math.round(now - run.t)}ms`;
      part.parentNode.insertBefore(span, part);
      span.appendChild(part);
    }
  }
}

function scheduleStream() {
  if (streamScheduled) return;
  streamScheduled = true;
  requestAnimationFrame(() => {
    streamScheduled = false;
    drawStreaming();
    keepUp();
  });
}

// Scrolling -----------------------------------------------------------------

// Following: while on, the view keeps up with everything that arrives,
// however much arrives at once. Sending turns it on, as does coming back
// to the bottom; only scrolling up, which is someone wanting to read,
// turns it off.
let follow = true;
const nearBottom = () => logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 100;

// ---------------------------------------------------------------------------
// Voice mode. The browser records; Flash's own models, on the computer
// it runs on, turn speech into text and replies back into speech, the
// same Vosk and Piper the terminal's voice mode uses. So a round is:
// listen until you pause, send what was said, wait for the reply, read
// it aloud, and listen again. Tap the orb to cut a reply short.


function setVoice(state, hint) {
  voice.state = state;
  const panel = $("#voice");
  panel.dataset.state = state;
  const words = {
    setup: ["Getting voice ready", "Downloading the voice models, once."],
    listening: ["Listening", "Speak, then pause. Say “stop voice” to finish."],
    hearing: ["Catching that", ""],
    thinking: ["Flash is working", pendingAsk() ? "It is asking you something on screen." : "It will answer out loud."],
    speaking: ["Speaking", "Say \u201cinterrupt\u201d, or tap the orb, to cut in."],
    paused: ["Paused", "Say \u201cresume\u201d, or tap the orb."],
    asking: ["Flash is asking", "Say \u201cyes\u201d or \u201cno\u201d."],
  }[state] || [state, ""];
  panel.querySelector(".voice-state").textContent = words[0];
  panel.querySelector(".voice-hint").textContent = hint ?? words[1];
}

async function startVoice() {
  if (voice.on) return;
  if (!canRecord) { toast("Voice mode needs this page opened on this computer, or over HTTPS"); return; }
  let status;
  try { status = await command("voice-status"); } catch (error) { showFailure(error); return; }
  if (status.missing.length) { toast(status.install); return; }
  voice.on = true;
  voice.cut = false;
  document.body.classList.add("voice-on");
  $("#voice").hidden = false;
  if (!status.ready) {
    setVoice("setup");
    const why = await new Promise((resolve) => {
      voice.setup = resolve;
      command("voice-setup").then((r) => { if (r.ready) resolve(""); }).catch((error) => resolve(error.message));
    });
    voice.setup = null;
    if (why) { toast(`Voice mode could not get ready: ${why}`); endVoice(); return; }
    if (!voice.on) return;
  }
  try {
    voice.stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  } catch (_) {
    toast("Flash could not use the microphone. Allow it for this page, then try again.");
    endVoice();
    return;
  }
  if (!voice.on) { voice.stream.getTracks().forEach((t) => t.stop()); return; }
  voice.ctx = new AudioContext();
  const source = voice.ctx.createMediaStreamSource(voice.stream);
  // A script processor, not a worklet: it needs no module file, and a
  // chunk of a few thousand samples at a time is plenty for speech.
  const tap = voice.ctx.createScriptProcessor(4096, 1, 1);
  const hush = voice.ctx.createGain();
  hush.gain.value = 0;
  source.connect(tap);
  tap.connect(hush);
  hush.connect(voice.ctx.destination);
  tap.onaudioprocess = (e) => hearChunk(e.inputBuffer.getChannelData(0));
  voice.analyser = voice.ctx.createAnalyser();
  voice.analyser.fftSize = 512;
  voice.analyser.connect(voice.ctx.destination);
  drawOrb();
  voiceLoop();
}

function endVoice() {
  if (!voice.on) return;
  if (voice.state === "setup") command("voice-cancel").catch(() => {});
  voice.on = false;
  if (voice.source) { try { voice.source.stop(); } catch (_) { /* already over */ } }
  // Ended here, before the context closes, so the reading finishes and
  // takes its mark off what was being said.
  if (voice.played) voice.played();
  unmarkSpoken();
  if (voice.turn) voice.turn.finish(null);
  if (voice.tap) voice.tap();
  if (voice.setup) voice.setup("");
  if (voice.stream) voice.stream.getTracks().forEach((t) => t.stop());
  if (voice.ctx) voice.ctx.close().catch(() => {});
  Object.assign(voice, { ctx: null, stream: null, turn: null, tap: null, source: null, played: null, analyser: null, state: "" });
  $("#voice").hidden = true;
  document.body.classList.remove("voice-on");
  updateSend();
  input.focus();
}

function voiceSetupEvent(event) {
  if (!voice.on || voice.state !== "setup") return;
  if (event.done) { if (voice.setup) voice.setup(event.error || ""); return; }
  setVoice("setup", `Downloading the ${event.label}: ${event.percent}%. End voice mode to cancel.`);
}

// One turn of listening: resolves to the audio, 16 kHz 16-bit, once the
// speaker pauses, or to null if nobody spoke in time. OPTS tune it: how
// long a pause ends the turn, how long to wait for speech at all, the
// longest turn, and how loud speech has to be.
function listenOnce(opts = {}) {
  const o = { pause: VOICE_PAUSE, patience: VOICE_PATIENCE, longest: VOICE_LONGEST, loud: VOICE_LOUD, ...opts };
  if (voice.turn) voice.turn.finish(null);
  return new Promise((resolve) => {
    const turn = { o, parts: [], heard: false, quiet: 0, elapsed: 0, finish: (pcm) => { if (voice.turn === turn) voice.turn = null; resolve(pcm); } };
    voice.turn = turn;
  });
}

function hearChunk(samples) {
  let sum = 0;
  for (let i = 0; i < samples.length; i++) sum += samples[i] * samples[i];
  const rms = Math.sqrt(sum / samples.length);
  if (voice.state === "listening" || voice.state === "asking") voice.level = Math.min(1, rms * 12);
  const turn = voice.turn;
  if (!turn) return;
  // Down to Vosk's rate: each output sample the average of the input
  // samples it stands for.
  const ratio = voice.ctx.sampleRate / VOICE_RATE;
  const out = new Int16Array(Math.floor(samples.length / ratio));
  for (let i = 0; i < out.length; i++) {
    const from = Math.floor(i * ratio), to = Math.min(samples.length, Math.floor((i + 1) * ratio));
    let total = 0;
    for (let j = from; j < to; j++) total += samples[j];
    const value = total / Math.max(1, to - from);
    out[i] = Math.max(-32768, Math.min(32767, Math.round(value * 32767)));
  }
  const step = samples.length / voice.ctx.sampleRate;
  turn.elapsed += step;
  const loud = rms >= turn.o.loud;
  // Waiting for speech, only the last second or so is kept, so a long
  // wait does not become a long recording.
  if (!turn.heard && !loud) {
    turn.parts.push(out);
    if (turn.parts.length > 6) turn.parts.shift();
  } else turn.parts.push(out);
  if (loud) { turn.heard = true; turn.quiet = 0; } else turn.quiet += step;
  const spoken = turn.heard ? turn.parts.length * out.length / VOICE_RATE : 0;
  if (turn.heard && (turn.quiet >= turn.o.pause || spoken >= turn.o.longest)) {
    const pcm = new Int16Array(turn.parts.reduce((n, part) => n + part.length, 0));
    let at = 0;
    for (const part of turn.parts) { pcm.set(part, at); at += part.length; }
    turn.finish(pcm);
  } else if (!turn.heard && turn.elapsed >= turn.o.patience) turn.finish(null);
}

function base64Of(bytes) {
  let text = "";
  for (let i = 0; i < bytes.length; i += 0x8000) text += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(text);
}

// What was said, and what it asks of voice mode. SPEAKING is the line
// Flash is reading out, so its own words coming back through the
// microphone are not taken for an interruption. Null if it failed.
async function hear(pcm, speaking = "") {
  try { return await api("/api/voice/hear", { data: base64Of(new Uint8Array(pcm.buffer)), speaking }); }
  catch (error) { if (voice.on) toast(error.message); return null; }
}

// Paused: waits for "resume", or a tap on the orb, and listens for
// nothing else, so a conversation in the room is not sent to Flash.
// Resolves false if voice mode ended meanwhile.
async function pausedUntilResume() {
  setVoice("paused");
  for (;;) {
    const tapped = new Promise((resolve) => { voice.tap = () => { voice.tap = null; resolve("tap"); }; });
    const which = await Promise.race([tapped, listenOnce({ pause: 0.8, patience: Infinity, longest: 6 })]);
    if (!voice.on) return false;
    if (which === "tap") { if (voice.turn) voice.turn.finish(null); return true; }
    voice.tap = null;
    if (!which) continue;
    const heard = await hear(which);
    if (!voice.on) return false;
    if (heard && heard.exit) { endVoice(); toast("Voice mode off"); return false; }
    if (heard && heard.resume) return true;
  }
}

async function voiceLoop() {
  while (voice.on) {
    setVoice("listening");
    const pcm = await listenOnce();
    if (!voice.on) return;
    if (!pcm) { if (!(await pausedUntilResume())) return; continue; }
    setVoice("hearing");
    const heard = await hear(pcm);
    if (!voice.on) return;
    if (!heard || !heard.text || heard.alone) continue;
    if (heard.exit) { endVoice(); toast("Voice mode off"); return; }
    if (heard.pause) { if (!(await pausedUntilResume())) return; continue; }
    setVoice("thinking");
    const reply = await sendAndWait(heard.text);
    if (!voice.on) return;
    if (!reply) continue;
    const how = await readAloud(reply);
    if (how === "exit") { endVoice(); toast("Voice mode off"); return; }
    if (how === "pause" && !(await pausedUntilResume())) return;
  }
}

// Sends TEXT as any message is sent, and resolves to the reply on the
// page once the turn it starts is over, or null if there was none. A
// permission Flash asks for on the way is asked out loud, and answered
// by voice.
async function sendAndWait(text) {
  const before = current;
  const startedAt = current && chats.get(current) ? chats.get(current).log.length : 0;
  await send(text);
  const asked = new Set();
  for (;;) {
    await new Promise((r) => setTimeout(r, 250));
    if (!voice.on) return null;
    const card = pendingAsk();
    if (card && !asked.has(card)) {
      asked.add(card);
      await askAloud(card);
      if (!voice.on) return null;
      setVoice("thinking");
      continue;
    }
    const chat = chats.get(current);
    if (!chat) continue;
    const from = current === before ? startedAt : 0;
    if (chat.busy || chat.queued || chat.log.length <= from) continue;
    const replies = chat.log.slice(from).filter((e) => e.type === "assistant" && e.text && e.text.trim());
    if (!replies.length) return null;
    const said = replies[replies.length - 1].text;
    const shown = [...messagesEl.querySelectorAll("[data-reply]")].reverse().find((n) => n.dataset.raw === said);
    return shown || null;
  }
}

// Reads a permission question out and waits for a spoken yes or no. After
// a few tries without one, it is left on screen to answer by hand.
const YES = /^(yes|yeah|yep|yup|sure|ok|okay|allow|allowed|go ahead|do it|approve)\b/;
const NO = /^(no|nope|nah|deny|denied|don't|do not|stop|cancel|reject)\b/;
async function askAloud(card) {
  setVoice("asking");
  const question = (card.querySelector(".q") || card).textContent.trim();
  // What it wants to run or change, so it can be judged by ear; a long
  // one is cut, the rest is on screen.
  const what = (card.querySelector("pre") || {}).textContent || "";
  const detail = what.trim().replace(/\s+/g, " ");
  const said = detail.length > 160 ? `${detail.slice(0, 160)}, and more on screen` : detail;
  await sayLine(`Flash asks: ${question} ${said ? `${said}.` : ""} Say yes or no.`);
  for (let tries = 0; tries < 3 && voice.on && card.isConnected && !card.classList.contains("done"); tries++) {
    setVoice("asking");
    const pcm = await listenOnce();
    if (!voice.on || !card.isConnected || card.classList.contains("done")) return;
    if (!pcm) continue;
    const heard = await hear(pcm);
    if (!voice.on) return;
    if (!heard) continue;
    if (heard.exit) { endVoice(); toast("Voice mode off"); return; }
    const said = heard.text.toLowerCase().trim();
    if (YES.test(said)) { answerPending("y"); return; }
    if (NO.test(said)) { answerPending("n"); return; }
    await sayLine("Say yes or no.");
  }
}

// A reply's sentences as they read on screen, each with the range of the
// page it covers, so the one being said can be marked where it sits.
// Code blocks and tables are shown, not read.
function sentencesOf(root) {
  const skip = "pre, table, .katex, math, svg, .actions";
  const spans = [];
  let text = "", home = null;
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: (n) => (n.parentElement.closest(skip) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT),
  });
  for (let n = walk.nextNode(); n; n = walk.nextNode()) {
    const block = n.parentElement.closest("p, li, h1, h2, h3, h4, h5, h6, blockquote, dt, dd") || root;
    if (home && block !== home) text += "\n";
    home = block;
    spans.push({ node: n, from: text.length });
    text += n.nodeValue;
  }
  const point = (offset, closing) => {
    for (let i = spans.length - 1; i >= 0; i--) {
      const s = spans[i];
      if (closing ? offset > s.from : offset >= s.from) return [s.node, Math.min(offset - s.from, s.node.nodeValue.length)];
    }
    return [spans[0].node, 0];
  };
  const out = [];
  for (const m of text.matchAll(/[^\n]+?(?:[.!?]+["')\]]*(?=\s|$)|$)/gm)) {
    const lead = m[0].length - m[0].trimStart().length;
    const body = m[0].trim();
    // A sentence of emoji, or of punctuation, has nothing to say.
    if (!/[\p{L}\p{N}]/u.test(body)) continue;
    const a = m.index + lead, b = a + body.length;
    const range = document.createRange();
    range.setStart(...point(a, false));
    range.setEnd(...point(b, true));
    out.push({ text: body.replace(/\s+/g, " "), range });
  }
  return out;
}

// Marks what is being said, and keeps it in view as the reading moves on.
function markSpoken(range) {
  if (!range || !window.CSS || !CSS.highlights) return;
  CSS.highlights.set("speaking", new Highlight(range));
  const r = range.getBoundingClientRect();
  const box = logEl.getBoundingClientRect();
  if (r.top < box.top + 64 || r.bottom > box.bottom - 24) {
    follow = false;
    logEl.scrollBy({ top: r.top - box.top - box.height * 0.3, behavior: calm.matches ? "auto" : "smooth" });
  }
}
const unmarkSpoken = () => { if (window.CSS && CSS.highlights) CSS.highlights.delete("speaking"); };

// A line of speech, made on this computer, ready to play.
function makeSpeech(line, ctx = voice.ctx) {
  return api("/api/voice/say", { text: line }).then((r) => {
    const raw = atob(r.audio);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    return ctx.decodeAudioData(bytes.buffer);
  });
}

// Reading aloud ---------------------------------------------------------------
// The play button under a reply, and under a spark's report. It reads
// in Flash's own voice, the one voice mode and the terminal speak with,
// when that is set up on this computer, and in the browser's otherwise.
// One thing is read at a time, a sentence at a time, each marked as it
// is said.


async function haveOwnVoice() {
  if (ownVoice === null) {
    try { const st = await command("voice-status", "", null); ownVoice = !st.missing.length && !!st.ready; }
    catch (_) { ownVoice = false; }
  }
  return ownVoice;
}

function markPlaying(key, on) {
  document.querySelectorAll(".read-aloud").forEach((b) => {
    if (b.dataset.key !== key) return;
    b.innerHTML = icon(on ? "halt" : "play");
    b.dataset.tip = on ? "Stop reading" : "Read aloud";
    b.setAttribute("aria-label", b.dataset.tip);
    b.classList.toggle("on", on);
  });
}

function stopReading() {
  if (reading.stop) reading.stop();
}

// A play button for what NODE() finds, known by KEY across redraws.
function readButton(key, node) {
  const b = button("icon-btn read-aloud", reading.key === key ? "halt" : "play", reading.key === key ? "Stop reading" : "Read aloud", "", () => readAloudNode(key, node()));
  b.dataset.key = key;
  b.classList.toggle("on", reading.key === key);
  return b;
}

async function readAloudNode(key, node) {
  if (reading.key === key) { stopReading(); return; }
  stopReading();
  if (voice.on) { toast("Voice mode is on, and reads replies itself"); return; }
  const parts = node ? sentencesOf(node) : [];
  if (!parts.length) { toast("There is nothing to read aloud in that"); return; }
  let stopped = false;
  let finish = () => {};
  reading.key = key;
  markPlaying(key, true);
  // Only one in the chat scrolls to keep the sentence in view: a report
  // sits in a window of its own.
  const inChat = messagesEl.contains(node);
  const mark = (range) => {
    if (!range || !node.isConnected) return;
    if (inChat) markSpoken(range);
    else if (window.CSS && CSS.highlights) CSS.highlights.set("speaking", new Highlight(range));
  };
  const done = () => {
    finish();
    unmarkSpoken();
    if (reading.key === key) { reading.key = null; reading.stop = null; }
    markPlaying(key, false);
  };
  reading.stop = () => { stopped = true; done(); };

  if (await haveOwnVoice()) {
    const ctx = new AudioContext();
    let source = null;
    finish = () => {
      try { if (source) source.stop(); } catch (_) { /* already over */ }
      ctx.close().catch(() => {});
    };
    // The next sentence is made while this one plays.
    let next = makeSpeech(parts[0].text, ctx);
    for (let i = 0; i < parts.length; i++) {
      let audio;
      try { audio = await next; } catch (error) { if (!stopped) { toast(error.message); done(); } return; }
      if (stopped) return;
      next = i + 1 < parts.length ? makeSpeech(parts[i + 1].text, ctx) : null;
      if (next) next.catch(() => {});
      mark(parts[i].range);
      await new Promise((resolve) => {
        source = ctx.createBufferSource();
        source.buffer = audio;
        source.connect(ctx.destination);
        source.onended = resolve;
        source.start();
      });
      if (stopped) return;
    }
    done();
  } else if ("speechSynthesis" in window) {
    finish = () => speechSynthesis.cancel();
    for (const part of parts) {
      mark(part.range);
      await new Promise((resolve) => {
        const said = new SpeechSynthesisUtterance(part.text);
        browserVoice(said, part.text);
        said.onend = said.onerror = resolve;
        // A browser with no voice to speak in may never say it finished.
        setTimeout(resolve, 4000 + part.text.length * 90);
        speechSynthesis.speak(said);
      });
      if (stopped) return;
    }
    done();
  } else {
    done();
    toast("This browser cannot read aloud");
  }
}

// The browser's own voice, when Flash's is not set up: its most natural
// one in the page's language, said in the chosen style as near as a
// browser goes (pace and pitch).
const BROWSER_STYLES = { warm: [0.96, 1.04], lively: [1.06, 1.12], calm: [0.88, 0.98], plain: [1, 1] };
const NATURAL = /natural|neural|online|premium|enhanced|samantha|ava|serena|google (uk|us) english/i;
const ROBOTIC = /espeak|compact|novelty|whisper|zarvox|bad news|bells|trinoids/i;
let pickedVoice;
function browserVoice(said, text) {
  if (pickedVoice === undefined) {
    const lang = (navigator.language || "en").slice(0, 2);
    const voices = speechSynthesis.getVoices().filter((v) => v.lang.startsWith(lang) && !ROBOTIC.test(v.name));
    pickedVoice = voices.find((v) => NATURAL.test(v.name)) || voices.find((v) => v.default) || voices[0] || null;
    // The list can arrive late: look again once it does.
    if (!speechSynthesis.getVoices().length) pickedVoice = undefined;
  }
  if (pickedVoice) said.voice = pickedVoice;
  const [rate, pitch] = BROWSER_STYLES[info.voice_style] || BROWSER_STYLES.warm;
  said.rate = rate * (/\?\s*$/.test(text) ? 0.97 : /!\s*$/.test(text) ? 1.04 : 1);
  said.pitch = pitch * (/\?\s*$/.test(text) ? 1.05 : 1);
}
if ("speechSynthesis" in window) speechSynthesis.addEventListener?.("voiceschanged", () => { pickedVoice = undefined; });

function playSpeech(audio) {
  return new Promise((resolve) => {
    const source = voice.ctx.createBufferSource();
    source.buffer = audio;
    source.connect(voice.analyser);
    const ended = () => {
      if (voice.source === source) voice.source = null;
      if (voice.played === ended) voice.played = null;
      resolve();
    };
    source.onended = ended;
    // For ending voice mode: a context closed while this plays never
    // says it ended, and the reading would wait on it for good.
    voice.played = ended;
    voice.source = source;
    source.start();
  });
}

async function sayLine(line) {
  try { const audio = await makeSpeech(line); if (voice.on) await playSpeech(audio); } catch (error) { if (voice.on) toast(error.message); }
}

// Stops the reading for REASON: "tap", "interrupt", "pause" or "exit".
function cutReading(reason) {
  voice.cut = reason;
  if (voice.source) { try { voice.source.stop(); } catch (_) { /* already over */ } }
}

// While a reply is read out, keeps an ear open for the interrupt word,
// "pause", or "stop voice". Only a louder sound counts as speech here, so
// the reply itself, softened by the browser's echo cancelling, does not.
function listenForInterruptions(line) {
  let stopped = false;
  (async () => {
    while (!stopped && voice.on && voice.state === "speaking") {
      const pcm = await listenOnce({ pause: 0.6, patience: Infinity, longest: 5, loud: VOICE_LOUD * 2.5 });
      if (stopped || !pcm || !voice.on) return;
      const heard = await hear(pcm, line());
      if (stopped || !heard) continue;
      if (heard.exit) { cutReading("exit"); return; }
      if (heard.pause) { cutReading("pause"); return; }
      if (heard.interrupt) { cutReading("interrupt"); return; }
    }
  })();
  return () => { stopped = true; if (voice.turn) voice.turn.finish(null); };
}

// Reads a whole reply aloud, a sentence at a time: the next one is made
// while this one plays, so the gaps stay short. Resolves to how it ended:
// "done", or what cut it short.
async function readAloud(node) {
  const parts = sentencesOf(node.querySelector(".assistant") || node);
  if (!parts.length) parts.push({ text: "That reply is code. It is on screen.", range: null });
  setVoice("speaking");
  voice.cut = false;
  let now = "";
  const stopListening = listenForInterruptions(() => now);
  let next = makeSpeech(parts[0].text);
  try {
    for (let i = 0; i < parts.length; i++) {
      let audio;
      try { audio = await next; } catch (error) { if (voice.on) toast(error.message); return "done"; }
      if (i + 1 < parts.length) next = makeSpeech(parts[i + 1].text);
      if (!voice.on) return "exit";
      if (voice.cut) return voice.cut;
      now = parts[i].text;
      markSpoken(parts[i].range);
      await playSpeech(audio);
      if (!voice.on) return "exit";
      if (voice.cut) return voice.cut;
    }
    return "done";
  } finally {
    stopListening();
    next.catch(() => {});
    unmarkSpoken();
  }
}

// The orb: what the microphone hears while listening, what Flash says
// while speaking.
function drawOrb() {
  if (!voice.on) return;
  const orb = $("#voice .voice-orb");
  let level = 0;
  if (voice.state === "listening") level = voice.level;
  else if (voice.state === "speaking" && voice.analyser) {
    const data = new Uint8Array(voice.analyser.fftSize);
    voice.analyser.getByteTimeDomainData(data);
    let sum = 0;
    for (const v of data) sum += ((v - 128) / 128) ** 2;
    level = Math.min(1, Math.sqrt(sum / data.length) * 4);
  }
  voice.shown = (voice.shown || 0) * 0.7 + level * 0.3;
  orb.style.setProperty("--lvl", voice.shown.toFixed(3));
  requestAnimationFrame(drawOrb);
}

$("#voice .voice-orb").onclick = () => {
  if (voice.state === "speaking") cutReading("tap");
  else if (voice.state === "paused" && voice.tap) voice.tap();
  else if (voice.state === "listening" && voice.turn && voice.turn.heard) voice.turn.quiet = VOICE_PAUSE;
};
$("#voice .voice-end").innerHTML = icon("x");
$("#voice .voice-end").onclick = endVoice;

function toBottom(force, smooth) {
  if (!force && !follow) return;
  follow = true;
  logEl.scrollTo({ top: logEl.scrollHeight, behavior: smooth && !calm.matches ? "smooth" : "auto" });
  $("#jump").hidden = true;
}

// After anything new lands: keep up, or offer the way down.
function keepUp() {
  if (follow) { toBottom(); return; }
  if (!document.body.classList.contains("empty") && view === "chat") { placeJump(); $("#jump").hidden = false; }
}

function readingUp() { follow = false; }

// Cards lean toward the pointer, a few degrees, as if under a hand.
const TILTS = ".card, .tile, .theme-card .preview";
(() => {
  if (!matchMedia("(hover: hover) and (pointer: fine)").matches || calm.matches) return;
  let card = null;
  const settle = () => { if (card) { card.classList.remove("tilting"); card.style.transform = ""; card = null; } };
  document.addEventListener("pointermove", (e) => {
    const over = e.target.closest && e.target.closest(TILTS);
    if (over !== card) settle();
    if (!over) return;
    card = over;
    const r = over.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - 0.5, py = (e.clientY - r.top) / r.height - 0.5;
    over.classList.add("tilting");
    over.style.transform = `perspective(700px) rotateX(${(-py * 7).toFixed(2)}deg) rotateY(${(px * 7).toFixed(2)}deg) translateY(-2px)`;
  }, { passive: true });
  document.documentElement.addEventListener("mouseleave", settle);
})();

// The pointer, for the light that follows it: each lit thing near it
// is told where it is, relative to itself. Once a frame at most, again
// when the chat scrolls under a still pointer, and only for a mouse: a
// finger has nothing to hover.
const LIT = "#composer, .suggestion, .tool, .attachment, .card, .tile, .usage-card, .setting-row, .assistant pre, .user, .browser-list, .ask";
(() => {
  if (!matchMedia("(hover: hover) and (pointer: fine)").matches) return;
  const REACH = 260;
  let x = -9999, y = -9999, queued = false, lit = new Set();
  const place = () => {
    queued = false;
    // Every rectangle first, then every write, so the page is laid out
    // once a frame rather than once a node.
    const near = [];
    for (const node of document.querySelectorAll(LIT)) {
      const r = node.getBoundingClientRect();
      if (x > r.left - REACH && x < r.right + REACH && y > r.top - REACH && y < r.bottom + REACH) near.push([node, x - r.left, y - r.top]);
    }
    const now = new Set(near.map(([node]) => node));
    for (const node of lit) if (!now.has(node)) { node.style.removeProperty("--x"); node.style.removeProperty("--y"); }
    for (const [node, lx, ly] of near) { node.style.setProperty("--x", lx + "px"); node.style.setProperty("--y", ly + "px"); }
    lit = now;
  };
  const again = () => { if (!queued) { queued = true; requestAnimationFrame(place); } };
  document.addEventListener("pointermove", (e) => { if (e.pointerType === "mouse") { x = e.clientX; y = e.clientY; again(); } }, { passive: true });
  document.documentElement.addEventListener("mouseleave", () => { x = y = -9999; again(); });
  logEl.addEventListener("scroll", again, { passive: true });
})();
logEl.addEventListener("wheel", (e) => { if (e.deltaY < 0) readingUp(); }, { passive: true });
// A press on the log itself, not on anything in it, is its scrollbar.
logEl.addEventListener("mousedown", (e) => { if (e.target === logEl) readingUp(); });
window.addEventListener("keydown", (e) => { if (e.key === "PageUp" || (e.key === "Home" && !typing())) readingUp(); }, true);
let touchY = null;
logEl.addEventListener("touchstart", (e) => { touchY = e.touches[0].clientY; }, { passive: true });
logEl.addEventListener("touchmove", (e) => { if (touchY !== null && e.touches[0].clientY > touchY + 4) readingUp(); }, { passive: true });
function placeJump() { $("#jump").style.bottom = ($("#dock").offsetHeight + 12) + "px"; }
logEl.addEventListener("scroll", () => {
  if (nearBottom()) { follow = true; $("#jump").hidden = true; }
});

// ---------------------------------------------------------------------------
// Events from Flash

function apply(event) {
  if (event.seq && event.seq <= lastSeq) return;
  if (event.seq) lastSeq = event.seq;
  if (event.type === "chats" || event.type === "status" || event.type === "projects") { refreshLite(); return; }
  if (event.type === "update") { info.update = event.update; onUpdate(); return; }
  if (event.type === "voice-setup") { voiceSetupEvent(event); return; }
  if (event.type === "voice-model") { voiceModelEvent(event); return; }
  if (event.type === "sparks") { sparksChanged(); return; }
  if (event.type === "browsers") { if (view === "settings" && settingsTab === "security") renderBrowsers(); return; }
  if (event.type === "notify") { notified(event); return; }

  const chat = chats.get(event.chat);
  if (!chat) { if (event.chat) refreshLite(); return; }
  const here = event.chat === current && view === "chat";

  switch (event.type) {
    case "pending": chat.pending = event.pending; if (event.chat === current) { renderPending(); updateSend(); } return;
    case "token": chat.partial += event.text; if (here) scheduleStream(); return;
    case "thinking": chat.thinking += event.text; if (here) scheduleStream(); return;
    case "speaker": chat.speaker = event.spark; if (here) drawStreaming(); return;
    case "busy":
      chat.busy = event.busy;
      if (event.busy) startedWaiting(chat.id); else busySince.delete(chat.id);
      if (event.busy) chat.queued = false;
      else { chat.partial = ""; chat.thinking = ""; chat.speaker = ""; refreshContext(); }
      renderChats();
      if (here) { drawStreaming(); updateSend(); }
      // The browser in the panel is live only while the turn runs.
      if (here && viewing && viewing.kind === "browser") openBrowser(viewing.run, viewing.at);
      break;
    case "cleared":
      chat.log = []; chat.partial = ""; chat.thinking = "";
      if (here) drawChat();
      return;
    default: {
      const entry = { ...event };
      delete entry.chat;
      chat.log.push(entry);
      // A steer joins the turn already running; any other message is
      // the start of one.
      if (event.type === "user" && !event.steer) { chat.queued = true; chat.updated = Date.now() / 1000; }
      if (event.type === "assistant") { chat.partial = ""; chat.thinking = ""; }
      if (here) {
        // The first thing in a chat turns the empty screen into a
        // conversation, and the follow-ups still have to happen after.
        if (document.body.classList.contains("empty")) { morph(() => { drawChat(); arrived(entry); }); break; }
        if (streamNode) { streamNode.remove(); streamNode = null; }
        drawCtx.index = chat.log.length - 1;
        drawEntry(entry, drawCtx);
        drawStreaming();
        updateSend();
        arrived(entry);
        if (entry.type === "browser") browserArrived(entry);
        if (entry.type === "assistant" && drawCtx.lastReply && !calm.matches) {
          const reply = drawCtx.lastReply;
          reply.classList.add("landed");
          setTimeout(() => reply.classList.remove("landed"), 1200);
        }
      } else if (event.type === "ask") {
        toast(`“${chat.title}” needs your permission`);
      }
    }
  }
  if (here) keepUp();
}

// The agent tapping the user on the shoulder, with notify_user: a toast
// here and, with the tab out of sight, the browser's own notification.
// The browser asks before it shows one, and only after a click, so the
// first one arms that question for the user's next click on the page.
function notified(event) {
  const title = event.title || "Flash";
  const text = event.text || "";
  const chat = chats.get(event.chat);
  toast(`**${title}**: ${text}`);
  const can = "Notification" in window;
  if (can && Notification.permission === "granted" && document.hidden) {
    try {
      // One per notification, however many tabs are open on Flash.
      const shown = new Notification(title, { body: text, tag: `flash-${event.seq || Date.now()}`, icon: "/static/logo-icon.svg" });
      shown.onclick = () => { window.focus(); if (chat) switchTo(chat.id); shown.close(); };
    } catch (_) { /* a browser that will not show it still has the toast */ }
  } else if (can && Notification.permission === "default" && !notified.asking) {
    notified.asking = true;
    document.addEventListener("pointerdown", () => {
      try { Notification.requestPermission(); } catch (_) { /* nothing to do */ }
    }, { once: true });
  }
  if (document.hidden) {
    // A mark on the tab, too, for a browser that shows no notification.
    if (!notified.title) notified.title = document.title;
    document.title = `🔔 ${title}`;
    document.addEventListener("visibilitychange", () => {
      if (notified.title) { document.title = notified.title; notified.title = ""; }
    }, { once: true });
  }
}

// What a live entry does beyond being drawn: a question takes the keys,
// and a file the agent sends pops out on the right.
function arrived(entry) {
  if (entry.type === "ask") focusAsk();
  // A picture shows where it is, in the chat; anything else pops out.
  if (entry.type === "file" && entry.kind !== "image") openViewer(entry);
}

let routed = false;

async function loadState() {
  loading = true;
  buffered = [];
  const state = await api("/api/state");
  chats.clear();
  for (const c of state.chats) chats.set(c.id, c);
  order = state.chats.map((c) => c.id);
  info = state.status;
  projects = state.projects || [];
  if (state.words && state.words.length) words = state.words;
  if (state.emojis) emojis = state.emojis;
  sparkList = state.sparks || [];
  showScene(state.scene);
  lastSeq = state.seq;
  if (!routed) { routed = true; routeTo(location.pathname); }
  if (current && !chats.has(current)) current = null;
  loading = false;
  renderChats();
  renderInfo();
  drawChat();
  if (info.update) onUpdate();
  for (const event of buffered) apply(event);
  buffered = [];
  refreshContext();
}

let liteTimer = null;
function refreshLite() {
  clearTimeout(liteTimer);
  liteTimer = setTimeout(async () => {
    const state = await api("/api/state?lite=1").catch(() => null);
    if (!state) return;
    info = state.status;
    projects = state.projects || [];
    sparkList = state.sparks || [];
    const ids = state.chats.map((c) => c.id);
    for (const c of state.chats) {
      const known = chats.get(c.id);
      if (known) Object.assign(known, { title: c.title, busy: c.busy, queued: c.queued, pending: c.pending || [], project: c.project, spark: c.spark, updated: c.updated });
      else chats.set(c.id, { ...c, log: [], partial: "", thinking: "" });
    }
    for (const id of [...chats.keys()]) if (!ids.includes(id)) chats.delete(id);
    order = ids;
    if (current && !chats.has(current)) { current = null; drawChat(); }
    // Not while something on the page is being edited: redrawing it
    // would throw away what is half typed.
    const editing = messagesEl.contains(document.activeElement) && /TEXTAREA|INPUT/.test(document.activeElement.tagName);
    if (!["chat", "settings", "skills", "sparks", "extensions"].includes(view) && !editing && $("#form").hidden) drawPage();
    renderChats();
    renderInfo();
    renderSparkBtn();
    const chat = chats.get(current);
    if (chat && !$("#title input")) { $("#title").textContent = chat.title; document.title = chat.title === "New chat" ? "Flash" : `${chat.title} · Flash`; }
  }, 60);
}

function connect() {
  const source = new EventSource("/api/events");
  let first = true;
  source.onopen = () => { if (!first) loadState().catch(showFailure); first = false; };
  source.onmessage = (message) => {
    const event = JSON.parse(message.data);
    if (loading) buffered.push(event); else apply(event);
  };
  source.onerror = async () => {
    if (restartingServer) return;
    // Refused rather than unreachable: Flash restarted with a new token,
    // or this browser was signed out.
    // Loading the page again shows why, instead of retrying forever.
    try { await api("/api/state?lite=1"); toast("Reconnecting to Flash…"); }
    catch (error) {
      if (error.message === "forbidden") { source.close(); location.reload(); }
      else toast("Reconnecting to Flash…");
    }
  };
}

// ---------------------------------------------------------------------------
// Chrome

let shownChats = null;
let renamingChat = null;   // a sidebar row being renamed in place

// Which projects' chats are folded away in the sidebar, per browser.
function foldedProjects() {
  try { return new Set(JSON.parse(pref("folded-projects", "[]"))); } catch (_) { return new Set(); }
}

function foldProject(id) {
  const folded = foldedProjects();
  if (folded.has(id)) folded.delete(id); else folded.add(id);
  savePref("folded-projects", JSON.stringify([...folded]));
  renderChats();
}

// Moves the current chat's highlight to its row: gliding from the last
// one, or appearing in place when there was none.
function placePill(nav) {
  let pill = nav.querySelector("#chat-pill");
  if (!pill) { pill = el("div"); pill.id = "chat-pill"; nav.prepend(pill); }
  const row = nav.querySelector(".chat.current");
  const was = pill.classList.contains("on");
  // In a folded project there is no row to show it on.
  if (!row || !row.offsetParent) { pill.classList.remove("on"); return; }
  pill.classList.toggle("still", !was || calm.matches);
  pill.style.transform = `translate(${row.offsetLeft}px, ${row.offsetTop}px)`;
  pill.style.width = `${row.offsetWidth}px`;
  pill.style.height = `${row.offsetHeight}px`;
  pill.classList.add("on");
}

// Recents folds away, and stays that way in this browser until opened.
function foldRecents(fold, instant) {
  const list = $("#chats");
  const b = $("#recents-btn");
  b.setAttribute("aria-expanded", !fold);
  b.dataset.tip = fold ? "Show recent chats" : "Hide recent chats";
  savePref("recents", fold ? "folded" : "open");
  clearTimeout(list.hiding);
  if (instant) list.style.transition = "none";
  list.classList.toggle("folded", fold);
  // Hidden once folded, so its links are out of the Tab order; shown
  // before it unfolds, so it can be seen opening.
  if (!fold) list.classList.remove("gone");
  else if (instant) list.classList.add("gone");
  else list.hiding = setTimeout(() => list.classList.add("gone"), 320);
  if (instant) { void list.offsetWidth; list.style.transition = ""; }
  setTimeout(rosterMore, instant ? 0 : 340);
}

function renderChats() {
  // Redrawing would throw away the half-typed name; it catches up after.
  if (renamingChat) return;
  const nav = $("#chats");
  // Where each row was, so a chat that moves up the list can glide there.
  const was = new Map([...nav.querySelectorAll(".chat")].map((row) => [row.dataset.chat, row.getBoundingClientRect().top]));
  [...nav.children].forEach((node) => { if (node.id !== "chat-pill") node.remove(); });
  const before = shownChats;
  shownChats = new Set();
  // Chats in a project go under it, the project with the latest chat
  // first; the rest follow under Chats.
  const groups = new Map();
  const loose = [];
  for (const id of visibleChats()) {
    const p = chats.get(id).project && projectOf(chats.get(id).project);
    if (p) { if (!groups.has(p.id)) groups.set(p.id, []); groups.get(p.id).push(id); } else loose.push(id);
  }
  const folded = foldedProjects();
  const places = [];
  for (const [pid, ids] of groups) {
    const p = projectOf(pid);
    const group = el("div", "group" + (folded.has(pid) ? " folded" : ""));
    const head = el("button", "group-head", `${icon("folder")}<span class="gname"></span><span class="gcount"></span>${icon("chevDown")}`);
    head.type = "button";
    head.querySelector(".gname").textContent = p.name;
    head.querySelector(".gcount").textContent = ids.length;
    head.setAttribute("aria-expanded", !folded.has(pid));
    head.onclick = () => foldProject(pid);
    head.ondblclick = () => openProject(pid);
    head.dataset.tip = "Double-click to open the project";
    const body = el("div", "group-body");
    group.append(head, body);
    nav.appendChild(group);
    for (const id of ids) places.push([id, body]);
  }
  if (groups.size && loose.length) nav.appendChild(el("div", "group-label", "Chats"));
  for (const id of loose) places.push([id, nav]);
  for (const [id, holder] of places) {
    const chat = chats.get(id);
    shownChats.add(id);
    const fresh = before && !before.has(id);
    const row = el("div", "chat" + (id === current ? " current" : "") + (fresh ? " fresh" : ""));
    row.dataset.chat = id;
    const open = el("a", "open", `<span class="name"></span>`);
    open.href = `/c/${id}`;
    open.draggable = false;
    open.firstChild.textContent = chat.title;
    const withSpark = sparkOf(chat.spark);
    if (withSpark) {
      const badge = sparkAvatar({ ...withSpark, unread: 0, status: "idle", waiting: false, paused: false }, 14);
      badge.title = `With ${withSpark.name}`;
      open.prepend(badge);
    }
    open.onclick = (e) => {
      // With a modifier, the browser opens the link as it would any other.
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      switchTo(id);
      if (innerWidth <= 800) closeSide();
    };
    open.ondblclick = () => renameInSide(id, row);
    row.appendChild(open);
    if (chat.busy || chat.queued) row.appendChild(el("span", "live"));
    const acts = el("span", "acts");
    acts.append(
      button("", "edit", "Rename", "", () => renameInSide(id, row)),
      button("", "x", "Delete chat", "Alt Shift D", () => deleteChat(id)),
    );
    row.appendChild(acts);
    holder.appendChild(row);
  }
  placePill(nav);
  // Folded, the label still says how many are in there.
  $("#recents-btn .count").textContent = shownChats.size || "";
  renderRoster();
  rosterMore();
  if (calm.matches) return;
  for (const row of nav.querySelectorAll(".chat")) {
    const before = was.get(row.dataset.chat);
    const shift = before === undefined ? 0 : before - row.getBoundingClientRect().top;
    if (Math.abs(shift) > 1) {
      row.animate([{ transform: `translateY(${shift}px)` }, { transform: "none" }],
        { duration: 460, easing: "cubic-bezier(0.32, 0.72, 0, 1)" });
    }
  }
}

function renderAgents() {
  const count = info.agents || 0;
  const btn = $("#agents-btn");
  btn.hidden = !count;
  $("#agents-count").textContent = `${count} agent${count === 1 ? "" : "s"} working`;
  const unread = $("#sparks-btn .count");
  if (unread) unread.textContent = info.sparks_unread || "";
}

// What this chat's sub-agents are doing: a menu over the pill.
async function openAgents() {
  const anchor = $("#agents-btn");
  const { agents } = await api("/api/agents?chat=" + encodeURIComponent(current || "")).catch(() => ({ agents: [] }));
  const rows = agents.length ? [] : [{ header: true, html: '<span style="font-weight:400">Working in another chat</span>' }];
  for (const a of agents) {
    const state = a.status === "running" ? `running · ${a.seconds}s` : a.status === "done" ? "done" : "failed";
    const detail = a.status === "running" ? (a.steps[a.steps.length - 1] || a.activity) : a.result.split("\n")[0];
    rows.push({ header: true, html: `<div class="agent-row"><div class="top"><span class="task">${esc(a.task)}</span><span class="state ${a.status}">${esc(state)}</span></div><div class="detail">${esc(detail || "")}</div></div>` });
  }
  openMenu(anchor, [{ header: true, html: "Sub-agents" }, ...rows], () => {}, "", true);
}

// A model's own name, without where it came from or which build:
// "Natuworkguy/flash-onyx-2.5:31b-cloudbase" is "flash-onyx-2.5".
const shortModel = (name) => String(name || "").split("/").pop().split(":")[0];
const tagged = (name) => { const n = String(name || ""); return n.split("/").pop().includes(":") ? n : n + ":latest"; };
const sameModel = (a, b) => !!a && !!b && tagged(a) === tagged(b);
// The whole name for the menu, its own part picked out.
function modelParts(name) {
  name = String(name || "");
  const slash = name.lastIndexOf("/") + 1;
  const colon = name.indexOf(":", slash);
  const own = colon < 0 ? name.slice(slash) : name.slice(slash, colon);
  const rest = (s) => (s ? `<span class="rest">${esc(s)}</span>` : "");
  return `<span class="label full">${rest(name.slice(0, slash))}<span class="own">${esc(own)}</span>${rest(colon < 0 ? "" : name.slice(colon))}</span>`;
}

function renderModelButtons() {
  const local = !info.host_name || info.host_name === "This computer";
  const full = info.model || "";
  const html = `<span class="name">${local ? "" : `<span class="host">${esc(info.host_name)} · </span>`}${esc(shortModel(full) || "No model")}</span>` +

function greet() {
  const hour = new Date().getHours();
  const when = hour < 5 ? "Up late" : hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
  const inProject = projectOf(viewProject);
  const withSpark = !current && sparkOf(viewSpark);
  $("#greeting").innerHTML = esc(when) + (withSpark ? `<span class="in">talking with ${esc(withSpark.name)}</span>` : inProject ? `<span class="in">in ${esc(inProject.name)}</span>` : "");
  $("#greeting").dataset.text = when;
  const name = inProject ? inProject.name : info.folder || "this project";
  const ideas = withSpark ? [
    ["What's new?", "What have you found since your last report?"],
    ["What are you working on?", "What are you working on right now, and what's next?"],
    ["Check now", "Check on your goal right now and tell me what you see."],
    ["Change your focus", "From now on, "],
  ] : [
    ["Explain the codebase", `Explain how ${name} is put together, and where I should start reading.`],
    ["Find a bug", `Find the most likely bug in ${name} and show me the fix.`],
    ["Write tests", "Write tests for the code I changed most recently."],
    ["Review my changes", "Review my uncommitted changes and point out anything risky."],
  ];
  const box = $("#suggestions");
  // Built again only when they change: rebuilding replays their entrance,
  // and the status refreshes far more often than the project does.
  const signature = ideas.map((idea) => idea[1]).join("|");
  if (box.dataset.signature === signature) return;
  box.dataset.signature = signature;
  box.textContent = "";
  ideas.forEach(([label, prompt], i) => {
    const chip = el("button", "suggestion");
    chip.type = "button";
    chip.textContent = label;
    chip.style.setProperty("--i", i);
    chip.onclick = () => typeIn(prompt);
    box.appendChild(chip);
  });
}

// What Flash has done, across the terminal and the web: how much of it
// ran on a local model, and roughly what that would cost on a hosted one
// (with the price it assumes, said).
function yoursCard(y) {
  const card = el("div", "usage-card yours");

  if (!y.turns) {
    card.innerHTML = `<div class="big">0<small>replies so far</small></div><p>Replies here and in the terminal are counted together.</p>`;
    return card;
  }
  card.innerHTML = `<div class="big"></div><p class="kept"></p><p class="note"></p>`;

  card.querySelector(".kept").textContent = `${y.private_share}% on a local model, ${fmtCount(y.private_tokens)} tokens` +

  card.querySelector(".note").textContent = `${since ? `Since ${since}, across` : "Across"} the terminal and the web UI.${y.saved >= 0.01 ? ` The estimate assumes $${y.price} per million tokens.` : ""}`;

// Types TEXT into the box quickly, the way a suggestion should land.
function typeIn(text) {
  input.focus();
  if (calm.matches) { input.value = text; autosize(); updateSend(); return; }
  cancelAnimationFrame(typeIn.frame);
  const step = Math.max(1, Math.ceil(text.length / 22));
  let at = 0;
  const tick = () => {
    at = Math.min(text.length, at + step);
    input.value = text.slice(0, at);
    autosize();
    updateSend();
    if (at < text.length) typeIn.frame = requestAnimationFrame(tick);
  };
  tick();
}

// The context bar under the composer: how much of the room this chat's
// history gets is in use. Past it, older messages are summarized.
const CONTEXT_WARN = 75, CONTEXT_FULL = 90;

function showContext(use) {
  const box = $("#context");
  if (!use || !use.used) { box.hidden = true; return; }
  const share = Math.max(0, Math.min(100, use.share || 0));
  box.hidden = false;
  box.classList.toggle("warn", share >= CONTEXT_WARN && share < CONTEXT_FULL);
  box.classList.toggle("full", share >= CONTEXT_FULL);
  // Any use at all shows a sliver, so a chat never reads as empty.
  box.querySelector(".ctx-fill").style.width = `${share ? Math.max(4, share) : 0}%`;
  box.querySelector(".ctx-pct").textContent = `${share}%`;
  const n = (x) => Number(x || 0).toLocaleString();
  const room = use.window ? ` · ${Math.round(use.window / 1024)}K window` : "";
  box.dataset.tip = `Context: ${n(use.used)} of ${n(use.budget)} tokens${room}` +
    (share >= CONTEXT_FULL ? ". Older messages get summarized soon." : "");
  box.setAttribute("aria-valuenow", share);
}

async function refreshContext() {
  const chat = chats.get(current);
  if (!chat || !chat.log.length) { showContext(null); return; }
  try {
    showContext(await command("context"));
  } catch (_) { /* the chat went away */ }
}

function updateSend() {
  const chat = chats.get(current);
  const busy = chat && (chat.busy || chat.queued);
  const typed = !!input.value.trim() || attached.length > 0;
  // Working with nothing typed: Stop. Working with something typed: it
  // steers. Otherwise: send.
  // Idle with nothing typed, where a browser can record: voice mode.
  const state = busy ? (typed ? "steer" : "stop") : (typed || !canRecord ? "up" : "voice");
  const send = $("#send");
  send.classList.toggle("stop", state === "stop");
  document.body.classList.toggle("working", !!busy && view === "chat");
  // Swapped only when it changes, so the icon's entrance plays once per
  // change rather than on every keystroke.
  if (send.dataset.state !== state) {
    send.dataset.state = state;
    send.innerHTML = icon(state);
  }
  const tip = { stop: ["Stop", "Esc"], steer: ["Steer: Flash reads it at its next step. Ctrl Enter runs it after instead", "Enter"], up: ["Send", "Enter"], voice: ["Voice mode: talk with Flash", ""] }[state];
  send.dataset.tip = tip[0];
  send.dataset.keys = tip[1];
  send.setAttribute("aria-label", { stop: "Stop", steer: "Steer", voice: "Voice mode" }[state] || "Send");
  send.disabled = (state === "up" && !typed) || (typed && uploading());
  const withSpark = sparkOf(chat ? chat.spark : viewSpark);
  const who = withSpark ? withSpark.name : "Flash";
  const face = $("#spark-btn .spark-av");
  if (face) face.dataset.state = busy ? "working" : "idle";
  if (busy && view === "chat") input.placeholder = `Steer ${who}, or Ctrl Enter to queue`;
  else if (input.placeholder.startsWith("Steer")) input.placeholder = `Reply to ${who}`;
}

// A notice grows out of a small capsule, springs to its width, and
// shrinks back into it, the way the Dynamic Island shows an alert.
function toast(text) {
  const t = $("#toast");
  clearTimeout(toast.timer);
  t.getAnimations().forEach((a) => a.cancel());
  // Markdown, as a reply's is drawn: inline() escapes it first, so a
  // message from the server cannot put markup of its own on the page.
  t.innerHTML = `<span>${inline(String(text ?? ""))}</span>`;
  // One with a link stays up long enough to click it.
  const linked = !!t.querySelector("a");
  t.style.width = "";
  t.style.opacity = "1";
  const wide = t.offsetWidth;
  if (!calm.matches) {
    t.animate(
      [{ width: "38px", transform: "translateX(-50%) translateY(10px) scale(0.9)", opacity: 0 },
       { width: wide + "px", transform: "translateX(-50%)", opacity: 1 }],
      { duration: 560, easing: "cubic-bezier(0.34, 1.3, 0.64, 1)" },
    );
    t.firstChild.animate([{ opacity: 0, filter: "blur(3px)" }, { opacity: 1, filter: "blur(0)" }],
      { duration: 300, delay: 140, easing: "ease-out", fill: "backwards" });
  }
  toast.timer = setTimeout(() => {
    if (calm.matches) { t.style.opacity = "0"; return; }
    t.firstChild.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 140, fill: "forwards" });
    t.animate(
      [{ width: wide + "px", opacity: 1 }, { width: "38px", opacity: 0, transform: "translateX(-50%) scale(0.9)" }],
      { duration: 360, delay: 90, easing: "cubic-bezier(0.32, 0.72, 0, 1)", fill: "forwards" },
    ).finished.then(() => { t.style.opacity = "0"; t.getAnimations().forEach((a) => a.cancel()); }, () => {});
  }, linked ? 6000 : 2000);
}
const showFailure = (error) => toast(error.message || String(error));

// Tooltips: a label, and its keys when it has keys, on hover only.
const tip = $("#tip");
let tipTimer = null;
let tipFor = null;
function showTip(target) {
  const label = target.dataset.tip;
  if (!label || !document.contains(target)) return;
  const keys = target.dataset.keys;
  tip.innerHTML = `<span>${esc(label)}</span>` + (keys ? `<span class="k">${keys.split(" ").map((k) => `<kbd>${esc(k)}</kbd>`).join("")}</span>` : "");
  tip.classList.add("show");
  const r = target.getBoundingClientRect();
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let top = r.top - h - 8;
  if (top < 6) top = r.bottom + 8;
  tip.style.top = top + "px";
  tip.style.left = Math.max(6, Math.min(innerWidth - w - 6, r.left + r.width / 2 - w / 2)) + "px";
}
function hideTip() { clearTimeout(tipTimer); tip.classList.remove("show"); tipFor = null; }
document.addEventListener("mouseover", (e) => {
  const target = e.target.closest("[data-tip]");
  if (target === tipFor) return;
  const warm = tip.classList.contains("show");
  hideTip();
  if (!target) return;
  tipFor = target;
  tipTimer = setTimeout(() => showTip(target), warm ? 0 : 380);
});
document.addEventListener("mousedown", hideTip, true);
document.addEventListener("scroll", hideTip, true);

// Actions: every key, button, menu row and slash command lands here.

// While a turn runs, a message waits: MODE "steer" (Enter) reaches the
// model at the turn's next step, "queue" (Ctrl Enter) runs after it.
async function send(text, mode = "steer") {
  text = text.trim();
  if (uploading()) { toast("Still uploading. Send once it is in."); return; }
  const files = attached.map((a) => a.id);
  if (!text && !files.length) return;
  if (!files.length && text.startsWith("/") && runSlash(text)) return;
  const running = chats.get(current);
  if (running && (running.busy || running.queued)) {
    if (text) sent.push(text);
    sentAt = -1;
    flash($("#composer"), "sent", 340);
    input.value = "";
    clearTray();
    autosize();
    updateSend();
    await api("/api/send", { chat: current, text, mode, files }).catch(showFailure);
    return;
  }
  if (text) sent.push(text);
  sentAt = -1;
  flash($("#send"), "launch", 420);
  flash($("#composer"), "sent", 340);
  buzz();
  follow = true;
  toBottom(true, true);
  input.value = "";
  clearTray();
  autosize();
  updateSend();
  // The chat has to exist here before anything is said in it, or its
  // first events would arrive for a chat this page has never seen.
  if (!current) await createChat(viewProject || "", viewSpark || "");
  // From voice mode, the reply will be heard: the model is told so.
  await api("/api/send", { chat: current, text, files, voice: voice.on }).catch(showFailure);
}

async function createChat(project = "", spark = "") {
  const { chat: id } = await command("new", "", null, { project, spark });
  if (!chats.has(id)) chats.set(id, { id, title: "New chat", busy: false, queued: false, log: [], partial: "", thinking: "", project, spark, updated: Date.now() / 1000 });
  if (!order.includes(id)) order.push(id);
  current = id;
  view = "chat";
  viewProject = project || null;
  replaceUrl = true;
  renderChats();
  drawChat();
}

function stopReply() {
  const chat = chats.get(current);
  if (!chat || !(chat.busy || chat.queued)) return false;
  command("stop").then((r) => {
    // Anything that was waiting comes back to the box, not lost.
    const back = (r && r.restored) || [];
    const files = (r && r.files) || [];
    if (!back.length && !files.length) return;
    reattach(files);
    input.value = [input.value.trim(), ...back].filter(Boolean).join("\n\n");
    autosize();
    updateSend();
    input.focus();
    toast(back.length === 1 ? "Stopped. Your waiting message is back in the box." : "Stopped. Your waiting messages are back in the box.");
  }).catch(showFailure);
  return true;
}

function renderPending() {
  const box = $("#pending");
  const chat = chats.get(current);
  const items = (view === "chat" && chat && chat.pending) || [];
  box.hidden = !items.length;
  box.textContent = "";
  for (const item of items) {
    const steer = item.mode === "steer";
    const row = el("div", `pending-row${steer ? " steer" : ""}`, `<span class="ico">${icon(steer ? "steer" : "clock")}</span><span class="text"></span>`);
    const n = (item.files || []).length;

    const said = [words, n ? `${n} ${n === 1 ? "file" : "files"}` : ""].filter(Boolean).join(" · ");
    row.querySelector(".text").textContent = said;
    row.querySelector(".text").title = said;

    mode.type = "button";

// ---------------------------------------------------------------------------
// Attachments: photos and files that go with the next message. Each one
// uploads the moment it is added, so sending does not wait on it.

const MAX_UPLOAD = 20 * 1024 * 1024;
const MAX_ATTACHED = 10;
const uploading = () => attached.some((a) => a.uploading);

function readBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
    reader.onerror = () => reject(new Error("the browser could not read it"));
    reader.readAsDataURL(file);
  });
}

function addFiles(list) {
  const files = [...(list || [])];
  if (!files.length) return;
  for (const file of files) {
    if (attached.length >= MAX_ATTACHED) { toast(`Up to ${MAX_ATTACHED} files go with one message`); break; }
    const name = file.name || "image.png";
    if (file.size > MAX_UPLOAD) { toast(`${name} is over 20 MB`); continue; }
    if (!file.size) { toast(`${name} is empty`); continue; }
    const item = { name, size: file.size, image: file.type.startsWith("image/"), uploading: true };
    if (item.image) item.url = URL.createObjectURL(file);
    attached.push(item);
    upload(item, file);
  }
  renderTray();
  updateSend();
  input.focus();
}

async function upload(item, file) {
  try {
    const kept = await api("/api/upload", { name: item.name, data: await readBase64(file) });
    Object.assign(item, { id: kept.id, name: kept.name, kind: kept.kind, uploading: false });
  } catch (err) {
    if (attached.includes(item)) { toast(`${item.name} did not upload: ${err.message}`); unattach(item); }
    return;
  }
  if (attached.includes(item)) { renderTray(); updateSend(); }
}

// Files the server already has: back from a stopped queue or an edit.
function reattach(files) {
  for (const f of files) {
    if (attached.length >= MAX_ATTACHED || attached.some((a) => a.id === f.id)) continue;
    attached.push({ id: f.id, name: f.name, size: f.size, kind: f.kind, image: f.kind === "image", url: f.kind === "image" ? fileUrl(f) : "" });
  }
  renderTray();
  updateSend();
}

function renderTray() {
  const tray = $("#tray");
  tray.hidden = !attached.length;
  for (const item of attached) {
    if (!item.node) item.node = trayItem(item);
    item.node.classList.toggle("uploading", !!item.uploading);
    if (!item.uploading) item.node.querySelector(".spinner")?.remove();
    if (item.node.parentNode !== tray) tray.appendChild(item.node);
  }
}

function trayItem(item) {
  const node = el("div", `tray-item ${item.recording ? "clip" : item.image ? "shot" : "doc"}`);
  node.title = `${item.name} · ${fileSize(item.size)}`;
  if (item.recording) {
    const img = node.appendChild(el("img"));
    img.alt = "Screen recording";
    img.src = item.url;
    node.appendChild(el("span", "length", `${icon("play")}${clock(item.seconds)}`));
  } else if (item.image) {
    const img = node.appendChild(el("img"));
    img.alt = item.name;
    img.src = item.url;
  } else {
    node.innerHTML = `<span class="badge">${icon("file")}</span><span class="words"><span class="name"></span><span class="meta"></span></span>`;
    node.querySelector(".name").textContent = item.name;
    node.querySelector(".meta").textContent = `${extOf(item.name)} · ${fileSize(item.size)}`;
  }
  if (item.uploading) node.appendChild(el("span", "spinner"));
  node.appendChild(button("unattach", "x", "Remove", "", () => { unattach(item); input.focus(); }));
  return node;
}

function unattach(item) {
  attached = attached.filter((a) => a !== item);
  const node = item.node;
  const gone = () => {
    if (node) node.remove();
    if (item.url && item.url.startsWith("blob:")) URL.revokeObjectURL(item.url);
    $("#tray").hidden = !attached.length;
  };
  if (node) leave(node, "leaving", gone, 140); else gone();
  updateSend();
}

// Sent: the message shows its own copies, from the server.
function clearTray() {
  for (const item of attached) if (item.url && item.url.startsWith("blob:")) URL.revokeObjectURL(item.url);
  attached = [];
  $("#tray").textContent = "";
  $("#tray").hidden = true;
}

const picker = Object.assign(document.createElement("input"), { type: "file", multiple: true, hidden: true });
document.body.appendChild(picker);
picker.onchange = () => { addFiles(picker.files); picker.value = ""; };

function pickFiles(accept, capture) {
  picker.accept = accept;
  if (capture) picker.setAttribute("capture", capture); else picker.removeAttribute("capture");
  picker.click();
}
