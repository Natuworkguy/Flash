// A spark's audit log: every shift, tool call, approval and change, newest
// first, each opening to the whole of what was kept.
const AUDIT_WORDS = { made: "Made", shift_start: "Shift started", shift_end: "Shift ended", tool: "Tool", approval_asked: "Asked first", approval_answered: "Answered", changed: "Changed", taught: "Taught", paused: "Paused", resumed: "Resumed", stopped: "Stopped", team: "Team", reports_to: "Reports to", budget: "Budget", budget_paused: "Budget used", budget_renewed: "New month", hire_proposed: "Proposed a hire", removal_proposed: "Proposed a let-go", hire_decided: "Your answer", hired: "Hired", asked: "Asked", removed: "Removed" };

function auditSummary(e) {
  if (e.kind === "tool") return `${e.tool}${e.during && e.during !== "shift" ? ` (in a ${e.during})` : ""}`;
  if (e.kind === "shift_end") return e.report || "";
  if (e.kind === "changed") return Object.keys(e.changes || {}).join(", ");
  if (e.kind === "budget") return e.on ? `${Number(e.tokens || 0).toLocaleString()} tokens a month` : "off";
  return e.lesson || e.label || e.team || e.lead || e.name || e.question || e.reason || e.why || "";
}

async function openAudit(spark) {
  let log;
  try { log = await command("spark-audit", spark.id, null); } catch (error) { showFailure(error); return; }
  const form = openForm(`
    <h2>${esc(spark.name)}'s audit log</h2>
    <p class="sub audit-sum"></p>
    <ol class="audit-list"></ol>
    <div class="dialog-buttons"><button type="button" class="btn with-icon" data-export>${icon("download")}<span>Export</span></button><button type="button" class="btn primary" data-cancel>Close</button></div>`, async () => false);
  const sum = form.querySelector(".audit-sum");
  sum.innerHTML = log.intact
    ? `<span class="intact">${icon("check")} Intact</span> ${log.checked} entr${log.checked === 1 ? "y" : "ies"}, each sealed with a hash of the one before. Nothing here is ever changed.`
    : `<span class="broken">${icon("alert")} Edited by hand</span> at entry ${log.checked}: what follows it cannot be trusted.`;
  const list = form.querySelector(".audit-list");
  const entries = [...log.entries].reverse();
  if (!entries.length) list.innerHTML = `<li class="audit-empty">Nothing yet: it has not worked a shift.</li>`;
  entries.forEach((e, k) => {
    const li = el("li", `audit-row kind-${e.kind}`, `<button type="button" class="audit-line"><span class="when"></span><span class="kind"></span><span class="what"></span></button><pre hidden></pre>`);
    li.style.setProperty("--k", Math.min(k, 20));
    li.querySelector(".when").textContent = new Date(e.at * 1000).toLocaleString([], { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
    li.querySelector(".kind").textContent = AUDIT_WORDS[e.kind] || e.kind;
    li.querySelector(".what").textContent = auditSummary(e);
    const { hash, prev, at, kind, ...rest } = e;
    li.querySelector("pre").textContent = JSON.stringify(rest, null, 2);
    li.querySelector(".audit-line").onclick = () => { const pre = li.querySelector("pre"); pre.hidden = !pre.hidden; li.classList.toggle("open", !pre.hidden); };
    list.appendChild(li);
  });
  form.querySelector("[data-cancel]").onclick = () => openSpark(spark.id);
  form.querySelector("[data-export]").onclick = async () => {
    try {
      const { text } = await command("spark-audit-export", spark.id, null);
      const a = el("a");
      a.href = URL.createObjectURL(new Blob([text], { type: "application/x-ndjson" }));
      a.download = `${spark.handle.replace(/^@/, "")}-audit.jsonl`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    } catch (error) { showFailure(error); }
  };
}



// System One's switch in Settings. Its model is picked in the model
// menu. Switching it on asks the server its version first: an Ollama
// older than 0.35 has no System One, and the row says so, with what to
// do about it.
async function fillSystemOne(row) {
  let r = null;
  const note = row.querySelector(".what span");
  const show = (state) => {
    r = state;
    row.setAttribute("aria-checked", !!r.on);
    row.classList.toggle("too-old", !!r.too_old);
    if (r.too_old) note.textContent = `This Ollama is v${r.version}. System One needs v${r.least} or later, so update Ollama to use it.`;
    else if (!r.version) note.textContent = r.problem || "Ollama did not answer.";
    else if (!r.on) note.textContent = `Off. Ollama v${r.version} is ready for it: switch it on, or pick its model in the model menu.`;
    else if (!r.auto) note.textContent = `On, with ${r.model}, and waiting for autonomous mode: until then you answer each command yourself.`;
    else note.textContent = `On, with ${r.model}. ${r.counts.reviewed} reviewed and ${r.counts.stopped} stopped since Flash started.`;
  };
  try { show(await command("system-one", "", null)); }
  catch (error) { note.textContent = error.message || String(error); return; }
  row.onclick = async () => {
    if (row.disabled) return;
    const on = row.getAttribute("aria-checked") !== "true";
    row.setAttribute("aria-checked", on);
    row.disabled = true;
    if (on) note.textContent = "Checking this Ollama…";
    try {
      show(await command("system-one", on ? "on" : "off", null));
      info.system_one = r.on;
      info.system_one_model = r.model;
      renderInfo();
      toast(on ? `System One on, with **${shortModel(r.model)}**` : "System One off");
    } catch (error) {
      row.setAttribute("aria-checked", !on);
      show(r);
      showFailure(error);
    }
    row.disabled = false;
  };
}

// The box in Settings for how many rounds of tools a shift gets: typed,
// or stepped, and saved a moment after the last change.
async function fillRoundsRow(row, limit) {
  const field = row.querySelector("input");
  let r;
  try { r = await command("spark-rounds", "", null); } catch (error) { showFailure(error); return; }
  // On, the number below is the limit; off, a shift calls tools until it
  // is done or stopped, and the number waits for the limit to come back.
  const showLimit = (unlimited) => {
    limit.setAttribute("aria-checked", !unlimited);
    limit.querySelector(".what span").textContent = unlimited
      ? "Off: a shift calls as many tools as it needs, until it writes its report or you stop it. A model that goes round in circles runs on until you do, ahead of your other sparks."
      : "On: each shift gets the rounds below, then writes its report from what it has.";
    row.hidden = unlimited;
  };
  showLimit(r.unlimited);
  limit.onclick = async () => {
    const unlimited = limit.getAttribute("aria-checked") === "true";
    showLimit(unlimited);
    try {
      r = await command("spark-rounds", unlimited ? "unlimited" : "limited", null);
      showLimit(r.unlimited);
      toast(r.unlimited ? "Shifts have no limit on tools now" : `Each shift gets ${r.rounds} round${r.rounds === 1 ? "" : "s"} of tools`);
    } catch (error) { showLimit(!unlimited); showFailure(error); }
  };
  field.min = r.least;
  field.max = r.most;
  field.value = r.rounds;
  field.title = `${r.least} to ${r.most}; ${r.default} unless you change it`;
  let saved = r.rounds;
  let timer = null;
  const save = () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const want = Math.max(r.least, Math.min(r.most, Math.round(Number(field.value) || saved)));
      field.value = want;
      if (want === saved) return;
      try { r = await command("spark-rounds", String(want), null); saved = r.rounds; showLimit(r.unlimited); toast(`Each shift gets ${saved} round${saved === 1 ? "" : "s"} of tools`); }
      catch (error) { field.value = saved; showFailure(error); }
    }, 500);
  };
  field.addEventListener("input", save);
  field.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); field.blur(); } });
  row.querySelector("[data-less]").onclick = () => { field.value = Math.max(r.least, (Number(field.value) || saved) - 1); save(); };
  row.querySelector("[data-more]").onclick = () => { field.value = Math.min(r.most, (Number(field.value) || saved) + 1); save(); };
}

// The switch in Settings: on or off, and what that means right now.
function showAlways(row, a) {
  row.setAttribute("aria-checked", !!a.installed);

}

async function fillAlwaysRow(row) {

  if (row.isConnected && !row.disabled) showAlways(row, sparksAlways);
}

async function setSparksAlways(on, row) {

    const r = await command("sparks-always", on ? "on" : "off", null);

  } catch (error) {

async function openSpark(id) {
  let r;
  try { r = await command("sparks"); } catch (error) { showFailure(error); return; }
  const spark = r.sparks.find((s) => s.id === id);
  if (!spark) { toast("That spark is gone."); return; }
  const form = openForm(`<div class="spark-detail"></div>`, async () => false);
  fillSpark(form.querySelector(".spark-detail"), spark);
  // Not the first feedback box, which would scroll past the goal.
  form.querySelector("[data-cancel]").focus({ preventScroll: true });
  // Opened is read. The ping on its bubble goes with the next redraw.
  if (spark.unread) command("spark-read", id, null).catch(() => {});
}

function fillSpark(box, spark, again = false) {
  box.dataset.id = spark.id;
  box.innerHTML = `<div class="spark-head"><div><h2></h2><div class="title"></div><div class="handle"></div><div class="meta"></div><div class="spark-status"></div></div></div>
    <div class="spark-sec">Goal</div><div class="spark-text" data-goal></div>
    <div data-bounds hidden><div class="spark-sec">Boundaries</div><div class="spark-text"></div></div>
    <div data-watch hidden><div class="spark-sec">Watching</div><div class="spark-text"></div></div>
    <div class="spark-actions"></div>
    <div data-lessons hidden><div class="spark-sec">What you have taught it</div><ul class="spark-lessons"></ul></div>
    <div class="spark-sec">Reports</div><div data-reports></div>
    <div class="dialog-buttons"><button type="button" class="btn" data-cancel>Close</button></div>`;
  box.querySelector(".spark-head").prepend(sparkAvatar({ ...spark, unread: 0 }, 64));
  box.querySelector(".spark-head").style.setProperty("--c", spark.colour);
  box.querySelector("h2").textContent = spark.name;
  const titled = box.querySelector(".spark-head .title");
  if (spark.title) titled.textContent = spark.title; else titled.remove();
  const [kind, doing] = sparkPresence(spark);
  const pill = box.querySelector(".spark-status");
  pill.classList.add(kind);
  pill.textContent = kind === "idle" ? "Ready" : doing;
  box.querySelector(".handle").textContent = spark.handle;
  box.querySelector(".spark-head .meta").textContent = `On ${spark.model_used || "no model"}${spark.model ? "" : " (Flash's)"} · ${spark.schedule}${spark.project_name ? ` · in ${spark.project_name}` : ""} · ${sparkState(spark)} · ${spark.runs} shift${spark.runs === 1 ? "" : "s"}`;
  if (spark.team_name) {
    const line = el("div", "team-line", `<span class="dot"></span><span></span>`);
    line.style.setProperty("--t", spark.team_colour || spark.colour);
    line.querySelector("span:last-child").textContent = `On ${spark.team_name}${spark.lead_name ? `, reporting to ${spark.lead_name}` : ""}`;
    box.querySelector(".spark-head .meta").after(line);
  }
  if (spark.budget_on) box.querySelector(".spark-head .meta").parentElement.appendChild(budgetMeter(spark));
  box.querySelector("[data-goal]").textContent = spark.goal;
  if (spark.boundaries) {
    box.querySelector("[data-bounds]").hidden = false;
    box.querySelector("[data-bounds] .spark-text").textContent = spark.boundaries;
  }
  if (spark.watch) {
    box.querySelector("[data-watch]").hidden = false;
    box.querySelector("[data-watch] .spark-text").textContent = `${spark.watch}: a change there starts a shift.`;
  }
  box.querySelector("[data-cancel]").onclick = closeForm;

  // A step it stopped at, for a yes or a no.
  if (spark.waiting) {
    const card = el("div", "spark-approval", `<div class="want"></div><pre></pre><div class="row"><input type="text" maxlength="400" autocomplete="off" data-keep="why" placeholder="Why not? (optional, it hears this)"><button type="button" class="btn small" data-no>Deny</button><button type="button" class="btn small primary" data-yes>Approve</button></div>`);
    card.querySelector(".want").textContent = `${spark.name} wants to: ${spark.pending.label || "take a step"}`;
    const detail = card.querySelector("pre");
    if (spark.pending.detail) detail.textContent = spark.pending.detail; else detail.remove();
    const decide = async (yes) => {
      try {
        await command(yes ? "spark-approve" : "spark-deny", spark.id, null, { why: card.querySelector("input").value });
        toast(yes ? `${spark.name} carries on` : `${spark.name} carries on without it`);
      } catch (error) { showFailure(error); }
    };
    card.querySelector("[data-yes]").onclick = () => decide(true);
    card.querySelector("[data-no]").onclick = () => decide(false);
    box.querySelector(".spark-actions").before(card);
  }

  const act = (label, run, cls = "btn small") => {
    const b = el("button", cls);
    b.type = "button";
    b.textContent = label;
    b.onclick = async () => { try { await run(b); } catch (error) { showFailure(error); } };
    box.querySelector(".spark-actions").appendChild(b);
    return b;
  };
  const working = spark.status === "working";
  act("Chat", async () => startSparkChat(spark.id), "btn small primary");
  if (working || spark.waiting) {
    act(working ? "Stop" : "Call off", async () => { await command("spark-stop", spark.id, null); toast(working ? `${spark.name} stops at its next step` : `${spark.name} called off that shift`); });
  } else {
    act("Run now", async () => { await command("spark-run", spark.id, null); toast(`${spark.name} is starting a shift`); });
  }
  act(spark.paused ? "Resume" : "Pause", async () => { await command(spark.paused ? "spark-resume" : "spark-pause", spark.id, null); });
  act("Edit", async () => sparkForm(spark));
  act("Share", async () => shareSpark(spark));
  act("Audit log", async () => openAudit(spark));
  act("Delete", async (b) => {
    if (!b.classList.contains("sure")) { b.classList.add("sure"); b.textContent = "Delete it?"; return; }
    await command("spark-remove", spark.id, null);
    closeForm();
    toast(`${spark.name} is gone`);
  }, "btn small danger");

  if (spark.lessons.length) {
    box.querySelector("[data-lessons]").hidden = false;
    const list = box.querySelector(".spark-lessons");
    spark.lessons.forEach((lesson, i) => {
      const item = el("li", "", `<span></span>`);
      item.querySelector("span").textContent = lesson;
      item.appendChild(button("icon-btn", "x", "Forget this", "", async () => {
        try { await command("spark-unteach", spark.id, null, { index: i + 1 }); } catch (error) { showFailure(error); }
      }));
      list.appendChild(item);
    });
  }

  const reports = box.querySelector("[data-reports]");
  const said = spark.reports.filter((r) => !r.quiet).reverse();
  const quiet = spark.reports.length - said.length;
  if (!said.length) {
    reports.appendChild(el("p", "spark-quiet", spark.runs ? `Nothing to report yet. ${quiet} quiet shift${quiet === 1 ? "" : "s"}.` : working ? "Working on its first shift." : "Its first shift starts soon."));
  }
  for (const report of said) {
    const card = el("div", "spark-report" + (report.failed ? " failed" : ""), `<div class="when"></div><div class="body assistant"></div>`);
    if (again) card.style.animation = "none";
    card.querySelector(".when").textContent = `${when(report.at)} · ${ago(report.at)}`;
    if (!report.read) card.querySelector(".when").appendChild(el("span", "made-by", "New"));
    card.querySelector(".body").innerHTML = markdown(report.text);
    const play = readButton(`report:${spark.id}:${report.at}`, () => card.querySelector(".body"));
    play.classList.add("small");
    card.querySelector(".when").appendChild(play);
    // Liked or not: later shifts are shown which, and do more of the one.
    if (!report.failed && !report.approval) {
      const rate = el("span", "rate");
      for (const [value, cls, name, tip] of [[1, "up", "thumbUp", "Good report: more like this"], [-1, "down", "thumbDown", "Not useful: less like this"]]) {
        const b = el("button", `icon-btn ${cls}` + (report.rating === value ? " on" : ""), icon(name));
        b.type = "button";
        b.dataset.tip = tip;
        b.setAttribute("aria-label", tip);
        b.setAttribute("aria-pressed", report.rating === value);
        b.onclick = async () => {
          const next = report.rating === value ? 0 : value;
          try { await command("spark-rate", spark.id, null, { at: report.at, rating: next }); }
          catch (error) { showFailure(error); return; }
          report.rating = next;
          rate.querySelectorAll(".icon-btn").forEach((other) => {
            const on = other === b && next !== 0;
            other.classList.toggle("on", on);
            other.setAttribute("aria-pressed", on);
          });
          if (!calm.matches && next) b.animate([{ transform: "scale(1)" }, { transform: "scale(1.3)" }, { transform: "scale(1)" }], { duration: 320, easing: "cubic-bezier(0.34, 1.56, 0.64, 1)" });
          // A dislike asks what was wrong, which it keeps as a lesson.
          const why = card.querySelector(".teach input");
          if (why) why.placeholder = next === -1 ? `What was wrong with it? ${spark.name} learns from this…` : `Tell ${spark.name} what to do differently…`;
          if (next === -1 && why) why.focus();
          toast(next === 1 ? `${spark.name} will do more like this` : next === -1 ? `${spark.name} will do less like this` : "Rating taken back");
        };
        rate.appendChild(b);
      }
      card.querySelector(".when").appendChild(rate);
    }
    if (report.steps.length) {
      const steps = el("details", "", `<summary>${report.steps.length} step${report.steps.length === 1 ? "" : "s"}</summary><ol></ol>`);
      for (const step of report.steps) steps.querySelector("ol").appendChild(el("li")).textContent = step;
      card.appendChild(steps);
    }
    if (report.feedback) {
      card.appendChild(el("div", "said")).textContent = `You said: ${report.feedback}`;
    } else if (!report.failed && !report.approval) {
      const teach = el("div", "teach", `<input type="text" maxlength="400" autocomplete="off"><button type="button" class="btn small">Tell it</button>`);
      const field = teach.querySelector("input");
      field.dataset.keep = `teach-${report.at}`;
      field.placeholder = report.rating === -1 ? `What was wrong with it? ${spark.name} learns from this…` : `Tell ${spark.name} what to do differently…`;
      const go = async () => {
        const lesson = field.value.trim();
        if (!lesson) return;
        try { await command("spark-teach", spark.id, null, { lesson, at: report.at }); field.value = ""; toast(`${spark.name} will remember that`); }
        catch (error) { showFailure(error); }
      };
      field.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); go(); } });
      teach.querySelector("button").onclick = go;
      card.appendChild(teach);
    }
    reports.appendChild(card);
  }
  if (said.length && quiet) reports.appendChild(el("p", "spark-quiet", `And ${quiet} quiet shift${quiet === 1 ? "" : "s"} with nothing new.`));
}

// Settings' pick of the model new sparks are made on: Flash's own, or
// one of this computer's. One that has since gone from it stays in the
// list, marked, with what new sparks get meanwhile.
async function fillSparkModelRow(row) {
  const select = row.querySelector("select");
  const words = row.querySelector(".what span");
  const draw = (said) => {
    const listed = said.models || [];
    const chosen = said.spark_default || "";
    const names = chosen && !listed.includes(chosen) ? [chosen, ...listed] : listed;
    select.innerHTML = `<option value="flash">Flash's model${info.model ? ` (${esc(shortModel(info.model))})` : ""}</option>` + names.map((m) => `<option value="${esc(m)}">${esc(m)}${listed.includes(m) || !said.reachable ? "" : " (not here)"}</option>`).join("");
    select.value = chosen || "flash";
    row.classList.toggle("warned", said.spark_default_here === false);
    words.innerHTML = said.spark_default_here === false
      ? `<b class="model-gone-word">${esc(chosen)} is not on this computer any more.</b> New sparks are made on ${esc(said.spark_model || "Flash's model")} until you pick another, and sparks on it run on that meanwhile.`
      : "The model the form picks for a new spark, and the one teams and sparks made by Flash start on. Each spark can still have its own.";
  };
  let said;
  try { said = await command("model", "", null); } catch (_) { words.textContent = "Could not ask this computer for its models."; return; }
  if (!row.isConnected) return;
  draw(said);
  select.onchange = async () => {
    try {
      const now = await command("spark-default-model", select.value, null);
      draw({ ...said, ...now });
      toast(now.spark_default ? `New sparks are made on **${now.spark_default}**` : "New sparks are made on Flash's model");
    } catch (error) { showFailure(error); }
  };
}

// The model a spark runs on, chosen in its form: the host's models in a
// list, with none picked until one is. A host that does not answer
// leaves a box to type the name in.
function modelField(current = "") {
  return `<label class="field"><span>Model</span><select name="model" required><option value="">Loading the models…</option></select><small>What it thinks with, on every shift and in every chat. A smaller model is quicker and lighter on this computer; a bigger one does harder work.</small></label>`;
}

// FRESH, for a spark not made yet: the default for new sparks is picked
// for it, or, when that is no longer on this computer, the form says so.
async function fillModelField(form, current = "", fresh = false) {
  const select = form.querySelector("select[name=model]");
  if (!select) return;
  let listed = [];
  let said = {};
  try { said = await command("model", "", null); listed = said.models || []; } catch (_) { listed = []; }
  if (!select.isConnected) return;
  if (fresh && !current && said.spark_default) {
    if (said.spark_default_here === false) {
      const gone = el("p", "model-gone", `<b>${esc(said.spark_default)}</b>, your default for new sparks, is not on this computer any more. Pick one here, or another default in Settings.`);
      select.closest(".field").appendChild(gone);
    } else current = said.spark_default;
  }
  if (!listed.length) {
    const box = el("input");
    box.name = "model";
    box.required = true;
    box.className = "mono";
    box.placeholder = info.model || "llama3.1";
    box.value = current;
    box.autocomplete = "off";
    select.replaceWith(box);
    return;
  }
  const names = current && !listed.includes(current) ? [current, ...listed] : listed;
  select.innerHTML = `<option value="">Choose a model…</option>` + names.map((m) => `<option value="${esc(m)}">${esc(m)}${!listed.includes(m) ? " (not on this computer)" : m === said.spark_default ? " (default)" : m === info.model ? " (Flash's)" : ""}</option>`).join("");
  select.value = current;
}

// A spark as a code to hand on: whoever adds it gets a copy of their own.
async function shareSpark(spark) {
  let code;
  try { code = (await command("spark-share", spark.id, null)).code; } catch (error) { showFailure(error); return; }
  const form = openForm(`
    <h2>Share ${esc(spark.name)}</h2>
    <p class="sub">Anyone with Flash can add a copy with Add shared on their Sparks page, or <code>/sparks add</code> in the terminal. It carries the goal, schedule, boundaries and what you taught it; not its reports or notes.</p>
    <textarea class="spark-code" rows="4" readonly></textarea>
    <div class="dialog-buttons"><button type="button" class="btn" data-cancel>Close</button><button type="button" class="btn primary" data-copy>Copy</button></div>`, async () => false);
  const box = form.querySelector(".spark-code");
  box.value = code;
  box.focus();
  box.select();
  form.querySelector("[data-cancel]").onclick = () => openSpark(spark.id);
  form.querySelector("[data-copy]").onclick = async () => {
    try { await navigator.clipboard.writeText(code); toast("Copied"); }
    catch (_) { box.select(); document.execCommand("copy"); toast("Copied"); }
  };
}

// A shared spark, looked over before it is added: what it would do, and
// what it must never do.
function addSharedSpark() {
  let preview = null;
  const form = openForm(`
    <h2>Add a shared spark</h2>
    <p class="sub">Paste the code someone shared. You see what it does before anything is added, and you get a copy of your own.</p>
    <textarea name="code" class="spark-code" rows="4" placeholder="flash-spark:…" spellcheck="false"></textarea>
    <div class="spark-preview" hidden></div>
    ${modelField()}
    <label class="field check"><input type="checkbox" name="paused"><span>Add it paused, to start when you press Resume.</span></label>
    <div class="dialog-buttons"><button type="button" class="btn" data-cancel>Cancel</button><button type="submit" class="btn primary" disabled>Add spark</button></div>`,
    async (data) => {
      const made = (await command("spark-add", data.code.trim(), null, { model: data.model || "", paused: !!data.paused })).spark;
      toast(made.paused ? `Added ${made.name}, paused` : `Added ${made.name}`);
      if (view !== "sparks") showPage("sparks");
    });
  const box = form.querySelector(".preview, .spark-preview");
  const submit = form.querySelector("[type=submit]");
  fillModelField(form, "", true);
  form.querySelector("[data-cancel]").onclick = closeForm;
  let timer = null;
  form.code.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const code = form.code.value.trim();
      submit.disabled = true;
      box.hidden = !code;
      if (!code) return;
      try { preview = (await command("spark-code", code, null)).template; }
      catch (error) { box.textContent = error.message; return; }
      box.innerHTML = `<b></b> · ${esc(preview.schedule)}<p class="goal"></p><p class="bounds"></p><p class="taught"></p>`;
      box.querySelector("b").textContent = preview.name;
      box.querySelector(".goal").textContent = preview.goal;
      box.querySelector(".bounds").textContent = preview.boundaries ? `Never: ${preview.boundaries}` : "No boundaries: add your own after, with Edit.";
      box.querySelector(".taught").textContent = preview.lessons.length ? `Taught ${preview.lessons.length} thing${preview.lessons.length === 1 ? "" : "s"}: ${preview.lessons.join(" · ")}` : "";
      submit.disabled = false;
    }, 150);
  });
}

// A template that works on email, picked while email is not connected:
// a line under the templates says so, with the way to connect it.
async function needsEmail(row, needs) {
  row.parentElement.querySelector(".needs-email")?.remove();
  if (!needs) return;
  let e;
  try { e = (await command("email")).email; } catch (_) { return; }
  if (e.configured || !row.isConnected) return;
  const note = el("p", "needs-email", "This spark works on your email, which is not connected yet. ");
  const go = el("button", "link-btn", "Connect it in Settings");
  go.type = "button";
  go.onclick = () => { closeForm(); showSettings("email"); };
  note.appendChild(go);
  row.after(note);
}

// The spark form's team and "reports to": the second lists the sparks on
// the team picked in the first, and the budget box shows with its tick.
async function teamFields(form, spark) {
  form.budget_on.addEventListener("change", () => {
    form.querySelector(".budget-field").hidden = !form.budget_on.checked;
    if (form.budget_on.checked) form.budget.focus();
  });
  let r;
  try { r = await command("sparks"); } catch (_) { return; }
  if (!form.isConnected) return;
  form.team.insertAdjacentHTML("beforeend", r.teams.map((t) => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join(""));
  form.team.value = spark?.team && r.teams.some((t) => t.id === spark.team) ? spark.team : "";
  const leads = () => {
    const on = form.team.value;
    const mates = r.sparks.filter((s) => on && s.team === on && s.id !== spark?.id);
    form.lead.innerHTML = `<option value="">No one</option>` + mates.map((s) => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("");
    form.lead.disabled = !mates.length;
    form.lead.value = spark && on === spark.team && mates.some((s) => s.id === spark.reports_to) ? spark.reports_to : "";
  };
  form.team.addEventListener("change", leads);
  leads();
}

// "At set times": the box for them shows with the choice, and says back
// what it read and when that next comes round, or why it cannot.
function setTimesField(form) {
  const field = form.querySelector(".at-field");
  const said = field.querySelector(".at-said");
  const example = said.innerHTML;
  let timer = 0;
  form.every.addEventListener("change", () => {
    field.hidden = form.every.value !== "at";
    form.at.required = !field.hidden;
    if (!field.hidden) form.at.focus();
  });
  form.at.required = !field.hidden;
  form.at.addEventListener("input", () => {
    clearTimeout(timer);
    const text = form.at.value.trim();
    form.at.setCustomValidity("");
    said.classList.remove("bad");
    if (!text) { said.innerHTML = example; return; }
    timer = setTimeout(async () => {
      try {
        const read = await command("spark-schedule", text, null);
        if (form.at.value.trim() !== text) return;
        const next = new Date(read.next * 1000);
        said.textContent = `Runs ${read.schedule}. Next: ${next.toLocaleString([], { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" })}.`;
      } catch (error) {
        if (form.at.value.trim() !== text) return;
        said.textContent = error.message;
        said.classList.add("bad");
        form.at.setCustomValidity(error.message);
      }
    }, 200);
  });
}

function sparkForm(spark, inProjectId = "", template = "") {
  const editing = !!spark;
  const every = editing ? spark.every : 60;
  const atTimes = editing && !!spark.at;
  const choices = atTimes || EVERY_CHOICES.some(([m]) => m === every) ? EVERY_CHOICES : [...EVERY_CHOICES, [every, `Every ${everyWords(every)}`]].sort((a, b) => a[0] - b[0]);
  const form = openForm(`
    <h2>${editing ? "Edit spark" : "New spark"}</h2>
    <p class="sub">${editing ? "" : "An agent that keeps working on one goal, on a schedule, while Flash runs, and reports back."}</p>
    ${editing ? "" : `<div class="spark-templates"></div>`}
    <label class="field"><span>Name</span><input name="sparkname" maxlength="24" placeholder="Scout" autocomplete="off"><small>Its handle: <b data-handle>@scout-spark</b></small></label>
    <label class="field"><span>Title <em class="count">optional</em></span><input name="title" maxlength="40" placeholder="Repo watcher" autocomplete="off"><small>Its job, as a teammate's: shown under its name, and it knows it.</small></label>
    ${modelField()}
    <label class="field"><span>Goal</span><textarea name="goal" rows="4" placeholder="Check github.com/me/app for new issues. Tell me which look like bugs, and skip ones you have already told me about."></textarea></label>
    <label class="field"><span>How often</span><select name="every">${choices.map(([m, label]) => `<option value="${m}"${!atTimes && m === every ? " selected" : ""}>${label}</option>`).join("")}<option value="at"${atTimes ? " selected" : ""}>At set times…</option></select><small>It works while Flash is open, in the terminal or here.</small></label>
    <label class="field at-field"${atTimes ? "" : " hidden"}><span>When</span><input name="at" placeholder="9am weekdays" autocomplete="off" spellcheck="false"><small class="at-said">Like <b>9am weekdays</b>, <b>mon, thu 8:30</b>, <b>the 1st at 9am</b>, or a cron line such as <b>0 9 * * 1-5</b>. On this computer's clock.</small></label>
    <label class="field"><span>Project</span><select name="project"><option value="">No project</option>${[...projects].reverse().map((p) => `<option value="${esc(p.id)}"${editing && spark.project === p.id ? " selected" : ""}>${esc(p.name)}</option>`).join("")}</select><small>${projects.length ? "Its shifts work on the project's folder and follow its instructions, and a chat with it starts there." : "Make a project on the Projects page to give it one: a folder, and how to work in it."}</small></label>
    <label class="field"><span>Watch a folder <em class="count">optional</em></span><input name="watch" class="mono" placeholder="~/Downloads" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false"><small>A change to its files starts a shift too, besides the schedule, and it is told which files changed. Tab takes a suggestion and shows what is inside it.</small></label>
    <label class="field"><span>Boundaries</span><textarea name="boundaries" rows="2" placeholder="Only read. Never push, delete, or message anyone."></textarea><small>Lines it must not cross. Running commands and changing files also need autonomous mode, as for sub-agents.</small></label>
    <div class="field-pair"><label class="field"><span>Team <em class="count">optional</em></span><select name="team"><option value="">No team</option></select></label><label class="field"><span>Reports to</span><select name="lead" disabled><option value="">No one</option></select></label></div>
    <label class="field check"><input type="checkbox" name="budget_on"${editing && spark.budget_on ? " checked" : ""}><span>Give it a budget. Past it, it pauses itself until the hour, day, week or month turns.</span></label>
    <div class="field budget-field"${editing && spark.budget_on ? "" : " hidden"}><span>Budget</span><div class="budget-row"><input name="budget" placeholder="200k" autocomplete="off" aria-label="Tokens" value="${editing && spark.budget ? spark.budget : ""}"><span class="per">tokens</span><select name="budget_period" aria-label="Every">${[["hour", "an hour"], ["day", "a day"], ["week", "a week"], ["month", "a month"]].map(([v, label]) => `<option value="${v}"${(editing ? spark.budget_period || "month" : "month") === v ? " selected" : ""}>${label}</option>`).join("")}</select></div><small>${editing && spark.budget_on ? `${(spark.used || 0).toLocaleString()} used ${spark.period_words || "this month"}. ` : ""}Counted over its shifts, chats and answers: what it reads and what it writes. Like 200000, 200k or 2m.</small></div>
    ${editing ? "" : `<label class="field check"><input type="checkbox" name="paused"><span>Make it paused. Nothing runs until you press Resume in its window; then it starts its first shift.</span></label>`}
    ${editing || sparksAlways.installed ? "" : `<label class="field check"><input type="checkbox" name="always" checked><span>Keep sparks working when Flash is closed. Flash starts a keeper at login and notifies you of news.</span></label>`}
    <div class="dialog-buttons"><button type="button" class="btn" data-cancel>Cancel</button><button type="submit" class="btn primary">${editing ? "Save" : "Make spark"}</button></div>`,
    async (data) => {
      const fields = { goal: data.goal, every: data.every === "at" ? data.at.trim() : data.every, boundaries: data.boundaries, project: data.project || "", watch: data.watch || "", model: data.model || "", title: data.title || "" };
      const name = data.sparkname.trim();
      // Its team, who it reports to and its budget, each only if changed.
      const placement = async (id, was) => {
        const team = data.team || "", lead = data.lead || "";
        if (team !== (was.team || "")) await command("spark-team", id, null, { team });
        if (lead !== (team === (was.team || "") ? was.reports_to || "" : "")) await command("spark-lead", id, null, { lead });
        const on = !!data.budget_on;
        const tokens = (data.budget || "").trim();
        const period = data.budget_period || "month";
        if (on !== !!was.budget_on || (on && ((tokens && tokens !== String(was.budget || "")) || period !== (was.budget_period || "month")))) {
          await command("spark-budget", id, null, { on, tokens: on ? tokens : "", period });
        }
      };
      if (editing) {
        // Not "name": that is the command's own.
        await command("spark-update", spark.id, null, { ...fields, rename: name });
        await placement(spark.id, spark);
        toast(`Saved ${name}`);
        await openSpark(spark.id);
        return false;
      }
      if (data.budget_on && !(data.budget || "").trim()) throw new Error("Say how many tokens a month it may use.");
      const made = (await command("spark-create", name, null, { ...fields, paused: !!data.paused })).spark;
      await placement(made.id, {});
      toast(made.paused ? `${made.name} is made, paused: Resume starts it` : `${made.name} is on it`);
      if (data.always) await setSparksAlways(true);
      if (view !== "sparks") showPage("sparks");
    });
  // The folder to watch, suggested as you type, as a project's is.
  suggestFolders(form.watch);
  setTimesField(form);
  teamFields(form, spark);
  // Chosen, not assumed: a spark from before it had one picks one now.
  fillModelField(form, editing ? spark.model || "" : "", !editing);
  const handle = form.querySelector("[data-handle]");
  const named = () => { handle.textContent = sparkHandle(form.sparkname.value || "scout"); };
  form.sparkname.addEventListener("input", named);
  if (editing) {
    form.sparkname.value = spark.name;
    form.title.value = spark.title || "";
    form.goal.value = spark.goal;
    form.boundaries.value = spark.boundaries;
    form.watch.value = spark.watch || "";
    form.at.value = spark.at || "";
    if (spark.at) form.at.dispatchEvent(new Event("input"));
  } else {
    if (inProjectId) form.project.value = inProjectId;
    // A template fills the form in, to change before it is made.
    command("spark-templates", "", null).then(({ templates }) => {
      const row = form.querySelector(".spark-templates");
      if (!row) return;
      row.appendChild(el("span", "sub", "Start from:"));
      for (const t of templates) {
        const chip = el("button", "chip-btn");
        chip.type = "button";
        chip.textContent = t.name;
        chip.title = t.blurb;
        chip.onclick = () => {
          row.querySelectorAll(".chip-btn").forEach((c) => c.classList.toggle("on", c === chip));
          needsEmail(row, t.needs === "email");
          form.sparkname.value = t.name;
          form.title.value = t.title || "";
          form.goal.value = t.goal;
          form.boundaries.value = t.boundaries;
          if (![...form.every.options].some((o) => +o.value === t.every)) form.every.add(new Option(`Every ${everyWords(t.every)}`, t.every));
          form.every.value = String(t.every);
          form.every.dispatchEvent(new Event("change"));
          named();
          form.goal.focus();
        };
        row.appendChild(chip);
        // Opened for one template, it starts filled in from it.
        if (template && t.name === template) chip.click();
      }
    }).catch(() => {});
  }
  named();
  form.querySelector("[data-cancel]").onclick = editing ? () => openSpark(spark.id) : closeForm;
}

// A spark started, finished, or changed. Shifts report every step, so
// this waits for a quiet moment before fetching.
let sparksTimer = null;
function sparksChanged() {
  refreshLite();
  clearTimeout(sparksTimer);
  sparksTimer = setTimeout(async () => {
    const always = document.querySelector(".sparks-always-row");
    if (always && !always.disabled) fillAlwaysRow(always);
    if (view === "sparks") {
      const body = messagesEl.querySelector(".tab-body");
      const editing = body && body.contains(document.activeElement) && /TEXTAREA|INPUT/.test(document.activeElement.tagName);
      if (body && !editing) drawSparks(body, true);
    }
    const box = $("#form-body .spark-detail");
    if (!box || !isOpen($("#form"))) return;
    let r;
    try { r = await command("sparks"); } catch (_) { return; }
    const spark = r.sparks.find((s) => s.id === box.dataset.id);
    if (!box.isConnected) return;
    if (!spark) { closeForm(); return; }
    // What is half typed, and where the caret was, survive the redraw.
    // Focus in the dialog is what Escape closes it by, so it goes back
    // where it was rather than with the old buttons.
    const kept = {};
    let caret = null;
    box.querySelectorAll("[data-keep]").forEach((f) => {
      kept[f.dataset.keep] = f.value;
      if (f === document.activeElement) caret = { key: f.dataset.keep, at: f.selectionStart };
    });
    const focused = box.contains(document.activeElement) || document.activeElement === document.body;
    if (emojiField && box.contains(emojiField)) closeMenu();
    fillSpark(box, spark, true);
    box.querySelectorAll("[data-keep]").forEach((f) => { if (kept[f.dataset.keep]) f.value = kept[f.dataset.keep]; });
    const back = caret && [...box.querySelectorAll("[data-keep]")].find((f) => f.dataset.keep === caret.key);
    if (back) { back.focus({ preventScroll: true }); back.setSelectionRange(caret.at, caret.at); }
    else if (focused) box.querySelector("[data-cancel]").focus({ preventScroll: true });
  }, 300);
}

// Background scenes ----------------------------------------------------------

let sceneName = "";

// A scene arrives as a palette and every pixel's index into it; one
// canvas pixel per scene pixel, scaled up by CSS with no smoothing.
function paintScene(canvas, scene) {
  canvas.width = scene.width;
  canvas.height = scene.height;
  const ctx = canvas.getContext("2d");
  const image = ctx.createImageData(scene.width, scene.height);
  const rgb = scene.palette.map((hex) => [1, 3, 5].map((at) => parseInt(hex.slice(at, at + 2), 16)));
  scene.pixels.forEach((index, at) => {
    const [r, g, b] = rgb[index];
    image.data[at * 4] = r;
    image.data[at * 4 + 1] = g;
    image.data[at * 4 + 2] = b;
    image.data[at * 4 + 3] = 255;
  });
  ctx.putImageData(image, 0, 0);
}

function showScene(scene) {
  sceneName = scene ? scene.name : "";
  document.body.classList.toggle("has-scene", !!scene);
  if (scene) paintScene($("#scene"), scene);
}

// Another page, or the terminal, may have picked a different one.
async function syncScene() {
  if ((info.background || "") === sceneName) return;
  const r = await command("background-scene").catch(() => null);

}

    card.querySelector(".name").textContent = scene.title;

// Voice models: the listening and speaking models voice mode can use,
// each with its size and who it suits, to download, switch to, or free
// the space of.
const fmtBytes = (n) => (n >= 1e9 ? `${(n / 1e9).toFixed(1)} GB` : `${Math.round(n / 1e6)} MB`);
const VOICE_GROUPS = [["listening", "Listening", "Turns what you say into text."], ["speaking", "Speaking", "Reads Flash's replies aloud."]];

async function drawVoiceModels(box = document.querySelector(".voice-models")) {
  if (!box) return;
  let r;
  try { r = await command("voice-models"); } catch (error) { showFailure(error); return; }
  if (!box.isConnected) return;
  box.textContent = "";
  if (r.missing.length) box.appendChild(el("p", "vm-missing")).textContent = r.install;
  drawVoiceStyles(box, r);
  for (const [kind, title, sub] of VOICE_GROUPS) {
    box.insertAdjacentHTML("beforeend", `<div class="vm-head"><b>${title}</b><span>${sub}</span></div>`);
    const list = box.appendChild(el("div", "vm-list"));
    for (const m of r[kind]) {
      const fetching = r.downloading && r.downloading.kind === kind && r.downloading.name === m.name;
      const row = list.appendChild(el("div", "vm-row" + (m.current ? " current" : ""), `<span class="vm-mark">${m.current ? icon("check") : ""}</span><span class="vm-what"><b></b><small></small></span><span class="vm-act"></span>`));
      row.dataset.key = `${kind}:${m.name}`;
      row.querySelector("b").innerHTML = `${fmtBytes(m.size)} <span class="vm-dot">&bull;</span> ${esc(m.label)}`;
      row.querySelector("small").textContent = m.name;
      const act = row.querySelector(".vm-act");
      if (fetching) { downloadingSlot(act, "Downloading"); continue; }
      if (m.current) { act.innerHTML = `<span class="vm-tag">In use</span>`; continue; }
      const pick = el("button", "btn small", m.installed ? "Use" : "Download");
      pick.type = "button";
      pick.disabled = !!r.downloading || (!m.installed && r.missing.length > 0);
      pick.onclick = async () => {
        pick.disabled = true;
        try { await command("voice-model", m.name, null, { kind }); drawVoiceModels(box); }
        catch (error) { pick.disabled = false; showFailure(error); }
      };
      act.appendChild(pick);
      if (m.installed) {
        const drop = button("icon-btn", "x", `Remove, freeing ${fmtBytes(m.size)}`, "", async () => {
          if (!(await confirmPop(drop, { title: kind === "listening" ? "Remove this listening model?" : "Remove this voice?", text: `Deletes ${m.name} and frees ${fmtBytes(m.size)}. You can download it again later.`, yes: "Remove" }))) return;
          try { await command("voice-model-remove", m.name, null, { kind }); drawVoiceModels(box); } catch (error) { showFailure(error); }
        });
        act.appendChild(drop);
      }
    }
  }
}

// How the voice delivers what it says: warm, lively, calm, or plain, and
// a line to hear it by.
const VOICE_SAMPLE = "Hi! I'm Flash. Oh, you're working late tonight? Let's get this done together.";
function drawVoiceStyles(box, r) {
  box.insertAdjacentHTML("beforeend", `<div class="vm-head"><b>How it speaks</b><span>The same voice, delivered differently.</span></div>`);
  const row = box.appendChild(el("div", "vm-styles"));
  row.setAttribute("role", "radiogroup");
  row.setAttribute("aria-label", "How it speaks");
  for (const s of r.styles) {
    const [name, what] = s.label.split(": ");
    const chip = row.appendChild(el("button", "vm-style" + (s.current ? " on" : ""), `<b></b><span></span>`));
    chip.type = "button";
    chip.setAttribute("role", "radio");
    chip.setAttribute("aria-checked", s.current);
    chip.querySelector("b").textContent = name;
    chip.querySelector("span").textContent = what || "";
    chip.onclick = async () => {
      if (s.current) return;
      try { await command("voice-style", s.name); drawVoiceModels(box); toast(`Flash speaks ${name.toLowerCase()} now`); }
      catch (error) { showFailure(error); }
    };
  }
  const hear = el("button", "btn small with-icon vm-hear", `${icon("play")}<span>Hear it</span>`);
  hear.type = "button";
  hear.disabled = !(r.speaking || []).some((m) => m.current && m.installed);
  hear.dataset.tip = hear.disabled ? "Download a voice first" : "Hear the voice in this style";
  hear.onclick = async () => {
    hear.disabled = true;
    const ctx = new AudioContext();
    try {
      const audio = await makeSpeech(VOICE_SAMPLE, ctx);
      await new Promise((done) => { const src = ctx.createBufferSource(); src.buffer = audio; src.connect(ctx.destination); src.onended = done; src.start(); });
    } catch (error) { showFailure(error); }
    ctx.close().catch(() => {});
    hear.disabled = false;
  };
  row.appendChild(hear);
}

// A download under way: how far along, and a way to call it off.
function downloadingSlot(slot, said) {
  let progress = slot.querySelector(".vm-progress");
  if (!progress) {
    slot.textContent = "";
    progress = slot.appendChild(el("span", "vm-progress"));
    const stop = slot.appendChild(el("button", "btn small", "Cancel"));
    stop.type = "button";
    stop.onclick = async () => {
      stop.disabled = true;
      stop.textContent = "Cancelling";
      try { await command("voice-cancel"); } catch (error) { stop.disabled = false; stop.textContent = "Cancel"; showFailure(error); }
    };
  }
  progress.textContent = said;
}

function voiceModelEvent(event) {
  const box = document.querySelector(".voice-models");
  if (event.done) {
    if (event.cancelled) toast(`Stopped downloading ${event.name}`);
    else if (event.error) toast(`Could not download ${event.name}: ${event.error}`);
    else toast(`${event.name} is ready and in use`);
    if (box) drawVoiceModels(box);
    return;
  }
  const slot = box && box.querySelector(`.vm-row[data-key="${CSS.escape(`${event.kind}:${event.name}`)}"] .vm-act`);
  if (slot) downloadingSlot(slot, `${event.label} ${event.percent}%`);
}

// LAN ----------------------------------------------------------------------

// Whether this page came in over the network rather than from this
// computer: turning the network off would cut it off.
const remotePage = () => !["localhost", "127.0.0.1", "[::1]", "::1"].includes(location.hostname);

function renderLan(box = document.querySelector(".lan-box")) {
  if (!box) return;
  const on = !!info.lan;
  box.textContent = "";
  const row = el("button", "setting-row", `<span class="what"><b>Open on your network</b><span></span></span><span class="switch" aria-hidden="true"></span>`);
  row.type = "button";
  row.setAttribute("role", "switch");
  row.setAttribute("aria-checked", on);
  row.querySelector(".what span").textContent = on
    ? "Phones and other computers on this network can open Flash with the link. It travels unencrypted, so keep this to networks you trust."
    : "Only this computer can reach Flash. Turn this on to open it on your phone.";
  if (!info.can_switch_lan) { row.disabled = true; row.querySelector(".what span").textContent += " Restart Flash with --lan to change this."; }
  row.onclick = () => switchLan(!on, row);
  box.appendChild(row);
}

async function switchLan(on, from) {
  // From a phone, turning it off ends the page it is on: ask first.
  if (!on && remotePage() && !(await confirmPop(from && from.querySelector(".switch"), { title: "Turn off network access?", text: "This page is open over your network, so it disconnects, and only this computer can open Flash until it is turned back on.", yes: "Turn off" }))) return false;
  if (from) { from.setAttribute("aria-checked", on); from.disabled = true; }
  try {
    const result = await command("lan", on ? "on" : "off");
    if (result.switching && !(await waitForLan(on))) {
      toast("Flash did not come back. Check the terminal it runs in.");
      renderLan();
      return false;
    }
  } catch (error) { showFailure(error); renderLan(); return false; }
  info.lan = on;
  renderLan();
  toast(on ? "Flash is open on your network. Open on phone shows the code." : "Only this computer can reach Flash now.");
  return true;
}

// The server closes and opens again listening elsewhere; the page waits
// for it to answer as the new choice.
async function waitForLan(on) {
  const started = Date.now();
  while (Date.now() - started < 12000) {
    await new Promise((resolve) => setTimeout(resolve, 400));
    try {
      const state = await api("/api/state?lite=1");
      if (!!state.status.lan === on) { Object.assign(info, state.status); return true; }
    } catch (_) { /* reopening */ }
  }
  return false;
}

// Updates ------------------------------------------------------------------

let updateLogOpen = false;
let toldAboutUpdate = false;
let waitingForRestart = false;

function renderUpdates(box = document.querySelector(".updates-box")) {
  if (!box) return;
  const u = info.update || {};
  const state = u.state || "idle";
  let line = "";
  let action = null;
  let busy = false;
  if (state === "checking") { line = "Checking for updates…"; busy = true; }
  else if (state === "updating") { line = `${u.step || "Updating"}…`; busy = true; }
  else if (state === "restarting") { line = "Restarting into the new version…"; busy = true; }
  else if (state === "updated") {
    line = u.message || "Updated.";
    if (u.can_restart) action = ["Restart now", restartFlash, true];
  } else if (state === "failed") { line = "The update did not finish."; action = ["Try again", startUpdate, true]; }
  else if (u.available) { line = `Version ${u.latest} is available.`; action = [`Update to v${u.latest}`, startUpdate, true]; }
  else if (u.message) { line = u.message; action = ["Try again", checkUpdates, false]; }
  else if (u.checked) { line = "You're on the latest version."; action = ["Check again", checkUpdates, false]; }
  else { line = "Not checked yet."; action = ["Check for updates", checkUpdates, false]; }

  box.textContent = "";
  const row = el("div", "setting-row static", `<span class="what"><b></b><span></span></span><span class="side"></span>`);
  row.querySelector("b").textContent = `Flash v${u.current || info.version || ""}`;
  row.querySelector(".what span").textContent = line;
  const side = row.querySelector(".side");
  if (busy) side.appendChild(el("span", "spin"));
  else if (action) {
    const [label, run, primary] = action;
    const b = el("button", "btn small" + (primary ? " primary" : ""));
    b.type = "button";
    b.textContent = label;
    b.onclick = run;
    side.appendChild(b);
  }
  box.appendChild(row);

  if (state === "failed" || ((state === "updating" || state === "updated") && (u.log || []).length)) {
    const extra = el("div", "update-extra");
    if (state === "failed" && u.message) {
      // The message ends with the installer's own last lines, fenced.
      extra.appendChild(el("p", "note")).textContent = u.message.replace(/```/g, "").trim();
    }
    if ((u.log || []).length) {
      const log = el("details", "update-log", `<summary>Installer output</summary><pre></pre>`);
      log.open = updateLogOpen;
      log.ontoggle = () => { updateLogOpen = log.open; };
      const pre = log.querySelector("pre");
      pre.textContent = u.log.join("\n");
      extra.appendChild(log);
      requestAnimationFrame(() => { pre.scrollTop = pre.scrollHeight; });
    }
    box.appendChild(extra);
  }
}

function onUpdate() {
  const u = info.update || {};
  $("#settings-btn").classList.toggle("has-update", !!u.available && u.state !== "updated" && u.state !== "restarting");
  renderUpdates();
  if (u.available && u.state === "idle" && !toldAboutUpdate) {
    toldAboutUpdate = true;
    toast(`Flash v${u.latest} is available. Update it in Settings.`);
  }
  if (u.state === "updated" && view !== "settings") toast("Flash updated. Open Settings to restart it.");
  if (u.state === "failed" && view !== "settings") toast("The update did not finish. Open Settings for why.");
  if (u.state === "restarting") waitForRestart();
}

// Ctrl Alt Shift R: Flash's server starts again, with a new link, and
// this page comes back in on it. Three keys held at once, so not by
// accident. The terminal prints the new link too.
let restartingServer = false;
async function restartServer() {
  if (restartingServer) return;
  let r;
  try { r = await command("server-restart"); } catch (error) { showFailure(error); return; }
  restartingServer = true;
  toast("Restarting Flash\u2026");
  const back = `${location.pathname}?token=${encodeURIComponent(r.token)}`;
  // The old server is gone within half a second; the new one answers
  // once Python has started, a second or two later.
  await new Promise((resolve) => setTimeout(resolve, 900));
  const started = Date.now();
  while (Date.now() - started < 60000) {
    try {
      const up = await fetch(`/api/state?lite=1&token=${encodeURIComponent(r.token)}`, { credentials: "same-origin" });
      if (up.ok) { location.replace(back); return; }
    } catch (_) { /* not listening yet */ }
    await new Promise((resolve) => setTimeout(resolve, 400));
  }
  restartingServer = false;
  toast("Flash did not come back. Start it again in your terminal.");
}

// The server goes away and comes back as the new version, with the same
// link. Once it answers again, the page loads fresh from it.
async function waitForRestart() {
  if (waitingForRestart) return;
  waitingForRestart = true;
  const started = Date.now();
  let wentAway = false;
  while (Date.now() - started < 90000) {
    await new Promise((resolve) => setTimeout(resolve, 700));
    try {
      await api("/api/state?lite=1");
      if (wentAway) { location.reload(); return; }
    } catch (error) {
      if (error.message === "forbidden") { location.reload(); return; }
      wentAway = true;
    }
  }
  waitingForRestart = false;
  toast("Flash did not come back. Start it again in your terminal.");
}

const fmtCount = (n) => n < 1000 ? Math.round(n).toLocaleString()
  : n < 1e6 ? `${(n / 1e3).toFixed(n < 1e4 ? 1 : 0)}K` : `${(n / 1e6).toFixed(n < 1e7 ? 1 : 0)}M`;
const fmtDays = (n) => `${Math.round(n)} day${Math.round(n) === 1 ? "" : "s"}`;
const fmtStreak = (n) => `${n}-day`;
function fmtDuration(s) {
  s = Math.round(s);
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s / 60)}m`;
  return `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`;
}

// Numbers run up to their value, quickly, and land exactly on it.
function countUp(node, value, format) {
  if (calm.matches || !value) { node.textContent = format(value); return; }
  const start = performance.now();
  const span = 900;
  const step = (now) => {
    const t = Math.min(1, (now - start) / span);
    node.textContent = format(t === 1 ? value : value * (1 - Math.pow(1 - t, 4)));
    if (t < 1 && node.isConnected) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

const localDay = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
const isoDay = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const HEAT_WEEKS = 53;

function heatmap(u) {
  const today = localDay(u.today);
  const start = new Date(today);
  start.setDate(start.getDate() - start.getDay() - (HEAT_WEEKS - 1) * 7);
  const counts = u.days || {};
  let max = 0;
  for (const n of Object.values(counts)) max = Math.max(max, n);
  const months = el("div", "heat-months");
  const grid = el("div", "heat");
  let shown = 0;
  let lastMonth = -1;
  for (let week = 0; week < HEAT_WEEKS; week++) {
    const first = new Date(start);
    first.setDate(first.getDate() + week * 7);
    const label = el("span");
    // A month is named over its first week. The one cut off at the
    // left edge is not, or its name would run into the next.
    if (first.getMonth() !== lastMonth) {
      lastMonth = first.getMonth();
      if ((week > 0 || first.getDate() <= 7) && week < HEAT_WEEKS - 2) {
        label.textContent = first.toLocaleDateString(undefined, { month: "short" });
      }
    }
    months.appendChild(label);
    for (let d = 0; d < 7; d++) {
      const day = new Date(first);
      day.setDate(day.getDate() + d);
      const cell = el("i");
      cell.style.setProperty("--c", week);
      if (day > today) { cell.style.visibility = "hidden"; grid.appendChild(cell); continue; }
      const n = counts[isoDay(day)] || 0;
      shown += n;
      if (n) cell.dataset.l = Math.max(1, Math.ceil((n / max) * 4));
      if (+day === +today) cell.classList.add("today");
      const when = day.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
      cell.dataset.tip = `${n ? `${n} turn${n === 1 ? "" : "s"}` : "No turns"} · ${when}`;
      grid.appendChild(cell);
    }
  }
  const card = el("div", "usage-card");
  card.innerHTML = `<div class="label"><span>Activity</span><small></small></div><div class="heat-wrap"></div><div class="heat-foot"><span class="streaks"></span><span class="legend"><span>Less</span><i></i><i data-l="1"></i><i data-l="2"></i><i data-l="3"></i><i data-l="4"></i><span>More</span></span></div>`;
  card.querySelector(".label small").textContent = `${fmtCount(shown)} turn${shown === 1 ? "" : "s"} in the last year`;
  card.querySelector(".heat-wrap").append(months, grid);
  card.querySelector(".streaks").textContent = u.streak
    ? `On a ${fmtStreak(u.streak)} streak · longest ${fmtDays(u.longest_streak)}`
    : u.longest_streak ? `Longest streak ${fmtDays(u.longest_streak)}` : "";
  requestAnimationFrame(() => { const wrap = card.querySelector(".heat-wrap"); wrap.scrollLeft = wrap.scrollWidth; });
  return card;
}

async function drawUsage(body) {

  if (!body.isConnected) return;

async function renderBrowsers(list = document.querySelector(".browser-list")) {
  if (!list) return;
  let listed;
  try { listed = (await command("browsers")).browsers; } catch (error) { showFailure(error); return; }
  if (!list.isConnected) return;
  const known = new Set([...list.children].map((r) => r.dataset.id));
  list.textContent = "";
  if (!listed.length) {
    list.innerHTML = `<div class="browser-empty">No browser is signed in yet.</div>`;
    return;
  }
  for (const b of listed) {
    const row = el("div", "browser-row" + (known.size && !known.has(b.id) ? " new" : ""), `<span class="dev${b.active ? " live" : ""}">${icon(b.phone ? "phone" : "monitor")}</span><span class="who"><span class="name"><span class="device"></span></span><span class="sub"></span></span>`);
    row.dataset.id = b.id;
    row.querySelector(".device").textContent = b.device;
    if (b.current) row.querySelector(".name").insertAdjacentHTML("beforeend", `<span class="you">This browser</span>`);
    const sub = [b.here ? "This computer" : b.address, b.active ? "Active now" : `Seen ${ago(b.seen)}`, `Signed in ${when(b.since)}`];
    row.querySelector(".sub").textContent = sub.join(" · ");
    row.querySelector(".sub").title = row.querySelector(".sub").textContent;
    const out = el("button", "btn danger", "Sign out");
    out.type = "button";
    // Signing this browser out is the one that cannot be undone from
    // here, so it asks twice.
    out.onclick = async () => {
      if (b.current && !(await confirmPop(out, { title: "Sign out this browser?", text: "This page closes, and getting back in takes Flash's link again.", yes: "Sign out" }))) return;
      signOut(b);
    };
    row.appendChild(out);
    list.appendChild(row);
  }
}

// The first press arms the button, a second within four seconds acts.
// Asks before something that cannot be undone, in a card by ANCHOR
// (or mid-window without one). Resolves true for yes; Cancel, Esc, or a
// click anywhere else is no. It waits as long as it takes.
let confirmOpen = null;
function confirmPop(anchor, { title, text = "", yes = "Confirm", danger = true }) {
  if (confirmOpen) confirmOpen(false);
  return new Promise((resolve) => {
    const pop = el("div", "confirm-pop", `<b></b><p></p><div class="row"><button type="button" class="btn small" data-no>Cancel</button><button type="button" class="btn small ${danger ? "danger solid" : "primary"}" data-yes></button></div>`);
    pop.setAttribute("role", "alertdialog");
    pop.setAttribute("aria-modal", "false");
    pop.querySelector("b").textContent = title;
    const words = pop.querySelector("p");
    if (text) words.textContent = text; else words.remove();
    pop.querySelector("[data-yes]").textContent = yes;
    document.body.appendChild(pop);
    // Under the button, its right edges lined up; above it when there is
    // no room below; never past the window's edge.
    const w = pop.offsetWidth, h = pop.offsetHeight;
    const r = anchor && anchor.isConnected ? anchor.getBoundingClientRect() : null;
    let left = r ? r.right - w : (innerWidth - w) / 2;
    let top = r ? r.bottom + 8 : (innerHeight - h) / 2;
    if (r && top + h > innerHeight - 8) { top = r.top - h - 8; pop.style.setProperty("--from", "bottom right"); }
    pop.style.left = `${Math.max(12, Math.min(innerWidth - w - 12, left))}px`;
    pop.style.top = `${Math.max(12, top)}px`;
    const back = document.activeElement;
    const done = (answer) => {
      if (confirmOpen !== done) return;
      confirmOpen = null;
      removeEventListener("mousedown", outside, true);
      removeEventListener("keydown", keys, true);
      removeEventListener("resize", no);
      removeEventListener("scroll", no, true);
      pop.remove();
      if (back && back.isConnected && !answer) back.focus({ preventScroll: true });
      resolve(answer);
    };
    const no = () => done(false);
    const outside = (e) => { if (!pop.contains(e.target)) done(false); };
    const keys = (e) => {
      if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); done(false); }
      else if (e.key === "Tab") {
        // Round the two buttons, not out into the page behind.
        e.preventDefault();
        const [a, b] = pop.querySelectorAll("button");
        (document.activeElement === a ? b : a).focus();
      }
    };
    confirmOpen = done;
    pop.querySelector("[data-no]").onclick = no;
    pop.querySelector("[data-yes]").onclick = () => done(true);
    addEventListener("mousedown", outside, true);
    addEventListener("keydown", keys, true);
    addEventListener("resize", no);
    // It is pinned where its button was: once that moves, it goes.
    addEventListener("scroll", no, true);
    pop.querySelector("[data-yes]").focus({ preventScroll: true });
  });
}

function ago(seconds) {
  const s = Math.max(0, Date.now() / 1000 - seconds);
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  return `${Math.floor(s / 86400)} d ago`;
}

function when(seconds) {
  const d = new Date(seconds * 1000);
  return d.toDateString() === new Date().toDateString()
    ? `at ${d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`
    : d.toLocaleDateString([], { month: "short", day: "numeric" });
}

    try { said.textContent = (await command("email-test", "", null, { address: account.address })).said; said.classList.add("good"); }

    test.disabled = false;
  };

  change.type = "button";
  change.onclick = () => drawEmailForm(host, account, e);

  if (!isDefault && account.has_password) {

        toast(`${account.address} is your default email`);
        drawEmailAccounts(host, r.email);
      } catch (error) { showFailure(error); }
    };
    card.querySelector(".email-actions").append(pick);
  }
  card.querySelector(".email-actions").append(test, change, off);
  if (account.has_password) test.onclick();
  else { said.textContent = "No password saved: Change adds one."; said.classList.add("bad"); }
  return card;
}

function renderMemories(host, entries) {
  host.entries = entries;
  host.textContent = "";
  const fresh = new Set(freshMemories);
  freshMemories = [];
  if (!entries.length) {
    host.innerHTML = `<div class="mem-empty"><b>Nothing saved yet</b>Flash saves what is worth keeping as you work. Or bring over what another AI already knows about you.</div>`;
    const b = el("button", "btn with-icon", `${icon("download")}<span>Import memory</span>`);
    b.type = "button";
    b.onclick = importMemory;
    host.firstChild.appendChild(b);
    return;
  }
  const list = el("ul", "memories");
  let n = 0;
  entries.forEach((text, i) => {
    const item = el("li", "", `<span class="text"></span>`);
    item.firstChild.textContent = text;
    if (fresh.has(text)) { item.classList.add("fresh"); item.style.setProperty("--i", n++); }
    const acts = el("span", "acts");
    acts.append(
      button("icon-btn", "edit", "Edit", "", () => editMemory(host, item, i + 1, text)),
      button("icon-btn", "x", "Forget", "", () => forgetMemory(host, item, i + 1)),
    );
    item.appendChild(acts);
    item.ondblclick = (e) => { if (!e.target.closest(".acts")) editMemory(host, item, i + 1, text); };
    list.appendChild(item);
  });
  host.appendChild(list);
  const first = list.querySelector(".fresh");
  if (first) requestAnimationFrame(() => reveal(logEl, first, true, 80));
}

// Edit a memory where it sits: Enter saves, Escape puts it back, and
// clicking away saves too. INDEX 0 is a new one, added at the end.
function editMemory(host, item, index, text) {
  if (host.querySelector(".mem-edit")) return;
  item.classList.add("editing");
  item.textContent = "";
  const row = el("div", "mem-edit-row", `<textarea class="mem-edit" rows="1" aria-label="Memory"></textarea><small>Enter to save · Esc to cancel</small>`);
  item.appendChild(row);
  const field = row.firstChild;
  field.value = text;
  const fit = () => { field.style.height = "auto"; field.style.height = `${field.scrollHeight + 2}px`; };
  field.addEventListener("input", fit);
  fit();
  field.focus();
  field.setSelectionRange(text.length, text.length);
  let finished = false;
  const done = async (save) => {
    if (finished) return;
    finished = true;
    const value = field.value.split(/\s+/).join(" ").trim();
    if (!save || !value || value === text) { renderMemories(host, host.entries); return; }
    try {
      const result = index
        ? await command("memory-edit", String(index), null, { text: value })
        : await command("memory-add", null, null, { text: value });
      freshMemories = [result.text];
      renderMemories(host, result.entries);
      toast(index ? "Memory updated" : "Memory added");
    } catch (error) {
      showFailure(error);
      renderMemories(host, host.entries);
    }
  };
  field.onkeydown = (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); done(true); }
    if (e.key === "Escape") { e.preventDefault(); done(false); }
    e.stopPropagation();
  };
  field.onblur = () => done(true);
}

function addMemory(host) {
  if (host.querySelector(".mem-edit")) { host.querySelector(".mem-edit").focus(); return; }
  let list = host.querySelector(".memories");
  if (!list) {
    host.textContent = "";
    list = host.appendChild(el("ul", "memories"));
  }
  const item = list.appendChild(el("li"));
  editMemory(host, item, 0, "");
  item.querySelector("textarea").placeholder = "A fact Flash should know, like \"I use pnpm, not npm\"";
  reveal(logEl, item, true, 80);
}

async function forgetMemory(host, item, index) {
  let result;
  try { result = await command("memory-forget", String(index)); } catch (error) { showFailure(error); return; }
  const done = () => renderMemories(host, result.entries);
  if (calm.matches) { done(); return; }
  const h = item.offsetHeight;
  item.animate([{ height: `${h}px`, opacity: 1 }, { height: "0px", opacity: 0, paddingTop: "0px", paddingBottom: "0px" }],
    { duration: 220, easing: "cubic-bezier(0.2, 0, 0, 1)" }).finished.then(done, done);
}

// Folder suggestions under a path field, as a shell completes: ~/D
// offers Desktop, Documents, Downloads. Tab or Enter takes one and
// shows what is inside it; Escape puts the list away. The list hangs
// off the page, not the dialog, so the dialog's scrolling cannot cut
// it short.
function suggestFolders(field) {
  const list = el("div", "suggest");
  list.setAttribute("role", "listbox");
  list.hidden = true;
  document.body.appendChild(list);
  let found = [], sel = -1, timer = 0, asked = 0;

  const place = () => {
    const r = field.getBoundingClientRect();
    list.style.left = `${r.left}px`;
    list.style.top = `${r.bottom + 6}px`;
    list.style.width = `${r.width}px`;
  };
  const close = () => { list.hidden = true; sel = -1; field.setAttribute("aria-expanded", "false"); };
  const mark = () => {
    [...list.children].forEach((row, i) => row.classList.toggle("sel", i === sel));
    if (sel >= 0) reveal(list, list.children[sel], false, 4);
  };
  const take = (i) => {
    field.value = found[i] + "/";
    field.setSelectionRange(field.value.length, field.value.length);
    ask(0);
  };
  const draw = () => {
    list.textContent = "";
    if (!found.length || document.activeElement !== field) { close(); return; }
    // What was typed after the last slash, to bold in each name.
    const typed = field.value.slice(field.value.lastIndexOf("/") + 1);
    found.forEach((d, i) => {
      const cut = d.lastIndexOf("/") + 1;
      const name = d.slice(cut);
      const row = el("div", "suggest-row", `${icon("folder")}<span class="path"><span class="where"></span><span class="name"><b></b><span></span></span></span>`);
      row.setAttribute("role", "option");
      row.querySelector(".where").textContent = d.slice(0, cut);
      row.querySelector("b").textContent = name.slice(0, typed.length);
      row.querySelector(".name > span").textContent = name.slice(typed.length);
      row.onmousedown = (e) => { e.preventDefault(); take(i); };
      row.onmousemove = () => { if (sel !== i) { sel = i; mark(); } };
      list.appendChild(row);
    });
    place();
    list.hidden = false;
    field.setAttribute("aria-expanded", "true");
    mark();
  };
  const ask = (wait = 90) => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const mine = ++asked;
      const { dirs } = await command("dirs", field.value).catch(() => ({ dirs: [] }));
      if (mine !== asked) return;  // a later keystroke already asked
      found = dirs;
      sel = -1;
      draw();
    }, wait);
  };

  field.addEventListener("input", () => ask());
  field.addEventListener("focus", () => ask(0));
  field.addEventListener("blur", close);
  field.addEventListener("keydown", (e) => {
    if (list.hidden) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (e.key === "ArrowDown") sel = sel + 1 < found.length ? sel + 1 : 0;
      else sel = sel <= 0 ? found.length - 1 : sel - 1;
      mark();
    } else if (e.key === "Tab" && !e.shiftKey) {
      e.preventDefault();
      take(sel >= 0 ? sel : 0);
    } else if (e.key === "Enter" && sel >= 0) {
      e.preventDefault();
      e.stopPropagation();
      take(sel);
    } else if (e.key === "Escape") {
      // The list goes; the dialog stays.
      e.preventDefault();
      e.stopPropagation();
      close();
    }
  });
  window.addEventListener("resize", () => { if (!list.hidden) place(); });
}
