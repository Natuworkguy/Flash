name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint-ruff:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Run Ruff
        run: ruff check .

  lint-flake8:
    name: Lint (Flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Run Flake8
        run: flake8 .

  lint-bandit:
    name: Lint (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit
      - name: Run Bandit
        run: bandit -r . -ll

  test-linux:
    name: Test (Linux)
    needs: [lint-ruff, lint-flake8, lint-bandit]
    runs-on: ubuntu-latest
    env:
      NO_COMMAND_CONFIRMATION: '1'
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install -e ".[voice]"
      - name: Run tests
        run: pytest

  installer-windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the Windows installer
        shell: powershell
        run: ./tests/installer/check-install-ps1.ps1

      - name: Check the installer app
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path installer/windows/InstallFlash.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Package the installer app
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "dist/Install Flash" | Out-Null
          Copy-Item "installer/windows/Install Flash.cmd", installer/windows/InstallFlash.ps1, install.ps1 "dist/Install Flash/"
          Compress-Archive -Path "dist/Install Flash" -DestinationPath "dist/Install Flash (Windows).zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Install Flash (Windows)
          path: dist/Install Flash (Windows).zip

  installer-mac:
    name: Mac installer app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Install Flash.app
        run: installer/mac/build.sh dist
      - name: Compile the Flash app's window
        run: swiftc -O -o /tmp/flash-window flash/window.swift -framework Cocoa -framework WebKit
      - uses: actions/upload-artifact@v4
        with:
          name: Install Flash (macOS)
          path: dist/Install Flash.zip

  test-windows:
    name: Test (Windows)
    needs: [lint-ruff, lint-flake8, lint-bandit]
    runs-on: windows-latest
    env:
      NO_COMMAND_CONFIRMATION: '1'
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install -e .
      - name: Run tests
        run: pytest

  test-macos:
    name: Test (macOS)
    needs: [lint-ruff, lint-flake8, lint-bandit]
    runs-on: macos-latest
    env:
      NO_COMMAND_CONFIRMATION: '1'
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install -e .
      - name: Run tests
        run: pytest

  build-linux:
    name: Build (Linux)
    needs: test-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build package
        run: python -m build

  build-windows:
    name: Build (Windows)
    needs: test-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build package
        run: python -m build

  build-macos:
    name: Build (macOS)
    needs: test-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build package
        run: python -m build
