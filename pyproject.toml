[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flash"
description = "FLASH CLI"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Natuworkguy" },
]
dynamic = ["version", "dependencies", "optional-dependencies"]
requires-python = ">=3.10"

[tool.setuptools.dynamic]
version = { attr = "flash.version.__version__" }

[tool.setuptools.dynamic.dependencies]
file = ["requirements.txt"]

[tool.setuptools.dynamic.optional-dependencies]
dev = { file = ["requirements-dev.txt"] }
voice = { file = ["requirements-voice.txt"] }

[project.scripts]
flash = "flash.ai:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flash*"]

[tool.setuptools.package-data]
flash = ["system_prompt.txt", "thinking_states.json", "suggestions.json"]

[tool.pyright]
# flash/urlscheme.py imports winreg only on Windows (os.name == "nt") to
# register the flash:// handler; typeshed gates winreg's members behind
# sys.platform == "win32", so without this, Pylance/pyright report every
# winreg attribute as missing when analyzed from macOS or Linux.
pythonPlatform = "All"
