[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flash"
description = "FLASH CLI"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Natuworkguy" },
]
dynamic = ["version", "dependencies", "optional-dependencies"]
requires-python = ">=3.10"

[tool.setuptools.dynamic]
version = { attr = "flash.version.__version__" }

[tool.setuptools.dynamic.dependencies]
file = ["requirements.txt"]

[tool.setuptools.dynamic.optional-dependencies]
dev = { file = ["requirements-dev.txt"] }
voice = { file = ["requirements-voice.txt"] }

[project.scripts]
flash = "flash.ai:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flash*"]

[tool.setuptools.package-data]
flash = ["system_prompt.txt", "thinking_states.json", "suggestions.json"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # import sorting
    "UP",     # pyupgrade, including PEP 604 `X | None` annotations
    "BLE",    # blind excepts
    "DTZ",    # naive datetimes
    "S110",   # try/except/pass
    "RUF100", # noqa directives that no longer suppress anything
]

# Security is the separate bandit job's responsibility. Selecting
# ruff's full S family here would report the same code twice, at a
# lower severity bar than bandit's -ll, so only the one rule this
# codebase actually suppresses by hand is enabled.

[tool.pyright]
# flash/urlscheme.py imports winreg only on Windows (os.name == "nt") to
# register the flash:// handler; typeshed gates winreg's members behind
# sys.platform == "win32", so without this, Pylance/pyright report every
# winreg attribute as missing when analyzed from macOS or Linux.
pythonPlatform = "All"
