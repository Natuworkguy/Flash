  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17110d"/>
      <stop offset="0.55" stop-color="#120e0c"/>
      <stop offset="1" stop-color="#1c1210"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a1f" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ff6a00" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="222" x2="0" y2="299" gradientUnits="userSpaceOnUse">
