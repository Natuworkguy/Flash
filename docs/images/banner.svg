  <style>
    .bob { animation: bob 5.5s ease-in-out infinite; }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-in-out infinite; }
    .bolt { animation: float 4s ease-in-out infinite; }
    .star { animation: twinkle 3s ease-in-out infinite; }
    .cursor { animation: cursor 1.1s steps(1) infinite; }
    .shine { animation: shine 6s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    @keyframes pulse { 0%, 100% { opacity: 0.75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.9; } }
    @keyframes cursor { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @keyframes shine { 0%, 70% { transform: translateX(-420px); } 100% { transform: translateX(1700px); } }
    @media (prefers-reduced-motion: reduce) {
      .bob, .blink, .pulse, .bolt, .star, .cursor, .shine { animation: none; }
    }
  </style>
